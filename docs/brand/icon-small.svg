<!-- Whistlestop icon, small version for 16-32 px (favicon, Home header tile, notification): the engine of
     docs/brand/whistlestop-icon.svg reduced to a few big shapes (cab front, smokebox, lamp, brass badge, buffer beam, pilot) on
     the same dusk sky. On a 32 grid, so one unit is one pixel at 32 px. Colours: --ill-blue-3, --ill-orange-1, --ill-tan-1 (sky),
     --ill-red-2/-3 (crimson), --ink, --ill-ink-2, --ill-yellow scale (brass, lamp), --ill-grey (pilot). -->
