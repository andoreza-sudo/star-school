<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 506 100" width="506" height="100">
<!-- Whistlestop logo, Concept F: Train at the stop. A red engine pulling up to a round station sign with a star: next stop!
     Mark (g#mark-x in defs): 100x100, the full-bleed app icon. Everything that matters sits inside the central circle of radius 33
     (Android adaptive/maskable safe zone; a launcher shows about that much, zoomed); only class "bg" (sky, ground, track) reaches
     the edges. The lockup tile (g#tile) shows the same art zoomed 1.4x in a rounded square (rx 22), as a launcher would. Bold --ink outlines (round 2: the owner asked for a train,
     big and bold). Wordmark (g#word): Andika 700, the app's display font, outlined; "Whistle" in --ink (.w1) and "stop" in --brand
     (.w2), the i dot drawn by the concept. On the dark --ink background: .w1 white, .w2 --ill-blue-1. Colours are tokens from
     docs/DESIGN_SYSTEM.md (--brand, --brand-shade, --star, --ink, --ill-red, --ill-grey, --ill-blue-1 ...). -->
