<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 506 100" width="506" height="100">
<!-- Whistlestop logo, Concept D3: Modern rail. A streamlined engine nose in the app blue with gold speed stripes and a big round headlamp: between steam age and modern.
     Round 3 (owner picked D and asked for more detail and less of a toy look, for older children too).
     Mark (g#mark-d3 in defs): 100x100, the full-bleed app icon. Everything that matters sits inside the central circle of radius 33
     (Android adaptive/maskable safe zone; a launcher shows about that much, zoomed); only class "bg" (sky, ground, rails, plume)
     reaches the edges. The lockup tile (g#tile) shows the art zoomed 1.4x in a rounded square (rx 22), as a launcher would.
     Volume follows DESIGN_SYSTEM 6.5 (light from the top left: base, shade on the lower right, highlight, white glints).
     Colours: tokens and --ill-* / --sc-* tones (crimson = --ill-red-2/-3, brass = --ill-yellow scale, metal = --ink/--ill-ink-2/--ill-grey).
     Wordmark (g#word): Andika 700, the app's display font, outlined; "Whistle" in --ink (.w1) and "stop" in --brand (.w2).
     On the dark --ink background: .w1 white, .w2 --ill-blue-1. -->
