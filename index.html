.pkscat .pko{align-self:center;justify-self:center}
.pks{display:block;width:clamp(48px,9vh,76px);height:auto;max-width:100%}
.ch .pks{margin:0 auto}
.pks.pkbig{width:clamp(96px,16vh,140px)}
.pkf{fill:var(--c,var(--surface-2));stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.pkdim{fill:var(--surface-2)}
.pkside{fill:none;stroke:var(--play);stroke-width:5;stroke-linecap:round;opacity:.15;animation:pkside var(--T,2.4s) var(--d,0s) infinite}
@keyframes pkside{0%,30%{opacity:1}31%,100%{opacity:.15}}
.pulse .pko{animation:pkpulse .7s var(--d,0s) 2}
@keyframes pkpulse{50%{transform:scale(1.4)}}
.pkhint{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);font-size:clamp(28px,6vh,44px)}
.pkhint .sub{font-size:clamp(16px,2.8vh,20px)}
.pkhint svg.viz{max-width:100%}
.pkline{display:flex;gap:.1em;justify-content:flex-start;min-height:1.2em}
.pkear{display:inline-flex;padding:var(--s-4);border-radius:var(--r-pill);background:var(--brand-tint);color:var(--brand)}
.pkask{font-size:.9em;color:var(--brand)}
/* more or fewer: two plates, each a tap target */
.pkpair{display:flex;gap:var(--s-4);justify-content:center;max-width:100%}
.pkplate{display:flex;align-items:center;justify-content:center;min-width:var(--tap-pk);min-height:calc(var(--tap-pk)*2);padding:var(--s-2);
  border:4px solid var(--line);border-radius:var(--r-card);background:var(--surface);cursor:pointer}
.pkplate.right{background:var(--good-tint);border-color:var(--good);animation:bump .4s}
.pkplate.wrong{background:var(--try-tint);border-color:var(--try);opacity:.6}
.pkpl{display:grid;grid-template-columns:repeat(3,auto);font-size:.8em;gap:.05em}
.pkpl .pkrow{display:contents}
/* pattern row */
.pkpat{display:flex;flex-direction:row;gap:var(--s-2);align-items:center;justify-content:center;max-width:100%}
.pkpat .pks{width:clamp(34px,11.5vw,64px)}
.pkunk{display:inline-flex;align-items:center;justify-content:center;width:clamp(34px,11.5vw,64px);aspect-ratio:1;box-sizing:border-box;
  border:3px dashed var(--brand);border-radius:var(--r-btn);color:var(--brand);font-size:.7em;font-weight:700}
/* picture choices */
.choices.pk2,.choices.pk4{grid-template-columns:1fr 1fr}
.choices.pk3{grid-template-columns:repeat(3,1fr)}
.choices.pkcol{grid-template-columns:1fr}
.choices.pics .ch{min-height:var(--tap-pk)}
.pkcell{display:flex;align-items:flex-end;justify-content:center;min-height:clamp(72px,12vh,100px);width:100%}
.pkcell.pkleft{justify-content:flex-start;align-items:center;min-height:calc(var(--tap)*.9);padding-left:var(--s-3)}
.pkscale{display:block;line-height:1}
.pkscale .art{width:1em;height:1em}
.pkbar{display:block;max-width:100%;height:auto}
.pkbar .pkf{fill:var(--c)}
/* the big replay button: the way to ask again without reading */
.btn.pkspk{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:72px;padding:var(--s-2) var(--s-6);
  color:var(--brand);border-radius:var(--r-pill)}
/* debug flag (smoke test, "all text hidden"): html.notext */
html.notext .pktxt{display:none}
/* Kindergarten math, world Shape Garden (P2-02): ten frames of objects, shapes, scenes for position and measuring.
   Builds on 31-pk.css (same audio-first presentation). Tokens only; sizes follow the prompt's font size (em). */
/* objects in ten frames (rows of 5): the first frame is the full ten */
.sgfrs{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-3);max-width:100%}
.sgfr{display:grid;grid-template-columns:repeat(5,1.25em);grid-auto-rows:1.25em;gap:2px;padding:2px;border:3px solid var(--ink-3);border-radius:var(--r-btn);background:var(--surface)}
.sgfr.sgten{border-color:var(--math)}
.sgc{display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:4px;font-size:.85em}
.sgc .pko{min-width:0}
/* two plates of up to 10 objects */
.pkpl.sgp10{grid-template-columns:repeat(4,auto);font-size:.72em}
.sgpl{min-width:clamp(120px,38vw,170px);min-height:calc(var(--tap-pk)*2)}
/* pairing up objects (the hint for more / fewer / same) */
.sgpairs{display:flex;flex-wrap:nowrap;gap:.1em;justify-content:center;font-size:.55em;max-width:100%}
.pkhint .sgfrs{font-size:.5em}
.sgpr{display:flex;flex-direction:column;align-items:center;padding:0 .05em;border-radius:6px;background:var(--surface-2)}
.sgpr.sgx{background:var(--star-tint)}
.sgs{display:block;min-height:1.2em;min-width:1.1em;text-align:center}
.sgs .pko{min-width:0}
/* shapes and solids */
.sgsh{display:flex;align-items:center;justify-content:center;width:100%}
.ch .sgsh .viz{--k:.8;max-width:100%}
.sgbigshape .viz{--k:1.1}
.sgobj{display:inline-block;font-size:1.6em;line-height:1}
.sgobj .art{width:1em;height:1em}
/* eight shapes in a pattern row */
.pkpat.sgpat{gap:var(--s-1)}
.pkpat.sgpat .pks,.pkpat.sgpat .pkunk{width:clamp(30px,9.4vw,60px)}
.pkpat.sgpat .pko .pks{width:clamp(30px,9.4vw,60px)}
/* tap targets in scenes: pictures with a tap-sized box, right and wrong as colour */
.sgt{display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap-pk);min-height:var(--tap-pk);padding:var(--s-1);
  border:4px solid var(--line);border-radius:var(--r-card);background:var(--surface);cursor:pointer;font-size:1.5em;line-height:1}
.sgt .art{width:1em;height:1em}
.sgt.right{background:var(--good-tint);border-color:var(--good);animation:bump .4s}
.sgt.wrong{background:var(--try-tint);border-color:var(--try);opacity:.6}
.sgscene{display:flex;align-items:center;justify-content:center;gap:var(--s-3)}
.sgref{display:inline-flex;align-items:center;justify-content:center;font-size:2em;line-height:1;min-width:1.1em}
.sgref .art{width:1em;height:1em}
.sgcol{flex-direction:column}
.sggrid{display:grid;grid-template-columns:auto auto;justify-content:center;gap:var(--s-3);align-items:center;justify-items:center}
.sggrid.sgflip{direction:rtl}
.sgrow{flex-direction:row}
/* in front of / behind: the one in front overlaps the lower right of the thing, the one behind peeks out above and left */
.sgdepth{position:relative;display:block;width:min(100%,9em);height:clamp(200px,32vh,280px);margin-bottom:var(--s-3)}
.sgdepth .sgref{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2;font-size:2.4em}
.sgdepth .sgbk{position:absolute;left:36%;top:0;z-index:1;font-size:.9em}
.sgdepth .sgfk{position:absolute;left:30%;bottom:0;z-index:3;font-size:.9em}
.sgdepth .sgt{border-color:transparent;background:none}
.sgdepth .sgt.right{background:var(--good-tint);border-color:var(--good)}
/* measuring: crayons (left edges), towers (standing on the floor), a tipped scale with two tap zones */
.sgbars{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-2);max-width:100%}
.sgbars .sgt{padding:var(--s-1) var(--s-2);min-height:var(--tap);justify-content:flex-start}
.sgbarrow{display:inline-flex;align-items:center}
.sgaligned{border-left:3px dashed var(--brand);padding-left:var(--s-1)}
.sgtowers{align-items:flex-end}
.sgtowers .sgt{align-items:flex-end}
.sgbal{position:relative;max-width:100%}
.sgbal i{position:absolute;top:0;bottom:0;width:50%;border-radius:var(--r-card);cursor:pointer}
.sgbal i[data-v=l]{left:0}
.sgbal i[data-v=r]{right:0}
.sgbal i.right{background:var(--good-tint);outline:4px solid var(--good)}
.sgbal i.wrong{background:var(--try-tint);outline:4px solid var(--try)}
.choices.syms.pk4,.choices.syms.pk2{grid-template-columns:1fr 1fr}
/* Stacked fractions in prompts and choices (P2-06): numerator over a bar over denominator. Tokens only. */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.1}
.fr .fn{border-bottom:.07em solid var(--ink);padding:0 .18em .04em}
.fr .fd{padding:.04em .18em 0}
.choices.wide .ch .viz{margin:0 auto}

/* Fraction Forest (P2-07): two-column picture choices (clocks, ruler lengths, scales) and a row of two clocks. Tokens only. */
.choices.ffc{grid-template-columns:repeat(2,1fr)}
.choices.ffc .ch .viz{margin:0 auto}
.ffrow{display:flex;justify-content:center;gap:var(--s-3);text-align:center;font-weight:700}
.ffrow>div{min-width:0;flex:0 1 auto}
.ffrow .viz{width:calc(var(--vw)*.78px);max-width:100%}
.ffrow>div>div{font-size:.55em;margin-top:var(--s-1)}
/* Question kinds A (P1-03): number pad extras, multi-select, order. Tokens only (00-tokens.css). */

/* number pad: extra key (. or +/-) on its own row; several slots (fraction, remainder, mixed number) */
.pad .k{min-height:var(--tap)}
.pad .x{grid-column:1/-1;background:var(--star-tint)}
.slot.sl-on{border-color:var(--brand);background:var(--brand-tint)}
.fslot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em}
.fbar{align-self:stretch;border-top:.07em solid var(--ink);margin:.06em 0}
.rsep{font-size:.5em;font-weight:700;margin:0 .3em;color:var(--ink-3);vertical-align:middle}

/* multi: tick boxes inside the choice buttons, then a Check button */
.mchoices .mc{display:flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:var(--tap);font-size:clamp(20px,3.6vh,28px)}
.mc .ml{min-width:0;overflow-wrap:anywhere}
.mk{flex:none;width:26px;height:26px;border-radius:var(--r-chip);border:3px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.mc.on{background:var(--brand-tint);outline:4px solid var(--brand);outline-offset:-4px}
.mc.on .mk{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.mc.right{background:var(--good-tint);outline:4px solid var(--good-ink);outline-offset:-4px}
.mc.right .mk{background:var(--good-ink);border-color:var(--good-ink);color:var(--surface)}
.mc.wrong{background:var(--try-tint);outline:4px dashed var(--try-ink);outline-offset:-4px;opacity:1}
.mgo{display:block;min-width:200px;min-height:var(--tap);margin:var(--s-3) auto 0;font-size:var(--fs-5);background:var(--good-ink);color:var(--surface)}
.mgo:disabled{opacity:.45}

/* order: slots in a row, tiles below; a filled slot is tapped to take the tile back */
.oslots{display:flex;flex-wrap:wrap;gap:var(--s-2);justify-content:center;max-width:560px;margin:0 auto var(--s-4)}
.os{min-width:var(--tap);min-height:var(--tap);padding:4px 10px;font-size:clamp(20px,3.8vh,30px);box-shadow:none;background:var(--surface-2);border:3px dashed var(--ink-3)}
.os.full{background:var(--brand-tint);border:3px solid var(--brand)}
.os.ok{background:var(--good-tint);border-color:var(--good-ink)}
.os.rev{background:var(--try-tint);border-color:var(--try-ink)}
.ot{min-width:var(--tap);min-height:var(--tap);padding:8px 14px;font-size:clamp(20px,3.8vh,30px);background:var(--star-tint)}
.ot.used{visibility:hidden}
/* Math visuals (P1-10; markup in src/js/23-viz.js, which documents the visual language). Tokens only: no raw colours. */
.viz{--vz:1;display:block;margin:0 auto;width:calc(var(--vw)*var(--vz)*var(--k,1)*1px);max-width:100%;height:auto;
  stroke-linejoin:round;stroke-linecap:round;font-family:var(--font-body)}
.viz.vi{width:calc(var(--vw)*var(--vz)*1px)}
@media (min-width:600px) and (min-height:560px){.viz{--vz:1.3}}
.viz text{font-size:16px;font-weight:700;fill:var(--ink);stroke:none;text-anchor:middle}
/* structure */
.viz .vo{fill:var(--surface);stroke:var(--ink-3);stroke-width:2}
.viz .vl{fill:none;stroke:var(--ink-3);stroke-width:2}
.viz .va{fill:none;stroke:var(--ink-2);stroke-width:3}
.viz .vr{fill:var(--ink-2);stroke:var(--ink-2);stroke-width:2}
.viz .vk{fill:none;stroke:var(--ink-2);stroke-width:2}
.viz .ve{fill:none;stroke:var(--ink-2);stroke-width:3}
/* quantity: counters (v1), second set (v2), shaded parts (vs), faded (vx) */
.viz .v1{fill:var(--math);stroke:var(--math-shade);stroke-width:2}
.viz .v2{fill:var(--play);stroke:var(--play-shade);stroke-width:2}
.viz .vp{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.viz .vp.vs{fill:var(--math)}
.viz .vx{opacity:.3}
/* base ten: shade block, square cells */
.viz .vb{fill:var(--math-shade)}
.viz .vc{fill:none;stroke:var(--math);stroke-linecap:butt}
/* array */
.viz .vbg{fill:var(--math-tint)}
.viz .vdd{fill:none;stroke:var(--math-shade);stroke-width:23}
.viz .vd{fill:none;stroke:var(--math);stroke-width:20}
/* fractions and unknowns */
.viz .vfr{font-size:14px}
.viz .vfb{fill:none;stroke:var(--ink);stroke-width:2}
.viz text.vw{fill:var(--surface)}
.viz .vfb.vw{stroke:var(--surface)}
.viz .vq{fill:var(--surface-2);stroke:var(--brand);stroke-width:2;stroke-dasharray:4 4}
.viz .vqt{fill:var(--brand);font-size:18px}
/* clock */
.viz .vrim{fill:var(--surface);stroke:var(--math);stroke-width:4}
.viz .vt1{fill:none;stroke:var(--ink-3);stroke-width:3;stroke-linecap:butt}
.viz .vt5{fill:none;stroke:var(--ink-2);stroke-width:4.5;stroke-linecap:butt}
.viz .vcn{font-size:13px}
.viz .vhh{fill:none;stroke:var(--read);stroke-width:7}
.viz .vmh{fill:none;stroke:var(--math);stroke-width:4.5}
.viz .vpin{fill:var(--ink)}
/* tap targets and their states (set by the tap kind) */
.viz .vt{cursor:pointer}
.viz .vh{fill:none;pointer-events:all}
.viz .vm{fill:var(--surface);stroke:var(--math);stroke-width:3}
.viz .sel .vm,.viz .vp.sel{fill:var(--brand);stroke:var(--brand-shade)}
.viz .right .vm,.viz .vp.right{fill:var(--good);stroke:var(--good-ink)}
.viz .wrong .vm,.viz .vp.wrong{fill:var(--try);stroke:var(--try-ink)}
.viz .vp.sel,.viz .vp.right,.viz .vp.wrong{stroke-width:2}
/* part 2 (P1-11) */
.viz .vta{text-anchor:end}
.viz .vts{text-anchor:start}
.viz .vgl{fill:none;stroke:var(--ink-3);stroke-width:1;opacity:.6}
.viz .vgd{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:4 4}
.viz .vtk{fill:none;stroke:var(--ink);stroke-width:4}
.viz .vjn{fill:none;stroke:var(--math-shade);stroke-width:3}
.viz .vdt circle{fill:var(--ink);stroke:var(--surface);stroke-width:1.5}
/* ruler, pencil, protractor */
.viz .vru{fill:var(--star-tint);stroke:var(--ink-3);stroke-width:2}
.viz .vpt{fill:var(--play-tint);stroke:var(--play-shade);stroke-width:2}
.viz .vwg{fill:var(--math-tint);stroke:var(--math);stroke-width:2}
/* bars: states on the group */
.viz .vbar{stroke-width:2}
.viz .sel .vbar{fill:var(--brand);stroke:var(--brand-shade)}
.viz .right .vbar{fill:var(--good);stroke:var(--good-ink)}
.viz .wrong .vbar{fill:var(--try);stroke:var(--try-ink)}
/* rectangle, area grid cells */
.viz .vpo{fill:var(--math-tint);stroke:var(--math-shade);stroke-width:3}
.viz .vce{fill:none;stroke:var(--surface);stroke-linecap:butt}
/* solids: front (s1), top or light (s2), side or shade (s3), equator (s0); .c2 is the second colour */
.viz .vsl .s1{fill:var(--math);stroke:var(--math-shade);stroke-width:2}
.viz .vsl .s2{fill:var(--math-tint);stroke:var(--math-shade);stroke-width:2}
.viz .vsl .s3{fill:var(--math-shade);stroke:var(--math-shade);stroke-width:2}
.viz .vsl .s0{fill:none;stroke:var(--math-shade);stroke-width:2}
.viz .vsl.c2 .s1{fill:var(--play);stroke:var(--play-shade)}
.viz .vsl.c2 .s2{fill:var(--play-tint);stroke:var(--play-shade)}
.viz .vsl.c2 .s3,.viz .vsl.c2 .s0{fill:var(--play-shade);stroke:var(--play-shade)}
.viz .vsl.c2 .s0{fill:none}
/* number-line hops */
.viz .vhop{fill:none;stroke:var(--play);stroke-width:3}
.viz .vhoa{fill:var(--play);stroke:var(--play);stroke-width:1}
/* balance scale */
.viz .vst{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:3}
.viz .vsr{fill:none;stroke:var(--ink-3);stroke-width:2}
.viz .vpan{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:3}
.viz .vbm{fill:none;stroke:var(--ink-2);stroke-width:6}
.viz .vwl{fill:var(--math-tint);stroke:var(--math-shade);stroke-width:2}
.viz .vwr{fill:var(--play-tint);stroke:var(--play-shade);stroke-width:2}
/* coins (penny copper, the rest silver) and bills */
.viz .vcu{fill:var(--ill-tan);stroke:var(--ill-tan-3);stroke-width:3}
.viz .vsv{fill:var(--ill-grey-1);stroke:var(--ill-grey-2);stroke-width:3}
.viz .vci{fill:none;stroke:var(--ill-grey-2);stroke-width:1.5;stroke-dasharray:2 3}
.viz .vcc{font-size:13px}
.viz .vcp{fill:var(--ill-brown-3)}
.viz .vbl{fill:var(--good-tint);stroke:var(--good-ink);stroke-width:2}
.viz .vbi{fill:none;stroke:var(--good-ink);stroke-width:1.5}
.viz .vcb{font-size:20px;fill:var(--good-ink)}
/* depth (P4-18; the header of 23-viz.js describes it): counters in the shade tone with a deep rim, a base-tone spot toward the
   light (.vbs) and a white gloss (.vsp); ledges (.vld), gloss bands (.vgs) and arcs (.vgc); decorations never take taps */
.viz g.v1>circle{fill:var(--math-shade);stroke:var(--ill-blue-3)}
.viz g.v2>circle{fill:var(--play-shade);stroke:var(--play-deep)}
.viz .vbs{fill:none;stroke:var(--math)}
.viz .v2 .vbs{stroke:var(--play)}
.viz .vsp{fill:none;stroke:var(--surface);opacity:.6}
.viz .vld{fill:var(--ledge-soft);stroke:none}
.viz .vgs{fill:var(--surface);stroke:none;opacity:.3}
.viz .vgc{fill:none;stroke:var(--surface);opacity:.55}
.viz .vfs{fill:var(--surface-2);stroke:none}
.viz .vbd{fill:var(--ill-blue-3)}
.viz .vcs{fill:var(--ill-grey);stroke:none}
.viz .vcs.vcp{fill:var(--ill-tan-2)}
.viz .vci.vcp{fill:none;stroke:var(--ill-tan-3)}
.viz .vbs,.viz .vsp,.viz .vld,.viz .vgs,.viz .vgc,.viz .vfs,.viz .vcs{pointer-events:none}
/* P1-08 mastery: the Challenge tag on a question from the next harder stop (51-mastery.js mastShow). Tokens only. */
.mtag{display:inline-flex;align-items:center;gap:var(--s-1);align-self:center;background:var(--star-tint);color:var(--ink);font-weight:700;
  font-size:var(--fs-2);border-radius:var(--r-pill);padding:var(--s-1) var(--s-3)}
.mtag .ic{color:var(--try-ink)}
/* P5-03 Daily Review card on Home (59-review.js). Tokens only; classes start with rv-. */
.rv-card{display:flex;align-items:center;gap:var(--s-3);background:var(--star-tint);border-radius:var(--r-card);
  padding:var(--s-3) var(--s-4);margin:var(--s-4) 0 0;color:var(--ink)}
.rv-card .ic{color:var(--star-shade);flex:none}
.rv-tx{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;font-size:var(--fs-3);line-height:var(--lh-3)}
.rv-tx span{color:var(--ink-2)}
.rv-go{min-height:var(--tap);min-width:var(--tap);font-size:var(--fs-3);font-weight:700;padding:var(--s-2) var(--s-4);
  background:var(--brand);color:var(--surface)}
.rv-done{background:var(--good-tint)}
.rv-done .ic{color:var(--good-ink)}
/* Streak flame chip and calendar (P5-04). Tokens only. */
.stc-chip{font:inherit;font-size:var(--fs-4);font-weight:700;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;gap:var(--s-1);
  border:0;cursor:pointer;color:var(--play-shade);background:var(--play-tint);border-radius:var(--r-btn);padding:6px 12px;box-shadow:var(--ledge) var(--shadow-ink);font-variant-numeric:tabular-nums}
.stc-chip{--ic2:var(--play-tint)}
.stc-chip.off{color:var(--ink-3);background:var(--surface-2);--ic2:var(--surface-2)}
.stc-chip.off .stc-fl{opacity:.45}
.stc-card{background:var(--surface);border-radius:var(--r-card);border:2px solid var(--line);padding:var(--s-4);max-width:520px;margin:0 auto;text-align:center}
.stc-big{font-family:var(--font-display);font-size:var(--fs-7);font-weight:700;line-height:1;color:var(--play-shade);font-variant-numeric:tabular-nums}
/* P4-18: the flame on a glowing disc, the count beside it; star cells, moon rest days, prize chips */
.stc-hero{display:flex;align-items:center;justify-content:center;gap:var(--s-3);margin-bottom:var(--s-2)}
.stc-fd{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--play-tint);color:var(--play);--ic2:var(--star);
  box-shadow:inset 0 0 0 4px var(--try),0 5px 0 var(--play-shade)}
.stc-hero.off .stc-fd{background:var(--surface-2);color:var(--ledge-soft);--ic2:var(--surface-2);box-shadow:inset 0 0 0 4px var(--line),0 4px 0 var(--line)}
.stc-hero.off .stc-big{color:var(--ink-3)}
.stc-sub .ic{vertical-align:-.25em}
.stc-pzs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:var(--s-2);margin-top:var(--s-3)}
.stc-pz{display:inline-flex;align-items:center;gap:2px;padding:2px var(--s-2) 2px var(--s-1);border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);
  box-shadow:inset 0 0 0 2px var(--line)}
.stc-pz .ic{color:var(--star-shade)}
.stc-pz.got{background:var(--good-tint);color:var(--good-ink);box-shadow:inset 0 0 0 2px var(--good)}
.stc-pz.got .ic{color:var(--good-ink)}
.stc-m .rs{display:block}
.stc-m .ic{display:block;color:var(--brand)}
.stc-sub{font-size:var(--fs-3);margin:var(--s-1) 0;color:var(--ink-2)}
.stc-sub.small{font-size:var(--fs-1);color:var(--ink-3)}
.stc-nav{display:flex;align-items:center;justify-content:space-between;margin:var(--s-3) 0 var(--s-2);font-size:var(--fs-3)}
.stc-nav .btn[disabled]{opacity:.35}
.stc-nav b{font-family:var(--font-display);font-size:var(--fs-4)}
.stc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s-1)}
.stc-h{font-size:var(--fs-1);font-weight:700;color:var(--ink-3);padding:var(--s-1) 0}
.stc-d{min-height:var(--tap);border-radius:var(--r-chip);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;padding:3px 0}
.stc-d.stc-pad{background:none}
.stc-d.on{background:var(--star-tint);box-shadow:inset 0 -3px 0 var(--star)}
.stc-d.on .stc-n{color:var(--try-ink);font-weight:700}
.stc-d.rest{background:var(--brand-tint)}
.stc-d.now{outline:3px solid var(--brand);outline-offset:-3px}
.stc-n{font-size:var(--fs-1);color:var(--ink-2)}
.stc-m{display:grid;place-items:center;min-height:22px}
@media (max-width:420px){.stc-card{padding:var(--s-3)}.stc-grid{gap:2px}}
/* P2-15 ABC Beach (32-gen-read.js genAbc, genSoundB, genSyl). Tokens only. */
.choices.syms.sym4{grid-template-columns:repeat(2,1fr)}
.ab-l{display:flex;align-items:center;justify-content:center;font-size:calc(clamp(36px,9vmin,72px)*var(--k));font-weight:700;color:var(--ink);min-width:1.1em}
.choices.clps .ch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1);min-height:var(--tap-pk)}
.clp{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-1);font-size:var(--fs-5);color:var(--star-shade)}
/* P5-06 Grown-ups report card (82-report.js). Tokens only; every class starts with rp-. */
.rp-entry{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.rp-entry .btn{display:inline-flex;align-items:center;gap:var(--s-2);min-height:var(--tap)}
.rp-entry .small{flex:1 1 180px}
.rp-noprint .btn{min-height:var(--tap);min-width:var(--tap)}
.rp-head{padding:var(--s-2) var(--s-1) 0}
.rp-t{font-size:var(--fs-5);font-weight:700;line-height:var(--lh-5);overflow-wrap:anywhere}
.rp-card{overflow-wrap:anywhere}
.rp-h2{margin:0 0 var(--s-3);font-size:var(--fs-4);line-height:var(--lh-4)}
.rp-h3{margin:var(--s-4) 0 var(--s-2);font-size:var(--fs-3)}
.rp-p{margin:var(--s-3) 0 0;line-height:var(--lh-2)}
.rp-p0{margin:0 0 var(--s-3)}
.rp-key{margin-top:var(--s-3)}
.rp-empty{background:var(--surface-2);border:2px dashed var(--line);border-radius:var(--r-btn);padding:var(--s-3) var(--s-4);
  color:var(--ink-2);line-height:var(--lh-2)}
.rp-card .rp-empty{margin:0}
/* this week / last week */
.rp-wrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2);margin-bottom:var(--s-3)}
.rp-wl{grid-column:1/-1;font-weight:700;color:var(--ink-2)}
.rp-cell{background:var(--surface-2);border-radius:var(--r-btn);padding:var(--s-2);min-width:0;overflow-wrap:normal;box-shadow:inset 0 3px 0 var(--line)}
.rp-h{font-size:var(--fs-1);color:var(--ink-3)}
.rp-n{font-size:var(--fs-5);font-weight:700;line-height:var(--lh-5)}
.rp-cell .small{font-size:var(--fs-1)}
/* 14-day chart */
.rp-svg{display:block;width:100%;max-width:560px;height:auto}
.rp-b0 rect{fill:var(--ink-3)}
.rp-b1 rect{fill:var(--brand)}
.rp-b0 rect.z,.rp-b1 rect.z{fill:var(--line)}
.rp-v{font-size:12px;font-weight:700;fill:var(--ink)}
.rp-l{font-size:12px;fill:var(--ink-3)}
.rp-l.now{fill:var(--ink);font-weight:700}
.rp-div{stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.rp-base{stroke:var(--line);stroke-width:2}
.rp-wk{display:flex;max-width:560px;font-size:var(--fs-1);color:var(--ink-2);font-weight:700}
.rp-wk span{flex:1;text-align:center}
/* by subject */
.rp-sub{display:flex;align-items:center;gap:var(--s-2);margin:var(--s-1) 0}
.rp-sn{flex:0 0 96px;font-weight:700}
.rp-sbar{flex:1;height:14px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.rp-sbar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill)}
.rp-sm{flex:0 0 64px;text-align:right;font-size:var(--fs-2)}
/* where they are working */
.rp-path,.rp-st{margin-bottom:var(--s-4)}
.rp-ph{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-2);flex-wrap:wrap}
.rp-g{display:flex;gap:3px;margin:var(--s-2) 0}
.rp-gc{flex:1;min-width:0;text-align:center;font-size:var(--fs-1);color:var(--ink-3)}
.rp-gc i{display:block;height:14px;border-radius:var(--r-chip);background:var(--surface-2);border:2px solid var(--line);margin-bottom:var(--s-1)}
.rp-gc.on i{background:var(--brand);border-color:var(--brand)}
.rp-gc.on{color:var(--ink)}
.rp-gc.pick i{border-color:var(--ink);border-width:3px}
.rp-gc.pick{font-weight:700;color:var(--ink)}
.rp-bar1{height:14px;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-pill);overflow:hidden;margin:var(--s-2) 0}
.rp-bar1 i{display:block;height:100%;background:var(--es)}
/* mastery by strand */
.rp-bar{display:flex;height:16px;border-radius:var(--r-pill);overflow:hidden;border:2px solid var(--line);margin:var(--s-2) 0;background:var(--surface-2)}
.rp-bar i{display:block;height:100%}
.rp-bar .m{background:var(--good-ink)}
.rp-bar .p{background:var(--good)}
.rp-bar .l{background:var(--try)}
.rp-bar .n{background:var(--surface-2)}
/* lists */
.rp-list{margin:0;padding-left:var(--s-5)}
.rp-list li{margin-bottom:var(--s-3);line-height:var(--lh-2)}
.rp-tag{display:inline-block;background:var(--brand-tint);color:var(--ink);font-size:var(--fs-1);font-weight:700;border-radius:var(--r-pill);padding:0 var(--s-2)}
.rp-ex{display:inline-block;background:var(--try-tint);color:var(--ink);border-radius:var(--r-chip);padding:0 var(--s-2);margin-right:var(--s-1)}
.rp-fr{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-4);padding:var(--s-2) 0;border-bottom:2px solid var(--line)}
.rp-fr b{flex:1 1 100%}
.rp-str{display:flex;align-items:center;gap:var(--s-3)}
.rp-fl{color:var(--play)}
@media (max-width:480px){.rp-wrow{grid-template-columns:repeat(2,1fr)}.rp-t{font-size:var(--fs-4)}.rp-n{font-size:var(--fs-4)}.rp-sn{flex-basis:78px}}
/* print: plain white page, no buttons, all cards in one flow */
@media print{
  html,body,#app,.scroll{height:auto!important;overflow:visible!important;display:block!important;background:var(--surface)!important;animation:none!important}
  .rp-noprint{display:none!important}
  .rp-scroll{padding:0!important}
  .rp-card{break-inside:avoid;box-shadow:none!important;border:2px solid var(--line)}
  .rp-bar,.rp-sbar,.rp-gc i,.rp-b0 rect,.rp-b1 rect{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* P1-04 kinds: match, tap, spell. Tokens only (see 00-tokens.css). */

/* match: two columns of tap-to-pair buttons */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4);max-width:560px;margin:0 auto;width:100%}
.mtc{display:flex;flex-direction:column;gap:var(--s-3)}
.mb{min-height:var(--tap-primary);font-size:clamp(var(--fs-3),3.4vh,var(--fs-5));padding:var(--s-2) var(--s-3);line-height:1.15;
  border:3px solid transparent;overflow-wrap:anywhere}
.mb.sel{border-color:var(--ink);background:var(--surface);transform:translateY(-3px);box-shadow:var(--ledge) var(--ink-3)}
.mb.bad{border-color:var(--danger)}
.mb.done{cursor:default;box-shadow:none;color:var(--ink)}
.mb.pc0{background:var(--brand-tint);border-color:var(--brand)}
.mb.pc1{background:var(--star-tint);border-color:var(--star-shade)}
.mb.pc2{background:var(--good-tint);border-color:var(--good)}
.mb.pc3{background:var(--read-tint);border-color:var(--read)}
.mb.pc4{background:var(--play-tint);border-color:var(--play)}

/* tap: tappable parts inside the prompt (a word, a tick, a piece of a picture) */
.tpz{font-size:var(--fs-6);line-height:1.7;font-weight:700}
.tp{display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);padding:0 var(--s-2);
  border-radius:var(--r-btn);background:var(--surface-2);border:3px dashed var(--line);cursor:pointer;touch-action:manipulation;
  font:inherit;color:inherit}
.tp.right{background:var(--good-tint);border:3px solid var(--good);animation:bump .4s}
.tp.wrong{background:var(--try-tint);border-color:var(--try);opacity:.6}
.tpl{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:var(--s-3);border-bottom:6px solid var(--ink)}
.tpl .tp{flex-direction:column;justify-content:flex-end;border-bottom:0;border-radius:var(--r-btn) var(--r-btn) 0 0;
  font-size:var(--fs-5);padding-bottom:var(--s-1);min-width:var(--tap);flex:0 1 var(--tap)}

/* spell: in-app keyboard. Keys flex to the row width and are at least 48 px tall; 10 keys at 380 px come to about 34 px wide */
.sks{display:flex;flex-direction:column;gap:var(--s-2);width:100%;max-width:560px;margin:0 auto}
.skr{display:flex;gap:var(--s-1);justify-content:center}
.sk{flex:1 1 0;min-width:0;min-height:var(--tap);height:clamp(var(--tap),7vh,64px);padding:0;font-size:var(--fs-5);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center}
.sk.wide{flex:1.6 1 0;background:var(--try-tint)}
@media (max-height:520px){.sks{gap:var(--s-1)}.sk{height:var(--tap)}}
/* content banks and the passage panel (P1-09); tokens only */
.bq{font-size:.55em;line-height:1.25}
.bpic{display:flex;justify-content:center;margin-bottom:var(--s-2);color:var(--brand)}
.bem{font-size:clamp(48px,9vh,72px);line-height:1}
.bq b{color:var(--brand);text-decoration:underline;text-underline-offset:.15em}
.bsent{margin-top:var(--s-2);font-size:.5em;font-weight:700;color:var(--ink-2);line-height:1.3}
.choices.wide{grid-template-columns:1fr}
.choices.wide .ch{font-size:clamp(20px,3.6vh,28px);padding:clamp(8px,1.6vh,14px) var(--s-3)}
.choices.bwords{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-2)}
.choices.bwords .ch{font-size:clamp(20px,3.6vh,28px);padding:clamp(8px,1.6vh,14px) var(--s-4);min-height:var(--tap)}

/* passage panel */
.bctx{width:100%;max-width:760px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);text-align:left;flex:none}
.bctx-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);min-height:var(--tap);padding:var(--s-2) var(--s-4);
  cursor:pointer;list-style:none;font-weight:700;font-size:var(--fs-3);color:var(--ink);touch-action:manipulation}
.bctx-h::-webkit-details-marker{display:none}
.bctx-s{display:inline-flex;align-items:center;gap:var(--s-2);font-size:var(--fs-2);color:var(--brand-shade)}
.bctx-s::after{content:'';width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;
  transform:rotate(225deg) translate(-2px,-2px);transition:transform var(--t) var(--ease)}
.bctx:not([open]) .bctx-s::after{transform:rotate(45deg) translate(-2px,-2px)}
.bctx[open] .bctx-show,.bctx:not([open]) .bctx-hide{display:none}
.bctx-b{max-height:30vh;overflow:auto;padding:0 var(--s-4) var(--s-4);-webkit-overflow-scrolling:touch}
.bctx-say{margin-bottom:var(--s-2);display:inline-flex;align-items:center;gap:var(--s-2)}
.bctx-p{margin:0;font-size:clamp(17px,3.2vmin,24px);line-height:var(--lh-3);font-weight:600;color:var(--ink)}
@media (orientation:landscape){.bctx-b{max-height:44vh}}
@media (max-height:520px){.bctx-b{max-height:36vh}.bctx-h{min-height:var(--tap);padding-top:0;padding-bottom:0}}

/* passage questions (P2-25): the choices sit under the passage panel, so they are compact and the question line stays on screen */
.choices.bpass{gap:var(--s-2)}
.choices.wide.bpass .choice.ch{font-size:clamp(17px,2.7vh,22px);padding:6px var(--s-3);min-height:var(--tap);line-height:1.2}
.choices.bpass:not(.wide) .choice.ch{font-size:clamp(20px,3.2vh,28px);padding:8px var(--s-3);min-height:var(--tap);line-height:1.2} /* short answers (2 x 2 tiles) are compact too (P2-26) */
@media (orientation:portrait) and (max-height:900px){.bctx-b{max-height:24vh}}
/* long passages (P2-29, over 700 characters: grade 4 and up): on a tall phone the panel takes less so the question line and four choices stay on screen */
@media (orientation:portrait) and (max-height:900px){
  .bctx.long .bctx-b{max-height:19vh}.bctx.long .bctx-say{margin-bottom:var(--s-1)}
  .qs .qarea:has(.bctx.long){padding-top:var(--s-3);padding-bottom:var(--s-3);gap:var(--s-2)}
  .qs .qarea:has(.bctx.long) .bctx-h{padding-top:0;padding-bottom:0}
}
/* Placement quiz "Find my level" (P1-07): home card, Grown-ups row, quiz dots, result. Tokens only. */
.pl-card{background:var(--brand-tint);border-radius:var(--r-card);padding:var(--s-3) var(--s-4);margin:var(--s-4) 0 0;color:var(--ink)}
.pl-ct{display:flex;align-items:center;gap:var(--s-2);font-size:var(--fs-3);line-height:var(--lh-3);color:var(--ink)}
.pl-ct .ic{color:var(--brand);flex:none}
.pl-row{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.pl-sub,.pl-no{min-height:var(--tap);font-size:var(--fs-3);font-weight:700;display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4)}
.pl-sub{background:var(--surface);color:var(--brand-shade)}
.pl-no{background:transparent;box-shadow:none;color:var(--ink-2)}
.pl-pe{display:grid;place-items:center;line-height:1;color:var(--c,var(--brand))}
.pl-grown{margin-top:var(--s-3)}
.pl-grown .small{margin-top:var(--s-1)}
.pl-in{max-width:560px;margin:0 auto}
.pl-in .rowh{flex-wrap:wrap;justify-content:center}
.pl-big{position:relative;display:grid;place-items:center;width:112px;height:112px;margin:0 auto var(--s-2);border-radius:34px;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));box-shadow:inset 0 -6px 0 var(--c-shade,var(--brand-shade)),0 6px 0 var(--ledge-soft)}
.pl-tg{position:absolute;right:-10px;bottom:-8px;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--star);color:var(--try-ink);
  box-shadow:inset 0 0 0 3px var(--surface),0 3px 0 var(--star-shade)}
.pl-done{display:grid;place-items:center;width:112px;height:112px;margin:0 auto var(--s-2);border-radius:50%;line-height:1;color:var(--star-shade);
  background:var(--star-tint);--ic2:var(--star-tint);box-shadow:inset 0 0 0 4px var(--star),0 6px 0 var(--star-shade)}
.pl-res{display:inline-flex;align-items:center;gap:var(--s-3);font-size:var(--fs-5);font-weight:700;background:var(--surface);color:var(--ink);font-family:var(--font-display);
  border-radius:var(--r-card);padding:var(--s-3) var(--s-5);box-shadow:var(--shadow);margin:var(--s-2) 0}
.pl-skip{display:flex;align-items:center;justify-content:center;gap:var(--s-1);color:var(--ink-2)}
.pl-skip .ic{color:var(--good);flex:none}
.pl-dots{display:flex;gap:var(--s-2);align-items:center}
.pl-dot{width:18px;height:18px;border-radius:var(--r-pill);background:var(--line);transition:transform var(--t) var(--ease)}
.pl-dot.now{background:var(--brand-tint);box-shadow:inset 0 0 0 3px var(--brand)}
.pl-dot.on{background:var(--brand)}
.pl-tag{display:flex;align-items:center;gap:var(--s-1);font-size:var(--fs-2);font-weight:700;color:var(--ink-2);white-space:nowrap}
.pl-tag .ic{color:var(--c,var(--brand))}
.pl-res .wbadge{width:48px;height:48px}
.pl-res .wbadge .ic{width:28px;height:28px}
.pl-pick{outline:4px solid var(--brand);outline-offset:2px}
.fb.pl-fb{color:var(--brand)}
@media (max-width:420px){.pl-card{padding:var(--s-3)}}
.btn.pl-x{min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-1)}
/* P2-08 step hints (CURRICULUM M-hints). Markup: hintSteps in 39-hints.js wraps one step of a builder in 39b-steps.js:
   .hs (+ txt | mid | wide) > .hs-pips + .hs-step > .hsb (the work board) + p.hsc (the caption).
   The board is a grid of i cells (one column per place): .cy carries, .n digits, .ln lines, .op the operator column, .pt the
   point column; cell states .on (used in this step), .nw (written in this step), .x (crossed out), .pz (a 0 written to line up),
   .ask (the "?"), .src (a digit just brought down), .sg (minus sign). Fractions: .hsf with .hfr (stacked), .har (x3 labels).
   Also the prompt layouts ST.vert (.veq .gh: hidden zeros that keep the points lined up) and ST.ldiv (.ldq).
   Tokens only; animate transform and opacity only; no filter. */

/* ---------- the step panel: board beside the caption, or above it when the board is wide ---------- */
.hs{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"b p" "b c";
  column-gap:var(--s-4);row-gap:var(--s-2);
  align-items:start;width:100%;text-align:left;font-weight:400}
.hs-step{display:contents}
.hs .hsb{grid-area:b}
.hs .hsc{grid-area:c}
.hs-pips{grid-area:p;display:flex;align-items:center;gap:6px;min-height:12px;padding-top:2px;color:var(--try-ink);font-size:var(--fs-2)}
.hs.txt{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "c"}
.hs.wide{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "b" "c"}
.hs.wide .hsb{justify-self:center}
@media (max-width:480px){
  .hs.mid{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "b" "c"}
  .hs.mid .hsb{justify-self:center}
}
.hs-pips i{width:8px;height:8px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 2px var(--try-ink);opacity:.55}
.hs-pips i.dn{background:var(--try-ink);opacity:1}
.hs-pips i.on{width:22px;background:var(--try-ink);opacity:1;transform-origin:left center;animation:k-hsgrow var(--t-slow) var(--ease)}
@keyframes k-hsgrow{from{transform:scaleX(.4)}}
.hsc{margin:0;color:var(--ink);font-size:var(--fs-3);font-weight:400;line-height:1.4;animation:k-hsin var(--t-slow) var(--ease)}
.hsc b{color:var(--try-ink);font-weight:700}
@keyframes k-hsin{from{opacity:0;transform:translateY(6px)}}

/* ---------- the work board ---------- */
.hsb{--hsw:1.2em;--hpt:.45em;display:grid;align-items:center;justify-content:start;padding:var(--s-2) var(--s-3);border-radius:var(--r-btn);
  background:var(--surface);box-shadow:inset 0 0 0 2px var(--try),0 3px 0 var(--try);color:var(--ink);font-family:var(--font-display);
  font-size:var(--fs-4);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hsb>i{position:relative;display:grid;place-items:center;height:1.3em;font-style:normal;border-radius:var(--r-chip)}
.hsb>i.cy{height:1.25em;font-size:.62em;color:var(--read)}
.hsb>i.op{place-items:center end;min-width:.8em;padding-right:.15em;color:var(--ink-2)}
.hsb>i.pt{place-items:end center;padding-bottom:.1em}
.hsb>i.pt.cy{padding:0}
/* lines: under the numbers, under each product in long division */
.hsb>i.ln{height:.4em}
.hsb>i.ln::after{content:'';position:absolute;left:-1px;right:-1px;top:50%;height:3px;margin-top:-1.5px;background:var(--ink)}
.hsb>i.ln.l0::after{display:none}
.hsb>i.ln.nw::after{transform-origin:right center;animation:k-hsline var(--t-slow) var(--ease)}
@keyframes k-hsline{from{transform:scaleX(0)}}
/* states */
.hsb>i.on{background:var(--try-tint);box-shadow:inset 0 0 0 2px var(--try)}
.hsb>i.nw{color:var(--brand);animation:k-hspop var(--t-slow) var(--spring)}
.hsb>i.cy.nw{color:var(--read)}
@keyframes k-hspop{from{opacity:0;transform:translateY(-.35em) scale(.6)}}
.hsb>i.pz{color:var(--ink-3)}
.hsb>i.x{color:var(--ink-3)}
.hsb>i.x::after{content:'';position:absolute;left:20%;right:20%;top:50%;height:2px;margin-top:-1px;border-radius:var(--r-pill);
  background:var(--read);transform:rotate(-60deg)}
.hsb>i.x.nw{animation:none}
.hsb>i.x.nw::after{animation:k-hsx var(--t-slow) var(--ease)}
@keyframes k-hsx{from{transform:rotate(-60deg) scaleX(0)}}
.hsb>i.ask{color:var(--try-ink);background:var(--try-tint);outline:2px dashed var(--try-ink);outline-offset:-2px;
  animation:k-hspop var(--t-slow) var(--spring)}
.hsb>i.src{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand);border-radius:0}

/* long division: the divisor sits in the operator column with the bracket on its right; a line (.vn) runs over the dividend */
.hsdiv>i.op.dd{padding-right:.4em;color:var(--ink)}
.hsdiv>i.op.dd::after{content:'';position:absolute;right:0;top:-.2em;bottom:.05em;width:.26em;border-right:3px solid var(--ink);
  border-radius:0 100% 100% 0/0 50% 50% 0}
.hsdiv>i.op.vn.l0::after{display:block;left:auto;right:-1px;width:.3em}
.hsdiv>i.op.n:not(.dd){color:var(--ink)}
.hsdiv>i.sg{color:var(--ink)}

/* fractions: stacked fractions, the "x3" steps between them, and two lines for a common bottom */
.hsf{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3)}
.hsf.hsfs{flex-direction:column;align-items:flex-start;gap:var(--s-2)}
.hfl{display:flex;align-items:center;gap:var(--s-2)}
.hfr{position:relative;display:inline-grid;justify-items:center;row-gap:.3em}
.hfr::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:var(--r-pill);background:var(--ink)}
.hfr>i{display:grid;place-items:center;min-width:1.5em;height:1.3em;padding:0 .15em;font-style:normal;border-radius:var(--r-chip)}
.hfr>i.on{background:var(--try-tint);box-shadow:inset 0 0 0 2px var(--try)}
.hfr>i.nw{color:var(--brand);animation:k-hspop var(--t-slow) var(--spring)}
.hfr>i.ask{color:var(--try-ink);background:var(--try-tint);outline:2px dashed var(--try-ink);outline-offset:-2px}
