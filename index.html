/* ---------- mastery tracking and in-round adaptation (P1-08; ROADMAP 3.3) ----------
   Saved data: S.mast = {nid: {n, p, ms, d, last, md}}, keyed by stop id nid() = skill + level ('add1'). Optional field:
   read with defaults, written on the first try at a question of a stop that is on some map (any round: stop, boss, test out,
   tricky mix, review slot). A round can opt out with G.nomast = true (no recording, no adaptation).
     n     first tries at this stop (attempts)
     p     first-try accuracy, 0..1: the plain average for the first 10 tries, then a moving average (weight 0.1)
     ms    answer time of a first try, running median estimate in ms (each sample capped at 60 s)
     d     distinct days practised
     last  last day practised, as a day number (STRK.idx(today()); STRK.key(n) turns it back into 'Y-M-D')
     md    day number the stop first became mastered (stays set if accuracy later drops; for "Recently mastered")
   API for the map, spaced review (P5-02) and the report card (P5-06):
     MAST                   the thresholds below
     mastRec(nid)           the record, or null when the stop was never tried (read only; never creates one)
     masteryState(nid)      'new' | 'learning' | 'practised' (>= 70% over 10+ tries) | 'mastered' (>= 90% over 20+ tries,
                            2+ days)
     mastStops(p)           [{i, nid, t, wi, state, rec}] for every non-boss stop of path p, in map order (one per nid)
     harder(nd), easier(nd) next / previous stop of the same skill in path order (a NODES entry), or null
     mastDay()              today as a day number
   In-round adaptation (only in a normal stop round: G.path and G.node set, no pool, not boss, test, mix):
     - after question 5, from the first tries of questions 1-5 (G.fr):
       5 of 5 and fast (median answer time under MAST.FAST, MAST.FAST_YOUNG for Pre-K and K) -> 'challenge': every
       remaining question comes from harder(stop) and shows a Challenge tag; a wrong first try there does not cost stars
       (G.forgive, added to the score for the star rating only). No harder stop: the round stays normal.
       2 or fewer of 5 -> 'support': the hint shows before the first try, and every other remaining question (6th, 8th,
       10th) comes from easier(stop) (the stop's own level when there is none).
       Anything else -> normal (G.mode = ''), the round is unchanged.
     - 3 wrong first tries in a row, at any point: the pet offers a hint and the next question is an easier one (from
       easier(stop), with the hint shown; in challenge mode, from the round's own stop). After question 5 it also steps
       the mode down: challenge -> normal, normal -> support.
     Star thresholds, round length, coins and locks never change. Everything is decided from the answers alone, so the
     same answers give the same questions' stops (tests rely on it).
   Hooks in 50-round.js: makeQ() calls mastQ() first, check() calls mastTry(q, ok) on a first try, renderQ() calls
   mastShow(q) last, finish() adds G.forgive to the score for the star rating. */
const MAST={

  FAST:12000,        // median first-try time (ms) that counts as fast, 1st grade and up
  FAST_YOUNG:16000,  // the same for Pre-K and K (every prompt is read aloud first)
  SUPPORT:2,         // this many right of the first 5, or fewer, turns on support
  RUN:3,             // wrong first tries in a row before an easier question
  CAP:60000,         // one answer time never counts as more than this
  ALPHA:0.1,         // weight of a new try in the accuracy average (after the first 1/ALPHA tries)

const mastDay=()=>STRK.idx(today());
const mastRec=k=>(S.mast&&S.mast[k])||null;
function masteryState(k){

  if(r.p>=.7&&r.n>=10)return'practised';
  return'learning';
}
/* The first map stop with this skill and level, as {p, i}, or null (a demo skill, an old stored question). */
function mastStop(sk,lv){

    out.push({i,nid:k,t:n.t,wi:n.wi,state:masteryState(k),rec:mastRec(k)});

}
function mastNear(nd,dir){
  if(!nd||nd.sk=='boss'||!NODES[nd.p])return null;
  const N=NODES[nd.p],i=N.findIndex(n=>n.sk==nd.sk&&n.lv==nd.lv);
  for(let j=i+dir;i>=0&&j>=0&&j<N.length;j+=dir)if(N[j].sk==nd.sk&&N[j].lv!=nd.lv)return N[j];
  return null;
}
const harder=nd=>mastNear(nd,1),easier=nd=>mastNear(nd,-1);

/* Adds one first try to S.mast[k]. Returns the record. */
function mastAdd(k,ok,ms){
  const M=S.mast||(S.mast={}),r=M[k]||(M[k]={n:0,p:0,ms:0,d:0,last:0}),dn=mastDay();
  ms=Math.max(0,Math.min(MAST.CAP,Math.round(ms)||0));
  r.n++;

  // running median: step toward the new time by at most an eighth of the estimate (at least 250 ms)

  return r;

/* ---- in-round adaptation ---- */
const mastOn=g=>!!(g&&g.path&&g.node>=0&&!g.pool&&!g.boss&&!g.test&&!g.mix&&!g.nomast&&NODES[g.path]&&NODES[g.path][g.node]);

/* Pure: the mode for a round from its first-try results [{ok, ms}] (first MAST.AT used) and grade g. */
function mastMode(fr,g){
  const f=fr.slice(0,MAST.AT),right=f.filter(x=>x.ok).length;
  if(f.length<MAST.AT)return'';
  if(right<=MAST.SUPPORT)return'support';
  const t=f.map(x=>x.ms).sort((a,b)=>a-b),med=t[t.length>>1];

/* Pure apart from G's own counters: the stop the next question comes from, as {sk, lv, tag}, or null for a normal one. */
function mastPick(g){

  if(g.ease){

  }
  if(g.done<MAST.AT)return null;
  if(g.mode===undefined)g.mode=mastMode(g.fr||[],gradeOf());
  if(g.mode=='challenge'){const h=harder(nd);return h?{sk:h.sk,lv:h.lv,tag:'ch'}:null}
  if(g.mode=='support'&&(g.done-MAST.AT)%2==0){const e=easier(nd);return e?{sk:e.sk,lv:e.lv,tag:'sup'}:null}
  return null;
}
/* makeQ hook: a question from another stop when adaptation asks for one (or a tagged own-level one after a wrong run). */
function mastQ(){

function mastTry(q,ok,ms){

/* Activity log (P5-05): time on task. Stays on the device; the Grown-ups report card (P5-06) reads it.
   S.log = [{d, sec, rounds, q, ok, by}] sorted oldest first, at most 60 days.
     d       day key 'Y-M-D' (same local format as today() and S.streak)
     sec     active seconds that day, all subjects (always the sum of by)
     rounds  learning rounds finished that day
     q       questions answered that day (a question counts once, when it is finally answered right; re-asked misses do not count again)
     ok      of those, answered right on the first try
     by      {area: seconds}; area is the skill's area: math, read, es (later bt, disc)
   Time rule: a question's time runs from the moment it is on screen to the moment it is answered right. Time while the tab is
   hidden is left out, and one question counts at most 60 s, so a tablet left on a question does not pile up minutes.
   A question that is never answered (child quits) adds no time. Fact Sprint adds its own active seconds to math.
   Every field is read with a default, so a missing or damaged S.log never throws.

   API for the report card (all safe on missing data):
     ACT.get()                 the cleaned array (oldest first); creates S.log if needed
     ACT.entry(key)            the entry for a day key, or null
     ACT.sum(endKey, days)     totals {sec, rounds, q, ok, by, active} for the `days` days ending at endKey (default today(), 7).
                               active = number of days with any time. "This week" = ACT.sum(today(),7); "last week" =
                               ACT.sum(ACT.shift(today(),-7),7). accuracy = ok/q when q>0.
     ACT.shift(key, n)         day key n days after key (n may be negative)
     ACT.total()               totals over the whole kept log */
const ACT={
  KEEP:60,      // days kept
  CAP:60,       // most seconds one question can count
  cur:null,     // question on screen: {area, acc (ms counted so far), t0 (ms when it last became visible, or null while hidden)}
  now(){return Date.now()},
  hidden(){return typeof document!='undefined'&&!!document.hidden},
  shift(k,n){const i=STRK.idx(k);return i>=0?STRK.key(i+n):k},
  clean(e){ // one entry with every field a safe number; null when it has no usable day
    if(!e||typeof e!='object'||!(STRK.idx(e.d)>=0))return null;
    const n=v=>(v>0&&isFinite(v))?Math.round(v):0,by={};
    if(e.by&&typeof e.by=='object'&&!Array.isArray(e.by))for(const a in e.by)if(/^[a-z]{1,8}$/.test(a)&&n(e.by[a]))by[a]=n(e.by[a]);
    let sec=0;for(const a in by)sec+=by[a];
    return{d:String(e.d),sec,rounds:n(e.rounds),q:n(e.q),ok:Math.min(n(e.ok),n(e.q)),by};
  },
  get(){
    const out=[];
    if(Array.isArray(S.log))for(const e of S.log){
      const c=ACT.clean(e);
      if(!c)continue;
      const o=out.find(x=>x.d===c.d);
      if(o){o.sec+=c.sec;o.rounds+=c.rounds;o.q+=c.q;o.ok+=c.ok;for(const a in c.by)o.by[a]=(o.by[a]||0)+c.by[a]}else out.push(c);
    }
    out.sort((a,b)=>STRK.idx(a.d)-STRK.idx(b.d));
    return S.log=out;
  },
  entry(k){return ACT.get().find(e=>e.d===k)||null},
  // Add to one day's entry (created on first use), then drop days older than KEEP days before `key`.
  add(key,o){
    const log=ACT.get();
    let e=log.find(x=>x.d===key);
    if(!e){e={d:key,sec:0,rounds:0,q:0,ok:0,by:{}};log.push(e);log.sort((a,b)=>STRK.idx(a.d)-STRK.idx(b.d))}
    const sec=Math.max(0,Math.round(o.sec||0));
    if(sec){const a=/^[a-z]{1,8}$/.test(o.area)?o.area:'other';e.by[a]=(e.by[a]||0)+sec;e.sec+=sec}
    e.rounds+=o.rounds||0;e.q+=o.q||0;e.ok+=o.ok||0;
    const t=STRK.idx(key);
    S.log=log.filter(x=>STRK.idx(x.d)>t-ACT.KEEP&&STRK.idx(x.d)<=t+1); // old days go; so do days far in the future (clock set back)
    return e;
  },
  sum(endKey,days){
    const end=STRK.idx(endKey||today()),n=days||7,r={sec:0,rounds:0,q:0,ok:0,by:{},active:0};
    if(!(end>=0))return r;
    for(const e of ACT.get()){
      const i=STRK.idx(e.d);
      if(i>end-n&&i<=end){
        r.sec+=e.sec;r.rounds+=e.rounds;r.q+=e.q;r.ok+=e.ok;if(e.sec)r.active++;
        for(const a in e.by)r.by[a]=(r.by[a]||0)+e.by[a];
      }
    }
    return r;
  },
  total(){
    const r={sec:0,rounds:0,q:0,ok:0,by:{},active:0};
    for(const e of ACT.get()){
      r.sec+=e.sec;r.rounds+=e.rounds;r.q+=e.q;r.ok+=e.ok;if(e.sec)r.active++;
      for(const a in e.by)r.by[a]=(r.by[a]||0)+e.by[a];
    }
    return r;
  },
  // A question appears. `now` and `hidden` are passed in by the tests.
  qStart(sk,now,hidden,lv){
    const a=(typeof SK!='undefined'&&SK[sk]&&((SK[sk].lvArea||{})[lv]||SK[sk].area))||'other';
    ACT.cur={area:a,acc:0,t0:hidden?null:now};
  },
  // The tab was hidden or shown again.
  vis(hidden,now){
    const c=ACT.cur;
    if(!c)return;
    if(hidden&&c.t0!=null){c.acc+=now-c.t0;c.t0=null}
    else if(!hidden&&c.t0==null)c.t0=now;
  },
  // The question was answered right. first = right on the first try; again = it was a re-asked miss (time counts, question does not).
  qEnd(first,again,now,key){
    const c=ACT.cur;
    ACT.cur=null;
    if(!c)return null;
    if(c.t0!=null)c.acc+=now-c.t0;
    const sec=Math.min(ACT.CAP,Math.max(1,Math.round(c.acc/1000)));
    return ACT.add(key||today(),{sec,area:c.area,q:again?0:1,ok:again?0:(first?1:0)});
  },
  round(key){return ACT.add(key||today(),{rounds:1})},
  flu(sec,key){return ACT.add(key||today(),{sec:Math.min(sec||0,ACT.CAP*2),area:'math'})},
};

/* Daily missions v2 (P5-08). Three missions a day, drawn from a pool that fits the child, the same all day, new at local midnight.
   Saved in S.day.m = [{k, p, d}] (kind, subject path for the kinds that need one, d = 1 when done). S.day is replaced by day() at the
   first call on a new day, so the missions start again then without a migration. A missing or damaged list is drawn again.
   The draw is seeded by the day key, the child's name and grade, and only offers what the child can do right now:
     round    one learning round in the subject that needs the most practice (lowest mastery, else the least played)
     other    a learning round in a different subject
     perfect  a round with every answer right (the subject with the best mastery, to make it fair)
     sprint   one Fact Sprint (grade K and up)
     teaser   solve one Brain Teaser (only when a puzzle type is offered at the child's grade)
     review   do today's review (only when something is due)
     mix      one Mixed Practice round
   "round" is always one of the three; the other two are drawn from what is left. Finishing a mission gives a sticker, once (it is
   marked done first). All three together give the old mission bonus once a day: 5 stars, 5 coins and a sticker (S.day.done).
   Hooks: finish() in 50-round.js (rounds, mixes, reviews), the sprint's finish in 57-fluency.js, BT.finish in 74-teasers.js. */
const MIS = {
  N: 3,
  KINDS: ['round', 'other', 'perfect', 'sprint', 'teaser', 'review', 'mix'],
  BONUS_STARS: 5,
  BONUS_COINS: 5,
  SUBJ: { math: 'Math', read: 'Reading', es: 'Spanish', disc: 'Discover' },
  hash(s) {
    let h = 2166136261;
    s = String(s);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  },
  // The stop a learning round in subject p starts at: the open stop the map points at (never a boss), or null when none can be played.
  stop(p) {
    const N = NODES[p];
    if (!N || !N.length) return null;
    const ok = j => N[j] && N[j].sk != 'boss' && SK[N[j].sk] && unlocked(p, j);
    const c = curNode(p);
    if (ok(c)) return { p, i: c };
    for (let j = Math.min(c, N.length - 1); j >= 0; j--) if (ok(j)) return { p, i: j };
    return null;
  },
  // Mean accuracy over the stops of a subject tried at least 3 times, or null when there is nothing to go on
  score(p) {
    let t = 0, c = 0;
    for (const n of NODES[p]) {
      if (n.sk == 'boss') continue;
      const r = mastRec(nid(n));
      if (r && r.n >= 3) { t += +r.p || 0; c++; }
    }
    return c ? t / c : null;
  },
  passedN: p => NODES[p].filter((n, i) => passed(p, i)).length,
  // The subjects the child can play a round in, with their score: [{p, i, s, n}]
  subjects() {
    const out = [];
    for (const p of Object.keys(PATHS)) {
      const st = MIS.stop(p);
      if (st) out.push({ p, i: st.i, s: MIS.score(p), n: MIS.passedN(p) });
    }
    return out;
  },
  // What the child can do right now; draw() reads only this
  ctx() {
    const g = gradeOf();
    let bt = false, spr = false, due = 0;
    try { bt = BT.offered().length > 0; } catch (e) {}
    try { spr = g >= 0 && FLU.sets().length > 0; } catch (e) {}
    try { due = dueItems().length; } catch (e) {}
    return { g, subs: MIS.subjects(), bt, spr, due };
  },
  // Pure: three missions [{k, p?, d:0}] for a day key, a child name and a ctx
  draw(dayKey, name, c) {
    const rnd = mulberry32(MIS.hash(['mis', dayKey, name, c.g].join('|')));
    const pickOf = a => a[Math.floor(rnd() * a.length)];
    // weakest first: lowest score (no data counts as 2), then the fewest stops passed, then the draw
    const subs = c.subs.map(s => ({ s, r: rnd() })).sort((a, b) => (a.s.s == null ? 2 : a.s.s) - (b.s.s == null ? 2 : b.s.s) || a.s.n - b.s.n || a.r - b.r).map(x => x.s);
    const first = { k: 'round', p: subs[0].p, d: 0 };
    const rest = [];
    if (subs.length > 1) rest.push({ k: 'other', p: pickOf(subs.slice(1)).p, d: 0 });
    rest.push({ k: 'perfect', p: subs[subs.length - 1].p, d: 0 }, { k: 'mix', d: 0 });
    if (c.spr) rest.push({ k: 'sprint', d: 0 });
    if (c.bt) rest.push({ k: 'teaser', d: 0 });
    if (c.due > 0) rest.push({ k: 'review', d: 0 });
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    return [first].concat(rest.slice(0, MIS.N - 1)).sort((a, b) => MIS.KINDS.indexOf(a.k) - MIS.KINDS.indexOf(b.k));
  },
  valid(m) {
    return Array.isArray(m) && m.length == MIS.N && new Set(m.map(x => x && x.k)).size == MIS.N &&
      m.every(x => x && MIS.KINDS.includes(x.k) && (x.d === 0 || x.d === 1) && (['round', 'other', 'perfect'].includes(x.k) ? !!NODES[x.p] : true));
  },
  // Today's three missions (drawn on the first call of the day and kept)
  get() {
    const d = day();
    if (!MIS.valid(d.m)) {
      d.m = MIS.draw(today(), S.name || '', MIS.ctx());
      if (d.done) d.m.forEach(x => { x.d = 1; }); // an old save that finished the old mission today: nothing more to earn
      save();
    }
    return d.m;
  },
  count() { try { return MIS.get().filter(x => x.d).length; } catch (e) { return 0; } },
  // Does a finished thing count for mission x? ev: {k:'round', p, mix, test, boss, daily, perfect} | {k:'sprint'} | {k:'teaser'}
  hit(x, ev) {
    if (x.k == 'sprint' || x.k == 'teaser') return ev.k == x.k;
    if (ev.k != 'round') return false;
    if (x.k == 'round' || x.k == 'other') return !!ev.p && ev.p === x.p && !ev.mix && !ev.test;
    if (x.k == 'perfect') return !!ev.perfect;
    if (x.k == 'mix') return !!ev.mix && !ev.daily;
    if (x.k == 'review') { let n = 1; try { n = dueItems().length; } catch (e) {} return !!ev.daily || (!!ev.mix && n == 0); }
    return false;
  },
  // Something was finished. Marks the missions it completes and gives each one sticker. Returns {won: [{x, st}], bonus: bool}.
  // The bonus (stars and coins) is paid by the caller (finish() adds it to its totals; pay() does it for the other screens).
  done(ev) {
    const out = { won: [], bonus: false };
    try {
      const m = MIS.get(), d = day();
      for (const x of m) if (!x.d && MIS.hit(x, ev)) { x.d = 1; out.won.push({ x, st: award() }); }
      if (out.won.length && m.every(x => x.d) && !d.done) { d.done = true; out.bonus = true; }
    } catch (e) { logErr('missions: ' + e.message); }
    return out;
  },
  // For screens without the treasure chest (sprint, puzzle): pays the bonus and returns the markup of what was won (or '')
  pay(mi) {
    if (!mi.won.length) return '';
    if (mi.bonus) { S.stars += MIS.BONUS_STARS; S.coins += MIS.BONUS_COINS; mi.bst = award(); }
    return MIS.winHTML(mi);
  },
  title(x) {
    const s = MIS.SUBJ[x.p] || 'Math';
    return { round: `Play a ${s} round`, other: `Try a ${s} round`, perfect: 'Get a perfect round', sprint: 'Do a Fact Sprint', teaser: 'Solve a Brain Teaser',
      review: "Do today's review", mix: 'Play Mixed Practice' }[x.k];
  },
  sub(x) {
    return { round: 'Make it stronger!', other: 'Visit another subject!', perfect: 'Every answer right!', sprint: 'Beat your best!', teaser: 'Think hard!',
      review: 'Practice what you learned', mix: 'A bit of everything!' }[x.k];
  },
  icon(x) {
    return { round: UI.SUBJ_ICON[x.p] || 'path-math', other: UI.SUBJ_ICON[x.p] || 'path-math', perfect: 'star', sprint: 'bolt', teaser: 'puzzle', review: 'replay', mix: 'sparkle' }[x.k];
  },
  // The subject colour class of a mission
  cls(x) { return { round: 's-' + x.p, other: 's-' + x.p, perfect: 's-play', sprint: 's-math', teaser: 's-bt', review: 's-play', mix: 's-es' }[x.k]; },
  // What the child sees after finishing: one line and one sticker per mission, then the bonus
  winHTML(mi) {
    const row = (icon, text, st, i) => `<li>${ico(icon, 20)}<span>${text}</span>${RW.sticker(st.s, st.isNew, i)}</li>`;
    const rows = mi.won.map((w, i) => row('check', 'Mission done! ' + esc(MIS.title(w.x)), w.st, i)).join('') +
      (mi.bonus && mi.bst ? row('trophy', `All 3 missions! +${MIS.BONUS_STARS} stars, +${MIS.BONUS_COINS} coins`, mi.bst, mi.won.length) : '');
    return `<ul class="mis-win" role="status">${rows}</ul>`;
  },
  // Tapping a mission: straight to it
  go(x) {
    SFX.whoosh();
    if (x.k == 'sprint') {
      const ss = FLU.sets();
      return fluPlay(ss[ss.length - 1].id, 't60');
    }
    if (x.k == 'teaser') {
      const d = BT.dailyInfo();
      return d && !d.done ? BT.start(d.id, d.band, d.level) : BT.hub();
    }
    if (x.k == 'review') return startReview();
    if (x.k == 'mix') return startMix();
    const st = MIS.stop(x.p) || MIS.stop('math');
    if (st) open(st.p, st.i); else startMix();
  },
};

/* Streak calendar (P5-04). S.streak = {days:{'Y-M-D':rounds}, best, rw}. Day keys use the same local-time format as today().
   A day counts when at least one learning round is finished (streakTick() is called from finish() in 50-round.js).
   Rest rule: one missed day is forgiven when the day before it was active and no other rest day sits inside the 7 days before it. */
const STRK={
  KEEP:120, // days of history kept
  MILESTONES:[[3,5],[7,10],[14,20],[30,50]], // [days, coins]; each also gives a sticker
  // 'Y-M-D' <-> whole day number. UTC arithmetic on the calendar date only, so daylight saving never shifts a day.
  idx(k){
    const m=/^(\d+)-(\d+)-(\d+)$/.exec(String(k));
    return m?Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5):NaN;
  },
  key(i){const d=new Date(i*864e5);return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()},
  // the saved object, with defaults when it is missing or damaged (not saved here)
  get(){
    let s=S.streak;
    if(!s||typeof s!='object'||Array.isArray(s))s=S.streak={};
    if(!s.days||typeof s.days!='object'||Array.isArray(s.days))s.days={};
    if(!(s.best>=0))s.best=0;
    if(!(s.rw>=0))s.rw=0;
    return s;
  },
  // Pure: current streak from a days map and today's key. Returns {count, rests:[keys], doneToday}.
  // Walks back from today (or yesterday while today is still to play). Future dates (clock set back) are ignored.
  calc(days,todayKey){
    const t=STRK.idx(todayKey),act=i=>(days&&+days[STRK.key(i)]>0)&&i<=t;
    const out={count:0,rests:[],doneToday:false};
    if(!(t>=0))return out;
    out.doneToday=!!act(t);
    let i=out.doneToday?t:t-1,lastRest=null;
    for(let n=0;n<400;n++){
      if(act(i)){out.count++;i--}
      else if(act(i-1)&&(lastRest===null||lastRest-i>=7)){out.rests.push(STRK.key(i));lastRest=i;i--}
      else break;
    }
    return out;
  },
  info(){return STRK.calc(STRK.get().days,today())},
  count(){try{return STRK.info().count}catch(e){return 0}},
  // Record one finished round. Returns {count, msg} where msg is a reward line (or '').
  tick(){
    const s=STRK.get(),k=today(),first=!(s.days[k]>0);
    s.days[k]=(+s.days[k]||0)+1;
    const t=STRK.idx(k);
    for(const d in s.days)if(!(STRK.idx(d)>t-STRK.KEEP))delete s.days[d]; // trim to the last 120 days (bad keys go too)
    const c=STRK.calc(s.days,k).count;
    if(c>s.best)s.best=c;
    let msg='';
    if(c<s.rw)s.rw=0; // the streak broke and started again: milestones can be earned again
    if(first){
      const m=STRK.MILESTONES.filter(([n])=>n<=c&&n>s.rw).pop();
      if(m){
        s.rw=m[0];S.coins=(S.coins||0)+m[1];
        const a=award();
        msg=`🔥 ${m[0]} days in a row! +${m[1]} 🪙 and a sticker ${a.s}`;
      }
    }
    return{count:c,msg};
  },
  // Calendar grid for a month (m = 0..11): array of weeks (Sunday first), each 7 entries of a day number or 0 for padding.
  grid(y,m){
    const first=new Date(Date.UTC(y,m,1)).getUTCDay(),n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),cells=[];
    for(let i=0;i<first;i++)cells.push(0);
    for(let d=1;d<=n;d++)cells.push(d);
    while(cells.length%7)cells.push(0);
    const weeks=[];
    for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
    return weeks;
  },
  MONTHS:['January','February','March','April','May','June','July','August','September','October','November','December'],
};
function streakTick(){try{return STRK.tick()}catch(e){return{count:0,msg:''}}}

// A played day's star: the P4-04 rating star (ledge behind, star in front)
const STC_STAR=`<span class="rs on">${ico('star',20,'rs-b')}${ico('star',20,'rs-f')}</span>`;
// Month grid screen. off = months back from this month (0 = this month).
function streakCal(off){

  const now=new Date(),b=new Date(now.getFullYear(),now.getMonth()-off,1),y=b.getFullYear(),m=b.getMonth();
  const s=STRK.get(),inf=STRK.info(),rest=new Set(inf.rests),tk=today();
  let cells='';
  for(const wk of STRK.grid(y,m))for(const d of wk){
    if(!d){cells+='<div class="stc-d stc-pad"></div>';continue}
    const k=y+'-'+(m+1)+'-'+d,n=+s.days[k]||0;
    cells+=`<div class="stc-d${n?' on':''}${k===tk?' now':''}${rest.has(k)?' rest':''}" aria-label="${STRK.MONTHS[m]} ${d}${n?', played':''}">`+
      `<span class="stc-n">${d}</span><span class="stc-m">${n?STC_STAR:rest.has(k)?ico('moon',18):''}</span></div>`;

  // P4-18: drawn flame, stars, moon and prize chips (were emoji)

  view(`<div class="top tbar gx-mtop s-play">${UI.ibtn('back','Back',{size:'sm',id:'back'})}<div class="ttl gx-ttl"><span class="gx-tb">${ico('flame',24)}</span><span>My Streak</span></div></div>
   <div class="scroll"><div class="stc-card">
    <div class="stc-hero${inf.count?'':' off'}"><span class="stc-fd">${ico('flame',64)}</span><span class="stc-big">${inf.count}</span></div><div class="stc-sub">${msg}</div>
    <div class="stc-sub small">Best: ${s.best} day${s.best==1?'':'s'}. A rest day ${ico('moon','1.2em','ic-brand')} will not break your streak.</div>
    <div class="stc-nav">${UI.ibtn('chevron-left','Earlier month',{size:'sm',id:'stcp',off:off>=4})}
     <b>${STRK.MONTHS[m]} ${y}</b>${UI.ibtn('chevron-right','Later month',{size:'sm',id:'stcn',off:off<=0})}</div>
    <div class="stc-grid">${['S','M','T','W','T','F','S'].map(x=>`<div class="stc-h">${x}</div>`).join('')}${cells}</div>
    <div class="stc-sub small stc-pzs"><span>Next prizes, days in a row:</span>${prizes}</div>
   </div></div>`);
  $('#back').onclick=()=>home();
  $('#stcp').onclick=()=>streakCal(off+1);
  $('#stcn').onclick=()=>streakCal(off-1);
}

/* ---------- Fact Sprint (P5-01): 60 seconds or 20 facts, beat your best ---------- */
/* Saved in S.flu = {key: {best, hist: [[day, sec, right]] (last 30)}}.
   key is the set id ('add10') for the 60-second mode and set id + '-20' ('add10-20') for the 20-facts mode.
   best is the most right answers (60 s) or the fastest seconds (20 facts). Missing fields are read with defaults.
   S.flu[set].paid holds the day game time was last earned for that set. */
// Highest level (1-4) of a math skill the child has passed, 0 when none.
const fluLv = sk => [4, 3, 2, 1].find(l => passedAny('math', sk, l)) || 0;
const FLU = {
  GOAL: 20, SECS: 60, KEEP: 30, MIN_RIGHT: 5,
  // Sets. `ok` says whether the child has reached the matching skill; mul/div sets are added here later (P2-05).
  SETS: [
    {id: 'add10', e: '➕', t: 'Adding to 10', ok: () => true,
      gen: () => {const a = R(1, 9), b = R(1, 10 - a); return {a, op: '+', b, c: a + b}}},
    {id: 'sub10', e: '➖', t: 'Take away from 10', ok: () => passedAny('math', 'sub', 1),
      gen: () => {const a = R(2, 10), b = R(1, a); return {a, op: '−', b, c: a - b}}},
    {id: 'add20', e: '➕', t: 'Adding to 20', ok: () => passedAny('math', 'add', 2),
      gen: () => {const a = R(1, 10), b = R(Math.max(1, 11 - a), 10); return {a, op: '+', b, c: a + b}}},
    {id: 'sub20', e: '➖', t: 'Take away from 20', ok: () => passedAny('math', 'sub', 2),
      gen: () => {const a = R(11, 20), b = R(1, Math.min(10, a - 1)); return {a, op: '−', b, c: a - b}}},
    // Times and divide facts (P2-05). The facts grow with the highest level of the matching skill the child has passed.
    {id: 'mfact', e: '✖️', t: 'Times facts', ok: () => passedAny('math', 'mfact', 1),
      gen: () => {
        const l = fluLv('mfact'), keys = MF_KEYS.slice(0, Math.max(1, l)).flat();
        let a = l >= 4 ? R(0, 10) : pick(keys), b = R(0, 10);
        if (coin()) [a, b] = [b, a];
        return {a, op: '×', b, c: a * b};
      }},
    {id: 'dfact', e: '÷', t: 'Divide facts', ok: () => passedAny('math', 'dfact', 1),
      gen: () => {
        const l = fluLv('dfact'), d = l >= 4 ? R(1, 10) : pick(DF_KEYS.slice(0, Math.max(1, l)).flat()), q = R(1, 10);
        return {a: d * q, op: '÷', b: d, c: q};
      }},
  ],
  set: id => FLU.SETS.find(s => s.id == id),
  sets: () => FLU.SETS.filter(s => s.ok()),
  key: (set, mode) => mode == 'n20' ? set + '-20' : set,
  fkey: f => f.a + f.op + f.b,
  // Next fact for a sprint. st = {set, last, redo: [{f, wait}]}. A missed fact comes back after 3 other facts.
  // Never the same fact twice in a row.
  next: st => {
    st.redo.forEach(r => r.wait--);
    const i = st.redo.findIndex(r => r.wait <= 0 && FLU.fkey(r.f) != st.last);
    let f;
    if (i >= 0) f = st.redo.splice(i, 1)[0].f;
    else {
      const s = FLU.set(st.set);
      for (let t = 0; t < 40; t++) {f = s.gen(); if (FLU.fkey(f) != st.last) break}
    }
    st.last = FLU.fkey(f);
    return f;
  },
  miss: (st, f) => st.redo.push({f, wait: 4}),
  // Is v a new record? The first run always is; a tie is not.
  isRecord: (best, v, lower) => best == null || (lower ? v < best : v > best),
  // Store one finished sprint. Returns {rec, prev}.
  record: (flu, key, d, sec, right, lower) => {
    const e = flu[key] || (flu[key] = {best: null, hist: []});
    const v = lower ? sec : right, prev = e.best;
    const rec = FLU.isRecord(prev, v, lower);
    if (rec) e.best = v;
    e.hist = (e.hist || []).concat([[d, sec, right]]).slice(-FLU.KEEP);
    return {rec, prev};
  },
  // Game time in seconds: 1 min once per set per day, +1 min for any new record. A 60 s sprint needs MIN_RIGHT right answers.
  earn: (flu, set, d, rec, right, mode) => {
    if (mode != 'n20' && right < FLU.MIN_RIGHT) return 0;
    const base = flu[set] || (flu[set] = {best: null, hist: []});
    let t = 0;
    if (base.paid !== d) {t += 60; base.paid = d}
    if (rec) t += 60;
    return t;
  },
  // Pausing clock. Call with document.hidden; time spent hidden is not counted.
  tick: (c, now, hidden) => {
    if (!hidden) c.ms += now - c.last;
    c.last = now;
    return c.ms;
  },
  // Best value for each of the last 7 days (oldest first); null where the child did not play.
  week: (e, lower, now) => {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(now || Date.now());
      dt.setDate(dt.getDate() - i);
      const k = dt.getFullYear() + '-' + (dt.getMonth() + 1) + '-' + dt.getDate();
      const v = ((e && e.hist) || []).filter(h => h[0] == k).map(h => lower ? h[1] : h[2]);
      out.push(v.length ? (lower ? Math.min(...v) : Math.max(...v)) : null);
    }
    return out;
  },
};

function fluPlay(set, mode) {
  stopFlu();

  view(`${GFX.speedTop('math', 'fbar', timed ? 1 : 0, UI.chip('bolt', timed ? 0 : '0 / ' + FLU.GOAL, { id: 'fsc', aria: 'Right answers' }) +
    UI.chip('timer', timed ? '60 s' : '0.0 s', { id: 'ftm', aria: 'Time' }))}
   <div class="play qs s-math" id="fplay"></div>`);
  FL = {set, mode, key, timed, right: 0, typed: '', lock: true, clock: {ms: 0, last: Date.now()}, st: {set, last: '', redo: []}, f: null};
  $('#quit').onclick = () => {stopFlu(); fluModes(set)};
  FL.vis = () => {if (FL) FLU.tick(FL.clock, Date.now(), document.hidden)};
  document.addEventListener('visibilitychange', FL.vis);

  const show = () => {
    if (!FL) return;
    const f = FL.f = FLU.next(FL.st);
    FL.typed = '';
    FL.lock = false;
    $('#fplay').innerHTML = `<div class="qarea"><div class="prompt" id="prompt"><div class="eq">${f.a} ${f.op} ${f.b} = ${SLOT}</div></div></div>
     <div class="inp">${GFX.pad()}</div>`;
    fit();
    $$('.k').forEach(b => b.onclick = () => {
      if (!FL || FL.lock) return;
      const k = b.dataset.k, want = String(FL.f.c);
      if (k == 'del') FL.typed = FL.typed.slice(0, -1);
      else if (FL.typed.length < want.length) {FL.typed += k; SFX.key(+k)}
      $('#slot').textContent = FL.typed;
      if (FL.typed.length == want.length) answer(FL.typed == want); // auto-submit when the digit count matches
    });
  };

  const answer = ok => {
    FL.lock = true;
    const slot = $('#slot');
    if (ok) {
      FL.right++;
      SFX.right(FL.right % 10);
      slot.classList.add('ok');
      if (timed) UI.setChip($('#fsc'), FL.right);
      else {
        UI.setChip($('#fsc'), FL.right + ' / ' + FLU.GOAL);
        GFX.bar($('#fbar'), FL.right / FLU.GOAL);
      }
      if (!timed && FL.right >= FLU.GOAL) return finish();
      FL.to = setTimeout(show, 250);
    } else {
      SFX.wrong();
      FLU.miss(FL.st, FL.f);
      slot.textContent = FL.f.c;
      slot.className = 'slot rev'; // show the fact for 1 second, then it comes back a few facts later
      FL.to = setTimeout(show, 1000);
    }
  };

  const finish = () => {
    FLU.tick(FL.clock, Date.now(), document.hidden);
    const sec = timed ? FLU.SECS : Math.round(FL.clock.ms / 100) / 10, right = FL.right;
    stopFlu();
    S.flu = S.flu || {};
    const r = FLU.record(S.flu, key, today(), sec, right, !timed);
    actFlu(sec); // P5-05
    const rec = r.rec && (!timed || right > 0); // no fireworks for a first 60 s run of zero
    const earned = FLU.earn(S.flu, set, today(), rec, right, mode);
    if (earned) ptEarn(earned);
    const mis = MIS.pay(MIS.done({k: 'sprint'})); // P5-08
    save();
    rec ? (SFX.fanfare(), confetti(40)) : SFX.magic();
    fluEnd({set, mode, key, timed, sec, right, rec, earned, mis});
  };

  // Clock counts only while the page is visible. It starts after a short "ready" beat.
  FL.to = setTimeout(() => {
    if (!FL) return;
    fb('Ready… GO!', 'zap');
    SFX.fanfare();
    FL.clock.last = Date.now();
    show();
    FL.iv = setInterval(() => {
      if (!FL) return;
      const ms = FLU.tick(FL.clock, Date.now(), document.hidden), left = FLU.SECS - ms / 1000;
      if (timed) {
        GFX.bar($('#fbar'), left / FLU.SECS);
        $('#ftm b').textContent = Math.max(0, Math.ceil(left)) + ' s';
        if (left <= 5 && left > 0 && Math.ceil(left) != FL.beep) {FL.beep = Math.ceil(left); tone(880, .08, 0, 'square', .05)}
        if (left <= 0) finish();
      } else $('#ftm b').textContent = fluSecs(ms) + ' s';
    }, 200);
  }, 300);
}

// Sparkline of the last 7 days: higher is always better (faster times are flipped).
function fluSpark(vals, lower) {
  const W = 168, H = 48, pad = 6, got = vals.filter(v => v != null);
  if (!got.length) return '';
  const lo = Math.min(...got), hi = Math.max(...got), span = hi - lo || 1;
  const pts = vals.map((v, i) => {
    if (v == null) return null;
    const t = (v - lo) / span, up = lower ? 1 - t : t;
    return [pad + i * (W - 2 * pad) / 6, H - pad - (got.length > 1 ? up : .5) * (H - 2 * pad)];
  });
  const line = pts.filter(Boolean).map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const dots = pts.map((p, i) => p ? `<circle class="${i == 6 ? 'gx-sn' : 'gx-sd'}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i == 6 ? 6 : 4}"/>` : '').join('');
  return `<svg class="gx-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your last 7 days"><polyline class="gx-sl" points="${line}"/>${dots}</svg>`;
}

function ptCfg(){return S.ptCfg=Object.assign({per:3,max:30,pause:false},S.ptCfg||{})}
function pt(){const p=S.pt||(S.pt={bank:180,day:'',used:0});if(p.day!==today()){p.day=today();p.used=0}return p}

function ptCalc(g,sc,n,stars,prev,newPass,testOk,nd){const per=ptCfg().per*60,L=[];let t=0;const add=(v,l)=>{if(v>0){t+=v;L.push([v,l])}};
  if(g.test){add(testOk?per+60:60,testOk?'Tested out!':'Good try')}
  else if(g.mix){add(Math.round(per*.6),'Practice round');add((g.fixed||0)*30,`Fixed ${g.fixed} tricky one${g.fixed>1?'s':''}`)}
  else{const acc=sc/n,mast=prev>=3&&!g.boss;
    if(mast)add(60,'Already mastered this one');
    else{add(Math.round(per*(acc<.5?.34:acc<.7?.67:1)),acc<.5?'Keep trying':'Round done');
      if(newPass)add(60,'New stop unlocked');else if(stars>prev&&prev>0)add(30,'Beat your old score');
      const hw=nd?worldStep(nd.p,nd.wi):0;if(hw>0)add(Math.min(90,30*hw),'Harder world')} // P1-05: by grade, not raw index
    if(sc==n)add(60,'Perfect score');if(g.boss&&g.won)add(120,'Beat the boss');add((g.fixed||0)*20,`Fixed ${g.fixed} old mistake${g.fixed>1?'s':''}`)}
  const rp=S.ptRep&&S.ptRep.day==today()?S.ptRep:(S.ptRep={day:today(),n:{}}),key=g.test?'t_'+worldId(g.path,g.test.wi):g.mix?'mix':nd?nid(nd):'x',r=rp.n[key]||0;rp.n[key]=r+1;
  if(r>0){const k=r==1?.6:.35,cut=Math.round(t*(1-k));t-=cut;L.push([-cut,`Played ${r+1} times today`])}
