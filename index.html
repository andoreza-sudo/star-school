.gx-week{display:flex;justify-content:center;margin:var(--s-2) 0}
.gx-spark{display:block;max-width:100%}
.gx-sl{fill:none;stroke:var(--math);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.5}
.gx-sd{fill:var(--surface);stroke:var(--math);stroke-width:2}
.gx-sn{fill:var(--star);stroke:var(--star-shade);stroke-width:2}
.rw-card p.gx-earn{display:flex;align-items:center;justify-content:center;gap:var(--s-2);margin:var(--s-2) 0 0;font-weight:700;color:var(--ink)}
.gx-earn .ic{flex:none;color:var(--play)}
.gx-earn .ic.ic-coin{color:var(--star-shade)}
.gx-acts{display:flex;flex-direction:column;gap:var(--s-3)}
#hpn{display:inline-flex;gap:1px;font-size:inherit;color:var(--read)}
#hpn .ic{flex:none}
.gx-rule{display:flex;align-items:center;justify-content:center;gap:var(--s-2);cursor:pointer}
.gx-rule .ic{flex:none;color:var(--brand)}

/* ---- Game Room: the game-time card ---- */
.ptcard.gx-pt{background:var(--play-tint);box-shadow:inset 0 0 0 2px var(--play),0 4px 0 var(--play-shade);border-radius:var(--r-card)}
.ptcard.gx-pt.empty{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.gx-ptd{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--surface);color:var(--play);--ic2:var(--surface);
  box-shadow:0 3px 0 var(--play-shade)}
.gx-pt .hname{font-family:var(--font-display);font-size:var(--fs-4);font-weight:700}
.gx-center{display:flex;justify-content:center;margin:var(--s-5) 0}

/* ---- Pet Care: icon meters, snack cards with object art and price chips, icon action buttons ---- */
.gx-cbar{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:var(--s-2);margin:var(--s-2) 0}
.gx-cbar .gx-ci{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--c,var(--brand))}
.gx-cbar .gx-cl{width:auto;min-width:56px}
.gx-cbar b{width:auto;min-width:44px;text-align:right}
.gx-cbar.k-food{--c:var(--play);--c-shade:var(--play-shade)}
.gx-cbar.k-clean{--c:var(--math);--c-shade:var(--math-shade)}
.gx-cbar.k-fun{--c:var(--good);--c-shade:var(--good-ink)}
.gx-cbar .gauge{background:var(--surface-2)}
.gx-h{display:flex;align-items:center;gap:var(--s-2)}
.gx-h .ic{color:var(--play)}
.btn.gx-snack{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft);border-radius:var(--r-card);padding:var(--s-3) var(--s-2)}
.gx-snack .gx-sp{display:grid;place-items:center;width:64px;height:64px;font-size:48px;line-height:1}
.gx-snack .gx-sp .art{width:60px;height:60px}
.gx-price{display:inline-flex;align-items:center;gap:2px;padding:2px var(--s-2) 2px 2px;border-radius:var(--r-pill);background:var(--star-tint);font-weight:700}
.gx-acts2{grid-template-columns:1fr 1fr}
.btn.gx-act{min-height:96px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft);border-radius:var(--r-card)}
.gx-act .gx-ai{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--brand-tint);color:var(--brand);font-size:inherit}
#play.gx-act .gx-ai{background:var(--good-tint);color:var(--good-ink)}

/* ---- setup: logo, pet cards (the pets themselves are P4-06; the card is the current look) ---- */
.setup h1.gx-logo{display:flex;align-items:center;justify-content:center;gap:var(--s-3);font-family:var(--font-display)}
.btn.gx-pet{gap:var(--s-1);padding:var(--s-3) var(--s-2) var(--s-2);border-radius:var(--r-card);background:var(--surface);
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft);position:relative}
.gx-pet .gx-pp{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--es-tint);font-size:52px;line-height:1;
  box-shadow:inset 0 -5px 0 var(--drop)}
.gx-pet[data-p="dino"] .gx-pp{background:var(--math-tint)}
.gx-pet[data-p="bird"] .gx-pp{background:var(--star-tint)}
.gx-pet[data-p="ocean"] .gx-pp{background:var(--disc-tint)}
.gx-pet b{font-size:var(--fs-3)}
.btn.gx-pet.sel{outline:0;background:var(--brand-tint);box-shadow:inset 0 0 0 4px var(--brand),0 4px 0 var(--brand-shade)}
.setup .btn.primary{margin-top:var(--s-3)}
@media (max-height:520px){.gx-pet .gx-pp{width:60px;height:60px;font-size:36px}}
@media (max-width:480px){.gx-learn .gx-tb{display:none}.gx-learn .btn.subject{padding-left:var(--s-3);padding-right:var(--s-3)}}
/* P4-09 map and world scenes (SCN in src/js/43-scenes.js): the world band holds one scene SVG, clipped to its rounded corners and
   sitting on a ledge in its ground colour; the trail is a worn path of stepping stones (gold where the child has walked) with a
   small bridge between two worlds. Decoration only: no pointer events, no animation. Tokens only. */
.wband{overflow:hidden;pointer-events:none;contain:layout paint}
.wband>.scn-art{position:absolute;left:0;top:0;display:block}
.mp-trail path,.mp-trail rect{pointer-events:none}
.mp-trail .tr{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tr-rim{stroke:var(--ill-ink);stroke-width:30px;opacity:.1}
.tr-bed{stroke:var(--ill-cream-1);stroke-width:24px;opacity:.92}
.tr-sh,.tr-st,.tr-gs,.tr-go{stroke-width:14px;stroke-dasharray:0 25}
.tr-sh{stroke:var(--ill-grey)}
.tr-st{stroke:var(--ill-white-2)}
.tr-gs{stroke:var(--star-shade)}
.tr-go{stroke:var(--star)}
.tr-hi{stroke:var(--ill-white);stroke-width:5px;stroke-dasharray:0 25;opacity:.9}
.tr-plank{fill:var(--ill-tan)}
.tr-plank-sh{fill:var(--ill-brown-2)}
.tr-seam{fill:none;stroke:var(--ill-tan-2);stroke-width:1.6px}
.tr-rail{fill:none;stroke:var(--ill-brown-2);stroke-width:4px;stroke-linecap:round}
/* Tracing board (P2-16; src/js/47-trace.js). Tokens only; animate transform and opacity only; no filter.
   The board is an svg in glyph box units (100 x 100): handwriting lines, the guide (outlined strokes at level 1, dots at level 2),
   the strokes already traced (subject colour on a shade ledge), the finger's ink (graphite), arrows and numbered green start
   dots. A miss never turns anything red: the start dot pulses and the arrows run along the stroke. */

/* the question screen gives the board the room: the prompt card shrinks to its content, the input area takes the rest */
.play.tr-play .qarea{flex:0 0 auto}
.play.tr-play .inp{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
@media (orientation:landscape){.play.tr-play .qarea{flex:1 1 0}.qs.tr-play .inp{width:54%;max-width:640px}}

.trw{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:var(--s-2)}
.trb{flex:1 1 0;min-height:240px;width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;background:var(--surface);border-radius:var(--r-hero);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft);
  cursor:crosshair}
.trb text{pointer-events:none}

/* handwriting lines: top and base solid, middle dashed */
.tr-l{stroke:var(--ledge-soft);stroke-width:.6}
.tr-lm{stroke-dasharray:2.4 2.4}
.tr-lb{stroke:var(--ill-grey);stroke-width:.7}

/* guide: level 1 hollow outlined strokes, level 2 (and a tier-2 hint) a dotted centre line */
.tr-band,.tr-bandi,.tr-dot,.tr-f,.tr-fl,.tr-demo,.tr-ink{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tr-band{stroke:var(--ill-grey);stroke-width:13}
.tr-bandi{stroke:var(--surface-2);stroke-width:10.4}
.tr-dot{stroke:var(--ink-3);stroke-width:2.6;stroke-dasharray:0 5.2}

/* strokes traced: subject colour on a shade ledge; they fade in when a stroke snaps on */
.tr-f{stroke:var(--c,var(--brand));stroke-width:8.4}
.tr-fl{stroke:var(--c-shade,var(--brand-shade));stroke-width:8.4}
.tr-f.in,.tr-fl.in{animation:k-trin var(--t) var(--ease) both}
@keyframes k-trin{from{opacity:0}}
.tr-dn{transform-box:fill-box;transform-origin:center}
.tr-dn.pop{animation:k-trpop 520ms var(--spring)}
@keyframes k-trpop{45%{transform:scale(1.06)}}

/* the finger's ink, the pen's demo stroke and the yellow ball (demo pen, tier-2 lead) */
.tr-ink{stroke:var(--ink-2);stroke-width:6;opacity:.8;transition:opacity var(--t-slow) var(--ease)}
.tr-ink.fade{opacity:0}
.tr-demo{stroke:var(--c,var(--brand));stroke-width:8.4;opacity:.5}
#trx{transition:opacity var(--t-slow) var(--ease)}
#trx.fade{opacity:0}
.tr-pen{fill:var(--star);stroke:var(--star-shade);stroke-width:1.4;pointer-events:none}

/* arrows along the stroke to trace; after a miss they run along it, one after another */
.tr-arr{fill:none;stroke:var(--c,var(--brand));stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.tr-arr.go{animation:k-trgo 560ms var(--ease) 2 both;animation-delay:calc(var(--i) * 90ms)}
@keyframes k-trgo{40%{transform:translateX(2.5px) scale(1.6)}}

/* start dots: green, numbered when a glyph has more than one stroke; the one to start at is big, ringed and on top */
.tr-sdi{transform-box:fill-box;transform-origin:center}
.tr-sdr{fill:var(--good-tint)}
.tr-sdc{fill:var(--good);stroke:var(--surface);stroke-width:1.2}
.tr-sd:not(.on) .tr-sdc{fill:var(--good-ink);opacity:.55}
.tr-sdt{fill:var(--surface);font-family:var(--font-display);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.tr-sdt.sm{font-size:6.4px}
.tr-sdi.pulse{animation:k-trpulse 420ms var(--spring) 2}
.tr-sdi.hop{animation:k-trhop 560ms var(--spring)}
@keyframes k-trpulse{50%{transform:scale(1.45)}}
@keyframes k-trhop{40%{transform:translateY(-3px) scale(1.18)}}

/* passes of this glyph (solid, dotted, on your own) and the glyph's stars when it is done */
.tr-pips{display:flex;gap:var(--s-2);justify-content:center;flex:none}
.tr-pips i{width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--ledge-soft)}
.tr-pips i.on{background:var(--c-tint,var(--brand-tint));box-shadow:inset 0 0 0 4px var(--c,var(--brand))}
.tr-pips i.dn{background:var(--good);box-shadow:inset 0 -2px 0 var(--good-ink)}
.tr-stars{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:var(--s-2);pointer-events:none}
.tr-stars:not(:empty){padding:var(--s-3) var(--s-5);border-radius:var(--r-pill);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft),var(--shadow)}
.tr-star{color:var(--ledge-soft);--ic2:var(--surface-2);animation:k-trstar var(--t-slow) var(--spring) both;animation-delay:calc(var(--i) * 140ms)}
.tr-star.lit{color:var(--star);--ic2:var(--star-tint)}
.tr-star .ic{display:block;width:52px;height:52px}
@keyframes k-trstar{from{opacity:0;transform:scale(.4)}}

/* the prompt card: the glyph to copy and, for a number, its dots */
.trq{display:flex;align-items:center;justify-content:center;gap:var(--s-4)}
.trq-g{display:block;height:72px;width:auto;flex:none}
.trq-g path{fill:none;stroke:var(--c,var(--brand));stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.trq-d svg{display:block;height:60px;width:auto}
@media (max-height:520px){.trq-g{height:56px}.trq-d svg{height:48px}.trb{min-height:200px}}

html.calm .tr-arr.go,html.calm .tr-sdi.pulse,html.calm .tr-sdi.hop,html.calm .tr-dn.pop,html.calm .tr-star{animation:none}
@media (prefers-reduced-motion:reduce){.tr-arr.go,.tr-sdi.pulse,.tr-sdi.hop,.tr-dn.pop,.tr-star{animation:none}}
/* P4-12 setup (first run), Grown-ups (+ the report card's frame) and Pet Care (DESIGN_SYSTEM 9 rows 1 and 6). Tokens only; motion
   is transform/opacity (calm mode and reduced motion stop it in 20-base.css, and hide the care sparkles). Markup: 46-home.js setup(),
   80-grown.js grown() and GW, 82-report.js report(), 48-shop.js stageHTML(), 56-petcare.js care() and careFx(). */

/* ---- text field: a white well with an icon (setup and Grown-ups) ---- */
.fld{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap-primary);padding:0 var(--s-4) 0 var(--s-3);border-radius:var(--r-btn);
  background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line),inset 0 4px 0 var(--line);cursor:text;text-align:left}
.fld>.ic{color:var(--ink-3)}
.fld:focus-within{background:var(--surface);box-shadow:inset 0 0 0 3px var(--brand),0 0 0 3px var(--brand-tint)}
.fld:focus-within>.ic{color:var(--brand)}
.fld input{flex:1;min-width:0;min-height:var(--tap);border:0;padding:0;background:transparent;font:inherit;font-size:var(--fs-4);color:var(--ink);outline:0}
.fld input::placeholder{color:var(--ink-3);opacity:1}

/* ---- grade picker (setup and Grown-ups): pressable tiles, the chosen one in brand blue ---- */
.grades .btn.gr{min-height:var(--tap-primary);border-radius:var(--r-btn);font-family:var(--font-display);font-size:var(--fs-3);background:var(--surface);
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.grades .btn.gr:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--ledge-soft)}
.grades .btn.gr.sel{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--brand);color:var(--surface);box-shadow:0 4px 0 var(--brand-shade)}

/* ---- setup: logo and a speaker, three numbered step cards, the big go button ---- */
.center.su{gap:var(--s-4);padding:var(--s-4) var(--s-4) var(--s-6)}
.su-top{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap);grid-template-areas:". logo spk" ". hi .";align-items:center;
  gap:var(--s-1) var(--s-2);width:min(640px,100%)}
.su .su-logo{grid-area:logo;margin:0;font-size:var(--fs-6);line-height:1.1}
.su-mark{width:56px;height:56px;border-radius:18px;box-shadow:inset 0 -4px 0 var(--brand-shade),0 4px 0 var(--ledge-soft)}
.su-top>.btn{grid-area:spk}
.su-hello{grid-area:hi;margin:0;font-size:var(--fs-3);color:var(--ink-2);line-height:1.35}
.su-grid{display:grid;gap:var(--s-4);width:min(640px,100%)}
.su-step{min-width:0;padding:var(--s-4) var(--s-4) var(--s-5);border-radius:var(--r-card);background:var(--surface);text-align:left;
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.su-h{display:flex;align-items:center;gap:var(--s-2);margin:0 0 var(--s-3);font-family:var(--font-display);font-size:var(--fs-4);line-height:1.25;color:var(--ink)}
.su-n{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--surface);font-size:var(--fs-3);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--brand);box-shadow:inset 0 -3px 0 var(--brand-shade)}
.su-n .ic{display:none;color:var(--surface)}
.su-hi{display:grid;color:var(--brand)}
.su-step.ok .su-n{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--good);box-shadow:inset 0 -3px 0 var(--good-ink);animation:k-pop var(--t-slow) var(--spring)}
.su-step.ok .su-n b{display:none}
.su-step.ok .su-n .ic{display:block}
.su-sub{margin:calc(-1 * var(--s-2)) 0 var(--s-2);color:var(--ink-3);font-size:var(--fs-2)}
.su-pets{margin-bottom:var(--s-4)}
.su .grades{margin-top:0}
.su-grid>#go{justify-self:center;min-width:min(320px,100%);margin-top:var(--s-1)}
@media (max-width:480px){.su .su-logo{font-size:var(--fs-5)}.su-mark{width:48px;height:48px;border-radius:16px}.su-hello span{display:block}}
@media (min-width:900px) and (orientation:landscape){
  .su-top,.su-grid{width:min(1080px,100%)}
  .su-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"n p" "g p" "g go";align-items:start}
  .su-step[data-step="1"]{grid-area:n}.su-step[data-step="2"]{grid-area:p}.su-step[data-step="3"]{grid-area:g}
  .su-grid>#go{grid-area:go;justify-self:stretch;align-self:end;margin:0}
}
@media (max-height:620px){.center.su{gap:var(--s-3);padding-top:var(--s-3)}.su .su-logo{font-size:var(--fs-5)}.su-mark{width:48px;height:48px}
  .su-step{padding:var(--s-3) var(--s-4) var(--s-4)}.su .gx-pet .gx-pp{width:70px;height:70px;font-size:44px}}

/* ---- Grown-ups: a calm page of cards; two columns on a wide screen ---- */
.scroll.gw{padding:var(--s-2) var(--s-4) var(--s-7)}
.gw-cols{max-width:760px;margin:0 auto}
@media (min-width:900px){.gw-cols{max-width:1180px;columns:2;column-gap:var(--s-5)}}
.gw-top .gw-tb{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--ink-2);box-shadow:inset 0 -3px 0 var(--ink)}
.gw-top .btn.sm:not(.icon){margin-left:auto}
.gw-card{display:block;break-inside:avoid;margin:0 0 var(--s-4);padding:var(--s-4) var(--s-5) var(--s-5);border-radius:var(--r-card);background:var(--surface);
  color:var(--ink);font-size:var(--fs-2);line-height:var(--lh-2);text-align:left;overflow-wrap:normal;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ledge-soft)}
.gw-h{display:flex;align-items:center;gap:var(--s-3);margin:0 0 var(--s-2);font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;line-height:1.25;color:var(--ink)}
.gw-h>span:last-of-type{min-width:0}
.gw-hi{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--brand-tint);color:var(--brand)}
.gw-hi:is(.s-math,.s-read,.s-es,.s-disc,.s-bt,.s-play){background:var(--c-tint);color:var(--c-shade)}
.gw-hi.gw-dz{background:var(--surface-2);color:var(--danger)}
.gw-sub{margin:0 0 var(--s-3);color:var(--ink-2)}
.gw-p{margin:0;color:var(--ink-2)}
.gw-h3{display:flex;align-items:center;gap:var(--s-2);margin:var(--s-4) 0 var(--s-2);font-size:var(--fs-3);line-height:1.3}
.gw-h3 .gw-n{margin-left:auto;font-size:var(--fs-1);font-weight:400;color:var(--ink-3);white-space:nowrap}
.gw-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-2)}
.gw-stats.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:var(--s-2)}
.gw-st{display:grid;justify-items:center;gap:2px;min-width:0;padding:var(--s-2) var(--s-1);border-radius:var(--r-btn);background:var(--surface-2);text-align:center}
.gw-st b{font-size:var(--fs-4);line-height:1.15;font-variant-numeric:tabular-nums}
.gw-st span{font-size:var(--fs-1);line-height:1.2;color:var(--ink-3)}
.gw-path{display:grid;grid-template-columns:auto minmax(64px,108px) minmax(0,1fr) auto;align-items:center;gap:var(--s-2) var(--s-3);margin:var(--s-2) 0}
.gw-pi{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--c-tint);color:var(--c)}
.gw-pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-path b{min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.gw-warn{display:flex;align-items:flex-start;gap:var(--s-2);margin:var(--s-3) 0;padding:var(--s-2) var(--s-3);border-radius:var(--r-btn);
  background:var(--try-tint);color:var(--try-ink);font-weight:700}
.gw-f{display:grid;gap:var(--s-1);margin:0 0 var(--s-3)}
.gw-fl{font-weight:700;color:var(--ink-2)}
.gw-help{font-size:var(--fs-1);color:var(--ink-3)}
.gw .fld input{font-size:var(--fs-3)}
.gw .grades{margin:0 0 var(--s-3)}
.gw .pl-grown{margin:var(--s-3) 0;padding:var(--s-3) var(--s-4);border-radius:var(--r-btn);background:var(--surface-2)}
.gw .pl-sub{box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.gw-sw{display:grid;gap:var(--s-1);margin:var(--s-2) 0 var(--s-3)}
.gw-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-3);margin:var(--s-3) 0}
.gw-rl{flex:1 1 130px;font-weight:700;color:var(--ink-2)}
.gw-seg>button{padding:0 var(--s-3);font-size:var(--fs-3);font-variant-numeric:tabular-nums}
.gw-btns{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.gw .btn.ghost.gw-risk,.gw .btn.ghost.gw-risk .ic,.gw .btn.icon.gw-del .ic{color:var(--danger)}
.gw-vr{margin-top:var(--s-3);padding-top:var(--s-1);border-top:2px solid var(--line)}
.gw-vr .gw-h3{margin-top:var(--s-2)}
.gw-vr .gw-sub{margin:calc(-1 * var(--s-1)) 0 var(--s-1);font-size:var(--fs-1)}
.gw-vl{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-1) 0;border-bottom:2px solid var(--surface-2)}

<body>
<div id="app"></div>
<div id="fb" class="fb"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* Seedable randomness (P1-01). Generators use only rnd(), R, pick, shuffle, coin. genQ() swaps RNG for a seeded stream so a question can be rebuilt from (sk, lv, seed). Games and art keep Math.random. */
const mulberry32=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let RNG=Math.random;
const rnd=()=>RNG();
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='starschool-v2';
const LATEST=6; // newest save schema version = MIGRATIONS.length (ROADMAP section 9)
let S,SAVE_RAW=null,SAVE_CORRUPT=false,SAVE_FAILED=false;
/* Read the save string into S. Corrupt or non-object JSON is kept in KEY-corrupt; KEY itself is untouched until the first save(). */
function loadSave(raw){
  SAVE_RAW=null;SAVE_CORRUPT=false;S=null;
  if(raw){
    try{S=JSON.parse(raw)}catch(e){}
    if(S&&typeof S=='object'&&!Array.isArray(S))SAVE_RAW=raw;
    else{
      S=null;SAVE_CORRUPT=true;
      try{localStorage.setItem(KEY+'-corrupt',raw)}catch(e){}
    }
  }
  if(!S){
    S={name:'',pet:'dragon',petName:'',buddy:'',stars:0,prog:{},stickers:{},day:{},voice:true,sound:true,music:true,best:0};
    S.v=LATEST;S.maps={math:{},read:{},es:{}};S.mapv=2; // a new save starts at the latest version, with the map state the migrations would make
  }
  S=Object.assign({wdone:{},owned:{meadow:1},wear:{hat:'',toy:'',scene:'meadow'},unlockAll:false,coins:S.stars||0},S);
}
let RAW0=null;try{RAW0=localStorage.getItem(KEY)}catch(e){}
loadSave(RAW0);
/* MIGRATIONS[n] upgrades S from version n to n+1. Idempotent, never edited after release (fix with a new one). A save with no S.v
   is a v30-or-older save; it runs 1 and 2, which each check their own marker, so old saves behave exactly as before. */
/* The maps exactly as they were from v31 to v42: [world id, its stop ids in order] per path (bosses not listed). Migrations read
   old index keys through this frozen table, never through PATHS/NODES, so worlds and stops added later cannot change what an old
   save means. Never edit it; tools/test.js checks it against today's maps. */
const MAP_V42={
  math:[['m_meadow','add1 cnt1 eo1 miss1 sub1 story1'],['m_candy','add2 big1 cnt2 cmp1 miss2 sub2 story2'],
    ['m_reef','add3 time1 big2 coins1 eo2 cmp2 time2 sub3 story3'],['m_space','big3 mult1 coins2 cnt3 sub4 time3 big4 mult2 cmp3 coins3']],
  read:[['r_meadow','sound1 sight1 rhyme1 pic1 sound2 build1 sent1'],['r_candy','sight2 rhyme2 pic2 build2 sent2 comp1'],
    ['r_reef','sight3 pic3 build3 comp2'],['r_space','pic4 build4']],
  es:[['e_plaza','es_greet1 es_color1 es_num1 es_animal1 es_greet2 es_color2 es_num2 es_animal2'],
    ['e_fiesta','es_food1 es_body1 es_family1 es_teen1 es_food2 es_body2 es_family2 es_teen2'],['e_repaso','es_mix1 es_mix2']]};
const v42Stops=p=>(MAP_V42[p]||[]).flatMap(w=>w[1].split(' ')); // a path's non-boss stop ids in v42 order
const MIGRATIONS=[null,
  /* 1: single-map progress (S.map) -> per-path maps (S.maps) */
  ()=>{if(S.maps)return;S.maps={math:{},read:{},es:{}};S.mapv=2;
    const OLD='add1 sight1 cnt1 pic1 eo1 build1 miss1 sent1 sub1 story1 add2 sight2 big1 pic2 cnt2 build2 cmp1 comp1 miss2 sent2 sub2 story2 add3 time1 sight3 big2 pic3 coins1 build3 eo2 cmp2 comp2 time2 sub3 story3 big3 mult1 pic4 coins2 cnt3 build4 sub4 time3 big4 mult2 cmp3 coins3'.split(' ');
    Object.entries(S.map||{}).forEach(([i,st])=>{const o=OLD[i];if(!o||!st)return;
      for(const p in MAP_V42)if(v42Stops(p).includes(o))S.maps[p][o]=Math.max(S.maps[p][o]||0,st)});
    delete S.map;S.wdone={}},
  /* 2: map keys by stop index -> by stop id (S.mapv=2) */
  ()=>{
    for(const p in PATHS)S.maps[p]=S.maps[p]||{};
    if(!S.mapv){for(const p in PATHS){const old=v42Stops(p),m={};Object.entries(S.maps[p]).forEach(([k,v])=>{if(old[k])m[old[k]]=v});S.maps[p]=m}S.mapv=2}},
  /* 3 (P1-05): keys by world index -> by world id (ROADMAP decision A5). Index k always means world k of MAP_V42.
     - Boss stars S.maps[p]['boss<k>'] are copied to 'boss_<worldId>'.
     - S.wdone 'math0' style keys are copied to 'm_meadow' style keys, and every world whose v42 stops and boss are all passed is
       marked done (saves from v30 lost their S.wdone in migration 1), so the +20 world prize is never paid twice.
     - The old keys stay: they are tiny, and an older cached app on an offline tablet keeps reading this save (rule 9).
     - S.ptRep (today's repeat counter for game time; 't<k>' and 'boss<k>' were shared by all paths) moves to 't_<worldId>' and
       'boss_<worldId>' for world k of every path, so nothing played today earns full time twice. */
  ()=>{
    S.wdone=S.wdone&&typeof S.wdone=='object'?S.wdone:{};
    for(const p in MAP_V42){
      const m=S.maps[p]=S.maps[p]||{};
      MAP_V42[p].forEach(([id,stops],k)=>{
        const b=m['boss'+k];
        if(b>0&&!(m['boss_'+id]>=b))m['boss_'+id]=b;
        if(S.wdone[p+k])S.wdone[id]=1;
        if(m['boss_'+id]>0&&stops.split(' ').every(s=>m[s]>0))S.wdone[id]=1;
      });
    }
    const rp=S.ptRep;
    if(rp&&rp.n&&typeof rp.n=='object'){
      const n={};
      for(const[k,v]of Object.entries(rp.n)){
        const mm=/^(t|boss)(\d+)$/.exec(k);
        if(!mm){n[k]=Math.max(n[k]||0,v);continue}
        for(const p in MAP_V42){const w=MAP_V42[p][+mm[2]];if(w){const nk=(mm[1]=='t'?'t_':'boss_')+w[0];n[nk]=Math.max(n[nk]||0,v)}}
      }
      rp.n=n;
    }
  }
  ,
  /* 4: P1-06. Infer S.grade for a save that has none: the highest grade tag among the graded worlds (math, reading) where the child
     has passed a stop or beaten the boss; K (0) when there is no progress. Uses the frozen v42 world table and the grade tags
     shipped in v46, never PATHS, so worlds added later cannot change what an old save means. A grade already set is kept.
     Only adds S.grade (more worlds open, never fewer); nothing is removed or re-locked. */
  ()=>{
    if([-1,0,1,2,3,4,5,6].includes(S.grade))return;
    const G46={m_meadow:0,m_candy:1,m_reef:1,m_space:2,r_meadow:0,r_candy:1,r_reef:1,r_space:2};
    let g=0;
    for(const p of['math','read']){
      const m=(S.maps&&S.maps[p])||{};
      (MAP_V42[p]||[]).forEach(([id,stops])=>{
        if(m['boss_'+id]>0||stops.split(' ').some(k=>m[k]>0))g=Math.max(g,G46[id]||0);
      });
    }
    S.grade=g;
  }
  ,
  /* 5: P5-02. Stored misses become spaced-review items. Until v53 P(sk).miss[label] = {n, tot, q} kept the whole question
     (html, choices, passage text). Each entry whose q is a whole question (has q.kind):
     - n > 0 (still tricky): one item in S.rev {sk, lv, seed, label, box 0, due 0 (due at once), n}, plus bk for a bank question;
       seed is left out when the question had none (saves older than v38; revQ in 59-review.js looks for one later).
       At most 150 items (the most missed are kept).
     - the entry itself shrinks to {tot, q: {label}}: the tally the Grown-ups "Tricky ones" table reads. n is dropped, so an
       older cached app (rule 9) finds nothing to replay and cannot try to show a question without its html.
     Self-contained (no generator or later code), idempotent (compact entries have no q.kind; items are not added twice).
     Removes no stars, coins, map progress or anything else. */
  ()=>{
    const rev=Array.isArray(S.rev)?S.rev:[],add=[];
    const key=o=>o.sk+'|'+o.lv+'|'+o.label;
    const have=new Set(rev.map(o=>o&&key(o)));
    const prog=S.prog&&typeof S.prog=='object'?S.prog:{};
    for(const sk in prog){

/* ---------- UI components (P4-04; DESIGN_SYSTEM.md section 4) ----------
   Small helpers that return the markup of the components in src/css/10-components.css, so every screen draws them the same way.
   Text arguments are escaped here; arguments named `html` are inserted as they are (the caller escapes what goes in them).
   Subjects: p is one of math, read, es, disc, bt, play and becomes the class s-<p> (sets --c, --c-tint, --c-shade). */
const UI = {
  SUBJ_ICON: { math: 'path-math', read: 'path-read', es: 'path-es', disc: 'path-disc', bt: 'puzzle', play: 'gamepad' },
  CHIP_ICON: { star: 'star', coin: 'coin', ticket: 'ticket', flame: 'flame', timer: 'timer' },

  // Escaped label text; a word with a hyphen ("Grown-ups") is kept on one line (.nw), so a label never breaks inside a word.
  t(text) {
    return esc(text).replace(/[^\s-]+(-[^\s-]+)+/g, w => `<span class="nw">${w}</span>`);
  },

  // ' id="x"' or '' (ids are code literals, but escape them anyway)
  _id(id) {
    return id ? ` id="${esc(id)}"` : '';
  },

  // Button. o: kind (primary | soft | subject | ghost | risk; default soft), size (sm | md | lg), icon, p (subject),
  // id, wide (full width), off (disabled), cls (extra classes), attrs (raw attribute string, e.g. data-x="1").
  btn(label, o = {}) {
    const cls = ['btn', o.kind || 'soft', o.size && o.size != 'md' ? o.size : '', o.wide ? 'wide' : '', o.p ? 's-' + o.p : '', o.cls || '']
      .filter(Boolean).join(' ');
    const icon = o.icon ? ico(o.icon) : '';
    return `<button class="${cls}"${UI._id(o.id)}${o.off ? ' disabled' : ''}${o.attrs ? ' ' + o.attrs : ''}>${icon}<span>${UI.t(label)}</span></button>`;
  },

  // Round icon-only button; aria is the spoken name (required). o: kind (soft default, or primary | subject | risk), size, p, id, cls, attrs.
  ibtn(icon, aria, o = {}) {
    const kind = o.kind && o.kind != 'soft' ? ' ' + o.kind : '';
    const cls = 'btn icon' + kind + (o.size && o.size != 'md' ? ' ' + o.size : '') + (o.p ? ' s-' + o.p : '') + (o.cls ? ' ' + o.cls : '');
    return `<button class="${cls}"${UI._id(o.id)} aria-label="${esc(aria)}"${o.off ? ' disabled' : ''}${o.attrs ? ' ' + o.attrs : ''}>${ico(icon)}</button>`;
  },

  // Stat chip: kind star | coin | ticket | flame | timer. o: id, tap (render as a button), aria, off (greyed flame).
  chip(kind, n, o = {}) {
    const tag = o.tap ? 'button' : 'span';
    const aria = o.aria ? ` aria-label="${esc(o.aria)}"` : '';
    const ic = ico(UI.CHIP_ICON[kind] || kind, 32, kind == 'coin' ? 'ic-coin' : '');
    return `<${tag} class="stat ${kind}${o.off ? ' off' : ''}"${UI._id(o.id)}${aria}>${ic}<b>${esc(n)}</b></${tag}>`;
  },

  // Change a chip's number and bump it (only when the number really changed).
  setChip(el, n) {
    if (!el) return;
    const b = el.querySelector('b');
    if (!b || b.textContent === String(n)) return;
    b.textContent = n;
    el.classList.remove('bump');
    void el.offsetWidth; // restart the animation
    el.classList.add('bump');
  },

  // Gauge (progress bar). v is 0..1. o: kind (grow | good), p (subject colour), lg, label (spoken, e.g. "9 of 58 stops").
  meter(v, o = {}) {
    const f = Math.max(0, Math.min(1, +v || 0));
    const cls = ['gauge', o.kind || '', o.lg ? 'lg' : '', o.p ? 's-' + o.p : ''].filter(Boolean).join(' ');
    const lab = o.label ? ` role="img" aria-label="${esc(o.label)}"` : ' aria-hidden="true"';
    return `<div class="${cls}"${lab}><i style="--v:${+f.toFixed(3)}"></i></div>`;
  },

  // Round progress dots: total questions, cur = index of the current one, res[i] = 'try' for one that needed a retry.
  dots(total, cur, res = []) {
    let h = '';

  },

  // Star rating: n filled of `of` (default 3), each star `size` px. o.arc lifts the middle star (reward screens).
  stars(n, of = 3, size = 28, o = {}) {
    let h = '';
    for (let i = 0; i < of; i++) h += `<span class="rs${i < n ? ' on' : ''}">${ico('star', size, 'rs-b')}${ico('star', size, 'rs-f')}</span>`;

  },

  choice(html, o = {}) {

    const data = (o.i != null ? ` data-i="${esc(o.i)}"` : '') + (o.v != null ? ` data-v="${esc(o.v)}"` : '');

  },

  // Path card for a subject. o: p, title, done, total, next (the next stop's name), id, icon (defaults by subject), attrs.
  pathcard(o) {
    const v = o.total ? o.done / o.total : 0;
    const next = o.next ? `Next: ${o.next}` : `${o.done} of ${o.total} stops`;
    return `<button class="pathcard s-${o.p}"${UI._id(o.id)}${o.attrs ? ' ' + o.attrs : ''}>` +
      `<span class="pc-badge">${ico(o.icon || UI.SUBJ_ICON[o.p] || 'map')}</span>` +
      `<span><span class="pc-t">${UI.t(o.title)}</span>${UI.meter(v, { label: `${o.done} of ${o.total} stops` })}` +
      `<span class="pc-next">${esc(next)}</span></span>` +
      `<span class="pc-go">${ico('play')}</span></button>`;
  },

  // Hint panel. html is the hint text or picture. o.steps: array of step strings, o.at: index of the step showing now;
  // o.next: label of the "next step" button (id "hintnext") shown while steps remain.
  hint(html, o = {}) {
    let steps = '';

      const at = o.at || 0;

  ctx(title, html, open = true, icon = 'path-read') {

  speech(text, side = '') {

  },

  // Empty state: icon, one line, one action (html of a button, may be '').
  empty(icon, line, actionHtml = '') {

  // Segmented control. opts: [[value, label], ...]; cur: the selected value. Wire it with UI.segOn(el, v => ...).
  seg(opts, cur, o = {}) {
    const b = opts.map(([v, l]) => `<button data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${UI.t(l)}</button>`).join('');
    return `<div class="seg${o.full ? ' full' : ''}"${UI._id(o.id)} role="group"${o.label ? ` aria-label="${esc(o.label)}"` : ''}>${b}</div>`;
  },
  segOn(el, cb) {
    if (!el) return;
    el.onclick = e => {
      const b = e.target.closest('button');
      if (!b || b.disabled || !el.contains(b)) return;
      for (const x of el.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
      cb(b.dataset.v);
    };
  },

  // Map node. o: p, state (lock | open | done | mast | skip), boss, icon or html (face), stars (0-3, shown under done/mast),
  // isNew (adds a "New" tag), aria, attrs.
  mapnode(o) {
    const cls = ['mapnode', o.p ? 's-' + o.p : '', o.state || '', o.boss ? 'boss' : ''].filter(Boolean).join(' ');
    const face = o.state == 'lock' ? ico('lock') : o.state == 'skip' ? ico('check') : o.html || ico(o.icon || 'star');
    const st = o.stars != null && (o.state == 'done' || o.state == 'mast') ? UI.stars(o.stars, 3, 18) : '';
    const tag = o.isNew ? UI.tag('New', 'new') : '';
    return `<button class="${cls}"${o.aria ? ` aria-label="${esc(o.aria)}"` : ''}${o.state == 'lock' ? ' aria-disabled="true"' : ''}` +
      `${o.attrs ? ' ' + o.attrs : ''}>${face}${st}${tag}</button>`;
  },

  // Toast: a pill at the top centre for ms milliseconds. kind: good | try | info | streak. icon: optional, overrides the kind's icon.
  toast(text, kind = 'info', ms = 1600, icon = '') {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.setAttribute('role', 'status');
      t.setAttribute('aria-live', 'polite');
      document.body.appendChild(t);
    }
    const ic = icon || { good: 'check', try: 'replay', info: 'info', streak: 'flame' }[kind] || 'info';
    t.className = 'toast ' + kind;
    t.innerHTML = `<span class="ti">${ico(ic)}</span><span>${UI.t(text)}</span>`;
    void t.offsetWidth; // let it slide in again when shown twice in a row
    t.classList.add('on');
    clearTimeout(UI._toastT);
    UI._toastT = setTimeout(() => t.classList.remove('on'), ms);
  },

  // Sheet (modal): dim backdrop, slides up, inside #app so view() removes it. html is the body (h2, p, .acts with one primary).
  // o.stay: backdrop taps do not close it. o.onClose runs once when it closes. Returns {el, close}.
  sheet(html, o = {}) {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    (document.getElementById('app') || document.body).appendChild(bg);
    let shut = false;
    const close = () => {
      if (shut) return;
      shut = true;
      bg.classList.remove('on');
      setTimeout(() => bg.remove(), 340);
      if (o.onClose) o.onClose();
    };
    if (!o.stay) bg.onclick = e => { if (e.target === bg) close(); };
    requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add('on')));
    return { el: bg.firstChild, close };
  },
};

}

/* Every content picture (counting objects, picture words, vocabulary) goes through picFor(word, emoji).
   P4-13 to P4-15 add drawings to ART with Object.assign(ART, {apple: '<path .../>', ...}): set A in src/js/16-art-a.js, set B in
   src/data/d-art-b.js (the data file, so ART is complete only at render time: read it inside functions, never while loading)
   (64x64 grid, style and limits in DESIGN_SYSTEM 6.5); words with a drawing show it, the rest keep the emoji,
   with no change to any generator.
   Rules for content code:
   - Never put a picture emoji straight into q.html; call picFor(word, emoji).
   - The word is the art name (lowercase, a-z and hyphens). The emoji is the fallback and must be in tools/emoji-allow.txt.
   - Use the result where the emoji used to go (inside .emo or inline text): drawings size to 1em, like an emoji. */
const ART = {};

// One drawing as an inline SVG, sized like text by default.
function picArt(name, size = '1em', cls = '') {
  const s = typeof size == 'number' ? size + 'px' : size;
  return `<svg class="art${cls ? ' ' + cls : ''}" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true" focusable="false">`
    + ART[name] + '</svg>';
}

// The picture for a word: the drawing when ART has one, else the emoji fallback.
function picFor(word, emoji = '') {
  return ART[word] ? picArt(word) : emoji;
}

/* ---------- pet rig (P4-05; DESIGN_SYSTEM.md section 6.2) ----------
   petSVG(kind, stage, mood, opts) draws a pet as one inline SVG, viewBox 0 0 200 200, ground at y 184.
   Named groups (class pg-<name>): shadow, glow (super only), extra (wings or fins: pg-xl, pg-xr), tail, body, belly,
   arm-l, arm-r (holds the toy), head (holds the hat), cheeks, eyes, mouth.
   - stage: 'egg' | 'baby' | 'kid' | 'grown', or the stage() number 0-4 (4 = grown plus the "super" glow ring: circles, no filter).
   - mood: 'idle' | 'happy' | 'oops' | 'cheer' | 'sleepy' | 'hungry'. A mood swaps only the eyes and mouth (PET_FACE).
   - opts.hat / opts.toy: SVG markup on a 64x64 grid (the drawn wearables, P4-07: pass wearOf(id) from 17-wear.js) or an emoji (drawn as text),
     placed at the stage's anchors. opts.react: also draw the cheer and oops faces, shown while anim() puts .jump / .sad
     on a parent. opts.super: force the glow on or off.
   Anchors: PET_RIG[kind].stages[name].hat / .toy = [x, y, scale, degrees] in viewBox units (petAnchor() reads them).
     hat = where the bottom centre of a hat sits on the head; toy = centre of the toy held by the right hand.
     SVG wearables (P4-07): hat art puts its point (32, 60) on the hat anchor, toy art puts (32, 32) on the toy anchor;
     scale maps 64-grid units to viewBox units; the hat turns with the head and the toy with the right arm.
   Colour: only fill/stroke="var(--pc-x)" roles, set per pet in src/css/41-pet.css from tokens (b body, b2 body shade,
     l belly, l2 belly shade and accents, h / h2 horns, x / x2 / x3 muzzle, claws and their shades, b3 / l3 dark accent and light tint, sh / sh2 egg shell, e ink, w glint,
     t tongue, ck cheeks, d drops, gl / gl2 glow, sd shadow;
     P4-06 adds p / p2 plates and fins, b1 light spots, n / n2 / n3 the bird's nest). Motion is CSS on the groups (41-pet.css).
   Pets: dragon (P4-05, the reference), dino, bird and ocean (the sea pal) (P4-06). A new pet: add PET_RIG.<kind> with the same
     stage keys and parts (wing / tail / arm strings, body / belly / head functions, cheeks; optional face = its own PET_FACE,
     e.g. the bird's beak is its mouth), and a .pet-k-<kind> palette in 41-pet.css (only --ill-* or app tokens).
   Stage numbers come from stage() in 05-pets.js (stars); nothing here reads or writes saved data except petMood (care). */
const PET_STAGES = ['egg', 'baby', 'kid', 'grown'];

const petR1 = v => Math.round(v * 10) / 10;

// stage name for a stage() number or a name (unknown -> 'kid')
const petStageName = st => typeof st == 'number' ? PET_STAGES[Math.max(0, Math.min(st, 3))] : PET_STAGES.includes(st) ? st : 'kid';

// {x, y, s, r} of an anchor ('hat' or 'toy') for a pet and stage, in viewBox units
function petAnchor(kind, st, name) {
  const a = (PET_RIG[kind] || PET_RIG.dragon).stages[petStageName(st)][name];
  return { x: a[0], y: a[1], s: a[2], r: a[3] };
}

// a hat or toy at its anchor: SVG markup (64x64 grid, P4-07) or an emoji as text
function petWear(slot, item, a) {
  if (!item) return '';
  const [x, y, s, r] = a;
  if (item[0] == '<') return `<g class="pw-${slot}" transform="translate(${x} ${y}) rotate(${r}) scale(${s}) translate(-32 -${slot == 'hat' ? 60 : 32})">${item}</g>`;
  const fs = petR1(64 * s * .75);
  return `<text class="pw-${slot}" transform="translate(${x} ${y}) rotate(${r})" y="${slot == 'hat' ? petR1(-fs * .42) : 0}" font-size="${fs}" ` +
    `text-anchor="middle" dominant-baseline="central">${esc(item)}</text>`;
}

const wr1 = v => Math.round(v * 10) / 10;

// ---- path helpers: absolute commands only (M L C Q Z), so every number pair is a point ----
// apply f([x, y]) to every point of a path
function wMap(d, f) {
  let out = '', n = [];
  for (const t of d.match(/[MLCQZ]|-?\d*\.?\d+/g)) {
    if (/[A-Z]/.test(t)) { out += t; continue; }
    n.push(+t);
    if (n.length == 2) {
      const [x, y] = f(n);
      out += (/[A-Z]$/.test(out) ? '' : ' ') + wr1(x) + ' ' + wr1(y);
      n = [];
    }
  }
  return out;
}
// [x0, y0, x1, y1] of a path's points (control points included, so the curve is inside)
function wBoxD(d) {
  const b = [1e9, 1e9, -1e9, -1e9];
  wMap(d, ([x, y]) => { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); return [x, y]; });
  return b;
}
// rotate a path by a degrees about (cx, cy)
const wRot = (d, a, cx = 32, cy = 32) => {
  const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
  return wMap(d, ([x, y]) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]);
};
// mirror a path left-right about x = 32
const wFlip = d => wMap(d, ([x, y]) => [64 - x, y]);

  const b = wBoxD(d), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  return `<path ${wF(sh)} d="${wMap(d, p => p)}"/><path ${wF(base)} d="${wMap(d, ([x, y]) => [cx + (x - cx) * k + dx, cy + (y - cy) * k + dy])}"/>`;
}

// bounding box [x0, y0, x1, y1] of drawing markup (shapes, absolute paths, group and rotate transforms, half the stroke width)
function wearBox(svg) {
  const b = [1e9, 1e9, -1e9, -1e9], stack = [[1, 0, 0, 1, 0, 0]];
  const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  const tf = s => {
    let m = [1, 0, 0, 1, 0, 0];
    for (const t of (s || '').matchAll(/(translate|scale|rotate)\(([^)]*)\)/g)) {
      const v = t[2].trim().split(/[\s,]+/).map(Number);
      if (t[1] == 'translate') m = mul(m, [1, 0, 0, 1, v[0], v[1] || 0]);
      else if (t[1] == 'scale') m = mul(m, [v[0], 0, 0, v.length > 1 ? v[1] : v[0], 0, 0]);
      else {
        const a = v[0] * Math.PI / 180, c = Math.cos(a), s2 = Math.sin(a), cx = v[1] || 0, cy = v[2] || 0;
        m = mul(m, [1, 0, 0, 1, cx, cy]);
        m = mul(m, [c, s2, -s2, c, 0, 0]);
        m = mul(m, [1, 0, 0, 1, -cx, -cy]);
      }
    }
    return m;
  };
  const add = (m, x, y) => {
    const X = m[0] * x + m[2] * y + m[4], Y = m[1] * x + m[3] * y + m[5];
    b[0] = Math.min(b[0], X); b[1] = Math.min(b[1], Y); b[2] = Math.max(b[2], X); b[3] = Math.max(b[3], Y);
  };
  for (const t of svg.matchAll(/<(\/?)(g|path|circle|ellipse|rect)\b([^>]*?)(\/?)>/g)) {
    if (t[1]) { stack.pop(); continue; }
    const at = k => { const r = t[3].match(new RegExp('\\s' + k + '="([^"]*)"')); return r ? r[1] : null; };
    const m = mul(stack[stack.length - 1], tf(at('transform')));
    if (t[2] == 'g') { if (!t[4]) stack.push(m); continue; }
    const sw = at('stroke') && at('stroke') != 'none' ? (+at('stroke-width') || 1) / 2 : 0, n = k => +(at(k) || 0);
    let box;
    if (t[2] == 'circle') box = [n('cx') - n('r'), n('cy') - n('r'), n('cx') + n('r'), n('cy') + n('r')];
    else if (t[2] == 'ellipse') box = [n('cx') - n('rx'), n('cy') - n('ry'), n('cx') + n('rx'), n('cy') + n('ry')];
    else if (t[2] == 'rect') box = [n('x'), n('y'), n('x') + n('width'), n('y') + n('height')];
    else box = wBoxD(at('d') || 'M0 0');
    box = [box[0] - sw, box[1] - sw, box[2] + sw, box[3] + sw];
    for (const [x, y] of [[box[0], box[1]], [box[2], box[1]], [box[0], box[3]], [box[2], box[3]]]) add(m, x, y);
  }
  return b.map(wr1);
}

// an item's picture (decorative): the drawing in a square viewBox around it
function wearPic(id, size = '1em', cls = '') {
  const a = wearArt(id);
  if (!a) return `<span class="wr-emo">${esc(id)}</span>`;
  const b = wearBox(a), s = Math.max(b[2] - b[0], b[3] - b[1]) + 4, x = (b[0] + b[2] - s) / 2, y = (b[1] + b[3] - s) / 2;
  return `<svg class="art wr-pic${cls ? ' ' + cls : ''}" width="${size}" height="${size}" viewBox="${wr1(x)} ${wr1(y)} ${wr1(s)} ${wr1(s)}" ` +
    `aria-hidden="true" focusable="false">${a}</svg>`;
}

const RW = {
  BOSS: { 'Gloop': 'gloop', 'Robo-Bonk': 'robo', 'Captain Inky': 'inky', 'Zorp': 'zorp' },

  // an inline SVG drawing (class "art" for the --a-* roles). label: spoken name, else decorative
  art(body, cls, vb = '0 0 200 200', label = '') {
    const a = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true" focusable="false"';
    return `<svg class="art ${cls}" viewBox="${vb}" ${a}>${body}</svg>`;
  },

  chest(open) {
    const C = RW_CHEST;
    const body = open ? C.shadow + C.lidOpen + C.inside + C.body + C.lock + C.sparks : C.shadow + C.body + C.lid + C.lock;
    return RW.art(body, 'rw-chest-art' + (open ? ' rw-open' : ''));
  },

  // soft light rays behind the chest (12 wedges and a glow)
  rays() {
    let d = '';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, b = a + Math.PI / 14;
      d += `M100 100L${rw1(100 + Math.cos(a) * 100)} ${rw1(100 + Math.sin(a) * 100)}L${rw1(100 + Math.cos(b) * 100)} ${rw1(100 + Math.sin(b) * 100)}Z`;
    }
    return RW.art(`<circle cx="100" cy="100" r="64" ${rwF('y1')} opacity=".55"/><path ${rwF('y1')} opacity=".7" d="${d}"/>`, 'rw-rays');
  },

  // one reward star (64 grid): a smiling gold star (the object-art star) or an empty slot
  star(on) {
    const D = 'M32 9L39.6 24.5L56.7 27L44.4 39L47.3 56L32 48L16.7 56L19.6 39L7.3 27L24.4 24.5Z';
    const body = on && typeof ART != 'undefined' && ART.star ? ART.star
      : `<path ${rwF('e1')} stroke="var(--a-e1)" stroke-width="6" stroke-linejoin="round" d="${D}"/>` +
      `<path ${rwF('w2')} stroke="var(--a-w2)" stroke-width="3" stroke-linejoin="round" transform="translate(32 33) scale(.84) translate(-32 -32)" d="${D}"/>`;
    return RW.art(body, 'rw-star', '0 0 64 64');
  },

  // the round's rating: n of `of` stars, the middle one bigger and lifted; earned stars pop in one by one (CSS, --i)
  rate(n, of = 3) {
    let h = '';
    for (let i = 0; i < of; i++) h += `<span class="rw-st${i < n ? ' on' : ''}" style="--i:${i}">${RW.star(i < n)}</span>`;
    return `<div class="rw-rate" role="img" aria-label="${n} of ${of} stars">${h}</div>`;
  },

  // boss key for a boss name ('' when it has no drawing)
  bossOf(name) {
    return RW.BOSS[name] || '';
  },

  // a boss drawing. pose 'idle' or 'hit' (both faces are in the markup; CSS shows one, and .bossE.hit shows the hit face).
  // Returns '' for a name without a drawing, so the caller can keep its emoji.
  boss(name, pose = 'idle', cls = '') {
    const k = RW.bossOf(name), B = RW_BOSSES[k];
    if (!B) return '';
    const body = `<ellipse cx="100" cy="185" rx="60" ry="8" ${rwF('k')} opacity=".14"/><g class="rb-fig">${B.body}` +
      `<g class="rb-idle">${B.idle}</g><g class="rb-hit">${B.hit}</g></g>`;
    return RW.art(body, `rw-boss rw-b-${k} rw-p-${pose == 'hit' ? 'hit' : 'idle'}${cls ? ' ' + cls : ''}`, '0 0 200 200', B.name);
  },

  // a prize rosette with the prize in the middle: its drawn emblem (P4-07), else the emoji
  badge(prize) {
    const ribbon = `<path ${rwF('r2')} d="M22 34L13 60L22 55.5L26.5 62L33 39Z"/><path ${rwF('r')} d="M42 34L51 60L42 55.5L37.5 62L31 39Z"/>`;
    const rose = `<path ${rwF('y2')} stroke="var(--a-y2)" stroke-width="3" stroke-linejoin="round" d="${rwStarD(32, 28, 25, 21, 14)}"/>` +
      `<path ${rwF('y')} stroke="var(--a-y)" stroke-width="2" stroke-linejoin="round" d="${rwStarD(31, 27, 23.5, 19.8, 14)}"/>` +
      `<circle cx="32" cy="28" r="16.5" ${rwF('y3')}/><circle cx="31.4" cy="27.4" r="15.6" ${rwF('w')}/>` +
      `<path ${rwS('y1', 2.2)} stroke-linecap="round" d="M15 21Q19 11 29 9"/>`;
    // P4-07: a prize with a drawn emblem shows it on the rosette's face (the same badge the pet then wears); others keep the emoji
    const emb = typeof wearEmb == 'function' ? wearEmb(prize) : '';
    if (emb) return `<span class="rw-badge">${RW.art(ribbon + rose + `<g transform="translate(31.4 27.4) scale(.4) translate(-32 -32)">${emb}</g>`,
      'rw-rose', '0 0 64 64', wearName(prize))}</span>`;
    return `<span class="rw-badge">${RW.art(ribbon + rose, 'rw-rose', '0 0 64 64')}<span class="rw-be">${esc(prize)}</span></span>`;
  },

  // a sticker prize: die-cut white border, a slight turn, "New" tag the first time
  sticker(s, isNew, i = 0) {
    const turn = [-7, 5, -3, 7][i % 4];
    return `<span class="rw-stk" style="--r:${turn}deg"><span class="rw-se">${esc(s)}</span>${isNew ? UI.tag('New', 'new') : ''}</span>`;
  },

  // icon for a line of the game-time list (ptCalc labels in 58-playtime.js)
  ptIcon(label) {
    const L = [[/^Round done/, 'check'], [/^Keep trying|^Good try/, 'heart'], [/^New stop/, 'map'], [/^Beat your old/, 'trophy'],
      [/^Harder world/, 'bolt'], [/^Perfect/, 'star'], [/^Beat the boss/, 'crown'], [/^Fixed/, 'replay'], [/^Already mastered/, 'crown'],
      [/^Tested out/, 'bolt'], [/^Practice round/, 'target'], [/^Played/, 'replay']];
    for (const [re, ic] of L) if (re.test(label)) return ic;
    return 'plus';
  },

  // a reward line without picture characters at the start, and with the coin emoji said in words (the icon carries the picture)
  clean(m) {
    return String(m).replace(/^\s*(\p{Extended_Pictographic}️?\s*)+/u, '').replace(/\s*\u{1FA99}️?/gu, ' coins');
  },

  // a list row: icon disc + text (html). kind sets the disc colour (star | coin | ticket | ...)
  row(kind, icon, html, id = '') {
    return `<div class="rw-er ${kind}"${id ? ` id="${id}"` : ''}><span class="rw-ed">${ico(icon, 28, icon == 'coin' ? 'ic-coin' : '')}</span>` +
      `<div class="rw-et">${html}</div></div>`;
  },

  // a message card: art = an icon name or drawn markup (starts with <), html = the text, kind: win | tip | '' (plain)
  msg(art, html, kind = '') {
    const a = art[0] == '<' ? art : ico(art, 30);
    return `<div class="rw-msg${kind ? ' ' + kind : ''}"><span class="rw-md">${a}</span><div class="rw-mt">${html}</div></div>`;
  },

  // the child's pet cheering (round with no stars, mix, test out): the drawn pet (every pet is on the rig since P4-06)
  pet() {
    const w = S.wear || {};
    return `<div class="rw-pet">${petSVG(S.pet, stage(), 'cheer', { hat: wearOf(w.hat), toy: wearOf(w.toy) })}</div>`;
  },

  // ---- screens ----
  // before the tap: the closed chest, rattling (#chest is the button)
  pre() {
    return `<div class="center rw-fin" id="fin"><div class="rw-pre"><h1 class="rw-h">Round complete!</h1>` +
      `<button class="rw-chest" id="chest" aria-label="Open the treasure chest"><span class="rw-glow">${RW.rays()}</span>${RW.chest(0)}</button>` +
      `<p class="rw-sub rw-tap">${ico('gift', 26)}<span>Tap the treasure chest!</span></p></div></div>`;
  },

  // after the tap. o: {sc, n, rate (stars or -1 for none), line, tip (the next step after a low score, or ''), again (label),
  // next (true: Next stop), menu ('Map' | 'Home')}
  done(o) {
    const art = o.rate >= 0 ? RW.rate(o.rate) : RW.pet();
    const main = o.next ? UI.btn('Next stop', { kind: 'primary', size: 'lg', wide: true, icon: 'play', id: 'nxt' })
      : UI.btn(o.again, { kind: 'primary', size: 'lg', wide: true, icon: 'replay', id: 'again' });
    const btns = main + `<div class="rw-two">${UI.btn('Bonus game', { kind: 'subject', p: 'play', icon: 'gamepad', id: 'bonus' })}` +
      `${UI.btn(o.menu, { icon: o.menu == 'Home' ? 'home' : 'map', id: 'menu' })}</div>`;
    const stars = o.sc ? RW.row('star', 'star', `<b class="rw-num">+0</b> stars`, 'rwst') : '';
    return `<div class="rw-res"><section class="rw-a"><div class="rw-hero">${art}` +
      `<h1 class="rw-score" id="sc"><b>${o.sc}</b> out of ${o.n}</h1><p class="rw-line">${esc(o.line)}</p>` +
      `${o.tip ? `<p class="rw-tip">${ico('target', 24)}<span>${esc(o.tip)}</span></p>` : ''}</div>` +
      `<div class="rw-tre"><div class="rw-chest-o">${RW.rays()}${RW.chest(1)}</div><div class="rw-prz" id="prz"></div></div></section>` +
      `<section class="rw-b"><div class="rw-feed"><div class="rw-msgs" id="msgs"></div><div class="rw-earn" id="earn">${stars}</div></div>` +

/* ---------- hints ---------- */
function rod(n,c,cls='',x=0){if(n<=0)return'';let s='';for(let i=0;i<n;i++)s+=`<i class="${i>=n-x?'x':''}"></i>`;return`<span class="rod ${cls}" style="--c:${c||PAL[(n-1)%10]}">${s}</span>`}
function hintHTML(q){const h=q.hint;if(!h)return'';
  if(h.k=='text')return esc(h.s);
  if(h.k=='steps')return hintSteps(q); // P2-08
  if(h.k=='say'){setTimeout(()=>say(h.w,null,h.lang),150);return esc(h.s)}
  if(h.k=='trace')return TR.hint(q); // P2-16: the hint plays on the tracing board (47-trace.js)
  if(h.k=='html'){if(h.w)setTimeout(()=>say(h.w),150);return h.html} // trusted markup from a generator (Pre-K pictures); h.w is spoken
  if(h.k=='next'){const need=q.word[G.built.length],i=q.tiles.findIndex((t,j)=>t==need&&!G.built.includes(j));const el=$(`.lt[data-i="${i}"]`);if(el)el.classList.add('glow');setTimeout(()=>say(q.word),150);return'Look for the glowing letter!'}
  if(h.k=='pairs'){if(h.n>20)return'Look at the last digit. Is it 0, 2, 4, 6, or 8?';let s='<div class="pairs">';for(let i=0;i<h.n;i+=2)s+='<span><b></b>'+(i+1<h.n?'<b></b>':'')+'</span>';return s+'</div><div>Does every dot have a partner?</div>'}
  if(h.k=='emoji'){const{e,a,b,op}=h;if(op=='+')return a+b>20?'Count on with your fingers!':`<div class="emh">${e.repeat(a)} + ${e.repeat(b)}</div>`;
    return a>20?'Count back with your fingers!':`<div class="emh">${e.repeat(a-b)}<span style="opacity:.25">${e.repeat(b)}</span></div><div>${b} went away</div>`}
  if(h.k=='blocks'){const{a,b,c,op,blank}=h;if(Math.max(a,b,c)>20)return'Count on from the bigger number!';
    if(op=='+'&&blank=='c'&&(a==0||b==0))return`<div class="rowh">${rod(a||b)}<span>+ nothing</span></div><div>Adding zero adds nothing! How many blocks?</div>`;
    if(op=='-'&&b==0)return`<div class="rowh">${rod(a)}</div><div>Taking away zero takes nothing away!</div>`;
    if(op=='-'&&a==b)return`<div class="rowh">${rod(a,null,'',b)}</div><div>Cross out all ${b}. How many are left?</div>`;
    if(op=='+'){if(blank=='c')return`<div class="rowh">${rod(a)}<span>+</span>${rod(b)}</div><div>Count them all!</div>`;
      const k=blank=='a'?b:a;return`<div class="rods">${rod(c,'#cbd5e1')}<div class="rowh" style="gap:0">${rod(k)}${rod(c-k,null,'dash')}</div></div><div>How many empty boxes?</div>`}
    return`<div class="rowh">${rod(a,null,'',b)}</div><div>Cross out ${b}. How many are left?</div>`}
  return''}

/* ---- P2-08 step hints: {k: 'steps', steps: [{html, say}], w} (builders in 39b-steps.js) ----
   The panel shows one step at a time: a row of pips (done, this one, still to come), then the step's board and caption.
   Help (#hb) reads "Next step" while more steps remain, and each tap shows the next one (hintStep, which the Help button in
   50-round.js calls first). The step reached is kept per question, so a wrong answer shows the same step again. */
const HSTEP = new WeakMap(); // question -> index of the step on show
function hintSteps(q) {
  const h = q.hint, n = h.steps.length, at = Math.min(HSTEP.get(q) || 0, n - 1), s = h.steps[at];
  const pips = n <= 12 ? h.steps.map((_, i) => `<i class="${i < at ? 'dn' : i == at ? 'on' : ''}"></i>`).join('') : `<b>${at + 1} / ${n}</b>`;
  // layout: a narrow board sits beside its caption, a wide one (w columns) above it (on phones from 6 columns)
  const lay = !s.html.includes('class="hsb') ? ' txt' : h.w >= 8 ? ' wide' : h.w >= 6 ? ' mid' : '';
  hintBtn(at < n - 1);
  // once the panel is in: if the card still overflows (a phone, a tall board), fold it for the rest of this question: the stacked
  // prompt goes onto one line (the board shows the columns), older rows of the board hide, rows get tighter (39-steps.css)
  setTimeout(() => {
    const qa = $('.qarea');
    if (qa && qa.querySelector('.hs') && !qa.classList.contains('hs-fold') && qa.scrollHeight > qa.clientHeight + 1) {
      qa.classList.add('hs-fold');
      fit();
    }
  }, 0);
  setTimeout(() => say(s.say), 150);
  return `<div class="hs${lay}" data-hs="${at}"><span class="hs-pips" role="img" aria-label="Step ${at + 1} of ${n}">${pips}</span>`
    + `<div class="hs-step">${s.html}</div></div>`;
}
// the Help button's label: "Next step" (arrow) while steps remain, else "Help" (bulb); the round Pre-K bulb keeps its look
function hintBtn(more) {
  const b = $('#hb');
  if (!b || b.classList.contains('pkhb')) return;
  b.innerHTML = `${ico(more ? 'go' : 'hint')}<span>${more ? 'Next step' : 'Help'}</span>`;
}
// Help tapped while q's steps are on show: the next step, in place. false: no step hint on show, or the last step is
// (the caller then shows the hint as usual)
function hintStep(q) {
  const h = q && q.hint, box = $('#hint');
  if (!h || h.k != 'steps' || !box || !box.querySelector('.hs')) return false;
  const at = HSTEP.get(q) || 0;
  if (at >= h.steps.length - 1) return false;
  HSTEP.set(q, at + 1);
  box.innerHTML = hintHTML(q);
  SFX.pop(3);
  fit();
  box.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  return true;
}

/* ---------- Map and world scenes (P4-09, DESIGN_SYSTEM 7; CSS 47-scenes.css; props, themes, world table: src/data/d-scenes.js) ----------
   A world band = a sky-to-ground CSS gradient (scene tokens) + one SVG: sun or moon, clouds, stars, rays, garland, horizon ridges,
   rolling ground, a landmark, props down the sides, ground marks. Props go only where the band's stops, labels, title, Test out
   banner, pet and trail are not. Decoration only (aria-hidden, no taps, no motion), tokens only, deterministic. */
const SCN = {
  memo: {},
  HUE: { r: 'red', o: 'orange', y: 'yellow', g: 'green', c: 'aqua', b: 'blue', v: 'purple', p: 'pink', n: 'brown', t: 'tan',
    s: 'skin', m: 'cream', e: 'grey', w: 'white', k: 'ink' },
};
const scR = n => Math.round(n * 10) / 10;

// a tone: 'g2' -> var(--ill-green-2), 'w' -> var(--ill-white), a word -> var(--sc-word)
SCN.col = t => {
  const m = /^([a-z])(\d?)$/.exec(t);
  return m ? `var(--ill-${SCN.HUE[m[1]]}${m[2] ? '-' + m[2] : ''})` : `var(--sc-${t})`;
};

/* Props are stamped into shared layers: one <path> per shape position and look for all props of a scene (every tree crown is one
   path), so a scene stays a few dozen elements. Each shape becomes path data once and is stamped by scaling and moving its numbers. */
SCN.ell = (cx, cy, rx, ry, a) => {
  const c = scR(Math.cos(a * Math.PI / 180) * rx), s = scR(Math.sin(a * Math.PI / 180) * rx);
  const A = `a${rx} ${ry} ${a} 1 0 `;
  return `M${scR(cx - c)} ${scR(cy - s)}${A}${2 * c} ${2 * s}${A}${-2 * c} ${-2 * s}Z`;
};
SCN.rect = (x, y, w, h, r) => {
  if (!r) return `M${x} ${y}h${w}v${h}h${-w}Z`;
  const A = `a${r} ${r} 0 0 1 `, iw = scR(w - 2 * r), ih = scR(h - 2 * r);
  return `M${scR(x + r)} ${y}h${iw}${A}${r} ${r}v${ih}${A}${-r} ${r}h${-iw}${A}${-r} ${-r}v${-ih}${A}${r} ${-r}Z`;
};
// path data ready to stamp: p = command letters, null for each number; kind of each number: 0 x, 1 y, 2 scale only, 3 keep
SCN.CMD = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };
SCN.segs = d => {
  const p = [], num = [], kind = [];
  let U = '', rel = false, j = 0;
  for (const t of d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)/g)) {
    if (/[a-zA-Z]/.test(t)) {
      p.push(t);
      U = t.toUpperCase();
      rel = t != U;
      j = 0;
      continue;
    }
    const i = j++ % (SCN.CMD[U] || 1);
    let c = U == 'H' ? 0 : U == 'V' ? 1 : U == 'A' ? (i < 2 ? 2 : i < 5 ? 3 : i == 5 ? 0 : 1) : i % 2;
    if (rel && c < 2) c = 2;
    p.push(null);
    num.push(+t);
    kind.push(c);
  }
  return { p, num, kind };
};
SCN.xf = (q, k, x, y) => { // scaled by k, moved to x, y
  let d = '', n = 0, gap = false;
  for (const p of q.p) {
    if (p) {
      d += p;
      gap = false;
      continue;
    }
    const v = q.num[n], c = q.kind[n++];
    d += (gap ? ' ' : '') + Math.round((c == 3 ? v : c == 2 ? v * k : v * k + (c ? y : x)) * 10) / 10;
    gap = true;

// one shape "tone [opacity] kind numbers... [@deg]" (d-scenes.js header) -> {st look, sw stroke width, da dash, segs}
SCN.shape = src => {
  const t = src.trim().split(/\s+/);
  const c = SCN.col(t.shift());
  const op = /^[\d.]+$/.test(t[0]) ? ` opacity="${t.shift()}"` : '';
  const k = t.shift();
  const rot = t.length && t[t.length - 1][0] == '@' ? +t.pop().slice(1) : 0;
  const [sw, da] = k == 'l' || k == 'o' ? t.shift().split('/') : [0, ''];
  const n = t.map(Number);
  let d = t.join(' ');
  if (k == 'c') d = SCN.ell(n[0], n[1], n[2], n[2], 0);
  if (k == 'e' || k == 'o') d = SCN.ell(n[0], n[1], n[2], n[3], rot);
  if (k == 'r') d = SCN.rect(n[0], n[1], n[2], n[3], n[4] || 0);
  const st = sw ? `fill="none" stroke="${c}" stroke-linecap="round" stroke-linejoin="round"${op}` : `fill="${c}"${op}`;
  return { st, sw: +sw, da: da ? da.split(',').map(Number) : null, segs: SCN.segs(d) };
};
// a prop by name (a variant swaps one hue): {hw, hh, sh}, built once
SCN.prop = name => {
  if (SCN.memo[name]) return SCN.memo[name];
  const v = SCN_V[name];
  let src = SCN_P[v ? v[0] : name];
  if (!src) return null;
  if (v) src = src.replace(new RegExp(`(^|[|;])${v[1]}(\\d?) `, 'g'), `$1${v[2]}$2 `);
  const [box, body] = src.split('|');
  const [hw, hh] = box.split(' ').map(Number);
  return (SCN.memo[name] = { hw, hh, sh: body.split(';').map(SCN.shape) });
};

SCN.hash = s => {
  let h = 7;
  for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h;
};
// a world's theme (SCN_W by id; a world not in it, like smoke's fake worlds, gets one by a hash); null without the data file
SCN.theme = w => {
  if (typeof SCN_T == 'undefined') return null;
  let e = SCN_W[w.id];
  if (!e) {
    const ids = Object.keys(SCN_W);

// a horizon ridge: q hills, l peaks, b blocks, a puffs; unit u, heights hs; closed down to end, or (top) up to 0 (cave ceiling)
SCN.ridge = (W, base, end, [k, u, hs, tone, top], off) => {
  const x0 = -(off % u);
  let d = `M${x0} ${base}`, x = x0;
  for (let i = 0; x < W; i++, x += u) {
    const h = hs[i % hs.length];
    if (k == 'q') d += `Q${scR(x + u / 2)} ${base - 2 * h} ${x + u} ${base}`;
    else if (k == 'l') d += `L${scR(x + u / 2)} ${base - h}L${x + u} ${base}`;
    else if (k == 'b') d += `V${base - h}H${scR(x + u * .8)}V${base}H${x + u}`;
    else d += `A${u / 2} ${h} 0 0 1 ${x + u} ${base}`;
  }
  d += top ? `V0H${x0}Z` : `V${end}H${x0}Z`;
  const [c, op] = tone.split(' ');

// small marks, many in one path: tuft, dot, spark, bub (bubble), dash (sprinkle)
SCN.mark = (k, x, y, r) => {
  x = scR(x);
  y = scR(y);
  if (k == 'tuft') return `M${x - 3} ${y}l-1.2 -5M${x} ${y}v-6.5M${x + 3} ${y}l1.2 -5`;
  if (k == 'dot') return `M${x - 1.8} ${y}a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0`;
  if (k == 'spark') return `M${x} ${y - 5}Q${x} ${y} ${x + 4} ${y}Q${x} ${y} ${x} ${y + 5}Q${x} ${y} ${x - 4} ${y}Q${x} ${y} ${x} ${y - 5}Z`;
  if (k == 'bub') return `M${x - 3.2} ${y}a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0`;
  return r < .5 ? `M${x} ${y}l3.4 -2` : `M${x} ${y}l3.4 2`;

   Scenes are cached by what they depend on (in band px), so moving between worlds redraws known scenes for free. */
SCN.cache = new Map();

  const T = SCN.theme(w);
  if (!T) return `<div class="wband" style="top:${top}px;height:${h}px;background:${w.c}" aria-hidden="true"></div>`;
  const stops = o.stops.map(([x, y, lab, boss, isNew]) => [scR(x), y - top, lab.length, boss ? 1 : 0, isNew ? 1 : 0]);
  const trail = o.trail.filter(q => q[1] > top - 30 && q[1] < top + h + 30).map(([x, y]) => [Math.round(x), Math.round(y - top)]);
  const pet = o.pet && [Math.round(o.pet[0]), Math.round(o.pet[1] - top)];
  const key = JSON.stringify([w.id, w.n, W, h, o.test ? 1 : 0, stops, trail, pet]);
  let inner = SCN.cache.get(key);
  if (!inner) {
    inner = SCN.draw(w, T, W, h, o.test, stops, trail, pet);
    SCN.cache.set(key, inner);
    if (SCN.cache.size > 12) SCN.cache.delete(SCN.cache.keys().next().value);
  }
  return `<div class="wband scn sc-${T.key}" data-scene="${T.key}" style="top:${top}px;${inner}`;
};
SCN.draw = (w, T, W, h, test, stops, trail, pet) => {
  let seed = SCN.hash(w.id) || 1;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const hz = test ? 124 : 76; // the horizon, under the title (and the Test out banner)
  // keep clear [x0, y0, x1, y1]; placed = the props drawn, [name, box] (tools/test.js checks them)
  const occ = [], placed = SCN.placed = [];
  const tw = 64 + w.n.length * 12.5;
  occ.push([(W - tw) / 2, 8, (W + tw) / 2, 68]);
  if (test) occ.push([W / 2 - 145, 52, W / 2 + 145, 112]);
  for (const [x, y, n, boss, isNew] of stops) {
    const r = boss ? 52 : 46, lw = Math.min(140, n * 7.6 + 18);
    occ.push([x - r, y - r, x + r, y + r + 6], [x - lw / 2 - 4, y + 38, x + lw / 2 + 4, y + 86]);
    if (isNew) occ.push([x - 28, y - 64, x + 28, y - 28]);
  }
  for (const [x, y] of trail) occ.push([x - 18, y - 18, x + 18, y + 18]);
  if (pet) occ.push([pet[0] - 38, pet[1] - 70, pet[0] + 38, pet[1] + 22]);
  const free = (a, b, c, d) => a > 2 && c < W - 2 && b > -2 && d < h + 2 && !occ.some(q => a < q[2] && c > q[0] && b < q[3] && d > q[1]);

  let s = '';
  // layers: key -> [pass, shape position, attributes, path data]; pass 0 sky, 1 landmarks and props, 2 companions (in front).
  // Props never overlap, so drawing layer by layer in shape order keeps each prop's own order.
  const layers = new Map();
  const stamp = (P, x, y, k, pass) => P.sh.forEach((q, i) => {
    const a = !q.sw ? q.st : (q.at = q.at || {})[k] ||
      (q.at[k] = q.st + ` stroke-width="${scR(q.sw * k)}"${q.da ? ` stroke-dasharray="${q.da.map(v => scR(v * k)).join(' ')}"` : ''}`);
    const key = pass + ' ' + i + a, L = layers.get(key), d = SCN.xf(q.segs, k, x, y);
    if (L) L[3] += d;
    else layers.set(key, [pass, i, a, d]);
  });
  const flush = pass => [...layers.values()].filter(L => L[0] == pass).sort((a, b) => a[1] - b[1])
    .map(L => `<path d="${L[3]}" ${L[2]}/>`).join('');
  // sky: sun or moon top left (where the light comes from), stars, clouds, rays, a papel picado garland
  if (T.sun == 'sun') s += `<circle cx="34" cy="34" r="25" fill="${SCN.col('y1')}" opacity=".35"/><circle cx="34" cy="34" r="15" fill="${SCN.col('y2')}"/>` +
    `<circle cx="32.5" cy="32.5" r="13" fill="${SCN.col('y')}"/><circle cx="28" cy="28" r="4.5" fill="${SCN.col('y1')}" opacity=".85"/>`;
  if (T.sun == 'moon') s += `<circle cx="34" cy="32" r="22" fill="${SCN.col('w')}" opacity=".12"/>` +
    `<path d="M38 18A14 14 0 1 0 48 40A11 11 0 0 1 38 18Z" fill="${SCN.col('m')}"/><circle cx="29" cy="30" r="2.4" fill="${SCN.col('m2')}" opacity=".7"/>`;
  if (T.st) {
    let d = '';
    for (let i = 0; i < T.st; i++) d += SCN.mark(i % 3 ? 'dot' : 'spark', 60 + rnd() * (W - 80), 8 + rnd() * (hz - 40), 0);
    s += `<path d="${d}" fill="${SCN.col('w')}" opacity=".85"/>`;
  }
  if (T.cl) stamp(SCN.prop('cloud'), W - 46, 40, .9, 0);
  if (T.cl > 1) stamp(SCN.prop('cloud'), W * .3, 26, .9, 0);
  if (T.rays) {
    let d = '';
    for (const f of [.18, .52, .8]) d += `M${scR(W * f)} 0h${scR(W * .08)}L${scR(W * f + W * .2)} ${scR(h * .55)}h${scR(-W * .2)}Z`;
    s += `<path d="${d}" fill="${SCN.col('w')}" opacity=".22"/>`;
  }
  if (T.pp) {
    const ds = T.pp.map(() => '');
    for (let i = 0, x = 10; x < W - 10; i++, x += 22) {
      ds[i % ds.length] += `M${scR(x - 6)} ${scR(8 + 14 * Math.sin(Math.PI * x / W))}h12v13l-3 -2.5l-3 2.5l-3 -2.5l-3 2.5z`;
    }
    s += `<path d="M0 8Q${W / 2} 36 ${W} 8" fill="none" stroke="${SCN.col('k2')}" stroke-width="1" opacity=".4"/>`;
    s += ds.map((d, i) => `<path d="${d}" fill="${SCN.col(T.pp[i])}" opacity=".9"/>`).join('');
  }
  s += flush(0);
  // horizon ridges back to front (the front one is the ground colour; a 6th value moves a ridge up: the sea behind a beach)
  const off = SCN.hash(w.id + 'x');
  T.hz.forEach((r, i) => { s += SCN.ridge(W, r[4] ? 4 : hz - (i ? 2 : 16) + (r[5] || 0), hz + 8, r, off >> (i * 3)); });
  // rolling ground: a crest every 200-260 px, every other layer a shade deeper, a light rim on each crest
  const crests = []; // [left y, control y 1, control y 2, right y]
  for (let y = hz + 150 + rnd() * 50; y < h - 90; y += 200 + rnd() * 60) {
    const a = scR(y + (rnd() - .5) * 50), b = scR(y + (rnd() - .5) * 50), up = rnd() > .5 ? 40 : -40;
    crests.push([a, scR(a - up), scR(b + up * .85), b]);
  }
  const x1 = scR(W * .3), x2 = scR(W * .62);
  let rim = '';
  crests.forEach(([a, c1, c2, b], i) => {
    const fwd = `M0 ${a}C${x1} ${c1} ${x2} ${c2} ${W} ${b}`, nx = crests[i + 1];
    rim += fwd;
    if (i % 2) return;
    const back = nx ? `V${nx[3]}C${x2} ${nx[2]} ${x1} ${nx[1]} 0 ${nx[0]}Z` : `V${h}H0Z`;
    s += `<path d="${fwd}${back}" fill="${SCN.col(T.g[1])}" opacity=".55"/>`;
  });
  if (rim) s += `<path d="${rim}" fill="none" stroke="${SCN.col('w')}" stroke-width="3" opacity=".55"/>`;
  const place = (name, x, y, k, pass = 1) => {
    const P = SCN.prop(name);
    if (!P) return false;
    x = Math.min(Math.max(x, P.hw * k + 4), W - P.hw * k - 4);
    const box = [x - P.hw * k - 3, y - P.hh * k - 3, x + P.hw * k + 3, y + 5];
    if (!free(...box)) return false;
    occ.push(box);
    placed.push([name, box]);
    stamp(P, x, y, k, pass);
    return true;
  };
  // landmarks on the horizon, the first on the side away from the first stop (lower or smaller when there is no room)
  const big = W >= 480 ? 1.3 : 1.1, f0 = stops[0], sides = !f0 || f0[0] > W / 2 ? [.12, .88] : [.88, .12];
  T.lm.forEach((name, i) => {
    const k = big * (i ? .9 : 1.15);
    [[22, 1], [70, 1], [22, .8], [120, 1], [70, .8]].some(([dy, f]) => place(name, W * sides[i % 2], hz + dy, k * f));
  });
  // props down the sides where there is room: a column by each edge and one where the trail swings out (free when the stops are
  // on the other side); wide screens two loose columns a side. At most 24, one size per kind (its strokes share a layer).
  const amp = Math.min(W * .3, 200), z = W / 2 - amp - 40, wide = W >= 480;
  const cols = z > 150 ? [z * .3 + 10, z * .78 + 10] : [Math.max(26, z * .5)];
  if (z <= 150 && W / 2 - amp * .9 - cols[0] > 40) cols.push(W / 2 - amp * .9);
  const xs = cols.flatMap(c => [c, W - c]), last = xs.map(() => -1e9);
  let n = 0;
  for (let y = hz + 84; y < h - 12 && n < 24; y += 30) {
    xs.forEach((x0, ci) => {
      if (y - last[ci] < (wide ? 110 : 92) || n >= 24) return;
      const name = T.pr[n % T.pr.length];
      const k = scR((wide ? 13 : 10) * (.88 + SCN.hash(name) % 25 / 100)) / 10;
      const x = x0 + (rnd() - .5) * (wide ? 70 : 16);
      if (!place(name, x, y, k)) return;
      last[ci] = y + (wide ? rnd() * 50 : 0);
      n++;
      // now and then a small companion in front (towards the middle), so things stand in groups; it may overlap its own prop
      const P = SCN.prop(name), sm = T.sm || [];
      if (sm.length && rnd() < .6) {
        const own = occ.pop();
        place(sm[n % sm.length], x + (x < W / 2 ? 1 : -1) * P.hw * k * .95, y + 7, wide ? .8 : .72, 2);
        occ.push(own);
      }
    });
  }
  s += flush(1) + flush(2);
  // ground marks on free ground, one path per kind
  for (const [k, tone] of T.tx || []) {
    let d = '';
    for (let y = hz + 26; y < h - 10; y += 26) {
      const x = 12 + rnd() * (W - 24);
      if (free(x - 7, y - 8, x + 7, y + 4)) d += SCN.mark(k, x, y, rnd());
    }
    if (!d) continue;
    s += k == 'tuft' || k == 'bub' || k == 'dash'
      ? `<path d="${d}" fill="none" stroke="${SCN.col(tone)}" stroke-width="${k == 'dash' ? 2.4 : 1.6}" stroke-linecap="round" opacity=".7"/>`
      : `<path d="${d}" fill="${SCN.col(tone)}" opacity=".7"/>`;
  }
  // the band markup after its top (SCN.band adds the start)
  return `height:${h}px;background:linear-gradient(var(--sc-${T.sky[0]}),var(--sc-${T.sky[1]}) ${hz}px,var(--sc-${T.g[0]}) ${hz}px);` +
    `box-shadow:0 6px 0 var(--sc-${T.g[1]})" aria-hidden="true"><svg class="scn-art" width="${W}" height="${h}" focusable="false">${s}</svg></div>`;
};

// the trail's curve between stops a and b (drawMap's: leave and arrive straight down) at t
SCN.bez = ([ax, ay], [bx, by], t) => {
  const u = 1 - t;
  return [u * u * (u + 3 * t) * ax + t * t * (3 * u + t) * bx, u * u * u * ay + 3 * u * u * t * (ay + 55) + 3 * u * t * t * (by - 55) + t * t * t * by];
};
SCN.trailPts = pts => { // points along the trail, for SCN.band
  const out = [];
  for (let k = 1; k < pts.length; k++) for (let t = .1; t < .95; t += .1) out.push(SCN.bez(pts[k - 1], pts[k], t));
  return out;
};
/* The trail: a worn path (rim, pale bed) with stepping stones, gold up to the current stop (the first kw points), and a little
   bridge over each gap between two world bands (gaps = their y). */
SCN.trail = (W, H, pts, kw, gaps) => {
  let d = pts.length ? `M${scR(pts[0][0])} ${pts[0][1]}` : '', walked = '';
  for (let k = 1; k < pts.length; k++) {
    const [px, py] = pts[k - 1], [x, y] = pts[k];
    d += ` C${scR(px)} ${py + 55} ${scR(x)} ${y - 55} ${scR(x)} ${y}`;
    if (k == kw - 1) walked = d;
  }
  const p = c => `<path class="tr ${c}" d="${d}"/>`;
  let br = '';
  for (const g of gaps) {
    const k = pts.findIndex(q => q[1] > g);
    if (k < 1) continue;
    let lo = 0, hi = 1; // where the curve crosses the gap (y grows along a stretch), and which way it runs there
    for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (SCN.bez(pts[k - 1], pts[k], mid)[1] < g) lo = mid; else hi = mid; }
    const [x, y] = SCN.bez(pts[k - 1], pts[k], lo), [x2, y2] = SCN.bez(pts[k - 1], pts[k], Math.min(1, lo + .02));
    br += `<g transform="translate(${scR(x)} ${scR(y)}) rotate(${scR(Math.atan2(y2 - y, x2 - x) * 180 / Math.PI - 90)})">` +
      '<rect class="tr-plank-sh" x="-14" y="-23" width="32" height="50" rx="3"/><rect class="tr-plank" x="-16" y="-25" width="32" height="50" rx="3"/>' +
      '<path class="tr-seam" d="M-16 -15H16M-16 -5H16M-16 5H16M-16 15H16"/><path class="tr-rail" d="M-17 -27V27M17 -27V27"/></g>';
  }
  const gold = walked ? `<path class="tr tr-gs" transform="translate(0 3)" d="${walked}"/><path class="tr tr-go" d="${walked}"/>` : '';
  return `<svg class="mp-trail" width="${W}" height="${H}" aria-hidden="true" focusable="false">${p('tr-rim')}${p('tr-bed')}${br}` +
    `<path class="tr tr-sh" transform="translate(0 3)" d="${d}"/>${p('tr-st')}${gold}<path class="tr tr-hi" transform="translate(-2 -2.5)" d="${d}"/></svg>`;
};
