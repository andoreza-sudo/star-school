/* ---------- placement quiz "Find my level" (P1-07; ROADMAP 3.2 step 3) ----------
   Optional, per graded path (math, reading; not Spanish, whose worlds are word sets in an order, not a ladder), not for Pre-K.
   Rules (ROADMAP 3.2):
     - starts one grade below the child's grade: the first world with g >= grade - 1 (the last world if none is)
     - a testlet is 4 questions from one world. 3 or 4 right: pass, go up one world. 0 or 1 right: not yet, go down one world.
       2 right: one more testlet at the same world, which then passes at 6 of 8.
     - stops when a "not yet" world sits directly above a passed world, at either end of the path, or after 5 testlets (20 questions)
     - result: the map starts at the lowest world not passed (the one above the highest passed world). The worlds below it get
       S.skip[worldId] = 1: a check mark, no stars, still playable. With no world passed it starts at the lowest world asked.
   Two parts:
     PLACE.*      pure state machine: takes the world list, a seed and the number right per testlet; no S, no DOM, no Math.random.
                  The same seed and answers always give the same questions and the same result (tests rely on it).
     place*()     a thin screen on the question kinds (KIND render/bind): no stars, no buzz, no hints, one try per question,
                  a neutral "Got it!" and progress dots. Nothing is saved until the last testlet is answered; quitting
                  (the X, or leaving the screen) changes nothing.
   Saved (only by placeApply, at the end): S.place[path] = {world, date, asked, right, g} (world id, today(), questions asked,
   right answers, the grade it was taken at) and S.skip[worldId] = 1 for the worlds below the result. It only ever adds: no star,
   stop, coin or skip is removed, nothing is re-locked. startWorld() (42-paths.js) reads the result through placeWorld(p) while
   the grade is unchanged, so the map opens on the placed world. A later run replaces S.place[path]; earlier skips stay. */
const PLACE={
  TL:4,  // questions per testlet
  MAX:5, // testlets at most: 20 questions
  // The start world for a grade: the first world with g >= grade - 1, else the last world.
  first(worlds,grade){
    const k=worlds.findIndex(w=>w.g>=grade-1);
    return k<0?worlds.length-1:k;
  },
  // A new quiz. rec[wi] = {t: testlets, r: right, v: 'pass' | 'fail'} per world asked.
  begin(worlds,grade,seed){
    return{n:worlds.length,wi:PLACE.first(worlds,grade),seed:seed>>>0,k:0,asked:0,right:0,rec:{},done:false,at:-1,skip:[]};
  },
  // The 4 questions of the next testlet: [{sk, lv, seed}], from the stops (not the boss, not a skill marked noPlace) of world st.wi.
  // Stops are shuffled by a private stream from (seed, testlet number) and taken in turn, so a world with 2 stops gives 2 each.
  items(worlds,st){
    const r=mulberry32((st.seed^Math.imul(st.k+1,0x9E3779B1))>>>0);
    const ns=worlds[st.wi].nodes.filter(nd=>!(SK[nd[0]]&&SK[nd[0]].noPlace)); // P2-16: tracing is not asked in the quiz
    for(let i=ns.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ns[i],ns[j]]=[ns[j],ns[i]]}
    const out=[];
    for(let i=0;i<PLACE.TL;i++){const nd=ns[i%ns.length];out.push({sk:nd[0],lv:nd[1],seed:Math.floor(r()*4294967296)>>>0})}
    return out;
  },
  // Score one testlet (right = how many of the 4 were right) and move on. Returns a new state; st is not changed.
  step(st,right){
    const s=JSON.parse(JSON.stringify(st));
    if(s.done)return s;
    right=Math.max(0,Math.min(PLACE.TL,right|0));
    const w=s.wi,rec=s.rec[w]||(s.rec[w]={t:0,r:0});
    rec.t++;rec.r+=right;s.k++;s.asked+=PLACE.TL;s.right+=right;
    let v=null;
    if(rec.t==1)v=right>=3?'pass':right<=1?'fail':null; // 2 right: one more testlet here
    else v=rec.r>=6?'pass':'fail';                       // two testlets: pass at 6 of 8
    if(v)rec.v=v;
    const R=s.rec;
    let stop=s.k>=PLACE.MAX;
    if(v=='pass'){if(w+1>=s.n||(R[w+1]&&R[w+1].v=='fail'))stop=true;else if(!stop)s.wi=w+1}
    if(v=='fail'){if(w==0||(R[w-1]&&R[w-1].v=='pass'))stop=true;else if(!stop)s.wi=w-1}
    if(stop)PLACE.finish(s);
    return s;
  },
  // Work out the result: s.at = the world to start at, s.skip = worlds to mark skipped, s.all = every world passed.
  finish(s){
    s.done=true;
    const ws=Object.keys(s.rec).map(Number),hi=Math.max(-1,...ws.filter(w=>s.rec[w].v=='pass'));
    s.all=hi>=s.n-1;
    s.at=hi>=0?Math.min(hi+1,s.n-1):Math.min(...ws);
    s.skip=[];
    for(let i=0;i<=hi;i++)s.skip.push(i);
    return s;
  },
  // Run a whole quiz with an answer function ans(world index, item) -> true/false. Used by the tests.
  sim(worlds,grade,seed,ans){
    let st=PLACE.begin(worlds,grade,seed);
    while(!st.done){const its=PLACE.items(worlds,st);st=PLACE.step(st,its.filter(it=>ans(st.wi,it)).length)}
    return st;
  }
};

// Paths that offer placement: graded ones (byLevel paths open by order).
const placePaths=()=>Object.keys(PATHS).filter(p=>!PATHS[p].byLevel&&!PATHS[p].noPlace); // Discover (noPlace) has no placement quiz
const placeOK=()=>gradeOf()>=0; // not for Pre-K
// The placed start world of path p (index), or -1. Only while the grade is the one it was taken at.
function placeWorld(p){
  const r=S.place&&S.place[p];
  if(!r||r.g!==gradeOf())return -1;
  return PATHS[p].worlds.findIndex(w=>w.id===r.world);
}
// Save a finished quiz. Adds skips and the record; never removes or lowers anything.
function placeApply(p,st){
  if(!st||!st.done)return null;
  const ws=PATHS[p].worlds;
  S.skip=S.skip||{};
  for(const wi of st.skip)S.skip[ws[wi].id]=1;
  S.place=S.place||{};
  S.place[p]={world:ws[st.at].id,date:today(),asked:st.asked,right:st.right,g:gradeOf()};
  save();
  return S.place[p];
}

/* ---------- screens ---------- */
let PL=null;          // the quiz on screen (this session only; never saved)
let PLACE_HIDE=false; // "Not now" on the home card hides it until the app is opened again
// Home card: offered to a new child (no stop passed on a graded path, never placed), K and up.
function placeAsk(){
  if(PLACE_HIDE||!placeOK()||(S.place&&Object.keys(S.place).length))return false;
  return placePaths().every(p=>!NODES[p].some((n,i)=>passed(p,i)));
}
const placeSubBtn=p=>`<button class="btn pl-sub s-${p}" data-place="${p}"><span class="pl-pe">${ico(UI.SUBJ_ICON[p]||'map',26)}</span>${esc(placeName(p))}</button>`; // P4-18: drawn subject icon
const placeName=p=>PATHS[p].n.replace(/ Adventure$/,'');
function placeBanner(){
  if(!placeAsk())return'';
  return`<div class="pl-card" id="plcard"><div class="pl-ct">${ico('target',28)}<span>Not sure where to start? <b>Find my level!</b></span></div>
   <div class="pl-row">${placePaths().map(placeSubBtn).join('')}<button class="btn pl-no" id="plno">Not now</button></div></div>`;
}
function placeBannerBind(){
  if(!$('#plcard'))return;
  $$('#plcard [data-place]').forEach(b=>b.onclick=()=>{SFX.whoosh();placeIntro(b.dataset.place,'home')});
  $('#plno').onclick=()=>{PLACE_HIDE=true;SFX.click();const c=$('#plcard');if(c)c.remove()};
}
// Grown-ups row: start a quiz for either path and see the last result.
function placeGrownHTML(){
  const last=placePaths().map(p=>{
    const r=S.place&&S.place[p],w=r&&PATHS[p].worlds.find(x=>x.id===r.world);
    return r&&w?`${esc(placeName(p))}: ${esc(w.n)} (${esc(gradeLabel(r.g))}, ${r.right|0} of ${r.asked|0} right, ${esc(r.date||'')})`:'';
  }).filter(Boolean).join('<br>');
  return`<div class="pl-grown"><b>Find my level</b> <span class="small">A short quiz (4 to 20 questions, no stars) that picks where each map
   starts. It can open worlds; it never removes stars or locks anything. Not for Pre-K.</span>
   <div class="pl-row">${placePaths().map(placeSubBtn).join('')}</div>${last?`<div class="small">Last result:<br>${last}</div>`:''}</div>`;
}
function placeGrownBind(){
  $$('.pl-grown [data-place]').forEach(b=>b.onclick=()=>{

const placeBack=from=>from=='grown'?grown():home();
function placeIntro(p,from){
  PL=null;
  if(G)G.dead=true; // a finished or left round must not fire its next-question timer into this screen
  const nm=esc(placeName(p));
  view(`<div class="center pl-in s-${p}"><div class="pl-big">${ico(UI.SUBJ_ICON[p]||'map',64)}<i class="pl-tg">${ico('target',26)}</i></div><h1>Let's find your level!</h1>
   <p class="sub">A few ${nm} questions. Some may be tricky, and that's OK. Just do your best!</p>
   <p class="small">No stars to win or lose. You can stop any time.</p>
   <div class="rowh">${UI.btn('Start',{kind:'primary',size:'lg',icon:'play',id:'plgo'})}${UI.btn('Not now',{id:'plback'})}</div></div>`);
  if(S.voice)say(`Let's find your level! Some questions may be tricky. Just do your best!`);
  $('#plback').onclick=()=>{SFX.click();placeBack(from)};
  $('#plgo').onclick=()=>{
    SFX.whoosh();

    placeStart(p,from,seed);

// Start the quiz on path p with a seed (smoke and shots pass a fixed one).
function placeStart(p,from,seed){
  const ws=PATHS[p].worlds;
  PL={p,from:from||'home',ws,st:PLACE.begin(ws,gradeOf(),seed),its:null,qi:0,right:0,lock:false};
  placeTestlet();
}
function placeTestlet(){
  PL.its=PLACE.items(PL.ws,PL.st).map(it=>genQ(it.sk,it.lv,it.seed));
  PL.qi=0;PL.right=0;
  placeQ();
}
function placeQ(){
  const me=PL,q=PL.its[PL.qi],K=KIND[q.kind];
  PL.q=q;PL.lock=false;PL.typed='';PL.tries=0;PL.built=[];
  const dots=PL.its.map((_,i)=>`<span class="pl-dot ${i<PL.qi?'on':i==PL.qi?'now':''}"></span>`).join('');
  view(`<div class="top tbar round qtop pl-top s-${PL.p}">${UI.ibtn('close','Stop',{size:'sm',id:'quit'})}
   <div class="pl-dots" aria-label="Question ${PL.qi+1} of ${PL.its.length}">${dots}</div><div class="sp"></div>
   <div class="pl-tag">${ico(UI.SUBJ_ICON[PL.p]||'map',24)}<span>Find my level</span></div></div>
  <div class="play qs s-${PL.p}"><div class="qarea">${q.ctx?bankCtx(q.ctx):''}<div class="prompt" id="prompt">${q.html}</div>
  <div class="tools">${q.say?UI.btn('Hear it',{size:'sm',icon:'speak',id:'spk'}):''}</div></div>
  <div class="inp">${K.render(q)}</div></div>`);
  $('#quit').onclick=()=>{PL=null;SFX.click();placeBack(me.from)};
  if($('#spk'))$('#spk').onclick=e=>say(q.say,e.currentTarget,q.lang=='es'&&q.auto=='must'?'es':null);
  $$('[data-sayes]').forEach(b=>b.onclick=()=>say(b.dataset.sayes,b,'es'));
  $$('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b));
  $$('.w').forEach(s=>s.onclick=()=>{say(s.dataset.w);SFX.pop(1)});
  K.bind(q,PL,placeSubmit);esQFix(q);
  fit();if(document.fonts)document.fonts.ready.then(fit);
  if(q.auto==='must'||(q.auto&&S.voice)||(q.say&&gradeCfg().auto==='all'))setTimeout(()=>{if(PL===me&&me.q===q)say(q.say,null,q.lang=='es'?'es':null)},400);
}
// One try per question. Right or not, the child hears the same neutral "Got it!"; nothing is saved here.
function placeSubmit(v,el){
  if(!PL||PL.lock)return;
  const me=PL,q=PL.q,K=KIND[q.kind];
  PL.lock=true;
  if(K.same?K.same(q,v):String(v)===String(q.ans))PL.right++;
  if(el)el.classList.add('pl-pick');
  SFX.pop(2);fb(pick(['Got it!','Thanks!','Okay!']),'pl-fb'); // brand blue, not the green of a right answer
  const d=$$('.pl-dot')[PL.qi];if(d)d.className='pl-dot on';
  setTimeout(()=>{
    if(PL!==me)return; // quit or left meanwhile
    PL.qi++;
    if(PL.qi<PL.its.length)return placeQ();
    PL.st=PLACE.step(PL.st,PL.right);
    if(PL.st.done)placeDone();else placeTestlet();
  },700);
}
function placeDone(){
  const {p,st,from}=PL,ws=PL.ws;
  PL=null;
  placeApply(p,st);
  const w=ws[st.at],sk=st.skip.map(i=>ws[i]);
  const other=placePaths().find(x=>x!=p&&!(S.place&&S.place[x]));
  view(`<div class="center pl-in"><div class="pl-done">${ico('trophy',64)}</div><h1>All done! Great work${S.name?', '+esc(S.name):''}!</h1>
   <p class="sub">${st.all?`You know a lot! Your ${esc(placeName(p))} map opens at the last world:`:`Your ${esc(placeName(p))} map starts here:`}</p>
   <div class="pl-res">${wBadge(p,st.at)}${esc(w.n)}</div>
   ${sk.length?`<p class="small pl-skip">${ico('check','1.2em')} Skipped: ${sk.map(x=>esc(x.n)).join(', ')}. You can still play ${sk.length>1?"them":"it"} any time.</p>`:''}
   <div class="rowh">${UI.btn('Go to my map',{kind:'primary',size:'lg',icon:'map',id:'plmap'})}
    ${other?UI.btn(placeName(other)+' next',{icon:UI.SUBJ_ICON[other]||'map',id:'plnext',attrs:`data-place="${other}"`}):''}
    ${UI.btn(from=='grown'?'Grown-ups':'Home',{icon:from=='grown'?'gear':'home',id:'plhome'})}</div></div>`);
  SFX.fanfare();
  if(S.voice)say(`All done! Great work! Your map starts at ${w.n}.`);
  $('#plmap').onclick=()=>{SFX.whoosh();pathMap(p,st.at)};
  if($('#plnext'))$('#plnext').onclick=()=>{SFX.whoosh();placeIntro(other,from)};
  $('#plhome').onclick=()=>{SFX.click();placeBack(from)};
}

function gradePickHTML(sel){
  return`<div class="grades" role="radiogroup" aria-label="Grade">${GRADES.map(g=>`<button class="btn gr ${g==sel?'sel':''}" role="radio" aria-checked="${g==sel}" data-g="${g}">${gradeLabel(g)}</button>`).join('')}</div>`}
function gradePickBind(onPick){
  $$('.gr').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;
    $$('.gr').forEach(x=>{x.classList.toggle('sel',x==b);x.setAttribute('aria-checked',x==b)});

/* Setup, first run (P4-12, DESIGN_SYSTEM 9 row 1): the logo, a speaker that reads the steps, then three numbered steps on drawn
   cards (name, pet egg, grade) and the big "Let's go!". A step's number turns into a tick once it is done. Styles in
   src/css/48-setup-grown-care.css. Ids and classes kept: #nm, #pn, #go, .petopt[data-p] (first span = the pet), .gr[data-g]. */
const SU_SAY = "Hi! Type your name. Pick a pet egg to hatch. Tap your grade. Then tap Let's go!";
function suStep(n, icon, title, sub, body) {
  return `<section class="su-step" data-step="${n}"><h2 class="su-h"><span class="su-n" aria-hidden="true"><b>${n}</b>${ico('check', 22)}</span>` +
    `<span class="su-hi">${ico(icon, 24)}</span><span>${title}</span></h2>${sub ? `<p class="su-sub">${sub}</p>` : ''}${body}</section>`;
}
// A text field drawn as a white well with an icon (setup and Grown-ups). Attributes in attrs (id, value, placeholder) are escaped by the caller.
const fldHTML = (icon, attrs) => `<label class="fld">${ico(icon, 24)}<input ${attrs} autocomplete="off"></label>`;
function setup() {
  let pet = S.pet, grade = gradeOf();
  const pets = Object.entries(PETS).map(([k, p]) => `<button class="btn petopt gx-pet ${k == pet ? 'sel' : ''}" data-p="${k}" aria-pressed="${k == pet}">` +
    `<span class="gx-pp">${petPick(k)}</span><b>${p.n}</b></button>`).join('');
  view(`<div class="center setup su"><header class="su-top"><h1 class="gx-logo su-logo"><span class="hm-mark su-mark">${ico('star', 36)}</span><span>Star School</span></h1>` +
    `<p class="su-hello">Hi! Let's get you ready.<span> A grown-up can help.</span></p>${UI.ibtn('speak', 'Hear the steps', { id: 'suspk' })}</header>` +
    `<div class="su-grid">` +
    suStep(1, 'user', "What's your name?", '', fldHTML('edit', `id="nm" value="${esc(S.name)}" placeholder="Your name" aria-label="Your name"`)) +
    suStep(2, 'paw', 'Pick a pet egg to hatch!', '', `<div class="pets su-pets">${pets}</div>` +
      fldHTML('paw', `id="pn" value="${esc(S.petName)}" placeholder="Name your pet (${PETS[pet].def})" aria-label="Your pet's name"`)) +
    suStep(3, 'calendar', 'What grade?', 'Grown-ups can change this later.', gradePickHTML(grade)) +
    UI.btn("Let's go!", { kind: 'primary', size: 'lg', icon: 'rocket', id: 'go' }) + '</div></div>');
  const ok = (n, on) => { const s = $(`.su-step[data-step="${n}"]`); if (s) s.classList.toggle('ok', !!on); };
  const nameOk = () => ok(1, $('#nm').value.trim());
  nameOk();
  $('#nm').oninput = nameOk;
  $('#suspk').onclick = e => say(SU_SAY, e.currentTarget);
  gradePickBind(g => { grade = g; ok(3, 1); });
  $$('.petopt').forEach(b => b.onclick = () => {
    pet = b.dataset.p;
    $$('.petopt').forEach(x => { x.classList.toggle('sel', x == b); x.setAttribute('aria-pressed', x == b); });
    ok(2, 1);
    $('#pn').placeholder = `Name your pet (${PETS[pet].def})`;
    SFX.giggle();
    anim(b.querySelector('span'), 'jump');
  });
  $('#go').onclick = () => {
    const n = $('#nm').value.trim();
    if (!n) { fb('Type your name first!', 'warn'); SFX.wrong(); $('#nm').focus(); return; }
    S.name = n; S.pet = pet; S.petName = $('#pn').value.trim(); setGrade(grade); SFX.magic(); home(true);
  };
}

let MAPP='math',MAPW={}; // MAPW[path] = the world picked in the strip (this session only, not saved)
/* P4-18: drawn map chrome (until P4-09 draws world scenes). A world badge is a disc in the world's own colour with the icon of
   the first skill that is new in that world (else its first skill); a stop shows its skill icon, a boss stop the drawn boss. */
function wBadge(p,wi){const ws=PATHS[p].worlds,w=ws[wi],seen=new Set();
  ws.slice(0,wi).forEach(x=>x.nodes.forEach(n=>seen.add(n[0])));
  const sk=(w.nodes.find(n=>!seen.has(n[0]))||w.nodes[0]||['star'])[0];
  return`<span class="wbadge s-${p}" style="--wb:${w.c}" aria-hidden="true">${ico(icoSk(sk),20)}</span>`}
function nodeFace(n,lk){if(lk)return ico('lock',32);
  if(n.sk=='boss')return RW.boss(n.boss[1],'idle','nb-art')||`<span class="nb-e">${n.boss[0]}</span>`;
  return ico(icoSk(n.sk),38)}
/* Map of a path (P1-05: long maps). A strip of world chips, grouped by grade, sits above the map; the map draws only the picked
   world and its two neighbours, so it stays fast with 16 worlds and 150 stops. pathMap(p) opens on the world the child is in
   (or the one they just played); pathMap(p, wi) opens on world wi. */
function pathMap(p,wi){MAPP=p;const P=PATHS[p];
  const last=G&&G.path==p&&G.node>=0&&NODES[p][G.node]?G.node:-1;
  MAPW[p]=wi!=null?wi:last>=0?NODES[p][last].wi:curWorld(p);
  view(`<div class="top tbar mp-top s-${p}">${UI.ibtn('back','Back',{size:'sm',id:'back'})}<div class="ttl mp-ttl">${ico(UI.SUBJ_ICON[p]||'map',30)}<span>${esc(P.n)}</span></div>${UI.chip('star',S.stars,{aria:'Stars'})}</div>
  <div class="wstrip" id="wstrip" aria-label="Worlds"></div>
  <div class="scroll" id="ms"><div class="map" id="map"></div></div>`);
  $('#back').onclick=()=>home();drawMap(p);music(true);
  if(wi!=null)return mapTop(p);
  const c=$('.node.cur')||$(`.node[data-n="${last>=0?last:curNode(p)}"]`);if(c)c.scrollIntoView({block:'center'})}
/* Pick a world from the strip or a "more worlds" button: redraw in place (no new screen, music keeps playing). */
function mapGo(p,wi){if(!$('#map'))return pathMap(p,wi);SFX.click();MAPW[p]=wi;drawMap(p);mapTop(p)}
function mapTop(p){const t=$(`.wtitle[data-w="${MAPW[p]}"]`);if(t)t.scrollIntoView({block:"start"})}
function worldStrip(p){
  const ws=PATHS[p].worlds,cw=curWorld(p);let h='',lastG=null;
  ws.forEach((w,wi)=>{
    if(!PATHS[p].byLevel&&w.g!==lastG){lastG=w.g;h+=`<span class="wgl">${gradeLabel(w.g)}</span>`}
    const open=worldOpen(p,wi),done=worldFinished(p,wi),sel=wi==MAPW[p];
    h+=`<button class="wchip${sel?' on':''}${done?' done':''}${open?'':' lock'}${wi==cw?' cur':''}" data-w="${wi}" aria-pressed="${sel}"`
      +` aria-label="${esc(w.n)}${done?', done':open?'':', locked'}">${wBadge(p,wi)}${esc(w.n)}`
      +`${done?ico('check',18):open?'':ico('lock',18)}</button>`;
  });
  return h;
}
function drawMap(p){const m=$('#map');if(!m)return;const N=NODES[p],ws=PATHS[p].worlds,W=m.clientWidth||360,amp=Math.min(W*.3,200),pts=[];
  const sel=Math.min(Math.max(MAPW[p]|0,0),ws.length-1),w0=Math.max(0,sel-1),w1=Math.min(ws.length-1,sel+1);MAPW[p]=sel;
  const st=$('#wstrip');if(st){st.innerHTML=worldStrip(p);$$('.wchip').forEach(b=>b.onclick=()=>mapGo(p,+b.dataset.w));
    const on=st.querySelector('.wchip.on');if(on)st.scrollLeft=Math.max(0,on.offsetLeft-(st.clientWidth-on.offsetWidth)/2)}
  let y=10,bands='';

/* ---------- tracing engine (P2-16; CURRICULUM E-trace) ----------
   Kind 'trace': the child traces a glyph (a digit now; letters from P2-17) with a finger on a board, stroke by stroke, in
   handwriting order. Glyph data: TRACE in src/data/d-trace.js (format in its header). This file reads TRACE only inside
   functions (the data file loads after all code).

   Question fields (made by genTrace, below):
     kind 'trace', set (TRACE.sets key: 'digit'), g (glyph key: '3'), ans 'done', passes (guide levels, default [1, 2, 3]),
     tol (optional; default 14 box units for Pre-K, 10 for K and up: CURRICULUM E-trace), pk true (spoken, no reading needed).
   One question is one glyph, traced once per pass:
     level 1  watch the demo (the pen draws every stroke), then trace over the solid guide: outlined strokes, numbered start
              dots, arrows along the stroke to trace
     level 2  dotted guide, the start dot of the stroke to trace and one arrow at its start
     level 3  start dot only (the prompt card shows the glyph to copy)
   A stroke is done when the trace passes the checker (TR.check). Lifting the finger part way keeps what was traced: the next
   touch near the end of it carries on (or a touch on the start dot starts the stroke again). A miss never shows red: the ink
   fades, the start dot pulses and the arrows run along the stroke; a soft sound and a spoken tip. Misses on one stroke raise the
   hint by themselves: 2 misses play the stroke (hint tier 1), 3 show a moving dot to follow (tier 2) over a dotted guide.
   Help does the same, one tier per tap. When every pass is traced the glyph earns stars (3 = no misses, 2 = one or two, 1 =
   more) and the answer 'done' is submitted. A glyph with fewer than 2 stars counts as "needed another try" in the round (no
   star point, amber dot), so 5 glyphs with at most 2 misses each give a 3-star stop.

   The checker (TR.track / TR.check), in box units (the glyph box is 100 x 100), for one stroke and tolerance tol:
     - the stroke is the dense centre line (points 1 unit apart) of its curve; the finger's points are joined into a line and
       walked in steps of at most 2 units
     - start: the first touch must be within 1.5 tol of the stroke's start (or of where a lifted trace stopped)
     - progress: each step looks for the nearest point of the stroke in a window from tol behind to 2.5 tol ahead of the
       progress so far; within tol it is "on" and moves the progress forward (never back), else it is "off". So the finger
       has to go along the stroke in its direction: reversed, out-of-order and off-path traces make no progress
     - ok when: progress reaches within 0.8 tol of the stroke's end, at most 25% of the trace length is off, and the trace is
       no longer than 2.5 x the stroke (plus 3 tol): a scribble fails even when it covers the stroke
     - results (why): '' ok; 'part' started right, stayed on, lifted before the end (carry on later); 'tap' a touch too
       short to count, or a start-dot tap (ignored: no miss); 'start' began away from the start; 'off' wandered off or went the
       wrong way; 'scribble' far too long
     - a one-point stroke is a dot: a touch within 1.5 tol of it, moving no further away, is ok
   Palms: a touch wider than 60 px is ignored, one finger is followed at a time, and a second touch replaces the first only
   while the first has not moved and the second is nearer the start dot. touch-action: none on the board. */
const TR = {
  N: 5,                 // glyphs in a round (CURRICULUM E-trace)
  LV: { 1: 'digit', 2: 'upper', 3: 'lower' }, // level -> TRACE set (P2-17: letters in ABC Beach, CURRICULUM E-trace)
  START: 1.5,           // start radius, in tol
  BACK: 1, AHEAD: 2.5,  // progress search window behind / ahead, in tol
  END: 0.8,             // the end must be reached within END tol
  OFF: 0.25,            // largest share of the trace that may be off the stroke
  SCRIB: 2.5,           // a trace longer than SCRIB x the stroke (+ 3 tol) is a scribble
  PART: 8,              // progress (units) that makes a lifted trace worth keeping
  TAP: 4,               // a touch shorter than this is a tap
  DOT: 2,               // a stroke shorter than this is a dot
  PALM: 60,             // css px: a wider touch is a palm
  geoC: {},             // geometry cache: 'set:key' -> {s: [stroke geometry]}
  cur: null,            // the board on screen
};

// ---- geometry ----
// cubic segments [a, c1, c2, b] of a stroke (uniform Catmull-Rom through the points; corners and ends get chord tangents)
TR.segs = pts => {
  const n = pts.length, out = [];
  const closed = n > 2 && Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) < 0.5;
  for (let i = 0; i < n - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const p0 = i == 0 ? (closed ? pts[n - 2] : a) : (a[2] ? a : pts[i - 1]);
    const p3 = i == n - 2 ? (closed ? pts[1] : b) : (b[2] ? b : pts[i + 2]);
    out.push([a, [a[0] + (b[0] - p0[0]) / 6, a[1] + (b[1] - p0[1]) / 6], [b[0] - (p3[0] - a[0]) / 6, b[1] - (p3[1] - a[1]) / 6], b]);
  }
  return out;
};
// one stroke: dense centre line p (points 1 unit apart), length L, svg path d
TR.stroke = pts => {
  const f = v => +v.toFixed(2);
  if (pts.length == 1) return { p: [[pts[0][0], pts[0][1]]], L: 0, d: `M${pts[0][0]} ${pts[0][1]}h0`, dot: true };
  const segs = TR.segs(pts), raw = [[pts[0][0], pts[0][1]]];
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (const [a, c1, c2, b] of segs) {
    d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${b[0]} ${b[1]}`;
    for (let k = 1; k <= 32; k++) {
      const t = k / 32, u = 1 - t, w0 = u * u * u, w1 = 3 * u * u * t, w2 = 3 * u * t * t, w3 = t * t * t;
      raw.push([w0 * a[0] + w1 * c1[0] + w2 * c2[0] + w3 * b[0], w0 * a[1] + w1 * c1[1] + w2 * c2[1] + w3 * b[1]]);
    }
  }
  // resample to 1 unit steps (the last step is shorter)
  const p = [raw[0]];
  let L = 0, carry = 0;
  for (let i = 1; i < raw.length; i++) {
    const [ax, ay] = raw[i - 1], [bx, by] = raw[i], seg = Math.hypot(bx - ax, by - ay);
    let t = 1 - carry;
    while (t <= seg) { p.push([ax + (bx - ax) * t / seg, ay + (by - ay) * t / seg]); t += 1; }
    carry = seg - (t - 1);
    L += seg;
  }
  const last = raw[raw.length - 1];
  if (Math.hypot(p[p.length - 1][0] - last[0], p[p.length - 1][1] - last[1]) > 1e-6) p.push(last);
  return { p, L, d };
};
TR.glyph = (set, key) => (TRACE.sets[set] || { glyphs: {} }).glyphs[key];
TR.geo = (set, key) => {
  const id = set + ':' + key;
  if (!TR.geoC[id]) TR.geoC[id] = { s: TR.glyph(set, key).s.map(TR.stroke) };
  return TR.geoC[id];
};
// the point at arc length s of a stroke, and the unit direction there
TR.at = (st, s) => {
  const i = Math.max(0, Math.min(st.p.length - 1, Math.round(s)));
  return st.p[i];
};
TR.dir = (st, s) => {
  const a = TR.at(st, s - 1.5), b = TR.at(st, s + 1.5), d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  return [(b[0] - a[0]) / d, (b[1] - a[1]) / d];
};
// svg path of a stroke from its start to arc length s (the filled part)
TR.partD = (st, s) => {
  const n = Math.max(2, Math.min(st.p.length, Math.round(s) + 1));
  return 'M' + st.p.slice(0, n).map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join('L');
};

// ---- checker ----
// A tracker for one touch along stroke st: add(x, y) per finger point (box units), res() gives the verdict (see the header).
TR.track = (st, tol, s0 = 0) => {
  const P = st.p, N = P.length;
  const t = { s: s0, s0, first: null, last: null, len: 0, on: 0, off: 0, far: 0 };
  const visit = (x, y, w) => {
    if (st.dot) {
      t.far = Math.max(t.far, Math.hypot(P[0][0] - x, P[0][1] - y));
      return;
    }
    const lo = Math.max(0, Math.floor(t.s - tol * TR.BACK)), hi = Math.min(N - 1, Math.ceil(t.s + tol * TR.AHEAD));
    let bd = Infinity, bi = -1;
    for (let i = lo; i <= hi; i++) {
      const dx = P[i][0] - x, dy = P[i][1] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; bi = i; }
    }
    if (Math.sqrt(bd) <= tol) {
      t.on += w;
      t.s = Math.max(t.s, Math.min(st.L, bi));
    } else t.off += w;
  };
  t.add = (x, y) => {
    if (!t.first) {
      t.first = t.last = [x, y];
      visit(x, y, 0);
      return;
    }
    const [ax, ay] = t.last, dx = x - ax, dy = y - ay, d = Math.hypot(dx, dy);
    if (d < 1e-6) return;
    const k = Math.ceil(d / 2);
    for (let i = 1; i <= k; i++) visit(ax + dx * i / k, ay + dy * i / k, d / k);
    t.len += d;
    t.last = [x, y];
  };
  t.res = () => {
    const o = { ok: false, why: 'tap', s: t.s0, len: t.len, off: t.on + t.off ? t.off / (t.on + t.off) : 0 };
    if (!t.first) return o;
    const a = TR.at(st, t.s0), sd = Math.hypot(t.first[0] - a[0], t.first[1] - a[1]), r = TR.START * tol;
    if (st.dot) {
      if (sd <= r && t.far <= r) return Object.assign(o, { ok: true, why: '', s: 0 });
      return Object.assign(o, { why: t.len < TR.TAP ? 'tap' : 'start' });
    }
    if (sd > r) return Object.assign(o, { why: t.len < TR.TAP ? 'tap' : 'start' });
    if (t.len > TR.SCRIB * (st.L - t.s0) + 3 * tol) return Object.assign(o, { why: 'scribble' });
    if (o.off > TR.OFF) return Object.assign(o, { why: 'off' });
    o.s = t.s;
    if (t.s >= st.L - TR.END * tol) return Object.assign(o, { ok: true, why: '' });
    return Object.assign(o, { why: t.s - t.s0 >= TR.PART ? 'part' : 'tap', s: t.s - t.s0 >= TR.PART ? t.s : t.s0 });
  };
  return t;
};
// verdict for a whole list of finger points [[x, y], ...] on stroke st
TR.check = (st, pts, tol, s0 = 0) => {
  const t = TR.track(st, tol, s0);
  for (const [x, y] of pts) t.add(x, y);
  return t.res();
};
// the tolerance for this child: Pre-K 14, K and up 10 (or the question's own)
TR.tol = q => q.tol || (gradeOf() < 0 ? 14 : 10);

// ---- data checks (kind validate; tools/test.js adds the handwriting rules) ----
TR.glyphProblems = (set, key) => {
  const S0 = TRACE.sets[set], p = [];
  if (!S0) return ['trace: no set ' + set];
  const g = S0.glyphs[key];
  if (!g) return ['trace: no glyph ' + set + ' ' + key];
  if (!g.say) p.push('trace ' + key + ': no spoken name');
  if (!Array.isArray(g.s) || g.s.length < 1 || g.s.length > 4) return p.concat('trace ' + key + ': 1 to 4 strokes');
  g.s.forEach((s, i) => {
    const w = 'trace ' + key + ' stroke ' + (i + 1);
    if (!Array.isArray(s) || !s.length) { p.push(w + ': no points'); return; }
    for (const pt of s) {
      if (!Array.isArray(pt) || pt.length < 2 || pt.length > 3 || !pt.slice(0, 2).every(v => typeof v == 'number' && isFinite(v)))
        p.push(w + ': bad point ' + JSON.stringify(pt));
      else if (pt[0] < 0 || pt[0] > 100 || pt[1] < 0 || pt[1] > 100) p.push(w + ': point outside the box ' + pt);
      else if (pt.length == 3 && pt[2] !== 1) p.push(w + ': the third value of a point must be 1 (a corner)');
    }
    for (let k = 1; k < s.length; k++) if (Math.hypot(s[k][0] - s[k - 1][0], s[k][1] - s[k - 1][1]) < 2) p.push(w + ': two points closer than 2');
  });
  return p;
};
TR.qProblems = q => {
  const p = [];
  if (!q.set || !q.g) return ['trace: no set or glyph'];
  p.push(...TR.glyphProblems(q.set, q.g));
  if (q.ans !== 'done') p.push('trace: ans must be done');
  const ps = q.passes || [1, 2, 3];
  if (!Array.isArray(ps) || !ps.length || ps.some(v => ![1, 2, 3].includes(v))) p.push('trace: passes must be guide levels 1-3');
  if (q.tol != null && !(q.tol >= 4 && q.tol <= 25)) p.push('trace: tol out of range');
  return p;
};
TR.name = q => {
  const g = TR.glyph(q.set, q.g);
  return g ? g.say : String(q.g);
};

// ---- generator: skill 'trace' (level 1 digits in Tiny Town) ----
function genTrace(lv) {
  const set = TR.LV[lv] || 'digit', S0 = TRACE.sets[set], key = pick(S0.order), g = S0.glyphs[key];
  // spoken: "the little letter A" (a letter's name is its capital, as abc 1 says it); shown: "the little letter a" (P2-17)
  const what = S0.n + ' ' + g.say, shown = S0.n + ' ' + (set == 'digit' ? g.say : key);
  return pkQ({
    kind: 'trace', set, g: key, ans: 'done', passes: [1, 2, 3],
    html: `<div class="trq">${TR.pic(set, key)}</div>${pkTxt(`Trace the ${esc(shown)}.`)}`,
    say: `Let's write the ${what}! Watch, then trace it with your finger.`,
    hint: { k: 'trace' },
    label: `trace ${set} ${key}`,
  });
}
// the prompt picture: the glyph to copy, and for a digit its number of dots (zero: an empty face)
TR.pic = (set, key) => TR.glyphSVG(set, key, 'trq-g') + (set == 'digit' ? `<span class="trq-d">${VIZ.dots(+key, 'dice')}</span>` : '');
// a glyph drawn from its strokes (the same model the child traces, not the font's), cropped to its strokes and the set's lines
TR.glyphSVG = (set, key, cls) => {
  const geo = TR.geo(set, key), L = TRACE.sets[set].lines, xs = geo.s.flatMap(s => s.p.map(p => p[0]));
  const x0 = Math.floor(Math.min(...xs) - 6), x1 = Math.ceil(Math.max(...xs) + 6), y0 = L.top - 6, y1 = (L.desc || L.base) + 6;
  return `<svg class="${cls}" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" aria-hidden="true" focusable="false">`
    + geo.s.map(s => `<path d="${s.d}"/>`).join('') + '</svg>';
};
// a round: TR.N different glyphs of the level, in teaching order; each is genQ-reproducible (sk, lv, seed)
function traceRound(lv) {
  const order = TRACE.sets[TR.LV[lv] || 'digit'].order;
  const keys = shuffle(order.slice()).slice(0, TR.N).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return keys.map(k => {
    let q = null;
    for (let s = R(1, 2e9), t = 0; t < 400 && !(q && q.g === k); t++, s++) q = genQ('trace', lv, s >>> 0);
    return q;
  });
}

// ---- the board ----
const TR_SAY = {
  turn: 'Your turn! Start at the green dot.',
  p2: 'Great! Now trace the dots.',
  p3: 'Now you write it! Start at the green dot.',
  start: 'Start at the green dot.',
  off: 'Follow the arrow.',
  part: 'Keep going!',
  watch: 'Watch the pen.',
  lead: 'Follow the yellow ball.',
};
// markup of the input area: the board (svg in box units) with the handwriting lines, pass pips, glyph stars
TR.board = q => {
  const S0 = TRACE.sets[q.set], L = S0.lines, nm = esc(S0.n + ' ' + TR.name(q));
  const ln = (y, c) => `<line class="${c}" x1="0" y1="${y}" x2="100" y2="${y}"/>`;
  const lines = ln(L.top, 'tr-l') + ln(L.mid, 'tr-l tr-lm') + ln(L.base, 'tr-l tr-lb') + (L.desc ? ln(L.desc, 'tr-l tr-lm') : '');
  const pips = (q.passes || [1, 2, 3]).map((v, i) => `<i data-i="${i}"></i>`).join('');
  return `<div class="trw" id="trw" data-g="${esc(q.g)}"><svg class="trb" id="trb" viewBox="0 0 100 100" role="img" aria-label="Trace the ${nm}">`
    + `<g class="tr-ln" aria-hidden="true">${lines}</g><g id="trg"></g><g id="trd" class="tr-dn"></g><g id="trx"></g><g id="tri"></g>`
    + `<g id="tra"></g><g id="trs"></g><circle id="trp" class="tr-pen" r="4.4" cx="0" cy="0" style="display:none"/></svg>`
    + `<div class="tr-pips" aria-hidden="true">${pips}</div><div class="tr-stars" id="trst" aria-hidden="true"></div></div>`;
};
TR.stop = () => {
  const c = TR.cur;
  if (!c) return;
  c.dead = true;
  c.timers.forEach(clearTimeout);
  if (c.raf) cancelAnimationFrame(c.raf);
  TR.cur = null;
};
// a timeout that dies with the board
TR.later = (c, f, ms) => {
  const id = setTimeout(() => { if (!c.dead && TR.cur === c) f(); }, ms);
  c.timers.push(id);
  return id;
};
TR.bind = (q, st, submit) => {
  TR.stop();
  const svg = $('#trb');
  if (!svg) return;
  const geo = TR.geo(q.set, q.g);
  const c = TR.cur = {
    q, st, submit, svg, geo, tol: TR.tol(q), passes: q.passes || [1, 2, 3], pass: 0, level: 1, k: 0, part: 0,
    misses: 0, sm: 0, tier: 0, arr: false, ptr: null, busy: false, timers: [], raf: 0, anim: null, tok: 0, dead: false,
  };
  const play = svg.closest('.play');
  if (play) play.classList.add('tr-play');
  svg.onpointerdown = e => TR.down(c, e);
  svg.onpointermove = e => TR.move(c, e);
  svg.onpointerup = e => TR.up(c, e, false);
  svg.onpointercancel = e => TR.up(c, e, true);
  svg.onlostpointercapture = e => { if (c.ptr && c.ptr.id === e.pointerId) TR.up(c, e, true); };
  svg.oncontextmenu = e => e.preventDefault();
  TR.startPass(c, 0);
};
TR.startPass = (c, i) => {
  c.pass = i;
  c.level = c.passes[i];
  c.k = 0; c.part = 0; c.sm = 0; c.tier = 0; c.arr = false; c.busy = false;
  $('#trd').innerHTML = '';
  $$('.tr-pips i').forEach((e, j) => { e.className = j < i ? 'dn' : j == i ? 'on' : ''; });
  TR.draw(c);
  if (c.level == 1) {
    c.busy = true;
    const tok = c.tok;
    TR.later(c, () => c.busy && c.tok === tok && TR.demo(c, c.geo.s.map((_, j) => j), () => {
      c.busy = false;
      TR.draw(c);
      TR.bounce(c);
      if (i == 0) say(TR_SAY.turn, null, null, true);
    }), 700);
  } else {
    say(c.level == 2 ? TR_SAY.p2 : TR_SAY.p3);
    TR.bounce(c);
  }
};
// redraw guide, done strokes, arrows and start dots for the current state
TR.draw = c => {
  const st = c.geo.s, lv = c.level, k = c.k, ns = st.length;
  // guide: level 1 outlined strokes, level 2 dotted; tier 2 dots the stroke to trace even at level 3
  let g = '';
  st.forEach((s, j) => {
    if (lv == 1) g += `<path class="tr-band" d="${s.d}"/><path class="tr-bandi" d="${s.d}"/>`;
    else if (lv == 2 || (j == k && c.tier >= 2)) g += `<path class="tr-dot" d="${s.d}"/>`;
  });
  $('#trg').innerHTML = g;
  // done strokes of this pass, and the part of the current one already traced
  let d = '';
  for (let j = 0; j < Math.min(k, ns); j++) d += TR.fillHTML(st[j].d, j == k - 1 && c.justDone ? ' in' : '');
  if (k < ns && c.part > 0) d += TR.fillHTML(TR.partD(st[k], c.part), ' part');
  $('#trd').innerHTML = d;
  c.justDone = false;
  // arrows along the rest of the stroke to trace: all along it at level 1 (or after a miss / with the tier-1 hint), one at its
  // start at level 2; none while the tier-2 ball shows the way (levels 2 and 3)
  let a = '';
  const lead = c.tier >= 2 && lv > 1;
  if (k < ns && !st[k].dot && !lead && (lv <= 2 || c.arr || c.tier)) {
    const s = st[k], L = s.L, at = [], x0 = c.part + Math.min(13, (L - c.part) / 2);
    if (lv == 1 || c.arr || c.tier) for (let x = x0; x < L - 6 || !at.length; x += 24) at.push(x);
    else at.push(x0);
    a = at.map((x, i) => {
      const [px, py] = TR.at(s, x), [dx, dy] = TR.dir(s, x), ang = Math.atan2(dy, dx) * 180 / Math.PI;
      return `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${ang.toFixed(0)})"><path class="tr-arr" style="--i:${i}" d="M-2.2 -3.2L1.8 0L-2.2 3.2"/></g>`;
    }).join('');
  }
  $('#tra').innerHTML = a;
  // start dots: the stroke to trace (big, numbered); at level 1 also the later strokes (small), unless one sits on an earlier dot
  let sd = '';
  for (let j = ns - 1; j >= k; j--) {
    if (j > k && lv > 1) continue;
    const p0 = j == k && c.part > 0 ? TR.at(st[j], c.part) : st[j].p[0];
    const hidden = st.slice(k, j).some(o => Math.hypot(o.p[0][0] - p0[0], o.p[0][1] - p0[1]) < 9);
    if (j > k && hidden) continue;
    const on = j == k, r = on ? 6.4 : 4.6;
    sd += `<g class="tr-sd${on ? ' on' : ''}" data-j="${j}" transform="translate(${p0[0].toFixed(1)} ${p0[1].toFixed(1)})">`
      + `<g class="tr-sdi">${on ? '<circle class="tr-sdr" r="9"/>' : ''}<circle class="tr-sdc" r="${r}"/>`
      + (ns > 1 && !(on && c.part > 0) ? `<text class="tr-sdt${on ? '' : ' sm'}" y="0.35">${j + 1}</text>` : '') + '</g></g>';
  }
  $('#trs').innerHTML = sd;
};
TR.fillHTML = (d, cls) => `<path class="tr-fl${cls}" d="${d}" transform="translate(0 1.3)"/><path class="tr-f${cls}" d="${d}"/>`;
// a gentle one-time hop of the start dot (your turn)
TR.bounce = c => {
  const e = $('#trs .tr-sd.on .tr-sdi');
  if (!e) return;
  e.classList.remove('hop', 'pulse');
  void e.getBoundingClientRect();
  e.classList.add('hop');
};

// ---- animations (requestAnimationFrame, one at a time; TR.stop cancels) ----
TR.anim = (c, step, done) => {
  if (c.raf) cancelAnimationFrame(c.raf);
  const t0 = performance.now();
  const f = () => { // performance.now(), not the frame time: the smoke clock speeds up performance.now
    if (c.dead) return;
    if (step(performance.now() - t0)) c.raf = requestAnimationFrame(f);
    else { c.raf = 0; if (done) done(); }
  };
  c.raf = requestAnimationFrame(f);
};
TR.pen = (p, show) => {
  const e = $('#trp');
  if (!e) return;
  e.style.display = show ? '' : 'none';
  if (p) e.setAttribute('transform', `translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})`);
};
// the pen draws strokes js (indexes) in order: speed 60 units a second, a short rest between strokes; then fades
TR.demo = (c, js, done) => {
  const x = $('#trx'), st = c.geo.s, tok = ++c.tok;
  c.anim = 'demo';
  x.innerHTML = '';
  x.classList.remove('fade');
  let j = 0, path = null;
  const next = () => {
    if (c.tok !== tok) return;
    if (j >= js.length) {
      TR.pen(null, false);
      x.classList.add('fade');
      TR.later(c, () => {
        if (c.tok !== tok) return;
        x.innerHTML = '';
        x.classList.remove('fade');
        c.anim = null;
        if (done) done();
      }, 450);
      return;
    }
    const s = st[js[j]], dur = Math.max(500, s.L / 60 * 1000);
    x.insertAdjacentHTML('beforeend', `<path class="tr-demo" d="M${s.p[0][0]} ${s.p[0][1]}"/>`);
    path = x.lastElementChild;
    TR.anim(c, ms => {
      const u = Math.min(1, ms / dur), at = u * s.L;
      path.setAttribute('d', s.dot ? s.d : TR.partD(s, at));
      TR.pen(TR.at(s, at), true);
      return u < 1;
    }, () => { j++; TR.later(c, next, 260); });
  };
  next();
};
TR.stopAnim = c => {
  c.tok++; // pending steps of a demo see the new token and stop
  if (c.raf) cancelAnimationFrame(c.raf);
  c.raf = 0;
  c.anim = null;
  const x = $('#trx');
  if (x) x.innerHTML = '';
  TR.pen(null, false);
};
// tier 2: the yellow ball runs along the stroke (and back to its start), and while the finger traces it stays just ahead
TR.lead = c => {
  const s = c.geo.s[c.k];
  if (!s || s.dot) return;
  c.anim = 'lead';
  c.tok++;
  let auto = c.part, wait = 0, last = 0;
  TR.anim(c, ms => {
    const dt = Math.min(64, ms - last);
    last = ms;
    if (c.ptr && c.ptr.t) auto = Math.min(s.L, Math.max(auto - 0.5, c.ptr.t.s + 12));
    else if (wait > 0) { wait -= dt; if (wait <= 0) auto = c.part; }
    else { auto += dt / 1000 * 40; if (auto >= s.L) { auto = s.L; wait = 700; } }
    TR.pen(TR.at(s, auto), true);
    return true;
  });
};

// ---- the finger ----
TR.pt = (c, e) => {
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(c.inv);
  return [p.x, p.y];
};
TR.palm = e => e.pointerType == 'touch' && Math.max(e.width || 0, e.height || 0) > TR.PALM;
TR.down = (c, e) => {
  if (c.dead || c.st.lock || c.k >= c.geo.s.length) return;
  if (e.pointerType == 'mouse' && e.button !== 0) return;
  if (TR.palm(e)) return;
  e.preventDefault();
  c.inv = c.svg.getScreenCTM().inverse();
  const p = TR.pt(c, e), s = c.geo.s[c.k];
  const want = c.part > 0 ? TR.at(s, c.part) : s.p[0], dist = q => Math.hypot(q[0] - want[0], q[1] - want[1]);
  if (c.ptr) {
    // a second touch: take it instead only if the first has not moved and this one is nearer the dot (a palm came first)
    if (c.ptr.t.len < 3 && dist(p) < dist(c.ptr.p0)) TR.drop(c);
    else return;
  }
  if (c.busy || c.anim == 'demo') { TR.stopAnim(c); c.busy = false; TR.draw(c); }
  // carry on from a lifted trace, or start the stroke again from its start dot
  let s0 = 0;
  if (c.part > 0) {
    if (dist(p) <= TR.START * c.tol) s0 = c.part;
    else if (Math.hypot(p[0] - s.p[0][0], p[1] - s.p[0][1]) <= TR.START * c.tol) { c.part = 0; TR.draw(c); }
    else s0 = c.part;
  }
  const t = TR.track(s, c.tol, s0);
  t.add(p[0], p[1]);
  $('#tri').insertAdjacentHTML('beforeend', '<path class="tr-ink" d=""/>');
  c.ptr = { id: e.pointerId, t, p0: p, pts: [p], el: $('#tri').lastElementChild };
  try { c.svg.setPointerCapture(e.pointerId); } catch (er) { /* a synthetic pointer */ }
  TR.ink(c);
};
TR.move = (c, e) => {
  if (!c.ptr || c.ptr.id !== e.pointerId) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) {
    const p = TR.pt(c, ev);
    c.ptr.t.add(p[0], p[1]);
    c.ptr.pts.push(p);
  }
  TR.ink(c);
};
TR.ink = c => {
  const pts = c.ptr.pts;
  c.ptr.el.setAttribute('d', 'M' + pts.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join('L') + (pts.length == 1 ? 'h0' : ''));
};
// the finger's ink fades away (after a stroke is done, missed or dropped)
TR.fadeInk = (c, el) => {
  el.classList.add('fade');
  TR.later(c, () => el.remove(), 420);
};
TR.drop = c => {
  if (!c.ptr) return;
  TR.fadeInk(c, c.ptr.el);
  try { c.svg.releasePointerCapture(c.ptr.id); } catch (er) { /* already released */ }
  c.ptr = null;
};
TR.up = (c, e, cancel) => {
  if (!c.ptr || c.ptr.id !== e.pointerId || c.dead) return;
  const ptr = c.ptr;
  c.ptr = null;
  TR.fadeInk(c, ptr.el);
  if (cancel) return;
  TR.result(c, ptr.t.res());
};
// what a finished touch did
TR.result = (c, r) => {
  const st = c.geo.s;
  if (r.ok) {
    c.k++;
    c.part = 0; c.sm = 0; c.tier = 0; c.arr = false; c.justDone = true;
    TR.stopAnim(c);
    SFX.key(Math.min(9, c.k + c.pass * 2));
    TR.draw(c);
    if (c.k >= st.length) TR.passDone(c);
    else TR.bounce(c);
    return;
  }
  if (r.why == 'part') {
    c.part = r.s;
    TR.draw(c);
    if (c.tier >= 2) TR.lead(c);
    say(TR_SAY.part);
    return;
  }
  if (r.why == 'tap') {
    TR.pulse(c, false);
    return;
  }
  // a miss: never red. The dot pulses, the arrows run along the stroke, a soft sound and a tip; hints rise by themselves
  c.misses++;
  c.sm++;
  c.arr = true;
  SFX.del();
  if (c.sm >= 3 && c.tier < 2) TR.hintTier(c, 2);
  else if (c.sm == 2 && c.tier < 1) TR.hintTier(c, 1);
  else {
    TR.draw(c);
    if (c.tier >= 2) TR.lead(c);
    say(r.why == 'start' ? TR_SAY.start : TR_SAY.off);
  }
  TR.pulse(c, true);
};
// the start dot pulses; with arrows: they run along the stroke
TR.pulse = (c, arrows) => {
  const e = $('#trs .tr-sd.on .tr-sdi');
  if (e) { e.classList.remove('hop', 'pulse'); void e.getBoundingClientRect(); e.classList.add('pulse'); }
  if (arrows) $$('#tra .tr-arr').forEach(a => { a.classList.remove('go'); void a.getBoundingClientRect(); a.classList.add('go'); });
};
TR.passDone = c => {
  c.busy = true;
  const dn = $('#trd');
  dn.classList.remove('pop');
  void dn.getBoundingClientRect();
  dn.classList.add('pop');
  if (c.pass + 1 < c.passes.length) {
    SFX.magic();
    TR.later(c, () => TR.startPass(c, c.pass + 1), 1000);
  } else TR.later(c, () => TR.finish(c), 450);
};
// every pass traced: the glyph's stars, then the answer (fewer than 2 stars counts as a second try in the round)
TR.finish = c => {
  const stars = c.misses == 0 ? 3 : c.misses <= 2 ? 2 : 1;
  c.stars = stars;
  $$('.tr-pips i').forEach(e => { e.className = 'dn'; });
  const box = $('#trst');
  if (box) box.innerHTML = [0, 1, 2].map(i => `<span class="tr-star${i < stars ? ' lit' : ''}" style="--i:${i}">${ico('star', 40)}</span>`).join('');
  if (stars < 2 && !c.st.tries) c.st.tries = 1;
  TR.later(c, () => c.submit('done', null), 700);
};

// ---- hints: tier 1 the pen draws the stroke to trace, tier 2 a ball to follow over a dotted guide ----
TR.hintTier = (c, tier) => {
  c.tier = Math.max(c.tier, tier);
  c.arr = true;
  TR.stopAnim(c);
  TR.draw(c);
  if (c.tier >= 2) {
    say(TR_SAY.lead);
    TR.lead(c);
  } else {
    say(TR_SAY.watch);
    c.busy = true;
    TR.demo(c, [c.k], () => { c.busy = false; TR.draw(c); TR.bounce(c); });
  }
};
// hintHTML (39-hints.js) for kind trace: the hint happens on the board; the hint panel stays empty
TR.hint = q => {
  const c = TR.cur;
  if (!c || c.q !== q || c.dead || c.k >= c.geo.s.length) return '';
  TR.hintTier(c, Math.min(2, c.tier + 1));
  return '';
};
// the engine's reveal (never reached: a glyph always ends right) and retry: show the whole glyph / start the pass again
TR.reveal = () => {
  const c = TR.cur;
  if (c) TR.demo(c, c.geo.s.map((_, j) => j));
};
TR.retry = () => {
  const c = TR.cur;
  if (c) TR.startPass(c, c.pass);
};
// the entry of the question-kind registry (49-kinds.js: KIND.trace)
const TRK = {
  render: q => TR.board(q),
  bind: (q, st, submit) => TR.bind(q, st, submit),
  right: () => { const w = $('#trw'); if (w) w.classList.add('ok'); },
  retry: (q, st, ready) => { TR.retry(); if (ready) ready(); },
  reveal: () => TR.reveal(),
  spoken: q => TR.name(q),
  validate: q => TR.qProblems(q),
};
/* ---------- pet shop (stageHTML: the stage Pet Care draws, 56-petcare.js) ---------- */
// P4-12: the stage is the scene Home draws for the shop place (HM_SCENE, 46-home.js), so no emoji props; sc-<id> sets its sky
function stageHTML(sc,title,sub,sticky){const id=HM_SCENE[sc[0]]?sc[0]:'meadow';return`<div class="stage gx-stage sc-${id} ${id=='space'?'dark':''} ${sticky?'sticky':''}" id="stage">
  <svg class="gx-scene" viewBox="0 0 160 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${HM_SCENE[id]()}</svg>
  <div class="petbig ${petAura()}" id="pet">${petHTML()}</div><div class="hname">${title}</div>${sub?`<div class="htxt">${sub}</div>`:''}</div>`}

/* ---- P4-07 Pet Shop (DESIGN_SYSTEM 6.4; CSS 43-shop.css): a stage with the pet wearing what is tried on, an info bar with one
   action, tabs, cards with drawn items (17-wear.js). Owned: a tap puts it on / takes it off; not owned: a tap tries it on, Buy asks
   first (a sheet). Saved data as before: S.coins, S.owned[id] = 1, S.wear.hat / .toy / .scene = id. ---- */
let shopTab = 'hat', shopSel = null; // the open tab, and the item being tried on (null: what the pet wears)
// a tab's items: [id, price] (+ 'boss' for a prize hat the child won); scenes [id, price, emoji, css, name]
const shopItems = t => t == 'hat' ? SHOP.hat.concat(BPRIZE.filter(h => S.owned[h]).map(h => [h, 0, 'boss'])) : SHOP[t];
const shopName = (t, it) => t == 'scene' ? it[4] : wearName(it[0]);
const shopOwn = it => !!S.owned[it[0]] || it[1] == 0 || ['hat', 'toy', 'scene'].some(k => S.wear[k] == it[0]); // a free place (the meadow) and what the pet wears are yours
const shopOn = (t, id) => t == 'scene' ? (S.wear.scene || 'meadow') == id : S.wear[t] == id;
// an item's picture: the drawing, or the place as a small scene
const shopPic = (t, id, size) => t == 'scene' ? `<span class="ps-scn sc-${esc(id)}">${hmScene(id)}</span>` : wearPic(id, size);

function shop() {
  const t = shopTab, items = shopItems(t), it = shopSel && items.find(x => x[0] == shopSel), w = S.wear;
  const pv = { hat: w.hat, toy: w.toy, scene: w.scene };
  if (it) pv[t] = it[0];
  const pet = petSVG(S.pet, stage(), 'happy', { hat: wearOf(pv.hat), toy: wearOf(pv.toy), react: true });
  // the info bar: the item tried on, what it costs or that it is the child's, and one action (#psact)
  let info;
  if (!it) info = `<div class="ps-it"><div class="ps-itt"><b>${esc(petN())}</b><span>Tap an item to try it on!</span></div></div>`;
  else {
    const nm = esc(shopName(t, it)), on = shopOn(t, it[0]), own = shopOwn(it), need = it[1] - S.coins;
    const line = on ? (t == 'scene' ? `${esc(petN())} lives here now.` : `${esc(petN())} is wearing it.`) : own ? 'It is yours.'
      : `${ico('coin', 22, 'ic-coin')}<span>${it[1]} coins</span>`;
    const act = on ? (t == 'scene' ? '' : UI.btn('Take it off', { icon: 'close', id: 'psact' }))
      : own ? UI.btn('Put it on', { kind: 'primary', icon: 'check', id: 'psact' })
      : need > 0 ? UI.btn(`Need ${need} more`, { icon: 'coin', id: 'psact', cls: 'ps-short' })
      : UI.btn('Buy', { kind: 'primary', icon: 'bag', id: 'psact' });
    info = `<div class="ps-it"><span class="ps-itp">${shopPic(t, it[0], '48px')}</span><div class="ps-itt"><b>${nm}</b>` +
      `<span class="ps-line">${line}</span></div>${act}</div>`;
  }
  const tabs = [['hat', 'hat', 'Hats'], ['toy', 'teddy', 'Toys'], ['scene', 'image', 'Places']].map(([k, ic, l]) =>
    `<button class="btn sm tab ps-tab${k == t ? ' on' : ''}" data-t="${k}" aria-pressed="${k == t}">${ico(ic, 26)}<span>${l}</span></button>`).join('');
  const cards = items.map(x => {
    const id = x[0], own = shopOwn(x), on = shopOn(t, id), nm = shopName(t, x);
    const tag = on ? `<span class="ps-tag on">${ico('check', 18)}On</span>` : x[2] == 'boss' ? `<span class="ps-tag ps-prize">${ico('crown', 18)}Prize</span>`
      : own ? `<span class="ps-tag">Yours</span>` : `<span class="ps-pr${S.coins < x[1] ? ' short' : ''}">${ico('coin', 22, 'ic-coin')}<b>${x[1]}</b></span>`;
    const say = nm + (on ? ', on' : own ? ', yours' : ', ' + x[1] + ' coins');
    return `<button class="btn item ps-card${own ? ' own' : ''}${on ? ' wear' : ''}${id == shopSel ? ' sel' : ''}" data-id="${esc(id)}" ` +
      `aria-label="${esc(say)}"><span class="ps-pic">${shopPic(t, id, '64px')}</span><span class="ps-nm">${esc(nm)}</span>${tag}</button>`;
  }).join('');
  view(`<div class="top tbar gx-mtop s-play">${UI.ibtn('back', 'Back', { size: 'sm', id: 'back' })}` +
    `<div class="ttl gx-ttl"><span class="gx-tb">${ico('bag', 24)}</span><span>Pet Shop</span></div>${UI.chip('coin', S.coins, { id: 'coinc', aria: 'Coins' })}</div>
  <div class="scroll ps-scroll"><div class="ps"><div class="ps-hold"><div class="ps-stage sc-${esc(pv.scene || 'meadow')}" id="stage">${hmScene(pv.scene)}` +
    `<div class="petbig rig" id="pet"><span class="petwrap">${pet}</span></div></div>${info}</div>` +
    `<div class="ps-shelf"><div class="tabs ps-tabs">${tabs}</div><div class="shopgrid ps-grid">${cards}</div></div></div></div>`);
  $('#back').onclick = () => { shopSel = null; home(true); };
  $$('.tab').forEach(b => b.onclick = () => { shopTab = b.dataset.t; shopSel = null; SFX.pop(1); shop(); });
  $$('.item').forEach(b => b.onclick = () => shopTap(b));
  const a = $('#psact');
  if (a) a.onclick = () => {
    if (!shopOn(t, it[0]) && !shopOwn(it)) return shopBuy(it, a);
    shopWear(it[0]);
  };
}

// a card: owned -> put on / take off; not owned -> try it on (the pet wears it on the stage until another tap)
function shopTap(b) {
  const id = b.dataset.id, it = shopItems(shopTab).find(x => x[0] == id);
  if (!it) return;
  if (shopOwn(it)) return shopWear(id);
  shopSel = id;
  SFX.pop(4);
  shop();
  anim($('#pet'), 'jump');
}

// put an owned item on, or take it off when it is on (a place stays: the pet always has one)
function shopWear(id) {
  const t = shopTab;
  if (t == 'scene') { S.owned[id] = 1; S.wear.scene = id; shopSel = id; }
  else if (S.wear[t] == id) { S.wear[t] = ''; shopSel = null; }
  else { S.wear[t] = id; shopSel = id; }
  save();
  SFX.pop(2);
  shop();
  anim($('#pet'), 'jump');
  if (S.voice && Math.random() < .5) say(pick(['I love it!', 'So cool!', 'Thank you!', 'Looking good!']));
}

// buy: not enough coins says how many more; else a sheet asks first ("Yes, buy it" #psyes / "Not now" #psno)
function shopBuy(it, btn) {
  const t = shopTab, need = it[1] - S.coins, nm = shopName(t, it);
  if (need > 0) { SFX.wrong(); anim(btn, 'sad'); fb(`Need ${need} more coins! Finish a round to earn some.`, 'warn'); return; }
  SFX.pop(3);
  const sh = UI.sheet(`<div class="ps-sheet"><div class="ps-big">${shopPic(t, it[0], '120px')}</div>` +
    `<h2>Buy the ${esc(nm.toLowerCase())}?</h2><p>It costs ${it[1]} coins. You will have ${S.coins - it[1]} left.</p>` +
    `<div class="acts">${UI.btn('Yes, buy it', { kind: 'primary', size: 'lg', wide: true, icon: 'bag', id: 'psyes' })}` +
    `${UI.btn('Not now', { wide: true, id: 'psno' })}</div></div>`);
  sh.el.querySelector('#psno').onclick = () => sh.close();
  sh.el.querySelector('#psyes').onclick = () => {
    sh.close();
    if (S.coins < it[1] || S.owned[it[0]]) return; // a double tap
    S.coins -= it[1];
    S.owned[it[0]] = 1;
    if (t == 'scene') S.wear.scene = it[0]; else S.wear[t] = it[0];
    shopSel = it[0];
    save();
    SFX.coin(0); setTimeout(() => SFX.coin(4), 120); setTimeout(() => SFX.magic(), 260);
    shop();
    const c = $('#coinc');
    if (c) { c.classList.add('bump'); }
    anim($('#pet'), 'jump');
    RW.burst($('#stage'), 22);
    if (S.voice) say(pick(['I love it!', 'So cool!', 'Thank you!', 'Looking good!']));
  };
}
/* ---------- question kinds (P1-02) ---------- */
/* A question is a plain object made by a generator (via genQ). Fields every kind uses:
     kind   'num' | 'choice' | 'build' | 'multi' | 'order' | 'match' | 'tap' | 'spell' | 'trace'   picks the entry in KIND below
     html   prompt HTML (trusted; generators escape their own text)
     ans    the right answer; compared as String(value) === String(q.ans)
     say    text read by "Hear it"; auto: true | 'must' reads it on show; lang/afterLang 'es' for Spanish voice
     label  short id of the fact (miss tracking); hint {k, ...} for hintHTML; after: text said after the answer
     sk, lv, seed   stamped by genQ
   Kind fields:
     num     html holds one SLOT (span#slot); ans is a whole number as a string ('12')
     choice  choices [{v, l, h}]: v value, l label, h true when l is HTML; cls extra class on .choices;
             ans is one of the v values; html may hold a SLOT that shows the picked answer
     build   word, tiles (letters, shuffled, at least word.length); html holds span#ls0..#ls(n-1) in .lslots
     match   items [{v,l,h}] and opts [{v,l,h}] (shuffled), 3 to 5 each, same v set; ans = sorted v joined by '|'
     tap     html has elements with data-v; tapping one submits it; ans is one of the values; ansSay optional
     spell   word, lang ('es' adds ñ á é í ó ú ü), html has .lslots span#ls0.. plus a visible picture or clue; in-app keyboard
     (the full field notes for these three sit above each entry at the end of KIND)
   P1-03 kind fields:
     num     also (all optional): pad 'int' (default) | 'dec' (adds .) | 'neg' (adds +/-) | 'frac' (two slots, ans '3/4');
             sep 'R' (two slots, ans '9R2') | 'mix' (three slots, ans '2 1/2') | 'xy' (two slots, ans '3,5', P2-12 coordinates); eq 'value' compares numerically
             (0.50 = .5, 2/4 = 1/2) instead of exact text; max digits per slot (default 4, up to 9).
             html holds SLOT, or SLOT_FRAC / SLOT_R / SLOT_MIX (ids slot, slot2, slot3). The check key moves to the
             next slot first and submits from the last one; del steps back across the separator.
     multi   choose all that apply: choices [{v, l, h}], ans = array of the right v values sorted as text
             (kindSort); cls extra class. A Check button submits the picked values (sorted array).
     order   tap tiles into slots in order: items [{v, l, h}] (shown in this order, so shuffle them; extra
             distractors are allowed), ans = array of v values in the right order. Tap a filled slot to take it back.
   Optional K.same(q, v) says whether the submitted value v is right; without it the engine compares
   String(v) === String(q.ans). num (eq 'value'), multi and order define it.
   Contract of a kind K = KIND[q.kind]:
     K.render(q)              HTML of the input area (goes inside .inp)
     K.bind(q, st, submit, o) wires the input. st is the screen state (G in a round, RC in Speed Race): it holds
                              st.lock (ignore taps while true) and the kind's own fields (num: st.typed, build: st.built).
                              Calls submit(value, el); el is the tapped button, or null when the answer sits in a slot.
                              o: {max: digits (4), auto: submit as soon as the typed answer is right, quiet: no del sound/bump}
     K.right(q)               marks the answer area right
     K.retry(q, st, ready)    resets the input after a first wrong try; calls ready() if it finishes later (build)
     K.reveal(q)              shows the right answer after the last wrong try
     K.spoken(q)              what is said when the answer is revealed (when q.after is not set)
     K.validate(q)            list of problems (strings); used by tools/test.js
   A new kind adds KIND.name = {...} with all of these. kindProblems(q) also catches an unknown kind. */
// P4-10: the pad is the P4-04 key component (.keys > .key); .pad, .k[data-k], .del, .go and .x stay as the hooks code and tests use.
// extra: '' | '.' | 'neg'; next: true when the check key first moves to the next slot (several slots).
function padHTML(extra,next){
  const key=(k,face,cls,aria)=>`<button class="key k${cls?' '+cls:''}" data-k="${k}"${aria?` aria-label="${aria}"`:''}>${face}</button>`;
  return '<div class="keys qpad pad">'+[1,2,3,4,5,6,7,8,9].map(n=>key(n,n)).join('')
    +key('del',ico('backspace'),'del','Delete')+key(0,0)+key('go',ico(next?'go':'check'),'go',next?'Next box':'Check')
    +(extra=='.'?key('.','.','x','Point'):extra=='neg'?key('neg','±','x','Plus or minus'):'')+'</div>';
}
const PAD_HTML=padHTML('');

const KIND={
  num:{
    // pad: int (default), dec, neg, frac; sep 'R' or 'mix'; see the header. Several slots share st.typed, parts joined by the separators
    render(q){
      const pad=q.pad||'int';
      return padHTML(pad=='dec'?'.':pad=='neg'?'neg':'',numSeps(q).length>0);
    },
    bind(q,st,submit,o={}){
      const max=o.max||q.max||4,seps=numSeps(q),K=KIND.num;
      $$('.k').forEach(b=>b.onclick=()=>{
        if(st.lock)return;
        const k=b.dataset.k,parts=numParts(st.typed,seps),last=parts[parts.length-1];
        if(k=='del'){
          st.typed=st.typed.slice(0,-1);
          if(!o.quiet)SFX.del();
        }
        else if(k=='go'){
          if(/\d/.test(last)){
            // not on the last slot yet: move to the next one; on the last slot: submit
            if(parts.length<=seps.length){st.typed+=seps[parts.length-1];SFX.pop(1)}
            else submit(st.typed,null);
          }
        }
        else if(k=='.'){
          if(!last.includes('.')&&last.replace(/\D/g,'').length<max){
            st.typed+=last.replace('-','')?'.':'0.';
            SFX.key(0);
          }
        }
        else if(k=='neg'){
          const head=st.typed.slice(0,st.typed.length-last.length);
          st.typed=head+(last[0]=='-'?last.slice(1):'-'+last);
          SFX.key(0);
        }
        else if(last.replace(/\D/g,'').length<max){
          st.typed+=k;
          SFX.key(+k);
        }
        // once submit has locked the question (right answer or reveal), the slot belongs to the engine: do not overwrite it
        if(st.lock&&k=='go')return;
        const at=K.draw(q,st,seps);
        if(!o.quiet)bump(at);
        if(o.auto&&st.typed==q.ans)submit(st.typed,null);
      });
    },
    // show the typed parts in the slots, mark the active one, label the check key; returns the active slot selector
    draw(q,st,seps){
      const parts=numParts(st.typed,seps),at='#slot'+(parts.length>1?parts.length:'');
      parts.forEach((t,i)=>{$('#slot'+(i?i+1:'')).textContent=t});
      for(let i=parts.length;i<=seps.length;i++)$('#slot'+(i+1)).textContent='';
      if(seps.length){
        $$('.slot').forEach(s=>s.classList.toggle('sl-on','#'+s.id==at));
        const go=$('.k.go'),last=parts.length>seps.length;
        if(go&&go.dataset.last!==String(last)){
          go.dataset.last=last;
          go.innerHTML=ico(last?'check':'go');
          go.setAttribute('aria-label',last?'Check':'Next box');
        }
      }
      return at;
    },
    same(q,v){
      return q.eq=='value'?numEq(String(v),String(q.ans)):String(v)===String(q.ans);
    },
    right(q){
      $$('.slot').forEach(s=>{s.classList.remove('sl-on');s.classList.add('ok')});
    },
    retry(q,st){
      st.typed='';
      KIND.num.draw(q,st,numSeps(q));
    },
    reveal(q){
      numParts(q.ans,numSeps(q)).forEach((t,i)=>{
        const s=$('#slot'+(i?i+1:''));
        s.textContent=t;
        s.className='slot rev';
      });
    },
    spoken:q=>`The answer is ${q.ans}`,
    validate(q){
      const p=[],pad=q.pad||'int',seps=numSeps(q),a=q.ans;
      if(!['int','dec','neg','frac'].includes(pad))p.push('num: bad pad '+pad);
      if(q.sep!=null&&!['R','mix','xy'].includes(q.sep))p.push('num: bad sep '+q.sep);
      if(q.eq!=null&&q.eq!=='value')p.push('num: bad eq '+q.eq);
      if(q.max!=null&&!(Number.isInteger(q.max)&&q.max>=1&&q.max<=9))p.push('num: max must be 1 to 9');
      const shape=q.sep=='R'?/^\d+R\d+$/:q.sep=='xy'?/^\d+,\d+$/:q.sep=='mix'?/^\d+ \d+\/[1-9]\d*$/:pad=='frac'?/^\d+\/[1-9]\d*$/
        :pad=='neg'?/^(0|-?[1-9]\d*)$/:pad=='dec'?/^-?(0|[1-9]\d*)(\.\d+)?$/:/^\d+$/;
      if(typeof a!=='string'||!shape.test(a)||(pad=='int'&&!q.sep&&String(+a)!==a))p.push('num: ans must look like the pad, got '+a);
      else if(q.max!=null&&numParts(a,seps).some(t=>t.replace(/\D/g,'').length>q.max))p.push('num: ans longer than max');
      for(let i=0;i<=seps.length;i++)if(!(q.html||'').includes(`id="slot${i?i+1:''}"`))p.push('num: html has no slot'+(i?i+1:''));

    },
  },

  choice:{
    render:q=>`<div class="choices ${q.cls||''}">`

    bind(q,st,submit){
      $$('.ch').forEach(b=>b.onclick=()=>submit(q.choices[b.dataset.i].v,b));
    },
    right(q){
      const s=$('#slot');
      if(s){

        s.classList.add('ok');
      }
    },
    retry(){},
    reveal(q){
      $$('.ch').forEach(b=>{if(q.choices[b.dataset.i].v==q.ans)b.classList.add('right')});

    },
    spoken:q=>q.ans,

      if(!Array.isArray(q.choices))return['choice: no choices'];

      if(new Set(vs.map(String)).size!==vs.length)p.push('choice: duplicate values');
      if(q.choices.some(c=>!c||c.v==null||c.l==null||c.l===''))p.push('choice: a choice has no v or l');
      return p;
    },
  },

  build:{
    render:q=>`<div class="tiles">${q.tiles.map((t,i)=>`<button class="piece lt" data-i="${i}">${t}</button>`).join('')}</div>`

    bind(q,st,submit){
      const K=KIND.build;
      $$('.lt').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i;

        st.built.push(i);
        SFX.pop(st.built.length);

      });

      $$('.lt').forEach(b=>{

      });
    },
    right(){

    },
    // keep the right start of the word, drop the rest after a short pause
    retry(q,st,ready){
      let k=0;

    },
    reveal(q){

    },
    spoken:q=>q.ans,

  match:{

      const btn=(s,i)=>$(`.mb[data-s="${s}"][data-i="${i}"]`);

        if(st.lock||b.classList.contains('done'))return;

        const a=btn(sel.s,sel.i);

          st.mDone.push(pool(s)[i].v);

          if(st.mDone.length==q.items.length)submit(q.ans,b);
        }
        else{
          [a,b].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake','bad')});
          setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad')),600);

        }
      });
    },
    right(){
      const m=$('.mt');
      if(m)m.classList.add('ok');
    },
    // keep the pairs already found, clear any half-made choice
    retry(q,st){

    },

    reveal(q){

      const n=q.items.length;

      for(const c of q.items.concat(q.opts))if(!c||c.v==null||c.l==null||c.l==='')p.push('match: an entry has no v or l');

  //        ansSay (optional) is what is said on reveal.
  tap:{
    render:()=>'',

    right(q){

    },
    retry(){},
    reveal(q){

    spoken:q=>q.ansSay||String(q.ans),
    validate(q){

      if(vs.length<2)p.push('tap: html needs at least 2 elements with data-v');
      if(new Set(vs).size!==vs.length)p.push('tap: duplicate data-v values');
      if(!vs.includes(String(q.ans)))p.push('tap: ans is not one of the data-v values');
      return p;
    },
  },

  // spell  word (lowercase letters; a-z, plus ñ á é í ó ú ü when lang is 'es'); lang 'es' adds the accent row;
  //        ans = word; html holds .lslots with span.ls#ls0..#ls(n-1) like build AND something visible (a picture or a
  //        clue), since speech may be missing; say = the word (spoken by "Hear it"); hint should be {k:'say', w, s}.
  //        Typing happens on the in-app keyboard only; st.typed is the letters so far.
  spell:{
    ROWS:['qwertyuiop','asdfghjkl','zxcvbnm'],
    render:q=>{
      const key=c=>`<button class="key sk" data-ch="${c}">${c}</button>`;
      const rows=KIND.spell.ROWS.map((r,i)=>`<div class="skr">${[...r].map(key).join('')}`
        +(i==2?`<button class="key sk wide del" data-ch="del" aria-label="Delete">${ico('backspace',28)}</button>`:'')+'</div>').join('');
      const es=q.lang=='es'?`<div class="skr">${[...'ñáéíóúü¿¡'].map(key).join('')}</div>`:'';
      return `<div class="sks">${rows}${es}</div>`;
    },
    bind(q,st,submit){
      const K=KIND.spell;
      $$('.sk').forEach(b=>b.onclick=()=>{
        if(st.lock)return;
        const c=b.dataset.ch;
        if(c=='del'){
          if(!st.typed)return;
          st.typed=st.typed.slice(0,-1);
          SFX.del();
        }
        else{
          if(st.typed.length>=q.word.length)return;
          st.typed+=c;
          SFX.pop(st.typed.length);
        }
        K.draw(q,st);
        if(st.typed.length==q.word.length)submit(st.typed,null);
      });
    },
    draw(q,st){
      [...q.word].forEach((_,i)=>{$('#ls'+i).textContent=st.typed[i]||''});
    },
    right(){
      $$('.ls').forEach(s=>s.classList.add('ok'));
    },
    // keep the right start of the word, drop the rest after a short pause
    retry(q,st,ready){
      let k=0;
      while(k<st.typed.length&&st.typed[k]==q.word[k])k++;
      st.lock=true;
      setTimeout(()=>{
        if(st.dead)return;
        st.lock=false;
        st.typed=st.typed.slice(0,k);
        KIND.spell.draw(q,st);
        if(ready)ready();
      },500);
    },
    reveal(q){
      [...q.word].forEach((c,i)=>{$('#ls'+i).textContent=c});
    },
    spoken:q=>q.ans,
    validate(q){
      const p=[];
      if(typeof q.word!=='string'||!q.word)return['spell: no word'];
      const okc=q.lang=='es'?/^[a-zñáéíóúü¿¡]+$/:/^[a-z]+$/;
      if(!okc.test(q.word))p.push('spell: word has letters the keyboard does not have: '+q.word);
      if(q.word.length>12)p.push('spell: word longer than 12 letters');
      if(q.ans!==q.word)p.push('spell: ans is not the word');
      if(typeof q.say!=='string'||!q.say)p.push('spell: no say (the word to speak)');
      const h=q.html||'';
      for(let i=0;i<q.word.length;i++)if(!h.includes(`id="ls${i}"`)){p.push('spell: html has no slot ls'+i);break}
      if(!/class="[^"]*\blslots\b/.test(h))p.push('spell: html has no .lslots');
      const rest=h.replace(/<span[^>]*id="ls\d+"[^>]*><\/span>/g,'');
      if(!rest.replace(/<[^>]*>/g,'').trim()&&!/<svg|<img/.test(rest))p.push('spell: html shows no picture or clue (speech may be off)');
      if(q.hint&&q.hint.k=='next')p.push('spell: hint k "next" is for build; use {k:"say"}');
      return p;
    },
  },

  // ---- P1-03 kinds: multi (choose all that apply), order (tap tiles into order) ----
  multi:{
    render:q=>`<div class="choices mchoices ${q.cls||''}">`
      +q.choices.map((c,i)=>`<button class="choice ch mc" data-i="${i}" aria-pressed="false">`
        +`<span class="mk">${ico('check',22)}</span><span class="ml">${c.h?c.l:esc(c.l)}</span></button>`).join('')+'</div>'
      +UI.btn('Check',{kind:'primary',icon:'check',id:'mcheck',cls:'mgo',off:true}),
    bind(q,st,submit){
      const K=KIND.multi;
      st.sel=[];
      $$('.mc').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i;
        if(st.lock)return;
        const at=st.sel.indexOf(i);
        if(at<0)st.sel.push(i);
        else st.sel.splice(at,1);
        SFX.pop(2);
        K.draw(q,st);
      });
      $('#mcheck').onclick=()=>{
        if(!st.lock&&st.sel.length)submit(kindSort(st.sel.map(i=>q.choices[i].v)),null);
      };
    },
    // picked choices marked (tick and outline, not colour alone); Check needs at least one
    draw(q,st){
      $$('.mc').forEach(b=>{
        const on=st.sel.includes(+b.dataset.i);
        b.classList.toggle('on',on);
        b.setAttribute('aria-pressed',on);
      });
      $('#mcheck').disabled=!st.sel.length;
    },
    same:(q,v)=>Array.isArray(v)&&v.map(String).join('\u0001')===q.ans.map(String).join('\u0001'),
    right(q){
      $$('.mc.on').forEach(b=>b.classList.add('right'));
    },
    retry(q,st){
      st.sel=[];
      KIND.multi.draw(q,st);
    },
    reveal(q){
      $$('.mc').forEach(b=>{
        const isRight=q.ans.map(String).includes(String(q.choices[b.dataset.i].v));
        b.classList.toggle('right',isRight);
        b.classList.toggle('wrong',!isRight&&b.classList.contains('on'));
        b.disabled=true;
      });
      $('#mcheck').disabled=true;
    },
    spoken:q=>'The answers are '+q.ans.map(v=>kindLabel(q.choices,v)).join(', '),
    validate(q){
      const p=[];
      if(!Array.isArray(q.choices)||q.choices.length<2||q.choices.length>8)return['multi: needs 2 to 8 choices'];
      const vs=q.choices.map(c=>c&&c.v);
      if(new Set(vs.map(String)).size!==vs.length)p.push('multi: duplicate values');
      if(q.choices.some(c=>!c||c.v==null||c.l==null||c.l===''))p.push('multi: a choice has no v or l');
      if(!Array.isArray(q.ans)||!q.ans.length)return p.concat('multi: ans must be a non-empty array');
      if(new Set(q.ans.map(String)).size!==q.ans.length)p.push('multi: duplicate values in ans');
      if(q.ans.some(a=>!vs.map(String).includes(String(a))))p.push('multi: an ans value is not in choices');
      if(kindSort(q.ans).map(String).join()!==q.ans.map(String).join())p.push('multi: ans is not sorted');
      return p;
    },
  },

  order:{
    render:q=>`<div class="oslots">${q.ans.map((_,i)=>`<button class="socket os" data-s="${i}" aria-label="Place ${i+1}"></button>`).join('')}</div>`
      +`<div class="tiles otiles">${q.items.map((t,i)=>`<button class="piece ot" data-i="${i}">${t.h?t.l:esc(t.l)}</button>`).join('')}</div>`,
    bind(q,st,submit){
      const K=KIND.order;
      st.ord=[];
      $$('.ot').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i;
        if(st.lock||st.ord.includes(i)||st.ord.length>=q.ans.length)return;
        st.ord.push(i);
        SFX.pop(st.ord.length);
        K.draw(q,st);
        if(st.ord.length==q.ans.length)submit(st.ord.map(j=>q.items[j].v),null);
      });
      $$('.os').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.s;
        if(st.lock||i>=st.ord.length)return;
        st.ord.splice(i,1);
        SFX.del();
        K.draw(q,st);
      });
    },
    draw(q,st){
      $$('.os').forEach((b,i)=>{
        const t=q.items[st.ord[i]];
        b.innerHTML=t?(t.h?t.l:esc(t.l)):'';
        b.classList.toggle('full',!!t);
      });
      $$('.ot').forEach(b=>b.classList.toggle('used',st.ord.includes(+b.dataset.i)));
    },
    same:(q,v)=>Array.isArray(v)&&v.map(String).join('\u0001')===q.ans.map(String).join('\u0001'),
    right(){
      $$('.os').forEach(b=>b.classList.add('ok'));
    },
    // keep the right start of the order, drop the rest after a short pause
    retry(q,st,ready){
      let k=0;
      while(k<st.ord.length&&String(q.items[st.ord[k]].v)===String(q.ans[k]))k++;
      st.lock=true;
      setTimeout(()=>{
        if(st.dead)return;
        st.lock=false;
        st.ord=st.ord.slice(0,k);
        KIND.order.draw(q,st);
        if(ready)ready();
      },500);
    },
    reveal(q){
      $$('.os').forEach((b,i)=>{
        const t=q.items.find(x=>String(x.v)===String(q.ans[i]));
        b.innerHTML=t.h?t.l:esc(t.l);
        b.classList.add('full','rev');
      });
    },
    spoken:q=>q.ans.map(v=>kindLabel(q.items,v)).join(', '),
    validate(q){
      const p=[];
      if(!Array.isArray(q.items)||!q.items.length)return['order: no items'];
      if(q.items.length>14)p.push('order: too many items');
      if(q.items.some(t=>!t||t.v==null||t.l==null||t.l===''))p.push('order: an item has no v or l');
      if(!Array.isArray(q.ans)||q.ans.length<2||q.ans.length>12)return p.concat('order: ans must be an array of 2 to 12 values');
      if(q.items.length<q.ans.length)p.push('order: fewer items than ans');
      const left=q.items.map(t=>t&&String(t.v));
      for(const a of q.ans){
        const i=left.indexOf(String(a));
        if(i<0){p.push('order: items cannot make ans');break}
        left.splice(i,1);
      }
      return p;
    },
  },
  // P2-16 tracing: set, g (glyph), ans 'done', passes; the engine and its field notes are in 47-trace.js
  trace:TRK,
};

// problems with a question as seen by its kind; an unknown kind is a problem too
function kindProblems(q){
  const K=q&&Object.prototype.hasOwnProperty.call(KIND,q.kind)&&KIND[q.kind];
  if(!K)return['unknown kind '+(q&&q.kind)];
  return K.validate(q);
}

// slot markup for num questions with more than one slot (put it in q.html where the answer goes)
const SLOT_FRAC='<span class="fslot"><span class="slot" id="slot"></span><span class="fbar"></span><span class="slot" id="slot2"></span></span>';
const SLOT_R='<span class="slot" id="slot"></span><span class="rsep">R</span><span class="slot" id="slot2"></span>';
const SLOT_MIX='<span class="slot" id="slot"></span><span class="fslot"><span class="slot" id="slot2"></span><span class="fbar"></span>'
  +'<span class="slot" id="slot3"></span></span>';
// separators between the slots of a num question, in order; none for a plain pad
function numSeps(q){
  return q.sep=='mix'?[' ','/']:q.sep=='R'?['R']:q.sep=='xy'?[',']:q.pad=='frac'?['/']:[];
}
// split typed text into one string per slot
function numParts(t,seps){
  const parts=[''];
  let n=0;
  for(const c of t){
    if(n<seps.length&&c===seps[n]){parts.push('');n++}
    else parts[n]+=c;
  }
  return parts;
}
// exact value of '-1.50', '3/4' or '2 1/2' as [numerator, denominator] BigInts, or null
function numRat(s){
  let m=/^(-?)(\d*)(?:\.(\d*))?$/.exec(s);
  if(m&&/\d/.test(s)){
    const f=m[3]||'';
    return[BigInt(m[1]+(m[2]+f)),10n**BigInt(f.length)];
  }
  m=/^(-?\d+)\/(\d+)$/.exec(s);
  if(m&&BigInt(m[2])>0n)return[BigInt(m[1]),BigInt(m[2])];
  m=/^(\d+) (\d+)\/(\d+)$/.exec(s);
  if(m&&BigInt(m[3])>0n)return[BigInt(m[1])*BigInt(m[3])+BigInt(m[2]),BigInt(m[3])];
  return null;
}
// numeric equality of two answer strings (0.50 = .5, 2/4 = 1/2); 'R' answers compare part by part
function numEq(a,b){
  const pa=a.split('R'),pb=b.split('R');
  if(pa.length!==pb.length)return false;
  return pa.every((t,i)=>{
    const x=numRat(t),y=numRat(pb[i]);
    return !!x&&!!y&&x[0]*y[1]===y[0]*x[1];
  });
}
// sort values as text: the order of q.ans for multi
function kindSort(a){
  return[...a].sort((x,y)=>String(x)<String(y)?-1:String(x)>String(y)?1:0);
}
// plain-text label of the choice or item with value v (for speech)
function kindLabel(list,v){
  const c=list.find(x=>String(x.v)===String(v));
  return c?(c.h?c.l.replace(/<[^>]*>/g,''):c.l):String(v);
}
