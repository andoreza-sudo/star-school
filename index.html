.chip small{font-size:13px;color:var(--muted)}.chip.on{outline:4px solid #3b82f6;transform:translateY(-3px)}
.cbpal.fp .chip{min-width:52px;padding:6px}
@media (orientation:landscape){.cbwrap{flex-direction:row;justify-content:center;align-items:center}.cbpal{flex-direction:column;flex-wrap:wrap;max-height:calc(100vh - 80px);max-width:240px;align-content:flex-start}.cbpal.fp{flex-direction:row;max-width:200px}}
.hcprog{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:min(320px,50vw);height:8px;background:#0004;border-radius:6px;z-index:2}.hcprog>div{height:100%;background:linear-gradient(90deg,#22c55e,#facc15);border-radius:6px}
.hcprog span{position:absolute;top:-6px;width:4px;height:20px;background:#facc15;border-radius:2px;box-shadow:0 0 0 2px #713f12}
.hccombo{position:absolute;right:14px;top:80px;font-size:clamp(20px,4vw,30px);font-weight:700;color:#fff;background:linear-gradient(135deg,#f97316,#ef4444);padding:4px 14px;border-radius:14px;opacity:0;transition:opacity .2s;transform:rotate(4deg)}.hccombo.on{opacity:1;animation:bump .4s}
.hcfuel>div.low{animation:glow 1s infinite}
.endcard{background:#fff;color:var(--ink);border-radius:26px;padding:18px 22px;max-width:560px;width:92vw;text-align:center;box-shadow:0 10px 40px #0006;animation:spin .5s cubic-bezier(.5,1.6,.5,1)}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.endstats div{background:#f5f5f4;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column}.endstats b{font-size:22px}.endstats span{font-size:12px;color:var(--muted)}
.vehs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.veh{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;font-size:15px}.veh canvas{width:150px;height:90px}.veh.on{outline:4px solid #22c55e;background:#f0fdf4}
.mis{cursor:default}
.shthumb{width:100px;height:100px;border-radius:10px;box-shadow:0 2px 6px #0002;background:#fff}
.shwrap svg{width:100%;height:100%;display:block;border-radius:12px;background:#fff;box-shadow:0 4px 14px #0002;touch-action:none}
.shwrap path{cursor:pointer;transition:fill .2s}.shl{font-family:Andika,sans-serif;font-weight:700;fill:#78716c;pointer-events:none}.shl.on{fill:#1d4ed8}
.popfill{animation:popf .35s}@keyframes popf{50%{opacity:.6}}
/* Pet rig (P4-05; DESIGN_SYSTEM.md 6.2). Drawing: src/js/17-pets-svg.js. Tokens only; animates transform and opacity only.
   Palette roles (--pc-*): shared ones on .pet-svg, body colours per pet on .pet-k-<kind>. */
.pet-svg{width:1.7em;height:1.7em;display:block;overflow:visible;margin:-.2em -.18em -.1em;
  --pc-e:var(--ink);--pc-e2:var(--ink-2);--pc-w:var(--surface);--pc-t:var(--read);--pc-ck:var(--read-tint);--pc-d:var(--glow-cool);
  --pc-gl:var(--star);--pc-gl2:var(--star-tint);--pc-sd:var(--shadow-ink-2)}
.pet-k-dragon{--pc-b:var(--good);--pc-b2:var(--good-ink);--pc-b3:var(--es-shade);
  --pc-l:var(--star);--pc-l2:var(--star-shade);--pc-l3:var(--star-tint);
  --pc-h:var(--try-tint);--pc-h2:var(--star);--pc-x:var(--star-tint);--pc-x2:var(--try-tint);--pc-x3:var(--star-shade);--pc-sh:var(--star-tint);--pc-sh2:var(--try-tint)}
/* P4-06: dino (blue, cream belly and snout, orange plates), bird (yellow, orange beak and feet, straw nest), sea pal (aqua, white chin, blue fins) */
.pet-k-dino{--pc-b:var(--ill-blue);--pc-b2:var(--ill-blue-2);--pc-b3:var(--ill-blue-3);--pc-l:var(--ill-cream);--pc-l2:var(--ill-cream-2);--pc-l3:var(--ill-cream-1);
  --pc-p:var(--ill-orange);--pc-p2:var(--ill-orange-2);--pc-sh:var(--ill-blue-1);--pc-sh2:var(--ill-blue)}
.pet-k-bird{--pc-b:var(--ill-yellow);--pc-b2:var(--ill-yellow-2);--pc-b3:var(--ill-yellow-3);--pc-l:var(--ill-yellow-1);--pc-l2:var(--ill-yellow);
  --pc-x:var(--ill-orange);--pc-x2:var(--ill-orange-2);--pc-sh:var(--ill-cream);--pc-sh2:var(--ill-cream-2);--pc-n:var(--ill-tan-2);--pc-n2:var(--ill-brown-2);--pc-n3:var(--ill-tan)}
.pet-k-ocean{--pc-b:var(--ill-aqua);--pc-b1:var(--ill-aqua-1);--pc-b2:var(--ill-aqua-2);--pc-b3:var(--ill-aqua-3);--pc-l:var(--ill-white);--pc-l2:var(--ill-white-2);
  --pc-p:var(--ill-blue);--pc-p2:var(--ill-blue-2);--pc-sh:var(--ill-aqua-1);--pc-sh2:var(--ill-aqua)}

/* containers that hold a rig pet (petAura() gives them .rig): no box bob, no shadow; the drawing has its own */
.rig{text-shadow:none}
.petbig.rig,.mappet.rig{animation:none}
.petopt .pet-svg{width:1.3em;height:1.3em;margin:-.1em 0}
.map .pet-svg{position:static}
.hero .pet-svg{width:1.95em;height:1.95em;margin:-.3em -.26em -.12em}
.runner .pet-svg{width:1.5em;height:1.5em;margin:-.2em -.15em -.08em}
.ovl .pet-svg{width:1.4em;height:1.4em;margin:0 auto}

/* idle: body bob with its shadow, blink every 4 s; the egg rocks instead */
.pet-svg .pg-fig{transform-box:fill-box;transform-origin:50% 100%;animation:pet-bob 2.4s ease-in-out infinite}
.pet-svg .pg-shadow{transform-box:fill-box;transform-origin:center;animation:pet-shadow 2.4s ease-in-out infinite}
.pet-svg .pg-eyes{transform-box:fill-box;transform-origin:center;animation:pet-blink 4s infinite}
.pet-svg .pg-arm-l,.pet-svg .pg-arm-r{transition:transform var(--t) var(--ease)}
.pet-s-egg .pg-fig{animation-name:pet-rock}
@keyframes pet-bob{50%{transform:translateY(-6px)}}
@keyframes pet-shadow{50%{transform:scaleX(.88);opacity:.7}}
@keyframes pet-blink{0%,93%,100%{transform:none}96%{transform:scaleY(.12)}}
@keyframes pet-rock{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* moods (the face is swapped in the markup; these add the body language) */
.pet-m-happy .pg-eyes,.pet-m-sleepy .pg-eyes{animation:none}
.pet-m-happy .pg-tail{animation:pet-wag .5s ease-in-out 4}
.pet-m-sleepy .pg-fig{animation-duration:4s}
.pet-m-sleepy .pg-head{transform:rotate(-7deg)}
.pet-m-hungry .pg-head{transform:rotate(5deg)}
.pet-m-cheer .pg-fig{animation:pet-hop .6s var(--ease) 3}
.pet-m-cheer .pg-arm-l{transform:rotate(60deg)}
.pet-m-cheer .pg-arm-r{transform:rotate(-60deg)}
.pet-m-cheer .pg-xl{animation:pet-flap-l .3s ease-in-out 6}
.pet-m-cheer .pg-xr{animation:pet-flap-r .3s ease-in-out 6}
.pet-m-oops .pg-fig{animation:pet-wobble .5s ease-in-out 2}
@keyframes pet-wag{50%{transform:rotate(-14deg)}}
@keyframes pet-hop{40%{transform:translateY(-14px)}}
@keyframes pet-flap-l{50%{transform:rotate(16deg)}}
@keyframes pet-flap-r{50%{transform:rotate(-16deg)}}
@keyframes pet-wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* reactions: anim(el, 'jump' | 'sad') on the container shows the cheer / oops face and moves the figure, not the whole box */
.pf-cheer,.pf-oops{opacity:0}
.jump .pf-base,.sad .pf-base{opacity:0}
.jump .pf-cheer,.sad .pf-oops{opacity:1}
.rig.jump,.rig.sad{animation:none!important}
.rig.jump .pg-fig{animation:pet-jump .5s var(--ease)}
.rig.jump .pg-arm-l{transform:rotate(60deg)}
.rig.jump .pg-arm-r{transform:rotate(-60deg)}
.rig.sad .pg-fig{animation:pet-wobble .5s ease-in-out}
@keyframes pet-jump{35%{transform:translateY(-24px) scale(1.04,.98)}70%{transform:translateY(0) scale(1.05,.94)}}
/* Question screen (P4-10; DESIGN_SYSTEM 9 row 4). Tokens only; animate transform and opacity only; no filter.
   Round markup is in 50-round.js renderQ: .top.tbar.round.qtop (close, track with dots and the pet runner, flame and star chips),
   then .play.qs.s-<subject> holding the prompt card .qarea and the input area .inp. The input markup of every kind is in 49-kinds.js
   and uses the P4-04 components (.key, .choice, .piece, .socket); the rules below give them their question-screen size and states.
   Kind rules are not scoped to .qs, so Speed Race and the placement quiz (same kinds) get them too.
   Old rules for the same classes still sit in 30-learn.css, 32-kinds-a.css, 37-kinds-b.css and 40-games.css; this file loads after
   them and wins with equal or higher specificity (the dead ones can go in P4-17). */

/* ---------- top bar: close, progress track, streak and star chips ---------- */
.top.qtop{flex-wrap:wrap;gap:var(--s-2) var(--s-3);min-height:0;padding:var(--s-3) var(--s-4) var(--s-1)}
.qtop #quit .ic{color:var(--ink-2)}
.qtop .stat.flame{margin-left:auto}
.qtop .bossbar~.stat.flame{margin-left:0}
.qtop .stat.flame.off{color:var(--ink-3)}
.qtop .stat.flame:not(.off) .ic{color:var(--play)}
.qtop .stat.flame:not(.off){background:var(--play-tint);box-shadow:inset 0 0 0 2px var(--try),0 3px 0 var(--try)}

/* the track: one grid column per question plus one for the goal; dots sit on a rail, the pet stands on the current dot */
.qtrack{position:relative;flex:1 1 0;min-width:0;max-width:640px;height:64px;margin:0 auto;display:grid;
  grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:end;justify-items:center;padding-bottom:6px;--rw:44px}
.qtrack .dots{display:contents}
.qtrack .dots>i{position:relative;z-index:1;width:16px;height:16px;margin-bottom:6px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--ledge-soft)}
.qtrack .dots>i.done{background:var(--good);box-shadow:inset 0 -3px 0 var(--good-ink)}
.qtrack .dots>i.try{background:var(--try);box-shadow:inset 0 -3px 0 var(--star-shade)}
.qtrack .dots>i.cur{width:24px;height:24px;margin-bottom:2px;background:var(--surface);box-shadow:inset 0 0 0 5px var(--brand),0 0 0 3px var(--brand-tint)}
.qtrack::before,.qtrack::after{content:'';position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));bottom:17px;height:6px;
  border-radius:var(--r-pill);background:var(--ledge-soft)}
/* the part of the rail already walked, grown with transform (--p = done / total) */
.qtrack::after{background:var(--good);opacity:.45;transform-origin:left center;transform:scaleX(var(--p,0));transition:transform var(--t-slow) var(--ease)}
.qgoal{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--star-tint);
  color:var(--star-shade);--ic2:var(--star-tint);box-shadow:inset 0 0 0 2px var(--star),0 3px 0 var(--star-shade)}
.qgoal .ic{width:26px;height:26px}
.qgoal.test{background:var(--brand-tint);color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand),0 3px 0 var(--brand-shade)}
/* #qwalk is as wide as the track, so translateX(%) (set by qLeft in 50-round.js) puts the pet's centre on a column centre */
.qwalk{position:absolute;left:0;right:0;bottom:22px;z-index:2;height:0;pointer-events:none;transition:transform var(--t-slow) var(--spring)}
.qtrack .runner{position:absolute;left:0;top:auto;bottom:0;width:var(--rw);margin-left:calc(var(--rw) / -2);font-size:32px;
  display:flex;justify-content:center;transition:none}
.qtrack .runner .petwrap{font-size:30px}
/* the pet's speech bubble (petSay), a P4-04 speech bubble that hangs under the pet */
#bub{top:calc(100% + 26px);padding:var(--s-1) var(--s-3);border:2px solid var(--line);border-radius:var(--r-btn);background:var(--surface);
  color:var(--ink);font-size:var(--fs-3);line-height:1.3;box-shadow:0 4px 0 var(--ledge-soft),var(--shadow);transform:translateY(-4px);
  transition:opacity var(--t) var(--ease),transform var(--t) var(--spring)}
#bub.on{transform:none}
/* phones: the track gets its own row under the buttons */
@media (max-width:480px){
  .top.qtop{padding:var(--s-2) var(--s-3) 0}
  .qtrack,.qtop .bossbar{order:9;flex:1 0 100%;max-width:none}
  .qtop .bossbar~.stat.flame{margin-left:auto}
  .qtrack{height:58px}
}
@media (max-height:520px){
  .top.qtop{padding:var(--s-2) var(--s-4) 0}
  .qtrack{height:56px}
}

/* ---------- the prompt card ---------- */
.play.qs{gap:var(--s-3);padding:var(--s-2) var(--s-4) var(--s-4)}
.qs .qarea{position:relative;gap:var(--s-3);padding:var(--s-5) var(--s-4) var(--s-4);border-top:6px solid var(--c,var(--brand));
  border-radius:var(--r-hero);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),var(--shadow)}
/* the prompt spans the card, so pictures sized in % of it (Shape Garden depth scenes) never collapse to 0 when the words are hidden */
.qs .prompt{align-self:stretch;color:var(--ink);font-family:var(--font-display);animation:k-qin var(--t-slow) var(--ease)}
@keyframes k-qin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.qs .prompt.shake{animation:k-shake 240ms linear}
.qs .tools{flex-wrap:wrap;justify-content:center;gap:var(--s-3)}
.qs .tools .btn.sm{min-width:var(--tap);font-size:var(--fs-3)}
/* Pre-K: a big round "hear it again" button and a round help button, no words needed */
.qs .btn.pkspk{width:88px;height:88px;min-width:88px;min-height:88px;padding:0;border-radius:50%}
.qs .btn.pkspk .ic{width:48px;height:48px}
.qs .btn.pkhb .ic{width:34px;height:34px;color:var(--try-ink)}
.qs .btn.pkhb{background:var(--try-tint);box-shadow:inset 0 0 0 2px var(--try),var(--ledge) var(--try)}
.btn.talking{animation:k-talk .6s var(--ease) 3}
@keyframes k-talk{50%{transform:scale(1.06)}}
/* tags at the top of the card: review ("Remember this one?") and challenge (51-mastery.js .mtag) */
.tag.rtag{background:var(--brand-tint);color:var(--brand-shade);border-radius:var(--r-pill);font-size:var(--fs-2);padding:var(--s-1) var(--s-3) var(--s-1) var(--s-2)}
.tag.rtag .ic{width:18px;height:18px}
/* the review tag sits in the card's top corner and takes no height, so a review question fits exactly where it did as a
   normal question (a ten-frame count at 380x780 overflowed by 25 px with the tag in the flow) */
.qs .qarea>.tag.rtag{position:absolute;top:var(--s-2);right:var(--s-2);margin:0;z-index:1;font-size:var(--fs-1);padding:2px var(--s-2) 2px var(--s-1)}
.qs .qarea>.tag.rtag .ic{width:16px;height:16px}
.qarea>.tag.rtag+*{margin-top:auto}
/* the challenge tag (51-mastery.js) is pinned the same way, in the top-left corner so it never meets the review chip */
.qs .qarea>.mtag{position:absolute;top:var(--s-2);left:var(--s-2);margin:0;z-index:1;font-size:var(--fs-1);padding:2px var(--s-2) 2px var(--s-1)}
.qs .qarea>.mtag .ic{width:16px;height:16px}
.qarea>.mtag+*{margin-top:auto}
.qs .mtag{background:var(--bt);color:var(--surface);padding:var(--s-1) var(--s-3) var(--s-1) var(--s-2);line-height:1.2}
.qs .mtag .ic{color:var(--surface)}
.qs .bctx{box-shadow:none;border:2px solid var(--line);background:var(--surface-2)}

/* hint: #hint is the amber panel once it has something in it; the bulb badge sits on its corner */
.qhint{position:relative;max-width:100%}
.qs .hint:not(:empty){padding:var(--s-3) var(--s-4);border:2px solid var(--try);border-radius:var(--r-card);background:var(--try-tint);
  color:var(--ink);font-size:clamp(var(--fs-3),2.8vh,var(--fs-4));line-height:1.35}
.qhint .hb{position:absolute;left:-10px;top:-14px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--try);
  color:var(--try-ink);box-shadow:inset 0 -3px 0 var(--star-shade)}
.qhint .hb .ic{width:22px;height:22px}
.qhint .hint:empty+.hb{display:none}
.qs .hint.pop{animation:k-qin var(--t-slow) var(--spring)}

/* ---------- answer slots in the prompt (num) ---------- */
.slot{position:relative;border:.07em dashed var(--ink-3);border-radius:.22em;background:var(--surface-2);color:var(--brand)}
.slot.sl-on{border-color:var(--brand);background:var(--brand-tint)}
.slot.ok{border:.07em solid var(--good);background:var(--good-tint);color:var(--good-ink);animation:k-pop var(--t-slow) var(--spring)}
.slot.rev{border:.07em solid var(--try);background:var(--try-tint);color:var(--try-ink)}

/* right and wrong badges (never colour alone): a green disc with a tick, or an amber disc with a soft cross.
   Shared by the slot, tap targets, Pre-K plates and the letter slots row; the choice component draws its own. */
:is(.slot,.tp,.pkplate).ok::before,:is(.tp,.pkplate).right::before,:is(.tp,.pkplate).wrong::before{content:'';position:absolute;z-index:1;
  top:-12px;right:-12px;width:28px;height:28px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--surface)}
:is(.slot,.tp,.pkplate).ok::after,:is(.tp,.pkplate).right::after{content:'';position:absolute;z-index:2;top:-6px;right:-2px;width:7px;height:13px;
  border:solid var(--surface);border-width:0 4px 4px 0;border-radius:1px;transform:rotate(45deg)}
:is(.tp,.pkplate).wrong::before{background:var(--try)}
:is(.tp,.pkplate).wrong::after{content:'';position:absolute;z-index:2;top:-12px;right:-12px;width:28px;height:28px;background-repeat:no-repeat;
  background-position:center;background-size:14px 14px;background-image:linear-gradient(45deg,transparent 40%,var(--try-ink) 40% 60%,transparent 60%),
  linear-gradient(-45deg,transparent 40%,var(--try-ink) 40% 60%,transparent 60%)}
.slot.ok::before{top:-.24em;right:-.24em}
.slot.ok::after{top:-.13em;right:-.06em}

/* ---------- number pad (.keys.qpad > .key.k) ---------- */
.qpad{max-width:440px}
.qpad .key{height:auto;min-height:var(--tap-pk);font-size:clamp(28px,4.6vh,var(--fs-6))}
.qpad .key .ic{width:34px;height:34px}
.qpad .key.go .ic{width:38px;height:38px}
.qpad .key.x{grid-column:1/-1;min-height:var(--tap);background:var(--star-tint);box-shadow:inset 0 0 0 2px var(--star),var(--ledge) var(--star-shade)}
.qpad .key.x:is(:active,.is-press){box-shadow:inset 0 0 0 2px var(--star),var(--ledge-press) var(--star-shade)}
@media (min-height:900px){.qpad .key{min-height:72px}}
@media (max-width:480px){.qpad .key{min-height:56px}}
@media (max-height:520px){.qpad .key{min-height:var(--tap)}}

/* ---------- choices (.choices > .choice.ch) ---------- */
.choices{gap:var(--s-3);max-width:600px}
.choice.ch{min-height:var(--tap-pk);padding:var(--s-2) var(--s-3);font-size:clamp(26px,4.6vh,var(--fs-6))}
.choice.ch.wrong{opacity:1;background:var(--try-tint);color:var(--try-ink);box-shadow:inset 0 0 0 3px var(--try),0 5px 0 var(--try)}
.choices.pics .choice.ch{font-size:clamp(44px,8vh,64px);padding:var(--s-2)}
.choices.wide .choice.ch{justify-content:center;font-size:clamp(20px,3.6vh,28px);padding:clamp(8px,1.6vh,14px) var(--s-7);line-height:1.25}
.choices.bwords .choice.ch{min-height:var(--tap-primary);font-size:clamp(20px,3.6vh,28px);padding:clamp(8px,1.6vh,14px) var(--s-5)}
.choices.syms .choice.ch{font-size:clamp(36px,7vh,56px)}
/* the right answer shown after the second try: green with its tick */
.choice.ch.right{opacity:1;background:var(--good-tint);color:var(--good-ink);box-shadow:inset 0 0 0 3px var(--good),0 5px 0 var(--good-ink)}

/* multi: a tick box in each choice, then the Check button */
.mchoices .choice.mc{justify-content:flex-start;gap:var(--s-3);min-height:var(--tap-primary);padding:var(--s-2) var(--s-4);font-size:clamp(20px,3.6vh,28px);text-align:left}
.choice.mc .mk{width:30px;height:30px;border:3px solid var(--ledge-soft);border-radius:var(--r-chip);background:var(--surface)}
.choice.mc.on{outline:0;background:var(--brand-tint);color:var(--brand-shade);box-shadow:inset 0 0 0 3px var(--brand),0 5px 0 var(--brand-shade)}
.choice.mc.on .mk{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.choice.mc.right{outline:0}
.choice.mc.right .mk{background:var(--good-ink);border-color:var(--good-ink);color:var(--surface)}
.choice.mc.wrong{outline:0}
.choice.mc.wrong .mk{border-color:var(--try-ink)}
.choice.mc:is(.right,.wrong)::before{top:50%;margin-top:-14px}
.choice.mc.right::after{top:50%;margin-top:-9px}
.choice.mc.wrong::after{top:50%;margin-top:-14px}
.btn.mgo{display:flex;min-width:200px;margin:var(--s-4) auto 0;background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--good-ink);
  box-shadow:inset 0 2px 0 var(--hi),var(--ledge) var(--es-shade)}
.btn.mgo:is(:active,.is-press){box-shadow:inset 0 2px 0 var(--hi),var(--ledge-press) var(--es-shade)}
.btn.mgo:disabled{opacity:1}

/* ---------- build and order: pieces into slots ---------- */
.tiles{gap:var(--s-3)}
.piece.lt{width:clamp(56px,10vh,76px);height:clamp(56px,10vh,76px);padding:0;font-size:clamp(30px,5.5vh,40px)}
.piece:is(.lt,.ot){background:var(--surface)}
.piece:is(.lt,.ot).used{visibility:visible;background:var(--surface-2)}
.piece.lt.glow{box-shadow:inset 0 0 0 4px var(--star-shade),0 0 0 4px var(--star),var(--ledge) var(--star-shade);animation:k-nudge .8s var(--ease) 3}
@keyframes k-nudge{40%{transform:translateY(-8px)}}
.btn.undo{display:flex;margin:var(--s-4) auto 0}
.lslots{gap:var(--s-2)}
.ls{position:relative;width:1.05em;height:1.3em;border-bottom:0;border-radius:.16em .16em .08em .08em;background:var(--surface-2);
  box-shadow:inset 0 -.11em 0 var(--ink-3);color:var(--ink)}
.ls:empty{background:var(--surface-2)}
.ls:not(:empty){background:var(--brand-tint);box-shadow:inset 0 -.11em 0 var(--brand);color:var(--brand-shade)}
.ls.ok,.ls.ok:not(:empty){background:var(--good-tint);box-shadow:inset 0 -.11em 0 var(--good);color:var(--good-ink);animation:k-pop var(--t-slow) var(--spring)}
.oslots{gap:var(--s-2)}
.socket.os{min-width:var(--tap-primary);min-height:var(--tap-primary);padding:var(--s-1) var(--s-3);font-size:clamp(20px,3.8vh,30px);cursor:pointer;
  touch-action:manipulation}
.socket.os.full{border:3px solid var(--brand);background:var(--brand-tint);color:var(--brand-shade);box-shadow:0 3px 0 var(--brand-shade)}
.socket.os.ok{border:3px solid var(--good);background:var(--good-tint);color:var(--good-ink);box-shadow:none;animation:k-pop var(--t-slow) var(--spring)}
.socket.os.rev{border:3px solid var(--try);background:var(--try-tint);color:var(--try-ink);box-shadow:none}
.piece.ot{min-height:var(--tap-primary);font-size:clamp(20px,3.8vh,30px);padding:0 var(--s-4)}
@media (min-width:560px){.socket.os,.piece.ot{min-width:var(--tap-pk);min-height:var(--tap-pk)}}

/* ---------- match: two columns of cards; a found pair shares a colour and a shape mark ---------- */
.choice.mb{min-height:var(--tap-primary);padding:var(--s-2) var(--s-3);font-size:clamp(var(--fs-3),3.4vh,var(--fs-5));border:0;overflow-wrap:anywhere}
.choice.mb.sel{transform:translateY(-3px)}
.choice.mb.bad{background:var(--try-tint);color:var(--try-ink);box-shadow:inset 0 0 0 3px var(--try),0 5px 0 var(--try)}
.choice.mb.done{cursor:default;color:var(--ink);transform:none}
.choice.mb.pc0{background:var(--brand-tint);box-shadow:inset 0 0 0 3px var(--brand);--pm:var(--brand)}
.choice.mb.pc1{background:var(--star-tint);box-shadow:inset 0 0 0 3px var(--star-shade);--pm:var(--star-shade)}
.choice.mb.pc2{background:var(--good-tint);box-shadow:inset 0 0 0 3px var(--good);--pm:var(--good-ink)}
.choice.mb.pc3{background:var(--read-tint);box-shadow:inset 0 0 0 3px var(--read);--pm:var(--read)}
.choice.mb.pc4{background:var(--play-tint);box-shadow:inset 0 0 0 3px var(--play);--pm:var(--play-shade)}
.choice.mb.done{padding-left:var(--s-7)}
.choice.mb.done::before{content:'';position:absolute;left:12px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--pm)}
.choice.mb.pc0::before{border-radius:50%}
.choice.mb.pc1::before{border-radius:2px}
.choice.mb.pc2::before{border-radius:2px;transform:rotate(45deg) scale(.9)}
.choice.mb.pc3::before{height:6px;margin-top:-3px;border-radius:3px}
.choice.mb.pc4::before{background:transparent;border:4px solid var(--pm);border-radius:50%}
.mt.ok .choice.mb.done{animation:k-pop var(--t-slow) var(--spring)}

/* ---------- tap: parts of the prompt you tap ---------- */
.tp{position:relative;background:var(--surface);border:0;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--ledge-soft);
  transition:transform var(--t-fast) var(--ease)}
.tp:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--line),0 1px 0 var(--ledge-soft)}
.tp.right{border:0;background:var(--good-tint);color:var(--good-ink);box-shadow:inset 0 0 0 3px var(--good),0 4px 0 var(--good-ink);animation:k-pop var(--t-slow) var(--spring)}
.tp.wrong{border:0;opacity:1;background:var(--try-tint);color:var(--try-ink);box-shadow:inset 0 0 0 3px var(--try),0 4px 0 var(--try)}
.tpl .tp{box-shadow:inset 0 0 0 3px var(--line)}
.tpl .tp:is(.right,.wrong)::before{top:-16px}
.tpl .tp.right::after{top:-10px}
.tpl .tp.wrong::after{top:-16px}

/* Pre-K plates (more / fewer) */
.pkplate{position:relative;box-shadow:0 4px 0 var(--ledge-soft)}
.pkplate.wrong{opacity:1}

/* ---------- spelling keyboard (.sks > .skr > .key.sk) ---------- */
.sks{gap:var(--s-2)}
.skr{gap:5px}
.key.sk{flex:1 1 0;min-width:0;max-width:60px;min-height:var(--tap);height:clamp(var(--tap),8.5vh,64px);padding:0;border-radius:var(--r-chip);
  font-family:var(--font-body);font-size:clamp(var(--fs-4),3.4vh,var(--fs-5));text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ledge-soft)}
.key.sk:is(:active,.is-press){box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--ledge-soft)}
.key.sk.wide{flex:1.7 1 0;max-width:96px}
.key.sk.del .ic{width:30px;height:30px}
.key.sk.del:is(:active,.is-press){box-shadow:inset 0 0 0 2px var(--try),0 1px 0 var(--try)}
@media (max-width:480px){.qs .sks{margin:0 calc(var(--s-2) * -1);width:calc(100% + var(--s-4))}.skr{gap:4px}}
@media (max-height:520px){.key.sk{height:var(--tap)}.sks{gap:var(--s-1)}}

/* ---------- feedback flourishes (12-speech.js): the star that flies to the star chip, the sparkle burst ---------- */
.fly{width:48px;height:48px;color:var(--star)}
.fly .ic{width:48px;height:48px;display:block}
.burst .ic{display:block}
.burst.b0{color:var(--star)}.burst.b1{color:var(--good)}.burst.b2{color:var(--brand)}
html.calm .burst,html.calm .fly{display:none}
@media (prefers-reduced-motion:reduce){.burst,.fly{display:none}}

/* ---------- landscape: card left, input right ---------- */
@media (orientation:landscape){
  .play.qs{gap:var(--s-4)}
  .qs .inp{width:46%;max-width:520px}
}
@media (max-height:520px){
  .play.qs{padding:var(--s-1) var(--s-4) var(--s-3)}
  .qs .qarea{padding:var(--s-3) var(--s-3) var(--s-3);border-top-width:5px}
  .qs .btn.pkspk{width:72px;height:72px;min-width:72px;min-height:72px}
}

/* streak toast (fb(text, 'streak')): flame on an orange disc */
.toast.streak{color:var(--play-shade)}
.toast.streak .ti{background:var(--play);color:var(--surface)}
/* on the question screen the toast drops just below the top bar, so it does not hide the pet stepping along the track
   (browsers without :has keep it at the top) */
body:has(.qtop) .toast{top:calc(env(safe-area-inset-top) + 84px)}
@media (max-width:480px){body:has(.qtop) .toast{top:calc(env(safe-area-inset-top) + 128px)}}
@media (max-height:520px){body:has(.qtop) .toast{top:calc(env(safe-area-inset-top) + 72px)}}
/* Shape Garden crayon bars: a full 48 px tap target inside the narrower card */
.qs .sgbars .sgt{min-height:var(--tap)}
/* Rewards (P4-11; DESIGN_SYSTEM.md 6.3, 8.1, 9 row 5): round complete, treasure chest, stars, prizes, bosses, test out, pet growth.
   Drawings: src/js/18-reward-art.js (RW.*). Tokens only. Animate only transform and opacity; keyframes are named rw-*.
   Calm mode and reduced motion cut every animation to 0.01 ms (20-base.css) and hide the drawn confetti (.rw-burst). */

/* ---- shared ---- */
.rw-h{margin:0 0 var(--s-2);font-family:var(--font-display);font-size:var(--fs-5);line-height:var(--lh-5);color:var(--ink)}
.rw-sub{margin:0 0 var(--s-3);font-size:var(--fs-3);line-height:var(--lh-3);font-weight:700;color:var(--ink-2);max-width:30ch}
.rw-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-3);margin-top:var(--s-4)}
.rw-art{display:block}
.rw-chest-art,.rw-rays,.rw-boss,.rw-star{display:block;width:100%;height:100%;overflow:visible}

/* ---- before the tap: a big closed chest that rattles until it is tapped ---- */
.rw-pre{display:flex;flex-direction:column;align-items:center}
.rw-chest{position:relative;display:block;width:min(240px,60vw,38vh);aspect-ratio:1;margin:var(--s-8) 0;padding:0;border:0;
  border-radius:var(--r-hero);background:none;cursor:pointer;touch-action:manipulation}
.rw-chest:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.rw-chest .rw-glow{position:absolute;inset:-12%;opacity:.7;pointer-events:none}
.rw-tap{display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4);border-radius:var(--r-pill);background:var(--surface);
  box-shadow:var(--shadow);color:var(--ink);max-width:none}
.rw-tap .ic{flex:none;color:var(--read)}
.rw-chest .rw-chest-art{position:relative;transform-origin:50% 88%;animation:rw-rattle 1.2s var(--ease) infinite}
.rw-chest:active .rw-chest-art{transform:scale(.96)}

/* ---- after the tap: hero (stars, score), treasure (open chest + stickers), what you earned, messages, the dock ---- */
.rw-fin.rw-open{justify-content:flex-start;padding:var(--s-4) var(--s-4) 0}
.rw-res{width:100%;max-width:560px;display:flex;flex-direction:column;gap:var(--s-3);text-align:left}
.rw-a,.rw-b{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.rw-feed{display:flex;flex-direction:column;gap:var(--s-3)}
.rw-hero{position:relative;padding:var(--s-5) var(--s-4) var(--s-4);border-radius:var(--r-hero);text-align:center;
  background:radial-gradient(120% 90% at 50% 0,var(--star-tint) 0 45%,var(--surface) 80%);box-shadow:var(--shadow);
  animation:rw-rise var(--t-slow) var(--ease) both}
.rw-score{margin:var(--s-2) 0 0;font-family:var(--font-display);font-size:var(--fs-5);line-height:1.1;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.rw-score b{font-size:var(--fs-7);color:var(--ink)}
.rw-tip{display:flex;align-items:center;justify-content:center;gap:var(--s-2);margin:var(--s-3) auto 0;padding:var(--s-2) var(--s-4);max-width:34ch;
  border-radius:var(--r-card);background:var(--brand-tint);font-size:var(--fs-3);line-height:var(--lh-3);font-weight:700;color:var(--ink);text-align:left}
.rw-tip .ic{flex:none;color:var(--brand)}
.rw-line{margin:var(--s-1) 0 0;font-size:var(--fs-4);line-height:var(--lh-4);font-weight:700;color:var(--ink)}

/* star rating: three slots, the middle one bigger and lifted; earned stars pop in 120 ms apart */
.rw-rate{display:flex;justify-content:center;align-items:flex-end;gap:var(--s-1);padding-top:var(--s-3)}
.rw-st{display:block;width:76px;height:76px}
.rw-st:nth-child(2){width:96px;height:96px;transform:translateY(-14px)}
.rw-st .rw-star{animation:rw-in var(--t) var(--ease) both}
.rw-st.on .rw-star{animation:rw-starpop 560ms var(--spring) both;animation-delay:calc(250ms + var(--i) * 120ms)}

/* the child's pet cheering instead of stars (no stars yet, Tricky Mix, test out) */
.rw-pet{font-size:84px;line-height:1;display:flex;justify-content:center;animation:rw-pop 500ms var(--spring) both}
.rw-pet .pet-svg{margin:0}
.rw-pete{font-size:96px;line-height:1.1}

/* treasure: the open chest with its prizes beside it */
.rw-tre{display:flex;align-items:center;gap:var(--s-3);min-height:104px;padding:var(--s-2) var(--s-4) var(--s-2) var(--s-2);
  border-radius:var(--r-card);background:var(--star-tint);animation:rw-rise var(--t-slow) var(--ease) 80ms both}
.rw-chest-o{position:relative;flex:none;width:104px;height:104px}
.rw-chest-o .rw-rays{position:absolute;inset:-12%;width:124%;height:124%;opacity:.9;animation:rw-rays 900ms var(--ease) both}
.rw-chest-o .rw-chest-art{position:relative;animation:rw-pop 500ms var(--spring) both}
.rw-prz{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);flex:1;min-width:0;padding:var(--s-2) 0}
.rw-stk{position:relative;display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--surface);
  box-shadow:0 0 0 3px var(--surface),0 4px 10px var(--drop);transform:rotate(var(--r,0deg));animation:rw-stk 520ms var(--spring) both}
.rw-se{font-size:42px;line-height:1}
.rw-stk .tag{position:absolute;top:-12px;right:-16px;padding:1px 8px}

/* what you earned: stars, game time (with the why list), coins */
.rw-earn{display:grid;gap:var(--s-3);padding:var(--s-3) var(--s-4);border:2px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.rw-earn:empty{display:none}
.rw-er{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--s-3);align-items:start;animation:rw-rise var(--t-slow) var(--ease) both}
.rw-ed{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--star-tint);color:var(--star-shade);--ic2:var(--star-tint)}
.rw-er.ticket .rw-ed{background:var(--play-tint);color:var(--play);--ic2:var(--play-tint)}
.rw-er.bump .rw-ed{animation:rw-bump 300ms var(--spring)}
.rw-et{padding-top:9px;font-size:var(--fs-4);line-height:var(--lh-4);font-weight:700;color:var(--ink);overflow-wrap:normal}
.rw-num{font-variant-numeric:tabular-nums}
.rw-pl{display:grid;gap:2px;margin:var(--s-2) 0 0;padding:0;list-style:none;font-size:var(--fs-2);line-height:var(--lh-2);font-weight:700;color:var(--ink-2)}
.rw-pl li{display:flex;align-items:center;gap:var(--s-2)}
.rw-pl .ic{flex:none;color:var(--good-ink)}
.rw-pl .neg{color:var(--try-ink)}
.rw-pl .neg .ic{color:var(--try-ink)}
.rw-ph{display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-2);font-size:var(--fs-2);line-height:var(--lh-2);font-weight:700;color:var(--bt)}
.rw-ph .ic{flex:none}

/* message cards: an icon disc (or a little drawn boss) and one line */
.rw-msgs{display:grid;gap:var(--s-2)}
.rw-msgs:empty{display:none}
.rw-msg{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:var(--s-3);align-items:center;padding:var(--s-2) var(--s-4) var(--s-2) var(--s-2);
  border-radius:var(--r-card);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);animation:rw-rise var(--t-slow) var(--ease) both}
.rw-msg.win{background:var(--star-tint);box-shadow:none}
.rw-msg.tip{background:var(--brand-tint);box-shadow:none}
.rw-md{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--brand)}
.rw-msg.win .rw-md{color:var(--star-shade);--ic2:var(--surface)}
.rw-msg.boss .rw-md{background:none;overflow:visible}
.rw-msg.boss .rw-boss{width:60px;height:60px;margin:-8px}
.rw-mt{font-size:var(--fs-3);line-height:var(--lh-3);font-weight:700;color:var(--ink);overflow-wrap:normal}
.rw-mt .rw-badge{width:48px;height:48px;vertical-align:middle;margin:-8px 0}
.rw-mt .rw-be{font-size:20px}

/* the dock: the next step (one primary button), then Bonus game and Map / Home; stays at the bottom while the list scrolls */
.rw-dock{position:sticky;bottom:0;z-index:1;display:grid;gap:var(--s-3);margin:0 calc(var(--s-4) * -1);padding:var(--s-4) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom));
  background:linear-gradient(var(--hi-0),var(--paper) var(--s-4))}
.rw-dock.on{animation:rw-rise var(--t-slow) var(--ease) both}
.rw-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.rw-two .btn{width:100%;padding-left:var(--s-3);padding-right:var(--s-3)}

/* wide landscape: hero and treasure on the left; the list scrolls on the right above the dock */
@media (orientation:landscape) and (min-width:700px){
  .rw-fin.rw-open{padding:var(--s-4) var(--s-5) 0;overflow:hidden}
  .rw-res{flex:1;min-height:0;max-width:1000px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-5);margin:0 auto}
  .rw-a{justify-content:center;padding-bottom:var(--s-4)}
  .rw-b{min-height:0}
  .rw-feed{flex:1;min-height:0;overflow:auto;padding:2px}
  .rw-dock{position:static;margin:0;padding:var(--s-3) 0 var(--s-4);background:none}
}
@media (max-height:520px){
  .rw-st{width:60px;height:60px}.rw-st:nth-child(2){width:76px;height:76px;transform:translateY(-10px)}
  .rw-rate{padding-top:var(--s-2)}
  .rw-hero{padding:var(--s-3) var(--s-4)}
  .rw-score b{font-size:var(--fs-6)}
  .rw-pet{font-size:64px}
  .rw-chest{margin-bottom:var(--s-3)}
}
@media (max-width:480px){
  .rw-st{width:64px;height:64px}.rw-st:nth-child(2){width:82px;height:82px;transform:translateY(-10px)}
  .rw-fin.rw-open{padding:var(--s-3) var(--s-3) 0}
  .rw-res,.rw-a,.rw-b,.rw-feed{gap:var(--s-2)}
  .rw-hero{padding:var(--s-3) var(--s-3) var(--s-3)}
  .rw-score b{font-size:var(--fs-6)}
  .rw-line{font-size:var(--fs-3)}
  .rw-tre{min-height:88px}.rw-chest-o{width:88px;height:88px}
  .rw-stk{width:58px;height:58px}.rw-se{font-size:38px}
  .rw-earn{padding:var(--s-3)}
  .rw-et{font-size:var(--fs-3);padding-top:10px}
  .rw-dock{margin:0 calc(var(--s-3) * -1);padding:var(--s-3) var(--s-3) calc(var(--s-3) + env(safe-area-inset-bottom))}
  .rw-two .btn{font-size:var(--fs-3);gap:6px}
}

/* ---- drawn confetti: a short burst out of the chest (or a card), about 1 s ---- */
.rw-burst{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none;z-index:2}
.rw-burst i{position:absolute;width:9px;height:14px;margin:-7px 0 0 -4px;border-radius:3px;animation:rw-cf 1100ms var(--ease) forwards}
.rw-burst i.r{width:11px;height:11px;border-radius:50%}
.rw-burst .c0{background:var(--star)}.rw-burst .c1{background:var(--read)}.rw-burst .c2{background:var(--math)}
.rw-burst .c3{background:var(--good)}.rw-burst .c4{background:var(--bt)}.rw-burst .c5{background:var(--play)}
html.calm .rw-burst{display:none}
@media (prefers-reduced-motion:reduce){.rw-burst{display:none}}

/* ---- overlays: pet growth (#yay) and test out (#tgo, #tno) as a card over a dim backdrop ---- */
.ovl.rw-ovl{background:var(--dim);padding:var(--s-4)}
.rw-card{position:relative;width:100%;max-width:440px;max-height:100%;overflow:hidden;padding:var(--s-6);border-radius:var(--r-hero);
  background:var(--surface);color:var(--ink);text-align:center;box-shadow:var(--shadow);animation:rw-up var(--t-slow) var(--ease) both}
.rw-card h1,.ovl .rw-card h1,.rw-card h2{position:relative;margin:var(--s-3) 0 var(--s-2);font-family:var(--font-display);font-size:var(--fs-5);line-height:var(--lh-5);color:var(--ink)}
.rw-card p{margin:0 0 var(--s-4);font-size:var(--fs-3);line-height:var(--lh-3);color:var(--ink-2)}
.rw-card .rw-acts{flex-direction:column;flex-wrap:nowrap;margin-top:var(--s-4)}
.rw-disc{display:grid;place-items:center;width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--bt-tint);color:var(--bt)}
.rw-growc{background:radial-gradient(90% 60% at 50% 32%,var(--star-tint) 0 50%,var(--surface) 90%)}
.rw-growc .rw-rays{position:absolute;left:50%;top:var(--s-4);width:340px;height:340px;margin-left:-170px;opacity:.75;animation:rw-rays 900ms var(--ease) both}
.ovl.rw-ovl .grow,.ovl.rw-ovl .grown{position:relative;display:flex;justify-content:center;font-size:min(124px,24vh)!important;line-height:1}
.ovl.rw-ovl .grow{animation:rw-wob 600ms var(--ease) infinite}
.ovl.rw-ovl .grown{animation:rw-pop 600ms var(--spring) both}
.rw-card .grown+h1{animation:rw-rise var(--t-slow) var(--ease) 200ms both}

/* ---- boss intro: the boss on a spotlight, seven zaps to win, the prize rosette ---- */
.rw-bstage{position:relative;width:min(230px,58vw,34vh);aspect-ratio:1;margin:0 0 var(--s-2)}
.rw-bstage::before{content:'';position:absolute;left:4%;right:4%;bottom:0;height:42%;border-radius:50%;background:var(--star-tint)}
.rw-bstage .rw-boss{position:relative;animation:rw-pop 600ms var(--spring) both}
.rw-bstage .rb-fig{transform-box:fill-box;transform-origin:50% 100%;animation:rw-bob 1.6s var(--ease) 600ms 3}
.rw-zaps{display:flex;justify-content:center;gap:2px;margin:0 0 var(--s-2);color:var(--try)}
.rw-badge{position:relative;display:inline-block;width:76px;height:76px;flex:none}
.rw-rose{display:block;width:100%;height:100%}
.rw-be{position:absolute;left:0;right:0;top:21%;font-size:34px;line-height:1;text-align:center}
.rw-bin .bossbig{font-size:min(140px,26vh)}

/* ---- the boss in the round's top bar (renderQ puts G.boss.e, the drawing, in .bossE) ---- */
.rw-boss .rb-fig{transform-box:fill-box;transform-origin:50% 100%;transition:transform var(--t) var(--ease)}
.rw-boss .rb-hit{opacity:0}
.rw-boss.rw-p-hit .rb-idle,.bossE.hit .rw-boss .rb-idle,.bossE.ko .rw-boss .rb-idle{opacity:0}
.rw-boss.rw-p-hit .rb-hit,.bossE.hit .rw-boss .rb-hit,.bossE.ko .rw-boss .rb-hit{opacity:1}
.rw-boss.rw-p-hit .rb-fig{transform:rotate(-6deg)}
.bossE .rw-boss{width:1.3em;height:1.3em}
.bossE.hit{animation:rw-hit 450ms var(--ease)}

/* ---- motion ---- */
@keyframes rw-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes rw-up{from{opacity:0;transform:translateY(24px)}}
@keyframes rw-in{from{opacity:0}}
@keyframes rw-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1}}
@keyframes rw-starpop{0%{opacity:0;transform:scale(0) rotate(-40deg)}60%{opacity:1;transform:scale(1.15) rotate(6deg)}100%{transform:none}}
@keyframes rw-stk{0%{opacity:0;transform:scale(0) rotate(var(--r,0deg))}100%{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes rw-rays{0%{opacity:0;transform:scale(.4)}}
@keyframes rw-rattle{0%,55%,100%{transform:none}62%{transform:rotate(-5deg) scale(1.03)}72%{transform:rotate(5deg) scale(1.03)}82%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
@keyframes rw-bump{40%{transform:scale(1.2)}}
@keyframes rw-bob{50%{transform:translateY(-6px) scale(1.02,.98)}}
@keyframes rw-wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes rw-hit{25%{transform:translateX(-7px) scale(.88)}60%{transform:translateX(5px) scale(1.06)}}
@keyframes rw-cf{0%{opacity:1;transform:translate(0,0) scale(.3) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--t))}}
/* P2-24 sentences: story order (sent 5) puts whole sentences on the order tiles. A tile that holds a .sl span is a full-width row
   that wraps its words; the three slots above it become full-width rows too, so nothing runs off a 380 px screen. */
.oslots:has(+ .otiles .sl){flex-direction:column;align-items:stretch;max-width:none;gap:var(--s-2)}
.oslots:has(+ .otiles .sl) .socket.os{width:100%;min-height:var(--tap);padding:var(--s-1) var(--s-3)}
.otiles:has(.sl){flex-direction:column;align-items:stretch}
.piece.ot:has(.sl),.socket.os:has(.sl){display:flex;align-items:center;justify-content:flex-start;text-align:left;white-space:normal;height:auto;min-height:var(--tap)}
.sl{display:block;font-size:var(--fs-3);line-height:1.25;padding:var(--s-1) 0}
/* Pet Shop and sticker book (P4-07; DESIGN_SYSTEM 6.4). Tokens only; motion on transform / opacity. Old .tabs / .shopgrid / .item
   rules (40-games.css) still serve the games and Pet Care, so these are scoped. */

/* ---- Pet Shop: a sticky stage + info bar, then tabs and the item cards; side by side on a wide landscape screen ---- */
.ps-scroll{padding:0 0 var(--s-6)}
.ps{display:flex;flex-direction:column;gap:var(--s-3);max-width:1120px;margin:0 auto;padding:0 var(--s-4)}
.ps-hold{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:var(--s-2);padding-top:var(--s-1);background:var(--paper)}
.ps-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;height:clamp(168px,26vh,300px);border-radius:var(--r-hero);
  overflow:hidden;background:linear-gradient(var(--ill-blue-1),var(--ill-aqua-1) 75%)}
.ps-stage .petbig{position:relative;font-size:clamp(78px,13vh,140px);margin-bottom:2px;text-shadow:none}
.ps-stage .pet-svg{width:1.95em;height:1.95em;margin:-.3em -.26em -.12em}
.ps-it{display:flex;align-items:center;gap:var(--s-3);min-height:72px;padding:var(--s-2) var(--s-2) var(--s-2) var(--s-3);border-radius:var(--r-card);
  background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.ps-itp{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--surface-2);overflow:hidden}
.ps-itt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ps-itt b{font-family:var(--font-display);font-size:var(--fs-4);line-height:1.2;color:var(--ink)}
.ps-itt>span{display:flex;align-items:center;gap:var(--s-1);font-size:var(--fs-2);line-height:1.3;color:var(--ink-2)}
.ps-line .ic{width:22px;height:22px;flex:none}
.ps-it .btn{flex:none}
.btn.soft.ps-short{color:var(--ink-3)}
.btn.soft.ps-short .ic{color:var(--star-shade);--ic2:var(--star-tint)}

/* tabs: a segmented strip; the open tab is a raised white key */
.ps .ps-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-1);margin:0;padding:var(--s-1);border-radius:20px;background:var(--surface-2)}
.ps-tabs .btn.tab{display:flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:52px;padding:0 var(--s-2);border-radius:16px;
  background:transparent;box-shadow:none;color:var(--ink-2);font-family:var(--font-display);font-size:var(--fs-3)}
.ps-tabs .btn.tab .ic{flex:none;color:var(--ink-3)}
.ps-tabs .btn.tab.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ledge-soft)}
.ps-tabs .btn.tab.on .ic{color:var(--play)}
.ps-shelf .ps-tabs{margin-bottom:var(--s-3)}

/* item cards: the drawing on a soft well, the name, a coin price chip or a tag */
.ps .ps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--s-3)}
.btn.ps-card{display:flex;flex-direction:column;align-items:center;gap:var(--s-1);min-width:0;padding:var(--s-2) var(--s-2) var(--s-3);
  border-radius:var(--r-card);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.btn.ps-card:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--ledge-soft)}
.ps-card span{font-size:var(--fs-2)}
.ps-card .ps-pic{display:grid;place-items:center;width:100%;height:80px;border-radius:16px;background:var(--surface-2);overflow:hidden}
.ps-pic .wr-pic{width:68px;height:68px}
.ps-card .ps-nm{max-width:100%;font-size:var(--fs-2);font-weight:700;line-height:1.2;color:var(--ink);text-align:center}
.ps-card .ps-pr,.ps-card .ps-tag{display:inline-flex;align-items:center;gap:2px;min-height:28px;padding:0 var(--s-2) 0 2px;border-radius:var(--r-pill);
  font-size:var(--fs-2);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ps-pr{background:var(--star-tint);color:var(--ink)}
.ps-pr .ic{width:24px;height:24px}
.ps-card .ps-pr.short{background:var(--surface-2);color:var(--ink-3)}
.ps-card .ps-tag{padding:0 var(--s-2);background:var(--brand-tint);color:var(--brand-shade)}
.ps-tag .ic{width:18px;height:18px}
.ps-card .ps-tag.on{padding-left:var(--s-1);background:var(--good-tint);color:var(--good-ink)}
.ps-card .ps-tag.ps-prize{padding-left:var(--s-1);background:var(--star-tint);color:var(--try-ink)}
.btn.ps-card.wear{box-shadow:inset 0 0 0 3px var(--good),0 4px 0 var(--good-ink)}
.ps-card.wear .ps-pic{background:var(--good-tint)}
.btn.ps-card.sel{box-shadow:inset 0 0 0 3px var(--brand),0 4px 0 var(--brand-shade)}
.ps-card.sel .ps-pic{background:var(--brand-tint)}
/* a place: its drawn scene fills the picture well */
.ps-scn{position:relative;display:block;width:100%;height:100%;background:linear-gradient(var(--ill-blue-1),var(--ill-aqua-1) 75%)}
.ps-itp .ps-scn{border-radius:16px}

/* buy sheet: the item big on a gold well */
.ps-sheet{text-align:center}
.ps-big{display:grid;place-items:center;width:136px;height:136px;margin:0 auto var(--s-3);border-radius:32px;background:var(--star-tint);overflow:hidden}
.ps-big .ps-scn{width:136px;height:136px}

@media (max-width:480px){
  .ps{padding:0 var(--s-3)}
  .ps .ps-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
  .ps-card .ps-pic{height:72px}
  .ps-pic .wr-pic{width:60px;height:60px}
  .ps-tabs .btn.tab{gap:var(--s-1)}
}
/* wide landscape (tablet held sideways): the stage on the left stays, the shelf scrolls on the right */
@media (min-width:700px) and (orientation:landscape){
  .ps{flex-direction:row;align-items:flex-start;gap:var(--s-4)}
  .ps-hold{flex:0 0 42%;padding-top:var(--s-2);background:none}
  .ps-stage{height:calc(100vh - 200px);min-height:200px;max-height:440px}
  .ps-stage .petbig{font-size:clamp(84px,25vh,170px)}
  .ps-shelf{flex:1;min-width:0;padding-top:var(--s-2)}
}

/* ---- sticker book: a header card, then pages of cream paper with a ring binding; die-cut stickers and dashed empty slots ---- */
.sb{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-4);padding-top:var(--s-2)}
.stat.sb-cnt{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.sb-cnt .ic{color:var(--read)}
.sb-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3) var(--s-4);padding:var(--s-3) var(--s-4);border-radius:var(--r-card);
  background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.sb-hl{flex:1 1 260px;min-width:0}
.sb-hl p{margin:var(--s-2) 0 0;font-size:var(--fs-3);line-height:1.4;color:var(--ink-2)}
.sb-head .bk-bt{margin:0}
.sb .sb-pages{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-4)}
@media (min-width:560px){.sb .sb-pages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sb-page{position:relative;padding:var(--s-3) var(--s-4) var(--s-4) calc(var(--s-6) + 6px);border-radius:var(--r-card);
  background:linear-gradient(90deg,var(--ill-cream-2),var(--ill-cream) 14px,var(--ill-cream-1) 40px);
  box-shadow:inset 0 0 0 2px var(--ill-cream-2),0 4px 0 var(--ill-cream-2)}
.sb-page::before{content:'';position:absolute;left:8px;top:18px;bottom:18px;width:12px;
  background:radial-gradient(circle,var(--ill-cream-3) 0 3.5px,var(--ill-cream-2) 4px 5.5px,transparent 6px) center top/12px 28px repeat-y}
.sb-ph{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);margin:0 0 var(--s-3);
  font-family:var(--font-display);font-size:var(--fs-4);line-height:1.2;color:var(--read-shade)}
.sb-pc{display:inline-flex;align-items:center;gap:var(--s-1);font-family:inherit;font-size:var(--fs-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sb-page.full .sb-pc{color:var(--good-ink)}
.sb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-2)}
.sb-slot{display:grid;place-items:center;aspect-ratio:1/1;min-height:56px;border-radius:18px}
.sb-no{box-shadow:inset 0 0 0 2px var(--ill-cream-2);background:var(--ill-cream);color:var(--ill-cream-2)}
.sb-no .ic{width:28px;height:28px}
.sb-stk{position:relative;padding:0;border:0;background:transparent;font:inherit;cursor:pointer;transform:rotate(var(--r,0deg));
  transition:transform var(--t-fast) var(--ease)}
.sb-stk:active{transform:rotate(var(--r,0deg)) scale(.92)}
/* the die-cut: a white border that follows the picture (stacked text shadows), then a soft drop shadow */
.sb-e{font-size:46px;line-height:1;
  text-shadow:3px 0 0 var(--surface),-3px 0 0 var(--surface),0 3px 0 var(--surface),0 -3px 0 var(--surface),2px 2px 0 var(--surface),
  -2px 2px 0 var(--surface),2px -2px 0 var(--surface),-2px -2px 0 var(--surface),0 5px 6px var(--drop)}
.sb-n{position:absolute;right:2%;bottom:4%;padding:0 6px;border-radius:var(--r-pill);background:var(--read);color:var(--surface);
  font-size:var(--fs-2);line-height:1.5;font-variant-numeric:tabular-nums;transform:rotate(calc(var(--r,0deg) * -1))}
@media (min-width:700px){.sb-e{font-size:50px}}
@media (max-width:480px){.sb-page{padding:var(--s-3) var(--s-3) var(--s-3) calc(var(--s-6) + 2px)}.sb-e{font-size:40px}.sb-hl p{font-size:var(--fs-2)}}
/* P2-12 Crystal Caves: unit cubes drawn on a box (VIZ.solid with o.grid), and the (x, y) answer boxes of coord 1 */
.viz .vcg{fill:none;stroke:var(--surface);stroke-width:1.5;opacity:.75}
.viz .vcg.vct{stroke:var(--math-shade);opacity:.55}
.viz .vsl.c2 .vcg.vct{stroke:var(--play-shade)}
.ccxy{display:inline-flex;align-items:center;gap:.12em}
.ccsep{font-weight:700;margin:0 .1em;color:var(--ink-3)}
/* long choices (y = 5x + 2, B is 5 times A) go one under the other so no word is cut */
.choices.ccw{grid-template-columns:1fr}
.choices.ccw .choice.ch{min-height:var(--tap-primary);font-size:clamp(20px,3.6vh,28px)}
/* P2-10 Decimal Desert: three long words as choices (parallel, perpendicular, equilateral ...) go one under the other */
.choices.dsw{grid-template-columns:1fr}
.choices.dsw .choice.ch{min-height:var(--tap-primary);font-size:clamp(20px,3.6vh,28px)}
/* P2-14 Galaxy Core: the ray of an inequality on a number line (VIZ.rayLine), picture choices of those lines, (x, y) answers */
.viz .vray{fill:none;stroke:var(--math-shade);stroke-width:6;stroke-linecap:round}
.choices.galr .ch .viz{margin:0 auto;width:calc(var(--vw)*.8px);max-width:100%}
.choices.galr .choice.ch{min-height:var(--tap-primary)}
/* the balance of a one-step equation hint stays small so the hint card keeps the keypad in view */
.galbal .viz{--vz:.42}

.hm-place{margin-top:var(--s-4);padding:var(--s-4);border-radius:var(--r-card);background:var(--brand-tint)}

.hm-pli{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--brand);box-shadow:inset 0 -3px 0 var(--brand-shade)}

  border-radius:var(--r-btn);font-family:var(--font-display);font-size:var(--fs-3);line-height:1.2}
.hm .hm-plb{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft)}
.hm .hm-plb .ic{color:var(--c)}
.hm .hm-plb:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.hm .hm-pln{padding:var(--s-2) var(--s-4);background:transparent;box-shadow:none;color:var(--ink-2)}
.hm .hm-pln:active{transform:translateY(2px);box-shadow:none}

/* ---- Today row: review, Fact Sprint, Mixed Practice ---- */
.hm-today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3)}
.hm-rvw{display:flex;min-width:0}
.hm-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);width:100%;min-width:0;min-height:124px;
  padding:var(--s-3) var(--s-1);border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);font:inherit;

  box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
button.hm-tile{cursor:pointer}
button.hm-tile:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.hm-tile.ok{background:var(--good-tint);color:var(--good-ink);box-shadow:none}
.hm-ti{position:relative;display:grid;place-items:center;flex:none;width:60px;height:60px;border-radius:50%;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));box-shadow:inset 0 -4px 0 var(--c-shade,var(--brand-shade))}
.t-rev{--c:var(--play);--c-shade:var(--play-shade)}
.t-ok{--c:var(--good);--c-shade:var(--good-ink)}
.t-mix{--c:var(--brand-tint);--c-shade:var(--ledge-soft)}
.hm-cnt{position:absolute;top:-6px;right:-12px;display:grid;place-items:center;min-width:30px;height:30px;padding:0 var(--s-2);
  border-radius:var(--r-pill);background:var(--read);color:var(--surface);font-size:var(--fs-2);line-height:1;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 3px var(--surface)}
.hm-bolt{position:absolute;right:-8px;bottom:-4px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--star);color:var(--ink);box-shadow:0 0 0 3px var(--surface)}
.hm-tl{display:block;max-width:100%}

/* ---- Puzzle of the Day (P3-17): a small white card under the Today row, Brain Teasers purple art; green when done ---- */
.hm .hm-pod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s-3);width:100%;min-height:84px;margin-top:var(--s-3);
  padding:var(--s-2) var(--s-3) var(--s-2) var(--s-2);border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);font:inherit;text-align:left;
  cursor:pointer;box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.hm .hm-pod:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.hm-podi{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:18px;background:var(--bt-tint)}
.hm .hm-podi .hm-svg{width:52px;height:52px}
.hm-podt{min-width:0}
.hm-podt b{display:block;font-family:var(--font-display);font-size:var(--fs-4);line-height:1.2;overflow-wrap:normal}
.hm-podt span{display:block;margin-top:2px;font-size:var(--fs-2);font-weight:700;line-height:1.3;color:var(--bt-shade)}
.hm-podr{display:inline-flex;align-items:center;gap:2px;padding:var(--s-1) var(--s-3) var(--s-1) var(--s-1);border-radius:var(--r-pill);
  background:var(--star-tint);color:var(--try-ink);font-size:var(--fs-3);font-weight:700;line-height:1;white-space:nowrap}
.hm-podk{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--good);box-shadow:inset 0 -3px 0 var(--good-ink)}
.hm .hm-pod.done{background:var(--good-tint);box-shadow:none}
.hm-pod.done .hm-podt span{color:var(--good-ink)}

/* ---- path cards and the Game Room: a big subject-colour button with a drawing ---- */
.hm-paths{display:grid;gap:var(--s-3)}
.hm .hm-path{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s-4);width:100%;
  min-height:108px;padding:var(--s-3) var(--s-4) var(--s-3) var(--s-3);border:0;border-radius:var(--r-card);overflow:hidden;
  font:inherit;text-align:left;color:var(--surface);cursor:pointer;
  background:radial-gradient(circle at 96% -20%,var(--hi) 0 30%,var(--hi-0) 30.5%),linear-gradient(var(--hi),var(--hi-0) 45%) var(--c-fill,var(--c));
  box-shadow:0 5px 0 var(--c-ledge,var(--c-shade));transition:transform var(--t-fast) var(--ease)}
.hm .hm-path:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c-ledge,var(--c-shade))}
.hm-art{display:grid;place-items:center;flex:none;width:84px;height:84px;border-radius:24px;background:var(--surface);
  box-shadow:inset 0 -5px 0 var(--c-tint),0 3px 0 var(--drop)}
.hm-art>.ic{color:var(--c)}
.hm-svg{display:block;width:70px;height:70px;overflow:visible}
.hm-svg text{font-family:var(--font-display);font-weight:700;text-anchor:middle}
.hm-pi{min-width:0}
.hm-pt{display:block;font-family:var(--font-display);font-size:var(--fs-5);font-weight:700;line-height:1.15}
.hm-pm{display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-2)}
.hm-pm .gauge{flex:1;background:var(--drop);box-shadow:none}
.hm-pm .gauge>i{background:var(--star);box-shadow:inset 0 3px 0 var(--hi)}
.hm-pm b{font-size:var(--fs-2);line-height:1;font-variant-numeric:tabular-nums}
.hm-pn{display:block;margin-top:var(--s-1);font-size:var(--fs-2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-gsub{display:flex;align-items:center;gap:var(--s-1);white-space:normal}
.hm-gsub .ic{color:var(--star)}
.hm-go{display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface);color:var(--c-fill,var(--c));
  box-shadow:0 4px 0 var(--drop)}
.hm-go .ic{margin-left:2px}
.hm-path.shut .hm-go{color:var(--ink-3)}
.hm-path.shut .hm-go .ic{margin-left:0}

/* ---- secondary actions: icon tiles ---- */
.hm-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-3);margin-top:var(--s-5)}
.hm-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);min-width:0;min-height:108px;
  padding:var(--s-3) var(--s-1);border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);font:inherit;
  font-family:var(--font-display);font-size:var(--fs-2);font-weight:700;line-height:1.2;text-align:center;overflow-wrap:normal;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.hm-act:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.hm-ai{position:relative;display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:16px;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c);box-shadow:inset 0 -4px 0 var(--c-shade)}
.t-race{--c:var(--bt);--c-shade:var(--bt-shade)}
.t-care{--c:var(--good);--c-shade:var(--good-ink)}
.t-shop{--c:var(--read);--c-shade:var(--read-shade)}
.t-book{--c:var(--star);--c-shade:var(--star-shade);color:var(--try-ink);--ic2:var(--star)}
.hm-need{position:absolute;top:-8px;right:-10px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--play);color:var(--surface);font-size:var(--fs-2);font-style:normal;font-weight:700;line-height:1;box-shadow:0 0 0 3px var(--surface)}

.hm-ver{display:flex;align-items:center;justify-content:center;gap:var(--s-1);margin:var(--s-6) 0 var(--s-1);font-size:var(--fs-2);color:var(--ink-3)}
.hm-ver .ic{color:var(--star-shade)}

/* ---- phones ---- */
@media (max-width:480px){
  .scroll.hm{padding:var(--s-1) var(--s-3) var(--s-5)}
  .hm-logo{font-size:var(--fs-4)}
  .hm-mark{width:40px;height:40px;border-radius:12px}
  .hm-today,.hm-acts{gap:var(--s-2)}
  .hm-tile{min-height:116px;font-size:var(--fs-2)}
  .hm-ti{width:56px;height:56px}
  .hm .hm-path{gap:var(--s-3);min-height:96px;padding:var(--s-3) var(--s-3) var(--s-3) var(--s-2)}
  .hm-art{width:72px;height:72px;border-radius:20px}
  .hm-svg{width:60px;height:60px}
  .hm-pt{font-size:var(--fs-4)}
  .hm-go{width:48px;height:48px}
  .hm-act{min-height:100px}
  .hm-ai{width:48px;height:48px}
  .hm .hm-pod{gap:var(--s-2)}
  .hm-podt b{font-size:var(--fs-3)}
}

/* ---- Today's missions (P5-08): three rows, each a button (a tick card when done); a subject-coloured disc, two lines, a go arrow ---- */
.hm-mis{display:grid;gap:var(--s-2)}
.hm .hm-mi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s-3);width:100%;min-height:64px;
  padding:var(--s-2) var(--s-3) var(--s-2) var(--s-2);border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);font:inherit;
  text-align:left;box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft)}
.hm button.hm-mi{cursor:pointer;transition:transform var(--t-fast) var(--ease)}
.hm button.hm-mi:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.hm .hm-mi.done{background:var(--good-tint);color:var(--good-ink);box-shadow:none}
.hm-mic{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));box-shadow:inset 0 -3px 0 var(--c-shade,var(--brand-shade))}
.hm-mi.done .hm-mic{--c:var(--good);--c-shade:var(--good-ink)}
.hm-mt{display:grid;gap:2px;min-width:0}
.hm-mt b{font-family:var(--font-display);font-size:var(--fs-3);line-height:1.2}
.hm-mt span{font-size:var(--fs-2);line-height:1.3;color:var(--ink-2)}
.hm-mi.done .hm-mt span{color:var(--good-ink)}
.hm-mg{display:grid;place-items:center;color:var(--brand)}
.hm-mi.done .hm-mg{color:var(--good-ink)}
/* what a finished mission won, on the sprint and puzzle end cards */
.mis-win{display:grid;gap:var(--s-2);margin:var(--s-3) 0 0;padding:0;list-style:none;font-size:var(--fs-2);line-height:var(--lh-2);font-weight:700;color:var(--good-ink)}
.mis-win li{display:flex;align-items:center;justify-content:center;gap:var(--s-3)}
.mis-win .ic{flex:none}
.mis-win .rw-stk{width:48px;height:48px;border-radius:16px}
.mis-win .rw-se{font-size:30px}
@media (min-width:900px){.hm-mis{gap:var(--s-3)}}
/* P4-18 graphics quality pass: drawn chrome for the screens that still had emoji or flat looks (map stops and world badges,
   Fact Sprint, Speed Race, streak calendar, placement, Pet Care, setup, Game Room). Tokens only; motion is transform/opacity
   (calm mode and reduced motion stop it in 20-base.css). Markup ids and classes are the ones the screens always had. */

/* ---- map (until P4-09 draws the world scenes) ---- */
.mp-top .ttl.mp-ttl{display:flex;align-items:center;gap:var(--s-2);color:var(--ink)}
.mp-ttl .ic{flex:none;color:var(--c,var(--brand))}
.mp-ttl span{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* world badge: a disc in the world's own colour (--wb, from PATHS) with the icon of its first new skill */
.wbadge{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--wb,var(--c-tint));
  color:var(--c-shade,var(--brand-shade));box-shadow:inset 0 0 0 2px var(--surface),inset 0 -3px 0 var(--drop),0 2px 0 var(--drop)}
.wbadge .ic{width:20px;height:20px}
.wchip.on .wbadge .ic,.wchip.lock .wbadge .ic{color:var(--c-shade,var(--brand-shade))}
.wchip.lock .wbadge{opacity:.6}
.wmore .wbadge{width:30px;height:30px}
.wmore>.ic{color:var(--brand)}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:var(--s-2);z-index:1;white-space:nowrap;
  background:var(--surface);border-radius:var(--r-pill);padding:var(--s-1) var(--s-4) var(--s-1) var(--s-1);font-family:var(--font-display);
  font-weight:700;font-size:var(--fs-4);line-height:1.2;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--ledge-soft)}
.wtitle .wbadge{width:40px;height:40px}
.wtitle .wbadge .ic{width:24px;height:24px}
.wtitle.mp-champ{padding:var(--s-2) var(--s-5);font-size:var(--fs-5);background:var(--star-tint);box-shadow:inset 0 0 0 3px var(--star),0 5px 0 var(--star-shade)}
.mp-champ .ic{color:var(--star-shade)}
.tobtn{position:absolute;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;display:flex;align-items:center;gap:var(--s-1);
  min-height:var(--tap);padding:0 var(--s-4) 0 var(--s-3);background:var(--star-tint);color:var(--try-ink);box-shadow:inset 0 0 0 2px var(--star),0 4px 0 var(--star-shade)}
.tobtn .ic{color:var(--star-shade)}
.tobtn:active{transform:translateX(-50%) translateY(3px);box-shadow:inset 0 0 0 2px var(--star),0 1px 0 var(--star-shade)}
/* stops: 72 px discs with a ledge and a top gloss; open = white with a coloured ring, done = subject fill, cur = fill and a pulsing ring */
.btn.node{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;padding:0;display:grid;place-items:center;z-index:2;
  background:var(--surface);color:var(--c,var(--brand));box-shadow:inset 0 0 0 4px var(--c,var(--brand)),0 5px 0 var(--c-shade,var(--brand-shade))}
.btn.node .ic{width:38px;height:38px}
.btn.node.done,.btn.node.cur{background:linear-gradient(var(--hi),var(--hi-0) 55%) var(--c,var(--brand));color:var(--surface);
  box-shadow:inset 0 3px 0 var(--hi),inset 0 0 0 4px var(--surface),0 5px 0 var(--c-shade,var(--brand-shade))}
.btn.node.cur::after{content:'';position:absolute;inset:-9px;border:4px solid var(--c,var(--brand));border-radius:50%;opacity:0;
  animation:k-ring 1.8s var(--ease) infinite;pointer-events:none}
.btn.node.lock{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 3px var(--line),0 3px 0 var(--line)}
.btn.node.lock .ic{width:30px;height:30px}
.btn.node:active{transform:translateY(3px)}
.btn.node.lock:active{transform:none}
.btn.node.boss{width:92px;height:92px;margin:-46px 0 0 -46px;overflow:visible;background:var(--c-tint,var(--brand-tint));
  box-shadow:inset 0 0 0 4px var(--c,var(--brand)),0 6px 0 var(--c-shade,var(--brand-shade))}
.btn.node.boss.done{box-shadow:inset 0 0 0 4px var(--star),0 0 0 3px var(--star-shade),0 6px 0 3px var(--star-shade)}
.btn.node.boss.cur{background:var(--c-tint,var(--brand-tint))}
.btn.node.boss.lock{background:var(--surface-2);box-shadow:inset 0 0 0 3px var(--line),0 3px 0 var(--line)}
.node .nb-art{width:104px;height:104px;margin-top:-22px;pointer-events:none}
.node .nb-e{font-size:46px;line-height:1}
.nlab{position:absolute;transform:translateX(-50%);width:max-content;max-width:140px;font-size:var(--fs-1);font-weight:700;text-align:center;line-height:1.2;
  pointer-events:none;z-index:2;color:var(--ink);background:var(--surface);border-radius:var(--r-chip);padding:2px var(--s-2);box-shadow:0 2px 0 var(--drop)}
.nstar{display:flex;justify-content:center;margin-top:2px}
.nstar:empty{display:none}
.nstar .rs .rs-b{transform:translateY(2px)}

/* ---- activity cards (GFX.card): the P4-04 path-card look for Fact Sprint sets and modes, Speed Race, Game Room ---- */
.pathcard.gx-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s-4);padding:var(--s-4);border-radius:var(--r-card);text-align:left}
.gx-card .pc-badge{position:relative}
.gx-tag{position:absolute;right:-8px;bottom:-6px;min-width:28px;padding:1px 6px;border-radius:var(--r-pill);font-style:normal;font-family:var(--font-display);
  font-size:var(--fs-2);font-weight:700;line-height:1.3;text-align:center;color:var(--c-shade,var(--brand-shade));background:var(--surface);
  box-shadow:inset 0 0 0 2px var(--c,var(--brand)),0 2px 0 var(--c-shade,var(--brand-shade))}
.gx-txt{min-width:0}
.gx-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--s-1);margin-top:var(--s-1);font-size:var(--fs-2);line-height:1.35;color:var(--ink-2)}
.gx-sub .ic{flex:none;color:var(--c,var(--brand))}
.gx-ln{display:flex;align-items:center;gap:var(--s-1);flex:1 0 100%}
.gx-sub b{color:var(--ink)}
.gx-best{display:flex;flex-direction:column;align-items:center;min-width:56px;font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;line-height:1;color:var(--ink)}
.gx-best .ic{color:var(--star-shade);margin-bottom:2px}
.gx-list .games{gap:var(--s-4);max-width:640px;margin:0 auto}
.gx-lead{margin:var(--s-1) auto var(--s-4);max-width:36ch;text-align:center;font-size:var(--fs-3);font-weight:700;color:var(--ink-2)}
.gx-note{display:flex;align-items:center;justify-content:center;gap:var(--s-2);margin:var(--s-5) auto 0;font-size:var(--fs-2);color:var(--ink-2)}
.gx-note .ic{flex:none;color:var(--play)}
@media (max-width:480px){.pathcard.gx-card{gap:var(--s-3);padding:var(--s-3)}}
/* menu top bar: back, a coloured badge, the title */
.gx-ttl{display:flex;align-items:center;gap:var(--s-2)}
.gx-ttl>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gx-tb{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));box-shadow:inset 0 -3px 0 var(--c-shade,var(--brand-shade))}
.gx-tb .ic{width:24px;height:24px}

/* ---- timed games (Fact Sprint, Speed Race): close, time gauge, chips; the P4-10 keys; the end card ---- */
.gx-top .gx-bar{flex:1;min-width:64px}
.gx-top .gauge>i{background:var(--try)}
.stat.bolt .ic,.stat.trophy .ic{color:var(--star-shade)}
.stat.timer b,.stat.bolt b{font-variant-numeric:tabular-nums}
.gx-gap{display:block}
.gx-end{padding:var(--s-5) var(--s-5) var(--s-5)}
.gx-disc{position:relative;width:96px;height:96px;background:var(--star-tint);color:var(--star-shade);--ic2:var(--star-tint);
  box-shadow:inset 0 0 0 4px var(--star),0 5px 0 var(--star-shade)}
.gx-disc.rec{animation:rw-pop 600ms var(--spring) both}
.gx-end .rw-rays{position:absolute;left:50%;top:-30px;width:300px;height:300px;margin-left:-150px;opacity:.7;pointer-events:none}
