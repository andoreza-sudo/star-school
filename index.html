:root{--bg:#fff8ec;--ink:#2d2a26;--blue:#3b82f6;--green:#16a34a;--red:#dc2626;--muted:#78716c;--card:#fff;--math:#dbeafe;--read:#fce7f3;--big:clamp(44px,11vmin,96px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:Andika,system-ui,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(circle at 20% 10%,#fff3d6 0,transparent 40%),radial-gradient(circle at 90% 90%,#e0f2fe 0,transparent 45%),var(--bg)}
input{font:inherit;-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:scale(.97)}}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:none}
.title{font-size:24px;font-weight:700}
.sp{flex:1}
.stars{font-size:22px;font-weight:700;white-space:nowrap;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 3px 0 #0001}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
.btn{border:0;border-radius:18px;background:var(--card);box-shadow:0 4px 0 #0002;font:inherit;font-weight:700;color:var(--ink);padding:12px 16px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #0002}
.btn.sm{font-size:18px;padding:10px 14px}
.btn.xs{padding:4px 10px;font-size:16px;border-radius:10px}
.btn.big{font-size:24px;padding:16px 26px;background:var(--green);color:#fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;text-align:center;overflow:auto;min-height:0}
.center>:first-child{margin-top:auto}.center>:last-child{margin-bottom:auto}
h1{font-size:34px;margin:0 0 14px}
h2{font-size:24px;margin:18px 4px 10px}
.small{font-size:16px;color:var(--muted);font-weight:400}
.scroll{flex:1;overflow:auto;padding:0 14px 24px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;font-size:19px}
.tile.math{background:var(--math)}.tile.read{background:var(--read)}
.te{font-size:44px;transition:transform .2s}.tile:active .te{transform:rotate(-12deg) scale(1.2)}
.lv{color:#f59e0b;font-size:20px;letter-spacing:2px}
/* hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:24px;padding:14px 18px;margin:4px 0 6px;box-shadow:0 4px 0 #0001}
.petbig{font-size:96px;line-height:1;cursor:pointer;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0002)}
.pet.aura,.petbig.aura{filter:drop-shadow(0 0 12px #facc15) drop-shadow(0 0 4px #fff)}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.jump{animation:jump .5s!important}
@keyframes jump{30%{transform:translateY(-30px) scale(1.15) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}}
.sad{animation:sad .5s!important}
@keyframes sad{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.hinfo{flex:1;min-width:0}
.hname{font-size:26px;font-weight:700}
.meter{height:16px;background:#fff9;border-radius:9px;overflow:hidden;margin:6px 0 2px}
.meter div{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:9px;transition:width .6s}
.meter.m div{background:linear-gradient(90deg,#22c55e,#14b8a6)}
.htxt{font-size:16px;font-weight:700;color:#78350f}
/* play */
.track{position:relative;flex:1;height:52px;margin:0 6px}
.track .line{position:absolute;left:0;right:30px;top:34px;border-top:5px dotted #d6cfc4}
.track .chest{position:absolute;right:0;top:12px;font-size:34px}
.runner{position:absolute;top:2px;font-size:40px;line-height:1;transition:left .5s cubic-bezier(.5,1.6,.5,1)}
.bubble{position:absolute;top:46px;left:0;background:#fff;border-radius:14px;padding:4px 10px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px #0002;opacity:0;transition:opacity .2s;z-index:5}
.bubble.on{opacity:1}
.streak{font-size:20px;flex:none;font-weight:700;color:#ea580c;background:#ffedd5;border-radius:14px;padding:4px 10px;white-space:nowrap;display:none}
.streak.on{display:block;animation:bump .4s}
.play{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;min-height:0}
.qarea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;min-height:0;text-align:center;overflow:auto}
.qarea>:first-child{margin-top:auto}.qarea>:last-child{margin-bottom:auto}
.prompt{--k:1;font-size:calc(var(--big)*var(--k));max-width:100%;font-weight:700;line-height:1.2;animation:qin .35s cubic-bezier(.5,1.6,.5,1)}
@keyframes qin{from{transform:scale(.6);opacity:0}}
.eq{white-space:nowrap}
.veq{display:inline-grid;justify-items:end;font-variant-numeric:tabular-nums}
.veq .bar{justify-self:stretch;height:6px;background:var(--ink);border-radius:3px;margin:4px 0}
.veq .op{margin-right:.35em}
.seq{font-size:calc(clamp(30px,8vmin,72px)*var(--k))}
.slot{display:inline-block;min-width:1.3em;min-height:1.15em;line-height:1.15em;border:4px dashed #94a3b8;border-radius:14px;padding:0 .12em;color:var(--blue);vertical-align:middle;text-align:center;background:#fff8}
.slot.ok{border:4px solid var(--green);color:var(--green);animation:bump .4s}
.slot.rev{border:4px solid #f59e0b;color:#b45309}
.tools{display:flex;gap:10px}
.hint{font-size:clamp(16px,2.8vh,20px);font-weight:700;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.inp{flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.pad .k{font-size:clamp(24px,4.6vh,36px);height:clamp(46px,8.5vh,76px);padding:0}
.pad .go{background:var(--green);color:#fff}.pad .del{background:#fde68a}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto;width:100%}
.ch{font-size:clamp(26px,4.6vh,34px);padding:clamp(10px,2vh,18px) 8px}
.choices.pics{grid-template-columns:repeat(3,1fr)}
.choices.pics .ch{font-size:clamp(44px,8vh,64px);padding:6px}
.ch.right{background:#bbf7d0;animation:bump .4s}.ch.wrong{background:#fecaca;opacity:.6}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.lt{font-size:clamp(30px,5.5vh,40px);width:clamp(56px,10vh,74px);height:clamp(56px,10vh,74px);padding:0;background:#fef9c3}
.lt.used{visibility:hidden}
.lt.glow{animation:glow 1s infinite}
.undo{display:block;margin:12px auto 0}
.emo{font-size:calc(clamp(70px,22vmin,160px)*var(--k));line-height:1.2;padding-bottom:.05em}
.lslots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.ls{width:1.1em;height:1.35em;border-bottom:6px solid var(--ink);font-size:calc(clamp(36px,9vmin,72px)*var(--k));display:flex;align-items:center;justify-content:center}
.ls.ok{color:var(--green)}
.story{font-size:calc(clamp(21px,4.6vmin,34px)*max(var(--k),.7));font-weight:700;line-height:1.5;max-width:760px;margin:0 0 6px}
.sent{font-size:calc(clamp(28px,6.5vmin,52px)*max(var(--k),.6));line-height:1.4}
.w{border-radius:8px;padding:0 2px}.w:active{background:#fde68a}
.sub{font-size:clamp(17px,3vh,22px);color:var(--muted);font-weight:700}
.hear{font-size:calc(64px*var(--k));padding:.15em .4em}
.rods{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rowh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.rod{display:inline-flex;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 #0003}
.rod i{width:clamp(16px,3.6vmin,28px);height:clamp(16px,3.6vmin,28px);background:var(--c);border-right:1px solid #0003;position:relative}
.rod.dash i{background:#fff;border:2px dashed #94a3b8}
.rod i.x{opacity:.4}
.rod i.x::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b91c1c;font-style:normal;font-weight:900}
.pairs{display:inline-flex;gap:8px;align-items:flex-start}
.pairs span{display:flex;flex-direction:column;gap:6px}
.pairs b{width:20px;height:20px;border-radius:50%;background:var(--blue);display:block}
.emh{font-size:clamp(18px,4vh,34px);line-height:1.3;max-width:100%}
.fb{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5) rotate(-6deg);font-size:clamp(26px,7vw,44px);font-weight:700;color:var(--green);background:#fff;padding:14px 26px;border-radius:24px;box-shadow:0 8px 30px #0003;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.5,1.8,.5,1);width:max-content;max-width:90vw;text-align:center;z-index:40}
.fb.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
.fb.warn{color:#c2410c}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px #facc15}}
.fly{position:fixed;font-size:48px;margin:-24px 0 0 -24px;transition:transform .6s cubic-bezier(.5,-.4,.7,1),opacity .6s;pointer-events:none;z-index:50}
.conf{position:fixed;top:-60px;font-size:36px;animation:fall linear forwards;pointer-events:none;z-index:45}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.burst{position:fixed;font-size:30px;pointer-events:none;z-index:45;transition:transform .7s ease-out,opacity .7s}
/* finish */
.chestbtn{font-size:120px;background:none;box-shadow:none;animation:rattle 1.2s infinite;padding:0}
@keyframes rattle{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}85%{transform:rotate(-6deg)}}
.prize{font-size:clamp(70px,18vmin,120px);animation:spin .8s cubic-bezier(.5,1.6,.5,1)}
@keyframes spin{from{transform:scale(0) rotate(-360deg)}}
.newtag{display:inline-block;background:#ef4444;color:#fff;border-radius:10px;padding:2px 10px;font-size:18px;animation:bump .6s infinite}
.bigstars{font-size:min(36px,8.5vw);white-space:nowrap;margin:6px 0 6px;min-height:1.3em;line-height:1.3}
.bigstars span{display:inline-block;animation:spin .4s}
.msg{font-size:24px;font-weight:700;margin:4px 0;animation:qin .4s}
.ovl{position:fixed;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;color:#fff;text-align:center}
.ovl .grow{font-size:160px;animation:wobble .25s infinite}
@keyframes wobble{50%{transform:rotate(8deg) scale(1.05)}}
.ovl .grown{font-size:160px;animation:spin .9s cubic-bezier(.5,1.6,.5,1)}
/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.st{background:#fff;border-radius:16px;font-size:44px;height:80px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 0 #0001}
.st.no{filter:grayscale(1) brightness(1.6);opacity:.35}
.st b{position:absolute;right:6px;bottom:2px;font-size:14px;color:var(--muted)}
/* setup + grownups */
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
.card .row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.name{flex:1;min-width:0;font-size:22px;padding:8px 12px;border:2px solid #e7e5e4;border-radius:12px}
.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.pets{grid-template-columns:1fr 1fr}}
.petopt{display:flex;flex-direction:column;align-items:center;font-size:16px;padding:10px 4px}
.petopt span{font-size:52px}
.petopt.sel{background:#fde68a;outline:4px solid #f59e0b}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid #f0ebe3;text-align:left}.nw{white-space:nowrap}.tr{color:var(--muted)}
.danger{color:var(--red)}
.setup .card{width:min(560px,100%)}.setup .name{width:100%;display:block}
label.tg{display:block;font-size:20px;margin:8px 0}
@media (orientation:landscape){.play{flex-direction:row;align-items:stretch}.inp{width:46%;display:flex;flex-direction:column;justify-content:center}}
@media (max-width:560px){.hero{padding:10px;gap:10px}.petbig{font-size:64px}.hname{font-size:21px}.top{gap:6px;padding:8px}.btn.sm{font-size:16px;padding:8px 10px}.stars{font-size:18px;padding:5px 9px}.streak{font-size:16px;padding:4px 7px}.runner{font-size:32px}.track .chest{font-size:28px}.title{font-size:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.tile{font-size:17px;padding:12px 6px}.te{font-size:38px}.chestbtn{font-size:100px}.bigstars{font-size:26px}.msg{font-size:19px}h1{font-size:28px}}
@media (max-height:520px){.setup h1{font-size:24px;margin:0 0 6px}.setup .card{margin:6px 0;padding:10px}.petopt{padding:6px 4px}.petopt span{font-size:36px}.prize{font-size:64px}.chestbtn{font-size:90px}.msg{font-size:18px;margin:2px 0}h1{font-size:26px;margin:0 0 8px}.top{padding:6px 10px}.play{padding-top:8px}.tools .btn{padding:6px 10px;font-size:15px}}

/* v4: map, new skills, shop, balloons */
.petwrap{position:relative;display:inline-block;line-height:1}
.petwrap .hat{position:absolute;left:50%;top:-.34em;transform:translateX(-50%) rotate(-10deg);font-size:.5em}
.petwrap .toy{position:absolute;right:-.4em;bottom:-.02em;font-size:.44em}
.hero.dark{color:#fff}.hero.dark .htxt{color:#fde68a}.hero.dark .stars{color:var(--ink)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;padding:10px 4px;line-height:1.15}.act span{font-size:34px}
.act.mix{background:linear-gradient(135deg,#fde68a,#fca5a5)}
.map{position:relative;margin:10px 0 20px}
.map svg{position:absolute;left:0;top:0;pointer-events:none}
.wband{position:absolute;left:0;right:0;border-radius:28px}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:6px 16px;font-weight:700;font-size:20px;box-shadow:0 3px 0 #0001;white-space:nowrap;z-index:1}
.node{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;padding:0;font-size:36px;display:flex;align-items:center;justify-content:center;border:4px solid #fff;z-index:2}
.node.math{background:#bfdbfe}.node.read{background:#fbcfe8}
.node.done{border-color:#facc15}
.node.lock{background:#e7e5e4;opacity:.65;font-size:28px}
.node.cur{animation:pulse 1.4s infinite;border-color:#f59e0b}
@keyframes pulse{50%{box-shadow:0 0 0 12px #facc1577}}
.nlab{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:700;text-align:center;width:120px;line-height:1.1;pointer-events:none;z-index:2;text-shadow:0 0 3px #fff,0 0 3px #fff}
.nstar{color:#f59e0b;font-size:15px;letter-spacing:1px}
.mappet{position:absolute;font-size:42px;transform:translate(-50%,-100%);pointer-events:none;animation:bob 2.4s ease-in-out infinite;z-index:3}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0}.tab.on{background:#3b82f6;color:#fff}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:15px}.item span{font-size:44px}
.item.own{background:#dcfce7}.item.wear{outline:4px solid #22c55e}
.clock{width:calc(clamp(170px,40vmin,300px)*var(--k));height:auto;display:block;margin:0 auto}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:520px;margin:0 auto 6px}
.cn{width:calc(70px*var(--s)*var(--k));height:calc(70px*var(--s)*var(--k));border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffa,var(--c) 62%);border:3px solid #0003;display:flex;align-items:center;justify-content:center;font-size:calc(20px*var(--s)*var(--k));font-weight:700;color:#2d2a26;box-shadow:0 3px 0 #0002}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px;margin:0 auto 6px}
.grp{border:3px dashed #a8a29e;border-radius:22px;padding:6px 8px;font-size:calc(30px*var(--k));line-height:1.2;background:#fff8;display:inline-grid;grid-template-columns:repeat(var(--c),1fr)}
.choices.syms{grid-template-columns:repeat(3,1fr)}.choices.syms .ch{font-size:clamp(36px,7vh,56px)}
.choices.wide{grid-template-columns:1fr}.choices.wide .ch{font-size:clamp(20px,3.6vh,28px);padding:clamp(8px,1.6vh,14px)}
.vrow{padding:8px 0;border-top:1px solid #f0ebe3}
.rule{font-size:clamp(20px,4vh,30px);font-weight:700;text-align:center;padding:4px 12px 8px;cursor:pointer}
.bfield{position:relative;flex:1;overflow:hidden;background:linear-gradient(#bae6fd,#f0f9ff);border-radius:24px 24px 0 0;touch-action:none}
.bal{position:absolute;width:88px;height:106px;border:0;padding:0;border-radius:50% 50% 48% 52%/55% 55% 45% 45%;background:var(--c);display:flex;align-items:center;justify-content:center;font:inherit;font-size:26px;font-weight:700;color:#fff;text-shadow:0 2px 2px #0005;box-shadow:inset -10px -12px 0 #0002,inset 8px 8px 0 #fff3;cursor:pointer}
.bal::after{content:'';position:absolute;bottom:-28px;left:50%;width:2px;height:28px;background:#0004}
.ovl h2{margin:0 0 14px}
.hint.pop{animation:qin .35s cubic-bezier(.5,1.6,.5,1)}
.talking{background:#dbeafe;animation:bump .6s infinite}
.fb.long{font-size:clamp(18px,4.5vw,26px)}
.vline{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #f0ebe3}.vtxt{flex:1;font-size:16px}.btn.rec{background:#fee2e2}

.games{display:flex;flex-direction:column;gap:12px}
.game{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:24px}
.ge{font-size:52px;line-height:1}.gi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.gt{font-size:24px}
.game .meter{display:block;background:#fff9}.game .go{font-size:28px;color:#16a34a}
.swatch{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--sw);border:4px solid #0002;box-shadow:inset -6px -6px 0 #0001;vertical-align:middle}
.numpic{display:inline-flex;align-items:center;justify-content:center;min-width:1.2em;height:1.2em;padding:0 .15em;border-radius:.3em;background:#fff;border:4px solid #93c5fd;font-weight:700;font-size:.8em;line-height:1;color:#1d4ed8}
.pcap{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}.pcap small{font-size:.3em;font-weight:700;color:var(--muted)}
.choices.pics .ch .pcap small{font-size:.32em}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px}.lcard .lp{font-size:54px;line-height:1.1}.lcard b{font-size:22px;color:#1d4ed8}.lcard small{font-size:15px;color:var(--muted)}
.lcard.heard{background:#dcfce7}
.node.es{background:#bbf7d0}
.ovl .grow,.ovl .grown{font-size:min(160px,30vh)!important}.ovl h1{font-size:min(34px,7vh)}

.bossbar{flex:1;display:flex;align-items:center;gap:8px;position:relative;min-width:0}
.bossE{font-size:44px;line-height:1;position:relative;display:inline-block}
.bossE .bubble{top:46px}
.bossE.hit{animation:hit .45s}
.bossE.ko{animation:ko 1.2s forwards}
@keyframes hit{20%{transform:translateX(-8px) scale(.85);filter:brightness(2.2) saturate(.3)}60%{transform:translateX(6px) scale(1.05)}}
@keyframes ko{30%{transform:rotate(-30deg) scale(1.3)}100%{transform:rotate(720deg) scale(0);opacity:0}}
.hp{flex:1;height:18px;background:#fee2e2;border-radius:10px;overflow:hidden;border:2px solid #fca5a5;min-width:40px}
.hp div{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .4s}
#hpn{font-size:13px;white-space:nowrap;max-width:30vw;overflow:hidden}
.bossbig{font-size:min(140px,26vh);animation:wobble .5s infinite}
.node.boss{background:#fecaca;width:90px;height:90px;margin:-45px 0 0 -45px;font-size:46px;border-color:#ef4444}
.node.boss.done{border-color:#facc15}
.tobtn{position:absolute;left:50%;transform:translateX(-50%);z-index:2;background:#fef3c7;white-space:nowrap}
.tobtn:active{transform:translateX(-50%) translateY(3px)}
.rtag{background:#ede9fe;color:#6d28d9;font-weight:700;font-size:16px;border-radius:12px;padding:3px 12px}
.cbar{display:flex;align-items:center;gap:10px;margin:6px 0;font-weight:700}.cbar span{width:90px}.cbar .meter{flex:1;margin:0;background:#f5f5f4}.cbar b{width:48px;text-align:right}
.thought{position:absolute;top:-10px;right:-18px;background:#fff;border-radius:16px;padding:2px 8px;font-size:22px;box-shadow:0 2px 6px #0002;animation:bob 1.6s infinite}
.dot{position:absolute;top:4px;right:8px;background:#ef4444;color:#fff;font-style:normal;border-radius:50%;width:22px;height:22px;font-size:15px;display:flex;align-items:center;justify-content:center}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:0 0 28px 28px;padding:10px 12px 12px;margin:0 -14px 6px;position:relative;overflow:hidden;box-shadow:0 4px 10px #0001}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='starschool-v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={name:'',pet:'dragon',petName:'',buddy:'',stars:0,prog:{},stickers:{},day:{},voice:true,sound:true,music:true,best:0};
S=Object.assign({wdone:{},owned:{meadow:1},wear:{hat:'',toy:'',scene:'meadow'},unlockAll:false,coins:S.stars||0},S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function P(sk){return S.prog[sk]||(S.prog[sk]={lv:1,r:0,c:0,t:0,miss:{}})}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function day(){if(S.day.d!==today())S.day={d:today(),r:0,done:false};return S.day}

/* ---------- pets ---------- */
const PETS={dragon:{n:'Dragon',s:['🥚','🐍','🐲','🐉'],def:'Sparky'},dino:{n:'Dino',s:['🥚','🦎','🦕','🦖'],def:'Rex'},
  bird:{n:'Bird',s:['🥚','🐣','🐥','🦅'],def:'Tweety'},ocean:{n:'Sea pal',s:['🥚','🐟','🐬','🐳'],def:'Bubbles'}};
const GROW=[0,20,70,160,300];
const stage=(st=S.stars)=>GROW.filter(g=>st>=g).length-1;
const petE=(st=S.stars)=>PETS[S.pet].s[Math.min(stage(st),3)];
const petAura=(st=S.stars)=>stage(st)>=4?'aura':'';
const petN=()=>S.petName||PETS[S.pet].def;
const STK=[...'🦄🐬🦖🚀🌈🍩🎸🏆🦁🐼🍕🎈🌟🐙🦋🍦🚂⚽🎨🐢🦊🍉🏰🛸🌻🐝🍪🎃🐳🦉🏀🚁🧁🍓🐧🦒🎡⛵🌋🦜🧸🎺🐞🍭🌙🦈🚒🐘'.matchAll(/\p{Extended_Pictographic}️?/gu)].map(m=>m[0]);

/* ---------- sound engine (all synthesized, works offline) ---------- */
let AC,MG;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.9;MG.connect(AC.destination)}catch(e){}}
  if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,d,t=0,type='sine',vol=.2,slide=0){const a=ac();if(!a)return;const n=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g).connect(MG);o.start(n);o.stop(n+d+.05)}
function noise(d,t=0,vol=.15,f0=600,f1=4000){const a=ac();if(!a)return;const n=a.currentTime+t,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.Q.value=1.5;
  f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  s.connect(f).connect(g).connect(MG);s.start(n)}
const NOTE=m=>440*Math.pow(2,(m-69)/12);
const XY=[0,2,4,5,7,9,11,12,14,16];
const RAW={
  hit:()=>{noise(.18,0,.32,300,1200);tone(160,.22,0,'square',.12,60)},
  ko:()=>{[72,67,64,60,55,48].forEach((m,i)=>tone(NOTE(m),.18,i*.09,'square',.09));noise(.6,.5,.2,200,6000)},
  chomp:()=>{for(let i=0;i<3;i++){noise(.06,i*.14,.25,500,500);tone(220,.05,i*.14,'square',.06)}},
  splash:()=>{noise(.5,0,.2,800,300);noise(.4,.3,.12,1500,600)},
  click:()=>tone(1400,.03,0,'square',.04),
  key:d=>{tone(NOTE(72+XY[d]),.35,0,'sine',.22);tone(NOTE(84+XY[d]),.12,0,'sine',.06)},
  del:()=>tone(500,.12,0,'sine',.15,250),
  pop:(i=0)=>tone(420+i*90,.09,0,'sine',.22,900+i*120),
  right:s=>{const b=60+Math.min(s,10)*2;[0,4,7,12].forEach((x,i)=>tone(NOTE(b+x),.22,i*.07,'triangle',.18));tone(NOTE(b+24),.3,.28,'sine',.08)},
  wrong:()=>{tone(320,.18,0,'triangle',.2,180);tone(260,.3,.16,'triangle',.18,110)},
  coin:(i=0)=>{tone(NOTE(83+i),.06,0,'square',.07);tone(NOTE(88+i),.22,.06,'square',.07)},
  streak:()=>{[0,4,7,11,14,19].forEach((x,i)=>tone(NOTE(79+x),.15,i*.045,'sine',.12));noise(.4,0,.05,3000,9000)},
  fanfare:()=>{[[67,0,.12],[67,.13,.12],[67,.26,.12],[72,.4,.6],[64,.4,.6],[76,.4,.6]].forEach(([m,t,d])=>tone(NOTE(m),d,t,'square',.08));noise(.5,.4,.06,2000,8000)},
  whoosh:()=>noise(.45,0,.18,300,5000),
  magic:()=>{for(let i=0;i<14;i++)tone(NOTE(72+i*2),.25,i*.06,'sine',.1);noise(1,.2,.05,4000,10000)},
  rattle:()=>{for(let i=0;i<5;i++)tone(150+Math.random()*120,.05,i*.07,'square',.06)},
  open:()=>{noise(.3,0,.25,200,1500);tone(NOTE(60),.15,.05,'triangle',.2);[72,76,79,84,88].forEach((m,i)=>tone(NOTE(m),.3,.15+i*.07,'sine',.13))},
  giggle:()=>{for(let i=0;i<5;i++)tone(700+i*60+Math.random()*80,.07,i*.08,'sine',.12,900+i*60)},
  hatch:()=>{noise(.15,0,.3,800,800);noise(.15,.2,.3,900,900);noise(.4,.45,.3,500,3000)}};
const SFX={};for(const k in RAW)SFX[k]=(...a)=>{if(S.sound)try{RAW[k](...a)}catch(e){}};
let musT=null;
function music(on){clearInterval(musT);musT=null;if(!on||!S.music)return;let i=0;const sc=[60,62,64,67,69,72,74,76,79],bass=[48,53,55,52];
  musT=setInterval(()=>{if(!AC||AC.state!='running')return;
    if(i%8==0)tone(NOTE(bass[(i/8|0)%4]),1.2,0,'sine',.05);

document.addEventListener('pointerdown',e=>{ac();const b=e.target.closest('.btn');if(b&&!b.matches('.k,.lt,.ch,.chestbtn'))SFX.click()},true);

/* ---------- speech & feedback ---------- */
const canSpeak=()=>'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!='undefined';
function noVoice(btn){fb('🔇 No voice here. Open Star School in Chrome or the installed app.','warn long',3000);if(btn){btn.classList.remove('talking');anim(btn,'sad')}}
function say(t,btn,lang){if(!canSpeak()){if(btn)noVoice(btn);return}
  try{speechSynthesis.cancel();const es=lang=='es',u=new SpeechSynthesisUtterance(String(t).replace(/−/g,' minus '));u.rate=es?.8:.88;u.pitch=1.1;u.lang=es?'es-MX':'en-US';
  const vs=speechSynthesis.getVoices(),v=es?(vs.find(v=>/^es[-_](MX|US)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))):(vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)));if(v)u.voice=v;
  if(btn){let started=false;btn.classList.add('talking');u.onstart=()=>{started=true};u.onend=u.onerror=()=>btn.classList.remove('talking');

let fbT;function fb(t,cls='',ms=1000){const e=$('#fb');e.textContent=t;e.className='fb on '+cls;clearTimeout(fbT);fbT=setTimeout(()=>e.className='fb',ms)}
function bump(sel){const e=typeof sel=='string'?$(sel):sel;if(!e)return;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
function anim(e,c){if(!e)return;e.classList.remove('jump','sad');void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),550)}
function flyStar(from){const to=$('#starc');if(!to)return;const r=from?from.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},t=to.getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+r.height/2,e=document.createElement('div');e.className='fly';e.textContent='⭐';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transform=`translate(${t.left+20-x}px,${t.top+16-y}px) scale(.5)`;e.style.opacity=.4}));
  setTimeout(()=>{e.remove();SFX.coin();bump('#starc')},640)}

function rod(n,c,cls='',x=0){if(n<=0)return'';let s='';for(let i=0;i<n;i++)s+=`<i class="${i>=n-x?'x':''}"></i>`;return`<span class="rod ${cls}" style="--c:${c||PAL[(n-1)%10]}">${s}</span>`}
function hintHTML(q){const h=q.hint;if(!h)return'';
  if(h.k=='text')return esc(h.s);
  if(h.k=='say'){setTimeout(()=>say(h.w,null,h.lang),150);return esc(h.s)}
  if(h.k=='next'){const need=q.word[G.built.length],i=q.tiles.findIndex((t,j)=>t==need&&!G.built.includes(j));const el=$(`.lt[data-i="${i}"]`);if(el)el.classList.add('glow');setTimeout(()=>say(q.word),150);return'Look for the glowing letter!'}
  if(h.k=='pairs'){if(h.n>20)return'Look at the last digit. Is it 0, 2, 4, 6, or 8?';let s='<div class="pairs">';for(let i=0;i<h.n;i+=2)s+='<span><b></b>'+(i+1<h.n?'<b></b>':'')+'</span>';return s+'</div><div>Does every dot have a partner?</div>'}
  if(h.k=='emoji'){const{e,a,b,op}=h;if(op=='+')return a+b>20?'Count on with your fingers!':`<div class="emh">${e.repeat(a)} + ${e.repeat(b)}</div>`;
    return a>20?'Count back with your fingers!':`<div class="emh">${e.repeat(a-b)}<span style="opacity:.25">${e.repeat(b)}</span></div><div>${b} went away</div>`}
  if(h.k=='blocks'){const{a,b,c,op,blank}=h;if(Math.max(a,b,c)>20)return'Count on from the bigger number!';
    if(op=='+'&&blank=='c'&&(a==0||b==0))return`<div class="rowh">${rod(a||b)}<span>+ nothing</span></div><div>Adding zero adds nothing! How many blocks?</div>`;
    if(op=='-'&&b==0)return`<div class="rowh">${rod(a)}</div><div>Taking away zero takes nothing away!</div>`;
    if(op=='-'&&a==b)return`<div class="rowh">${rod(a,null,'',b)}</div><div>Cross out all ${b}. How many are left?</div>`;
    if(op=='+'){if(blank=='c')return`<div class="rowh">${rod(a)}<span>+</span>${rod(b)}</div><div>Count them all!</div>`;
      const k=blank=='a'?b:a;return`<div class="rods">${rod(c,'#cbd5e1')}<div class="rowh" style="gap:0">${rod(k)}${rod(c-k,null,'dash')}</div></div><div>How many empty boxes?</div>`}
    return`<div class="rowh">${rod(a,null,'',b)}</div><div>Cross out ${b}. How many are left?</div>`}
  return''}

let G;
const newG=o=>Object.assign({n:10,done:0,score:0,streak:0,best:0,missed:[],last:null,node:-1,path:null},o);
function start(p,i){const n=NODES[p][i];G=newG({path:p,node:i,sk:n.sk,lv:n.lv});next()}
function startMix(){const qs=allMiss().slice(0,7).map(m=>({...m.q})),pool=[];
  for(const p in NODES)NODES[p].forEach((n,i)=>{if(unlocked(p,i)&&i<=curNode(p))pool.push(n)});
  while(qs.length<10){const n=pick(pool),q=SK[n.sk].gen(n.lv);q.sk=n.sk;q.lv=n.lv;qs.push(q)}
  G=newG({mix:true,pool:shuffle(qs),sk:'mix'});next()}
const back=()=>G&&G.path?pathMap(G.path):home();
function worldPool(p,wi,k){const ns=NODES[p].filter(n=>n.wi==wi&&n.sk!='boss');return Array.from({length:k},()=>{const n=pick(ns),q=SK[n.sk].gen(n.lv);q.sk=n.sk;q.lv=n.lv;return q})}
function bossIntro(p,i){const n=NODES[p][i],[e,name]=n.boss;
  view(`<div class="center"><div class="bossbig">${e}</div><h1>${name} appears!</h1><p class="sub">Every right answer zaps ${name}. Zap 7 times to win a prize: ${n.prize}</p>

  $('#nope').onclick=()=>pathMap(p);$('#fight').onclick=()=>{SFX.whoosh();G=newG({path:p,node:i,sk:'boss',boss:{e,name},hp:7,pool:worldPool(p,n.wi,10)});next()}}
function testOut(p,wi){const w=PATHS[p].worlds[wi],o=document.createElement('div');o.className='ovl';
  o.innerHTML=`<div style="background:#fff;color:var(--ink);border-radius:24px;padding:20px;max-width:520px;text-align:center"><div style="font-size:64px">⚡</div><h2 style="margin:4px 0">Test out of ${w.e} ${w.n}?</h2>
   <p>10 questions from this whole world. Get <b>9 right</b> and you skip all of its stops!</p><div class="rowh"><button class="btn big" id="tgo">Let's do it!</button><button class="btn" id="tno">Not now</button></div></div>`;
  document.body.appendChild(o);o.querySelector('#tno').onclick=()=>o.remove();
  o.querySelector('#tgo').onclick=()=>{o.remove();SFX.whoosh();const bi=NODES[p].findIndex(n=>n.sk=='boss'&&n.wi==wi);G=newG({path:p,node:bi,sk:'test',test:{wi},pool:worldPool(p,wi,10)});next()}}
function makeQ(){if(G.pool)return G.pool.shift();
  if(G.path&&(G.done==3||G.done==7)){const N=NODES[G.path],old=N.filter((n,i)=>i<G.node&&n.sk!='boss'&&passed(G.path,i)&&!(n.sk==G.sk&&n.lv==G.lv));
    if(old.length){const n=pick(old),q=SK[n.sk].gen(n.lv);q.sk=n.sk;q.lv=n.lv;q.review=1;return q}}
  const p=P(G.sk),s=SK[G.sk],ms=Object.values(p.miss).filter(m=>m.n>0&&m.q&&m.q.lv==G.lv);let q;
  if(ms.length&&Math.random()<.3)q={...pick(ms).q};
  for(let t=0;t<10&&(!q||q.label===G.last);t++)q=s.gen(G.lv);
  q.sk=G.sk;q.lv=G.lv;G.last=q.label;return q}
function next(){if(!G||G.dead)return;
  if(G.done<G.n){G.q=makeQ();G.retry=false}
  else if(G.missed.length){G.q=G.missed.shift();G.retry=true}
  else return finish();
  renderQ()}
function fit(){const qa=$('.qarea'),pr=$('#prompt');if(!qa||!pr)return;let k=1;pr.style.setProperty('--k',1);
  while(k>.42&&(qa.scrollHeight>qa.clientHeight+1||pr.scrollWidth>pr.clientWidth+1)){k-=.05;pr.style.setProperty('--k',k)}}

function petSay(t){const b=$('#bub');if(!b)return;b.textContent=t;const far=G&&G.done/G.n>.5;b.style.left=far?'auto':'0';b.style.right=far?'0':'auto';b.classList.add('on');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),1400)}
function renderQ(){const q=G.q;G.typed='';G.tries=0;G.built=[];G.lock=false;
  let input='';
  if(q.kind=='num')input=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn k" data-k="${n}">${n}</button>`).join('')}<button class="btn k del" data-k="del">⌫</button><button class="btn k" data-k="0">0</button><button class="btn k go" data-k="go">✓</button></div>`;
  else if(q.kind=='choice')input=`<div class="choices ${q.cls||''}">${q.choices.map((c,i)=>`<button class="btn ch" data-i="${i}">${c.h?c.l:esc(c.l)}</button>`).join('')}</div>`;
  else input=`<div class="tiles">${q.tiles.map((t,i)=>`<button class="btn lt" data-i="${i}">${t}</button>`).join('')}</div><button class="btn sm undo" id="undo">↩ Undo</button>`;
  const pos=`calc(${G.done/G.n} * (100% - 70px))`;
  view(`<div class="top"><button class="btn sm" id="quit">✕</button>
   ${G.boss?`<div class="bossbar"><span class="bossE" id="bossE">${G.boss.e}<div class="bubble" id="bub"></div></span><div class="hp"><div id="hpf" style="width:${G.hp/7*100}%"></div></div><b id="hpn">${'❤️'.repeat(G.hp)}</b></div>`
    :`<div class="track"><div class="line"></div><div class="chest">${G.test?'⚡':'🎁'}</div><div class="runner ${petAura()}" id="runner" style="left:${pos}">${petHTML()}<div class="bubble" id="bub"></div></div></div>`}

/* ---------- game timer shared by pure games ---------- */
let GT=null;
function gtStop(){if(GT){clearInterval(GT.iv);GT=null}}
function gtStart(el,onEnd){gtStop();GT={up:false,grace:0,iv:setInterval(()=>{if(!GT||document.hidden)return;const p=pt();

  else if(--GT.grace<=0){gtStop();save();return onEnd()}
  if(p.used%5==0)save();const t=$(el);if(t)t.textContent=GT.up?`⏰ ${GT.grace}s`:`🎟️ ${fmtT(ptLeft())}`},1000)}}

  document.body.appendChild(o);SFX.magic();if(S.voice)say("Game time is up! Your picture is saved.");o.querySelector('#tl').onclick=()=>{o.remove();home()}}

function shData(id){const s=SHAPES.find(x=>x[0]==id),R=s[2]().map(([d,c,o],i)=>({d,c,o:o||{},i}));const keys=[];R.forEach(r=>{if(!r.o.fix&&!keys.includes(r.c))keys.push(r.c)});R.forEach(r=>r.n=r.o.fix?0:keys.indexOf(r.c)+1);return{id,name:s[1],R,keys}}

const SHN='<defs><radialGradient id="shn" cx=".34" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient></defs>';
function shSVG(d,fills,opts={}){const lit=r=>{const f=fills[r.i];return r.o.fix||(f&&f!='#fef9c3'&&f!='#fecaca')};
  return`<svg viewBox="0 0 300 300" class="${opts.cls||''}" ${opts.id?`id="${opts.id}"`:''}>${SHN}${d.R.map(r=>`<path d="${r.d}" data-i="${r.i}" fill="${r.o.fix?CB_COL[r.c][0]:fills[r.i]||(opts.faded?shade(CB_COL[r.c][0],.72):'#fff')}" stroke="#27272a" stroke-width="${opts.thin?1.6:2.4}" stroke-linejoin="round"/>${lit(r)&&r.i>0?`<path d="${r.d}" fill="url(#shn)" pointer-events="none"/>`:''}`).join('')}${opts.labels||''}</svg>`}
function shMenuItems(lv){const cs=shS();return SHAPES.filter(([id])=>!lv||shDiff(id)==lv).map(([id,n])=>{const d=shData(id),done=cs.done[id],pr=cs.prog[id]||[],fl={};
  if(done)d.R.forEach(r=>fl[r.i]=CB_COL[r.c][0]);else pr.forEach(i=>fl[i]=CB_COL[d.R[i].c][0]);const free=cs.free[id];
  const tot=d.R.filter(r=>!r.o.fix).length;return`<button class="btn cbitem" data-sh="${id}">${shSVG(d,free&&!done&&!pr.length?free:fl,{thin:1,faded:!done&&!pr.length&&!free,cls:'shthumb'})}<b>${n}</b><span class="small">${done?'✅ Done':pr.length?Math.round(pr.length/tot*100)+'%':free?'🖌️ Colored':'New'}</span></button>`}).join('')}

   <div class="cbwrap"><div class="cbcv shwrap" id="shw"></div><div class="cbpal ${free?'fp':''}">${pal}</div></div>`);

    if(!free){const svg=$('#shsvg'),sr=svg.getBoundingClientRect(),k=sr.width/300;$$('#shsvg text').forEach(t=>{const r=d.R[+t.dataset.l],p=w.querySelector(`path[data-i="${r.i}"]`),b=p.getBBox(),cx=b.x+b.width/2,cy=b.y+b.height/2;let pt=r.o.l;

      t.setAttribute('x',pt[0]);t.setAttribute('y',pt[1]);t.setAttribute('font-size',Math.max(7,Math.min(16,Math.min(b.width,b.height)*.55)))})}

  $$('.chip').forEach(c=>c.onclick=()=>pick(c.dataset.n?+c.dataset.n:c.dataset.k));
  w.addEventListener('pointerdown',e=>{const t=e.target.closest('path');if(!t)return;const r=d.R[+t.dataset.i];if(r.o.fix)return;e.preventDefault();
    if(free){fills[r.i]=CB_COL[sel][0];SFX.pop(R(0,5));cs.free[id]=fills;save();t.setAttribute('fill',fills[r.i]);t.classList.remove('popfill');void t.getBBox();t.classList.add('popfill');return}

    if(r.n!=sel){SFX.wrong();t.setAttribute('fill','#fecaca');setTimeout(()=>render(),350);if(mode=='es')say(d.keys[r.n-1],null,'es');return}
    filled.add(r.i);fills[r.i]=CB_COL[r.c][0];SFX.pop(filled.size%6);cs.prog[id]=[...filled];save();render();if(esHard){const c=$(`.chip[data-n="${r.n}"]`);if(c)c.classList.add('found')}

  if(free)$('#shclr').onclick=()=>{for(const k in fills)delete fills[k];cs.free[id]={};save();SFX.whoosh();render()};

  const leave=()=>{cs.prog[id]=fill.join('');save()};
  $('#back').onclick=()=>{leave();gtStop();classicColor('pixel')};
  function finishPic(){leave();cs.done[id]=1;delete cs.prog[id];S.coins+=5;save();gtStop();draw();SFX.fanfare();confetti(50);
    setTimeout(()=>{const o=document.createElement('div');o.className='ovl';o.innerHTML=`<img src="${cbThumb(d.G,true,200)}" style="width:200px;height:200px;border-radius:16px;box-shadow:0 8px 30px #0006;image-rendering:pixelated;animation:spin .8s cubic-bezier(.5,1.6,.5,1)"><h1>You finished ${d.name}!</h1><h2>+5 🪙</h2><div class="rowh"><button class="btn big" id="cbm">🎨 More pictures</button></div>`;
      document.body.appendChild(o);if(S.voice)say(`Beautiful! You finished ${d.name}!`);o.querySelector('#cbm').onclick=()=>{o.remove();classicColor('pixel')}},700)}
  pick(1);size();let rs;const onR=()=>{clearTimeout(rs);rs=setTimeout(()=>{if($('#cbc'))size()},120)};addEventListener('resize',onR);
  gtStart('#gtm',()=>{leave();timeUpOverlay()});
  if(S.voice)setTimeout(()=>say(mode=='math'?'Solve the fact to find each color!':mode=='es'?'Tap a color to hear it in Spanish!':'Match the numbers to the colors!'),300)}

const FP_COLS=['rojo','naranja','amarillo','verde','verde oscuro','celeste','azul','morado','rosa','café','gris','negro','blanco'];
function freePaint(ai){const cs=cbS();const G=ai>=0?cs.art[ai].split(',').map(k=>k||'blanco'):cbGrid('blanco');let sel='rojo',saved=ai>=0,idx=ai;
  view(`<div class="top"><button class="btn sm" id="back">◀</button><div class="title" style="font-size:20px">🖌️ Free Paint</div><div class="sp"></div><button class="btn sm" id="fsave">💾 Save</button><div class="stars" id="gtm">🎟️ ${fmtT(ptLeft())}</div></div>
   <div class="cbwrap"><div class="cbcv"><canvas id="cbc"></canvas></div><div class="cbpal fp">${FP_COLS.map(k=>`<button class="btn chip" data-k="${k}" style="--cc:${CB_COL[k][0]}"><span class="sw"></span></button>`).join('')}
    <button class="btn chip" data-k="fill" title="Fill">🪣</button><button class="btn chip" id="fclear">🗑️</button></div></div>`);
  const cv=$('#cbc'),x=cv.getContext('2d');let cs2=cbLayout(14),dpr=Math.min(2,devicePixelRatio||1),bucket=false;
  const size=()=>{cs2=cbLayout(14);cv.width=cv.height=cs2*CBN*dpr;cv.style.width=cv.style.height=cs2*CBN+'px';draw()};
  function draw(){const s=cs2*dpr;G.forEach((k,i)=>{x.fillStyle=CB_COL[k][0];x.fillRect((i%CBN)*s,Math.floor(i/CBN)*s,s+.5,s+.5)});x.strokeStyle='#0000000f';x.lineWidth=1;for(let i=1;i<CBN;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,CBN*s);x.moveTo(0,i*s);x.lineTo(CBN*s,i*s);x.stroke()}}
  const pick=k=>{if(k=='fill'){bucket=!bucket;$('[data-k="fill"]').classList.toggle('on',bucket);SFX.pop(2);return}sel=k;$$('.chip[data-k]').forEach(c=>c.classList.toggle('on',c.dataset.k==k||(c.dataset.k=='fill'&&bucket)));say(k,null,'es')};
  $$('.chip[data-k]').forEach(c=>c.onclick=()=>pick(c.dataset.k));
  const flood=(i,from)=>{if(from==sel)return;const st=[i];while(st.length){const j=st.pop();if(j<0||j>=G.length||G[j]!=from)continue;G[j]=sel;const cx=j%CBN;if(cx>0)st.push(j-1);if(cx<CBN-1)st.push(j+1);st.push(j-CBN,j+CBN)}};
  let down=false,last=-1;const cellAt=e=>{const r=cv.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/cs2),cy=Math.floor((e.clientY-r.top)/cs2);return cx>=0&&cy>=0&&cx<CBN&&cy<CBN?cy*CBN+cx:-1};
  const paint=i=>{if(i<0)return;if(bucket){flood(i,G[i]);SFX.magic()}else{if(G[i]==sel)return;G[i]=sel;SFX.pop(R(0,5))}saved=false;draw()};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;last=cellAt(e);paint(last);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!down||bucket)return;const i=cellAt(e);if(i!=last){last=i;paint(i)}});
  cv.addEventListener('pointerup',()=>{down=false});
  const doSave=()=>{const str=G.join(',');if(idx>=0)cs.art[idx]=str;else{cs.art.unshift(str);cs.art=cs.art.slice(0,12);idx=0}saved=true;save()};
  $('#fsave').onclick=()=>{doSave();SFX.fanfare();confetti(20);fb('💾 Saved to My Drawings!')};
  $('#fclear').onclick=()=>{G.fill('blanco');SFX.whoosh();saved=false;draw()};
  $('#back').onclick=()=>{if(!saved&&G.some(k=>k!='blanco'))doSave();gtStop();classicColor('paint')};
  pick('rojo');size();addEventListener('resize',()=>{if($('#cbc')&&$('.fp'))size()});
  gtStart('#gtm',()=>{if(G.some(k=>k!='blanco'))doSave();timeUpOverlay()})}

/* ---------- grown-ups ---------- */
function grown(){let armed=false;
  const rows=[...new Set(Object.values(NODES).flat().map(n=>n.sk))].filter(id=>SK[id]).map(id=>{const p=P(id),s=SK[id],acc=p.t?Math.round(p.c/p.t*100)+'%':'–';
    const tricky=Object.values(p.miss).sort((a,b)=>b.tot-a.tot).slice(0,3).map(m=>esc(m.q.label)).join('<br>');
    return`<tr><td>${s.e} ${s.t}</td><td>${p.r}</td><td>${acc}</td><td class="tr">${tricky}</td></tr>`}).join('');
  const prog=Object.keys(PATHS).map(p=>`${PATHS[p].e} ${NODES[p].filter((n,i)=>passed(p,i)).length}/${NODES[p].length}`).join(' · '),canRec=!!(navigator.mediaDevices&&window.MediaRecorder);
  view(`<div class="top"><button class="btn sm" id="back">◀</button><div class="title">Grown-ups</div></div><div class="scroll">
  <div class="card"><div class="row"><b style="width:110px">Child</b><input class="name" id="nm" value="${esc(S.name)}"></div>
   <div class="row"><b style="width:110px">Pet name</b><input class="name" id="pn" value="${esc(S.petName)}" placeholder="${PETS[S.pet].def}"></div>
   <div class="row"><b style="width:110px">Buddy</b><input class="name" id="bd" value="${esc(S.buddy)}" placeholder="Sibling or friend, used in story problems"></div>
   <div class="small">Stops passed: ${prog}<br>⭐ ${S.stars} stars · 🪙 ${S.coins} coins · 📒 ${STK.filter(s=>S.stickers[s]).length}/${STK.length} stickers · 🔥 best streak ${S.best||0}</div>
   <label class="tg"><input type="checkbox" id="ula" ${S.unlockAll?'checked':''}> Unlock every stop on the map (let them jump ahead)</label></div>
  <div class="card"><h2 style="margin:0 0 6px">🎙️ Your voice</h2><div class="small" style="margin-bottom:8px">Tap ⏺ and say the line (up to 4 seconds). Record as many as you like. The app shuffles them so the same one doesn't play twice in a row. ${inFrame?'<b>Recording only works on the tablet app, not in this preview.</b>':!canRec?'<b>Recording isn\'t available in this browser. Use Chrome or the installed app.</b>':''}</div>
   ${CLIPKINDS.map(([k,l,tip,lines])=>{const cs=CLIPS.filter(c=>c.kind==k),extra=cs.filter(c=>c.line==null||c.line>=lines.length);
     const row=(txt,c,line)=>`<div class="vline"><span class="vtxt">${c?'✅':'⚪'} ${txt}</span>${c?`<button class="btn xs" data-play="${c.id}">▶</button><button class="btn xs danger" data-del="${c.id}">🗑</button>`:`<button class="btn xs rec" data-rec="${k}|${line}">⏺ Record</button>`}</div>`;
     return`<div class="vrow"><b>${l}</b> <span class="small">${tip} (${cs.length} recorded)</span>
       ${lines.map((t,i)=>row('“'+esc(t.replace('{name}',S.name))+'”',cs.find(c=>c.line==i),i)).join('')}
       ${extra.map((c,i)=>row('Your own #'+(i+1),c,null)).join('')}
       <div class="vline"><span class="vtxt small">➕ Say anything you like</span><button class="btn xs rec" data-rec="${k}|x">⏺ Record</button></div></div>`}).join('')}</div>
  <div class="card"><h2 style="margin:0 0 6px">🎮 Game time</h2><div class="small">Each learning round earns game time (plus a bonus for 10/10, bosses, and tests). Bank right now: <b>${fmtT(pt().bank)}</b> · used today: <b>${fmtT(pt().used)}</b></div>
   <div class="vline"><span class="vtxt">Minutes per round</span>${[2,3,5].map(v=>`<button class="btn xs ${ptCfg().per==v?'on':''}" data-per="${v}">${v}</button>`).join('')}</div>
   <div class="vline"><span class="vtxt">Daily max</span>${[15,30,45,60,0].map(v=>`<button class="btn xs ${ptCfg().max==v?'on':''}" data-max="${v}">${v||'No limit'}</button>`).join('')}</div>
   <div class="vline"><span class="vtxt">Give a bonus</span><button class="btn xs" id="pt5">+5 min</button><button class="btn xs danger" id="pt0">Empty bank</button></div>
   <label class="tg"><input type="checkbox" id="ptp" ${ptCfg().pause?'checked':''}> Pause game time (games locked)</label></div>
  <div class="card"><div class="tw"><table><tr><th>Skill</th><th>Rounds</th><th>1st try</th><th>Tricky ones</th></tr>${rows}</table></div></div>
  <div class="card"><label class="tg"><input type="checkbox" id="voice" ${S.voice?'checked':''}> Read questions out loud</label>
   <label class="tg"><input type="checkbox" id="snd" ${S.sound?'checked':''}> Sound effects</label>
   <label class="tg"><input type="checkbox" id="mus" ${S.music?'checked':''}> Music on the home screen</label>
   <button class="btn sm" id="test">🔊 Test voice</button> <button class="btn sm danger" id="reset">Erase everything</button></div>
  <div class="card small"><b>How it works:</b> three games (Math, Reading, Spanish), each with its own map. Getting 7 of 10 right opens the next stop (8 = ★★, 10 = ★★★), and each world stretches further: clocks, coins, borrowing, 3-digit numbers, magic-e and vowel-team words, and story comprehension. Missed questions come back at the end of a round, in later rounds, and in the 🎯 Tricky Mix. Each right answer earns a star (grows the pet) and a coin (spent in the shop). Everything is saved on this tablet only.</div></div>`);
  $('#back').onclick=()=>home(true);
  $('#nm').oninput=e=>{if(e.target.value.trim()){S.name=e.target.value.trim();save()}};
  $('#pn').oninput=e=>{S.petName=e.target.value.trim();save()};
  $('#bd').oninput=e=>{S.buddy=e.target.value.trim();save()};
  $('#ula').onchange=e=>{S.unlockAll=e.target.checked;save()};
  $$('[data-per]').forEach(b=>b.onclick=()=>{ptCfg().per=+b.dataset.per;save();grown()});
  $$('[data-max]').forEach(b=>b.onclick=()=>{ptCfg().max=+b.dataset.max;save();grown()});
  $('#pt5').onclick=()=>{ptEarn(300);grown()};$('#pt0').onclick=()=>{pt().bank=0;save();grown()};
  $('#ptp').onchange=e=>{ptCfg().pause=e.target.checked;save()};
  $('#voice').onchange=e=>{S.voice=e.target.checked;save()};
  $('#snd').onchange=e=>{S.sound=e.target.checked;save()};
  $('#mus').onchange=e=>{S.music=e.target.checked;save()};
  $('#test').onclick=e=>say(`Hello ${S.name}! I can read to you.`,e.currentTarget);
  $$('[data-play]').forEach(b=>b.onclick=()=>{const c=CLIPS.find(x=>x.id==b.dataset.play);if(c)new Audio(c.url).play().catch(()=>{})});
  $$('[data-del]').forEach(b=>b.onclick=async()=>{await DB.del(b.dataset.del);await loadClips();grown()});
  $$('[data-rec]').forEach(b=>b.onclick=()=>{const[k,l]=b.dataset.rec.split('|');record(k,l=='x'?null:+l,b)});
  $('#reset').onclick=async e=>{if(!armed){armed=true;e.target.textContent='Tap again to erase ALL progress';return}try{localStorage.removeItem(KEY);const d=await DB.open();d.close();indexedDB.deleteDatabase('starschool')}catch(x){}location.reload()}}
async function record(kind,line,btn){if(inFrame)return micHelp('frame');if(!navigator.mediaDevices||!window.MediaRecorder)return micHelp('frame');
  try{const pm=await navigator.permissions.query({name:'microphone'});if(pm.state=='denied')return micHelp('denied')}catch(e){}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return micHelp(e&&e.name=='NotFoundError'?'none':'denied')}
  music(false);const mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const blob=new Blob(ch,{type:mr.mimeType||'audio/webm'});
    try{await DB.put({id:String(Date.now()),kind,line,blob});await loadClips();const c=CLIPS.find(x=>x.blob===blob)||CLIPS[CLIPS.length-1];if(c)new Audio(c.url).play().catch(()=>{})}catch(e){fb("Couldn't save the clip",'warn')}
    grown()};
  mr.start();let s=4;btn.textContent='🔴 Recording… '+s;btn.style.background='#fee2e2';
  const iv=setInterval(()=>{s--;if(s<=0){clearInterval(iv);if(mr.state=='recording')mr.stop()}else btn.textContent='🔴 Recording… '+s},1000);
  btn.onclick=()=>{clearInterval(iv);if(mr.state=='recording')mr.stop()}}

/* ---------- app mode: full screen, install button ---------- */
const isApp=()=>matchMedia('(display-mode: fullscreen),(display-mode: standalone)').matches||navigator.standalone===true;
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if($('.hero')&&$('#map'))home(true)});
addEventListener('appinstalled',()=>{installEvt=null});
document.addEventListener('pointerup',()=>{const d=document.documentElement;
  if(!document.fullscreenElement&&d.requestFullscreen&&!matchMedia('(display-mode: fullscreen)').matches)d.requestFullscreen({navigationUI:'hide'}).catch(()=>{})},true);
document.addEventListener('contextmenu',e=>e.preventDefault());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
loadClips();
home(true);
</script>
