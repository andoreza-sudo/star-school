<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff9ef">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Star School</title>
<style>
/* Design tokens (DESIGN_SYSTEM.md section 2). The only file that may contain raw hex colours. */
:root{
/* colour */
--ink:#1F2440;--ink-2:#3D4263;--ink-3:#6B7090;--line:#E3E5EF;
--paper:#FFF9EF;--surface:#FFFFFF;--surface-2:#F4F5FB;
--brand:#3B5BDB;--brand-shade:#2F49B8;--brand-tint:#E3E9FF;
--star:#FFC93C;--star-shade:#F5A800;--star-tint:#FFF1C7;
--good:#20A556;--good-ink:#147A3C;--good-tint:#DDF5E7;
--try:#FFB020;--try-ink:#8A4B00;--try-tint:#FFE8B8;
--danger:#C92A2A;
--math:#2D6BE4;--math-tint:#E1EBFF;--math-shade:#1F4FB8;
--read:#CD3168;--read-tint:#FFE3EC;--read-shade:#A61E4D;
--es:#17804F;--es-tint:#DDF5E7;--es-shade:#0F5F3A;
--disc:#0E7C86;--disc-tint:#D9F3F5;--disc-shade:#0A5A62;
--bt:#7C3AED;--bt-tint:#EDE4FF;--bt-shade:#5B21B6;
--play:#E8590C;--play-tint:#FFE8D9;--play-shade:#B8420A;
/* helper colours (alpha and glows) */
--glow-warm:#FFF3D6;--glow-cool:#E0F2FE;--shadow-ink:#0001;--shadow-ink-2:#0002;--wash:#FFF9;
/* components (P4-04): ledges for white and danger fills, play ledge, gloss highlight, sheet backdrop, soft drop */
--ledge-soft:#D5D9E8;--danger-shade:#9B1C1C;--play-deep:#8F3307;
--hi:rgba(255,255,255,.28);--hi-0:rgba(255,255,255,0);--dim:rgba(31,36,64,.5);--drop:rgba(31,36,64,.16);
/* illustration palette (object art, DESIGN_SYSTEM 6.5): per hue -1 highlight, base, -2 shade, -3 deep accent; light from top left */
--ill-red-1:#FF8F80;--ill-red:#F2483B;--ill-red-2:#C93030;--ill-red-3:#8F1D27;
--ill-orange-1:#FFB66E;--ill-orange:#FF8A24;--ill-orange-2:#E0640F;--ill-orange-3:#A84509;
--ill-yellow-1:#FFF3A3;--ill-yellow:#FFD23F;--ill-yellow-2:#F5A800;--ill-yellow-3:#C27A00;
--ill-green-1:#A6E36B;--ill-green:#5CBF3E;--ill-green-2:#389A35;--ill-green-3:#22702B;
--ill-aqua-1:#B2EEF6;--ill-aqua:#45C6DE;--ill-aqua-2:#229BBB;--ill-aqua-3:#13708E;
--ill-blue-1:#8CC8FF;--ill-blue:#4C8DF6;--ill-blue-2:#3065D6;--ill-blue-3:#1F449E;
--ill-purple-1:#C7A6FF;--ill-purple:#9663F2;--ill-purple-2:#7041D6;--ill-purple-3:#4D2A9E;
--ill-pink-1:#FFD3E1;--ill-pink:#FF97B8;--ill-pink-2:#EC6C95;--ill-pink-3:#C2456F;
--ill-brown-1:#D69A62;--ill-brown:#B06E3A;--ill-brown-2:#8A5028;--ill-brown-3:#5E341A;
--ill-tan-1:#FFE3B3;--ill-tan:#F7C07A;--ill-tan-2:#DE9A50;--ill-tan-3:#B06F2E;
--ill-skin-1:#FFDCC4;--ill-skin:#F7BE98;--ill-skin-2:#E39B72;--ill-skin-3:#B8704D;
--ill-cream-1:#FFFDF6;--ill-cream:#FFF1D6;--ill-cream-2:#EDD3A6;--ill-cream-3:#C9A26A;
--ill-grey-1:#E1E5EF;--ill-grey:#B4BBD0;--ill-grey-2:#8C94AE;--ill-grey-3:#5F6683;
--ill-white:#FFFFFF;--ill-white-2:#E4E8F3;--ill-white-3:#B9C0D4;
--ill-ink:#1F2440;--ill-ink-2:#3A3F5C;
/* map scenes (P4-09, DESIGN_SYSTEM 7): pale skies (top, -1 at the horizon) and grounds (base, -2 the ledge and soft patches).
   Quiet behind the stops: ink at least 7:1 and every subject colour at least 3:1 on every ground (tools/contrast.js) */
--sc-sky:#CBE6FC;--sc-sky-1:#EAF6FF;--sc-dusk:#FFD6BF;--sc-dusk-1:#FFF0DF;--sc-candy:#FFD3E5;--sc-candy-1:#FFF0F6;
--sc-night:#2C2766;--sc-night-1:#9C91E0;
--sc-green:#E5F6D7;--sc-green-2:#CDEBB5;--sc-mint:#DDF4EC;--sc-mint-2:#BFE6D7;--sc-sand:#FCF0D8;--sc-sand-2:#F1DCB2;
--sc-pink:#FFE9F1;--sc-pink-2:#F9CEDE;--sc-lilac:#EFEAFF;--sc-lilac-2:#D8CEF7;--sc-sea:#DDF2FB;--sc-sea-1:#EFFAFF;--sc-sea-2:#BEE2F2;
--sc-stone:#EDEFF5;--sc-stone-2:#D3D8E5;--sc-peach:#FFEDE0;--sc-peach-2:#F8D2B8;--sc-sun:#FFF6D8;--sc-sun-2:#F4E2A6;
--sc-rose:#FFE6E6;--sc-rose-2:#F7CACA;--sc-blue:#E3EAFF;--sc-blue-2:#C8D5FA;
/* type */
--font-body:Andika,system-ui,Roboto,sans-serif;
--font-display:Andika,system-ui,Roboto,sans-serif;
--fs-1:14px;--fs-2:16px;--fs-3:18px;--fs-4:22px;--fs-5:28px;--fs-6:36px;--fs-7:48px;
--lh-1:1.4;--lh-2:1.45;--lh-3:1.45;--lh-4:1.3;--lh-5:1.25;--lh-6:1.2;--lh-7:1.1;
--fs-prompt:clamp(44px,11vmin,96px);
/* space, shape, depth */
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--s-8:48px;
--r-chip:10px;--r-btn:16px;--r-card:22px;--r-hero:28px;--r-pill:999px;
--ledge:0 4px 0;--ledge-press:0 1px 0;
--shadow:0 6px 16px rgba(31,36,64,.08);
--tap:48px;--tap-primary:56px;--tap-pk:64px;
/* motion */
--t-fast:90ms;--t:180ms;--t-slow:320ms;--t-xl:600ms;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
/* legacy aliases, kept until P4-17 */
--bg:var(--paper);--blue:var(--brand);--green:var(--good);--red:var(--danger);--muted:var(--ink-3);--card:var(--surface);
--big:var(--fs-prompt);
}
/* Core components (P4-04; DESIGN_SYSTEM.md section 4). Tokens only. Animate only transform and opacity.
   Every component is opt-in: a class that already exists in the app (.card, .chip, .meter, .tile, .slot, .bubble, .node,
   .empty, .danger) is NOT restyled here; the new component uses a new name instead (see the table in DESIGN_SYSTEM 4).
   A bare .btn keeps its old look (20-base.css); a variant class (primary, soft, subject, ghost, risk, icon) opts in.
   Depth: a solid ledge under things you can press (squashes on press), a soft blur shadow only on panels and sheets,
   a thin gloss (--hi) on coloured fills. Helpers that return the markup are in src/js/14-ui.js (UI.*). */

/* a word that holds a hyphen (Grown-ups) never breaks at it; UI.* helpers wrap such words in .nw */
.nw{white-space:nowrap}

/* ---- subject colours: put .s-math (etc.) on a component or any parent ---- */
.s-math{--c:var(--math);--c-tint:var(--math-tint);--c-shade:var(--math-shade)}
.s-read{--c:var(--read);--c-tint:var(--read-tint);--c-shade:var(--read-shade)}
.s-es{--c:var(--es);--c-tint:var(--es-tint);--c-shade:var(--es-shade)}
.s-disc{--c:var(--disc);--c-tint:var(--disc-tint);--c-shade:var(--disc-shade)}
.s-bt{--c:var(--bt);--c-tint:var(--bt-tint);--c-shade:var(--bt-shade)}
/* white text on --play fails 4.5:1, so filled play buttons use the shade as fill and a deeper ledge */
.s-play{--c:var(--play);--c-tint:var(--play-tint);--c-shade:var(--play-shade);--c-fill:var(--play-shade);--c-ledge:var(--play-deep)}

/* ---- button: .btn + primary | soft | subject | ghost | risk; sizes sm | (md) | lg; .icon = round icon button ---- */
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon){display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  position:relative;min-height:var(--tap-primary);min-width:var(--tap);padding:var(--s-2) var(--s-6);border:0;border-radius:var(--r-btn);
  font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;line-height:1.15;text-align:center;vertical-align:middle;
  overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual;text-decoration:none;
  transition:transform var(--t-fast) var(--ease)}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon) .ic{width:1.3em;height:1.3em;flex:none}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon):active,.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon).is-press{transform:translateY(3px)}
.btn:is(.soft,.icon){background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft)}
.btn:is(.soft,.icon) .ic{color:var(--brand)}
.btn:is(.soft,.icon):is(:active,.is-press){box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.btn.primary{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--brand);color:var(--surface);
  box-shadow:inset 0 2px 0 var(--hi),var(--ledge) var(--brand-shade)}
.btn.primary:is(:active,.is-press){box-shadow:inset 0 2px 0 var(--hi),var(--ledge-press) var(--brand-shade)}
.btn.subject{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c-fill,var(--c,var(--brand)));color:var(--surface);
  box-shadow:inset 0 2px 0 var(--hi),var(--ledge) var(--c-ledge,var(--c-shade,var(--brand-shade)))}
.btn.subject:is(:active,.is-press){box-shadow:inset 0 2px 0 var(--hi),var(--ledge-press) var(--c-ledge,var(--c-shade,var(--brand-shade)))}
.btn.risk{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--danger);color:var(--surface);
  box-shadow:inset 0 2px 0 var(--hi),var(--ledge) var(--danger-shade)}
.btn.risk:is(:active,.is-press){box-shadow:inset 0 2px 0 var(--hi),var(--ledge-press) var(--danger-shade)}
.btn.ghost{background:transparent;color:var(--brand-shade);box-shadow:none}
.btn.ghost:is(:active,.is-press){background:var(--brand-tint);transform:translateY(1px)}
.btn:is(.primary,.subject,.risk) .ic{color:var(--surface)}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon).sm{min-height:var(--tap);padding:var(--s-1) var(--s-4);font-size:var(--fs-3);border-radius:14px}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon).lg{min-height:72px;padding:var(--s-3) var(--s-7);font-size:var(--fs-5);border-radius:var(--r-card);gap:var(--s-3)}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon).wide{display:flex;width:100%}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon):is(:disabled,[aria-disabled="true"]){background:var(--surface-2);color:var(--ink-3);
  box-shadow:inset 0 0 0 2px var(--line);transform:none;cursor:default}
.btn:is(.primary,.soft,.subject,.ghost,.risk,.icon):is(:disabled,[aria-disabled="true"]) .ic{color:var(--ink-3)}
.btn.ghost:is(:disabled,[aria-disabled="true"]){background:transparent;box-shadow:none}
/* round icon button: 56 px (md), 48 px (sm), 64 px (lg). Needs aria-label. */
.btn.icon{width:var(--tap-primary);height:var(--tap-primary);padding:0;border-radius:50%}
.btn.icon .ic{width:28px;height:28px}
.btn.icon.sm{width:var(--tap);height:var(--tap);min-height:var(--tap);padding:0;border-radius:50%}
.btn.icon.sm .ic{width:24px;height:24px}
.btn.icon.lg{width:var(--tap-pk);height:var(--tap-pk);min-height:var(--tap-pk);padding:0;border-radius:50%}
.btn.icon.lg .ic{width:32px;height:32px}

/* ---- keys: .keys grid of .key; .key.go, .key.del; .keys.abc for a letter pad ---- */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-3);width:100%;max-width:420px;margin:0 auto}
.keys.abc{grid-template-columns:repeat(auto-fill,minmax(var(--tap),1fr));gap:var(--s-2);max-width:600px}
.key{display:flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap-pk);padding:0;border:0;
  border-radius:var(--r-btn);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-size:var(--fs-6);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.keys.abc .key{font-size:var(--fs-5);min-height:56px}
.key .ic{width:36px;height:36px}
.key:active,.key.is-press{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.key.go{background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--good-ink);color:var(--surface);--ic2:var(--good-ink);
  box-shadow:inset 0 2px 0 var(--hi),var(--ledge) var(--es-shade)}
.key.go:is(:active,.is-press){box-shadow:inset 0 2px 0 var(--hi),var(--ledge-press) var(--es-shade)}
.key.del{background:var(--try-tint);color:var(--try-ink);--ic2:var(--try-tint);box-shadow:inset 0 0 0 2px var(--try),var(--ledge) var(--try)}
.key.del:is(:active,.is-press){box-shadow:inset 0 0 0 2px var(--try),var(--ledge-press) var(--try)}
.key:disabled{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line);transform:none;cursor:default}
@media (max-width:480px){.key{min-height:56px}.keys{gap:var(--s-2)}}
@media (max-height:520px){.key{min-height:var(--tap);font-size:var(--fs-5)}.keys{gap:var(--s-2)}}

/* ---- choice: .choice (+ .pic | .sym | .wide); states .sel .right .wrong, :disabled. .picks is a grid for them ---- */
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-4);width:100%;max-width:600px;margin:0 auto}
.picks.three{grid-template-columns:repeat(3,1fr)}
.picks.one{grid-template-columns:1fr}
.choice{position:relative;display:flex;align-items:center;justify-content:center;gap:var(--s-2);min-width:var(--tap);min-height:var(--tap-pk);
  padding:var(--s-3) var(--s-4);border:0;border-radius:var(--r-card);background:var(--surface);color:var(--ink);
  font-family:var(--font-body);font-size:var(--fs-6);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:normal;word-break:normal;
  cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 3px var(--line),0 5px 0 var(--ledge-soft);
  transition:transform var(--t-fast) var(--ease)}
.choice:active,.choice.is-press{transform:translateY(4px);box-shadow:inset 0 0 0 3px var(--line),0 1px 0 var(--ledge-soft)}
.choice.pic{min-height:104px;padding:var(--s-2);font-size:clamp(44px,8vh,64px);line-height:1}
.choice.sym{min-height:88px;font-size:var(--fs-7);line-height:1}
.choice.wide{justify-content:flex-start;width:100%;min-height:var(--tap-pk);padding:var(--s-3) var(--s-7) var(--s-3) var(--s-5);font-size:var(--fs-4);
  line-height:1.3;text-align:left}
.choice.sel{background:var(--brand-tint);color:var(--brand-shade);box-shadow:inset 0 0 0 3px var(--brand),0 5px 0 var(--brand-shade)}
.choice.right{background:var(--good-tint);color:var(--good-ink);box-shadow:inset 0 0 0 3px var(--good),0 5px 0 var(--good-ink);
  animation:k-pop var(--t-slow) var(--spring)}
.choice.wrong{background:var(--try-tint);color:var(--try-ink);box-shadow:inset 0 0 0 3px var(--try),0 5px 0 var(--try);animation:k-shake 240ms linear}
.choice:disabled,.choice.off{opacity:.4;box-shadow:inset 0 0 0 3px var(--line);transform:none;cursor:default}
.choice:is(.right,.wrong,.sel):disabled{opacity:1}
/* right and wrong carry a corner badge as well as a colour (never colour alone): a check, or a soft amber cross */
.choice:is(.right,.wrong)::before{content:'';position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--good)}
.choice.right::after{content:'';position:absolute;top:13px;right:18px;width:7px;height:13px;border:solid var(--surface);border-width:0 4px 4px 0;
  border-radius:1px;transform:rotate(45deg)}
.choice.wrong::before{background:var(--try)}
.choice.wrong::after{content:'';position:absolute;top:8px;right:8px;width:28px;height:28px;background-repeat:no-repeat;background-position:center;
  background-size:14px 14px;background-image:linear-gradient(45deg,transparent 40%,var(--try-ink) 40% 60%,transparent 60%),
  linear-gradient(-45deg,transparent 40%,var(--try-ink) 40% 60%,transparent 60%)}

/* ---- piece and socket: tappable letter/word/number pieces and the places they go (build, order, spell) ---- */
.piece{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:56px;padding:0 var(--s-3);border:0;
  border-radius:var(--r-btn);background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-5);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  box-shadow:inset 0 0 0 2px var(--line),var(--ledge) var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.piece.word{font-size:var(--fs-4);padding:0 var(--s-4)}
.piece:active,.piece.is-press{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),var(--ledge-press) var(--ledge-soft)}
.piece.sel{transform:translateY(-4px);background:var(--brand-tint);color:var(--brand-shade);box-shadow:inset 0 0 0 3px var(--brand),0 6px 0 var(--brand-shade)}
.piece.used,.piece:disabled{background:var(--surface-2);color:transparent;box-shadow:inset 0 0 0 2px var(--line);transform:none;cursor:default}
.socket{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:56px;padding:0 var(--s-2);
  border:3px dashed var(--ink-3);border-radius:var(--r-btn);background:var(--surface-2);color:var(--ink);font-family:var(--font-body);
  font-size:var(--fs-5);font-weight:700;line-height:1;vertical-align:middle;white-space:nowrap}
.socket.word{min-width:96px;font-size:var(--fs-4)}
.socket.on{border-color:var(--brand);background:var(--brand-tint)}
.socket.full{border:3px solid var(--line);background:var(--surface)}
.socket.right{border:3px solid var(--good);background:var(--good-tint);color:var(--good-ink);animation:k-pop var(--t-slow) var(--spring)}
.socket.wrong{border:3px solid var(--try);background:var(--try-tint);color:var(--try-ink)}

/* ---- panel (the DS "card"): .panel, .panel.tint (subject tint), .panel.big (hero) ---- */
.panel{position:relative;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:var(--r-card);
  padding:var(--s-5);box-shadow:var(--shadow);text-align:left}
.panel.tint{background:var(--c-tint,var(--brand-tint));border-color:transparent;box-shadow:none}
.panel.big{border:0;border-radius:var(--r-hero);padding:var(--s-6);background:linear-gradient(160deg,var(--c-tint,var(--star-tint)) 10%,var(--surface) 90%);
  box-shadow:var(--shadow),0 4px 0 var(--ledge-soft)}
.panel>h3{margin:0 0 var(--s-2);font-size:var(--fs-4);line-height:var(--lh-4);display:flex;align-items:center;gap:var(--s-2)}
.panel.tint>h3{color:var(--c-shade,var(--brand-shade))}
.panel>p{margin:0;font-size:var(--fs-3);line-height:var(--lh-3);color:var(--ink-2)}

/* ---- path card: one big button per subject (badge, title, gauge, next line, play disc) ---- */
.pathcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s-4);width:100%;min-height:96px;
  padding:var(--s-4) var(--s-4) var(--s-4) var(--s-4);border:0;border-radius:var(--r-card);
  background:linear-gradient(100deg,var(--c-tint,var(--brand-tint)) 0,var(--surface) 55%);color:var(--ink);font:inherit;text-align:left;
  cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 2px var(--line),0 5px 0 var(--ledge-soft);transition:transform var(--t-fast) var(--ease)}
.pathcard:active,.pathcard.is-press{transform:translateY(4px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--ledge-soft)}
.pc-badge{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));box-shadow:inset 0 -4px 0 var(--c-shade,var(--brand-shade))}
.pc-badge .ic{width:38px;height:38px;margin-top:-3px}
.pc-t{display:block;font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;line-height:1.2}
.pc-next{display:block;margin-top:var(--s-1);font-size:var(--fs-2);line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pathcard .gauge{margin-top:var(--s-2)}
.pc-go{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;color:var(--surface);
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c-fill,var(--c,var(--brand)));
  box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--c-ledge,var(--c-shade,var(--brand-shade)))}
.pc-go .ic{width:26px;height:26px;margin-left:3px}
.pathcard:disabled{background:var(--surface-2);cursor:default;transform:none;box-shadow:inset 0 0 0 2px var(--line)}
@media (max-width:480px){.pathcard{gap:var(--s-3);padding:var(--s-3)}.pc-badge{width:56px;height:56px;border-radius:18px}.pc-badge .ic{width:32px;height:32px}
  .pc-go{width:48px;height:48px}.pc-go .ic{width:22px;height:22px}}

/* ---- top bar: .top.tbar (+ .round in a round, .adult in Grown-ups); back button left, title, chips right ---- */
.top.tbar{min-height:72px;gap:var(--s-3);padding:var(--s-3) var(--s-4)}
.tbar .ttl{flex:1;min-width:0;font-family:var(--font-display);font-size:var(--fs-5);font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar.round .dots{flex:1}
.tbar.adult .ttl{font-size:var(--fs-4)}
@media (max-width:480px){.top.tbar{min-height:64px;gap:var(--s-2);padding:var(--s-2) var(--s-3)}.tbar .ttl{font-size:var(--fs-4)}
  .tbar .stat{font-size:var(--fs-3);padding:0 var(--s-3) 0 var(--s-1)}.tbar .stat .ic{width:28px;height:28px}}

/* ---- stat chip: .stat (+ star | coin | ticket | flame | timer); a <button class="stat"> is tappable; .bump when it changes ---- */
.stat{display:inline-flex;align-items:center;gap:var(--s-1);min-height:var(--tap);padding:0 var(--s-4) 0 var(--s-2);border:0;
  border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;
  line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle;
  box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--ledge-soft)}
.stat .ic{width:32px;height:32px;flex:none}
.stat.star .ic{color:var(--star-shade)}
.stat.coin .ic{color:var(--star-shade);--ic2:var(--star-tint)}
.stat.ticket .ic{color:var(--play);--ic2:var(--play-tint)}
.stat.flame .ic{color:var(--play)}
.stat.flame.off .ic{color:var(--ledge-soft)}
.stat.timer .ic{color:var(--brand)}
button.stat{cursor:pointer;touch-action:manipulation;transition:transform var(--t-fast) var(--ease)}
button.stat:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--ledge-soft)}
.stat.bump{animation:k-bump 400ms var(--spring)}

/* ---- gauge (the DS "meter"): .gauge > i with style="--v:.4"; .grow (pet), .good, subject via --c; .lg is taller ---- */
.gauge{position:relative;height:16px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.gauge.lg{height:24px}
.gauge>i{position:absolute;inset:0;border-radius:inherit;background:var(--c,var(--brand));box-shadow:inset 0 3px 0 var(--hi);
  transform:translateX(calc((var(--v,0) - 1) * 100%));transition:transform var(--t-xl) var(--ease)}
.gauge.grow>i{background:linear-gradient(90deg,var(--star),var(--star-shade))}
.gauge.good>i{background:var(--good)}
:is(.panel.tint,.panel.big,.pathcard) .gauge{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}

/* ---- round progress dots: .dots > i (.done, .try = right after a retry, .cur) ---- */
.dots{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.dots>i{flex:none;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--ledge-soft)}
.dots>i.done{background:var(--good);box-shadow:inset 0 -2px 0 var(--good-ink)}
.dots>i.try{background:var(--try);box-shadow:inset 0 -2px 0 var(--star-shade)}
.dots>i.cur{width:24px;height:24px;box-shadow:inset 0 0 0 5px var(--brand)}
/* phones: smaller dots so 10 fit between a back button and a chip; past about 12 questions use a gauge instead */
@media (max-width:480px){.dots{gap:4px}.dots>i{width:12px;height:12px}.dots>i.cur{width:18px;height:18px;box-shadow:inset 0 0 0 4px var(--brand)}}

/* ---- star rating: UI.stars(n, of) -> .rate > .rs(.on) with a back star (ledge) and a front star; .rate.arc lifts the middle ---- */
.rate{display:inline-flex;align-items:flex-end;gap:2px;vertical-align:middle;line-height:0}
.rs{position:relative;display:inline-block;line-height:0}
.rs .ic{display:block}
.rs .rs-f{position:absolute;left:0;top:0;color:var(--line)}
.rs .rs-b{transform:translateY(3px);color:var(--ledge-soft)}
.rs.on .rs-f{color:var(--star)}
.rs.on .rs-b{color:var(--star-shade)}
.rate.arc .rs:nth-child(2){transform:translateY(-22%)}

/* ---- tag: .tag (+ new | mast | skip | chal) ---- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);background:var(--brand);color:var(--surface);
  font-size:var(--fs-2);font-weight:700;line-height:1.2;white-space:nowrap;vertical-align:middle}
.tag .ic{width:16px;height:16px}
.tag.mast{background:var(--good-ink)}
.tag.skip{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line)}
.tag.chal{background:var(--bt)}

/* ---- toast: UI.toast(text, 'good' | 'try' | 'info'); top-centre pill with an icon disc ---- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:70;display:flex;align-items:center;gap:var(--s-3);
  width:max-content;max-width:calc(100vw - 32px);padding:var(--s-2) var(--s-6) var(--s-2) var(--s-2);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);
  font-family:var(--font-display);font-size:var(--fs-4);font-weight:700;line-height:1.2;pointer-events:none;
  box-shadow:inset 0 0 0 2px var(--line),0 8px 20px var(--drop);opacity:0;transform:translate(-50%,-140%);
  transition:transform var(--t-slow) var(--spring),opacity var(--t) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ti{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--surface)}
.toast .ti .ic{width:26px;height:26px}
.toast.good{color:var(--good-ink)}
.toast.good .ti{background:var(--good)}
.toast.try{color:var(--try-ink)}
.toast.try .ti{background:var(--try);color:var(--try-ink)}

/* ---- speech bubble: .speech (tail bottom-left), .speech.r (bottom-right), .speech.l (left side, pet to the left) ---- */
.speech{position:relative;display:inline-block;max-width:min(320px,80vw);padding:var(--s-3) var(--s-4);border:2px solid var(--line);
  border-radius:var(--r-card);background:var(--surface);color:var(--ink);font-size:var(--fs-3);font-weight:700;line-height:1.3;text-align:left;
  box-shadow:0 4px 0 var(--ledge-soft)}
.speech::after{content:'';position:absolute;left:26px;bottom:-11px;width:18px;height:18px;background:var(--surface);
  border:solid var(--line);border-width:0 2px 2px 0;border-bottom-right-radius:5px;transform:rotate(45deg)}
.speech.r::after{left:auto;right:26px}
.speech.l::after{left:-11px;bottom:auto;top:calc(50% - 9px);border-width:0 0 2px 2px;border-radius:0 0 0 5px}

/* ---- sheet: UI.sheet(html) -> .sheet-bg > .sheet; dim backdrop, slides up, one primary action in .acts ---- */
.sheet-bg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--dim);
  opacity:0;transition:opacity var(--t-slow) var(--ease)}
.sheet-bg.on{opacity:1}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:var(--s-3) var(--s-6) calc(var(--s-6) + env(safe-area-inset-bottom));
  border-radius:var(--r-hero) var(--r-hero) 0 0;background:var(--surface);color:var(--ink);text-align:center;box-shadow:0 -8px 24px var(--drop);
  transform:translateY(100%);transition:transform var(--t-slow) var(--ease)}
.sheet-bg.on .sheet{transform:none}
.sheet::before{content:'';display:block;width:48px;height:6px;margin:0 auto var(--s-4);border-radius:3px;background:var(--line)}
.sheet h2{margin:0 0 var(--s-2);font-family:var(--font-display);font-size:var(--fs-5);line-height:var(--lh-5)}
.sheet p{margin:0 0 var(--s-5);font-size:var(--fs-3);line-height:var(--lh-3);color:var(--ink-2)}
.sheet .sh-art{display:grid;place-items:center;width:88px;height:88px;margin:0 auto var(--s-3);border-radius:50%;background:var(--brand-tint);color:var(--brand)}
.sheet .sh-art .ic{width:48px;height:48px}
.sheet .acts{display:flex;flex-direction:column;gap:var(--s-3)}
@media (orientation:landscape) and (min-width:700px){.sheet-bg{align-items:center}
  .sheet{border-radius:var(--r-hero);transform:translateY(24px);opacity:0;transition:transform var(--t-slow) var(--ease),opacity var(--t-slow) var(--ease)}
  .sheet-bg.on .sheet{opacity:1}.sheet::before{display:none}}

/* ---- hint panel: .hintp > .hb (bulb) + .hx (text; optional .hsteps list with li.on / li.later, and a next-step button) ---- */
.hintp{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-4);border:2px solid var(--try);border-radius:var(--r-card);
  background:var(--try-tint);color:var(--ink);font-size:var(--fs-3);line-height:1.45;text-align:left}
.hintp .hb{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--try);color:var(--try-ink);
  box-shadow:inset 0 -3px 0 var(--star-shade)}
.hintp .hb .ic{width:28px;height:28px}
.hintp .hx{flex:1;min-width:0;padding-top:var(--s-2)}
.hintp .hx>p{margin:0 0 var(--s-2)}
.hintp .hpic{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin:var(--s-2) 0;font-size:var(--fs-6);line-height:1}
.hsteps{margin:0 0 var(--s-2);padding:0;list-style:none;counter-reset:hs}
.hsteps li{position:relative;min-height:32px;margin:0 0 var(--s-2);padding:2px 0 0 42px;color:var(--ink-2)}
.hsteps li::before{counter-increment:hs;content:counter(hs);position:absolute;left:0;top:0;display:grid;place-items:center;width:30px;height:30px;
  border-radius:50%;background:var(--surface);color:var(--try-ink);font-size:var(--fs-2);font-weight:700;box-shadow:inset 0 0 0 2px var(--try)}
.hsteps li.on{color:var(--ink);font-weight:700}
.hsteps li.on::before{background:var(--try-ink);color:var(--surface);box-shadow:none}
.hsteps li.later{display:none}

/* ---- context panel: <details class="ctx" open><summary>..</summary><div class="ctx-b">passage</div></details> ---- */
.ctx{border:2px solid var(--line);border-radius:var(--r-card);background:var(--surface);color:var(--ink);text-align:left;overflow:hidden}
.ctx>summary{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap-primary);padding:0 var(--s-4);cursor:pointer;list-style:none;
  font-family:var(--font-display);font-size:var(--fs-4);font-weight:700}
.ctx>summary::-webkit-details-marker{display:none}
.ctx>summary>.ic:first-child{color:var(--brand)}
.ctx>summary .chev{margin-left:auto;color:var(--ink-3);transition:transform var(--t) var(--ease)}
.ctx[open]>summary .chev{transform:rotate(90deg)}
.ctx-b{max-height:min(40vh,320px);overflow:auto;padding:var(--s-3) var(--s-5) var(--s-4);border-top:2px solid var(--line);
  font-size:var(--fs-3);line-height:1.6;-webkit-user-select:text;user-select:text}
.ctx-b>p{max-width:60ch;margin:0 0 var(--s-3)}

/* ---- segmented control: .seg > button (.on or aria-pressed="true"); .seg.full stretches ---- */
.seg{display:inline-flex;gap:4px;max-width:100%;padding:4px;border-radius:var(--r-pill);background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line)}
.seg.full{display:flex;width:100%}
.seg>button{flex:1 1 auto;min-width:var(--tap);min-height:var(--tap);padding:0 var(--s-4);border:0;border-radius:var(--r-pill);background:transparent;
  color:var(--ink-2);font:inherit;font-size:var(--fs-3);font-weight:700;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.seg>button:is(.on,[aria-pressed="true"]){background:var(--surface);color:var(--brand-shade);box-shadow:inset 0 0 0 2px var(--brand),0 2px 0 var(--ledge-soft)}
.seg>button:disabled{color:var(--ink-3);cursor:default}

/* ---- switch: <label class="switch"><input type="checkbox" role="switch"><span class="sw"></span><span>Label</span></label> ---- */
.switch{position:relative;display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap);font-size:var(--fs-3);line-height:1.3;color:var(--ink);cursor:pointer;text-align:left}
.switch>input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.switch>.sw{position:relative;flex:none;width:56px;height:32px;border-radius:var(--r-pill);background:var(--ink-3)}
.switch>.sw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--brand);opacity:0;transition:opacity var(--t) var(--ease)}
.switch>.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);
  box-shadow:0 2px 0 var(--drop);transition:transform var(--t) var(--spring)}
.switch>input:checked+.sw::before{opacity:1}
.switch>input:checked+.sw::after{transform:translateX(24px)}
.switch>input:focus-visible+.sw{outline:3px solid var(--brand);outline-offset:2px}
.switch>input:disabled+.sw{opacity:.45}
.switch>input:disabled~span{color:var(--ink-3)}

/* ---- table: <div class="tblw"><table class="tbl"> (zebra rows, sticky header; td.n for numbers) ---- */
.tblw{overflow:auto;border:2px solid var(--line);border-radius:var(--r-btn);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-2);line-height:1.4;color:var(--ink);font-variant-numeric:tabular-nums;text-align:left}
.tbl th{position:sticky;top:0;z-index:1;padding:var(--s-2) var(--s-3);background:var(--surface-2);color:var(--ink-2);font-weight:700;white-space:nowrap;
  border-bottom:2px solid var(--line)}
.tbl td{padding:var(--s-2) var(--s-3)}
.tbl tbody tr:nth-child(even) td{background:var(--paper)}
.tbl :is(th,td).n{text-align:right}

/* ---- empty state: .blank > .bi (icon disc) + p (one line) + one action ---- */
.blank{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);padding:var(--s-6) var(--s-4);text-align:center}
.blank .bi{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--brand-tint);color:var(--brand)}
.blank .bi .ic{width:52px;height:52px}
.blank p{max-width:28ch;margin:0;font-size:var(--fs-3);line-height:var(--lh-3);color:var(--ink-2)}

/* ---- map node (DS 7): .mapnode (+ .lock .open .done .mast .skip .boss), subject via --c; stars and tags hang off it ---- */
.mapnode{position:relative;display:grid;place-items:center;width:64px;height:64px;padding:0;border:0;border-radius:50%;
  background:linear-gradient(var(--hi),var(--hi-0) 60%) var(--c,var(--brand));color:var(--surface);font:inherit;font-size:32px;line-height:1;
  cursor:pointer;touch-action:manipulation;box-shadow:inset 0 3px 0 var(--hi),0 5px 0 var(--c-shade,var(--brand-shade));
  transition:transform var(--t-fast) var(--ease)}
.mapnode>.ic{width:32px;height:32px}
.mapnode:active{transform:translateY(3px)}
.mapnode.lock{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 3px var(--line);cursor:default;transform:none}
.mapnode.open::after{content:'';position:absolute;inset:-8px;border:4px solid var(--c,var(--brand));border-radius:50%;opacity:0;
  animation:k-ring 1.8s var(--ease) infinite;pointer-events:none}
.mapnode.mast{box-shadow:inset 0 3px 0 var(--hi),0 0 0 5px var(--star),0 5px 0 5px var(--star-shade)}
.mapnode.skip{background:var(--surface);color:var(--c,var(--brand));box-shadow:inset 0 0 0 3px var(--c,var(--brand)),0 5px 0 var(--ledge-soft)}
.mapnode.boss{width:84px;height:84px;font-size:46px;background:var(--c-tint,var(--brand-tint));color:var(--c-shade,var(--brand-shade));
  box-shadow:inset 0 0 0 4px var(--c,var(--brand)),0 6px 0 var(--c-shade,var(--brand-shade))}
.mapnode .rate{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%)}
.mapnode .tag{position:absolute;top:-14px;right:-22px}

/* ---- motion (calm mode and reduced motion cut these to 0.01 ms in 20-base.css) ---- */
@keyframes k-pop{40%{transform:scale(1.08)}}
@keyframes k-shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes k-bump{40%{transform:scale(1.2)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.btn{touch-action:manipulation}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(circle at 20% 10%,var(--glow-warm) 0,transparent 40%),radial-gradient(circle at 90% 90%,var(--glow-cool) 0,transparent 45%),var(--paper)}
input{font:inherit;-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);animation:enter var(--t-slow) ease-out}
@keyframes enter{from{opacity:0;transform:scale(.97)}}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:none}
.title{font-size:24px;font-weight:700}
.sp{flex:1}
.stars{font-size:var(--fs-4);font-weight:700;white-space:nowrap;background:var(--surface);border-radius:var(--r-btn);padding:6px 12px;box-shadow:0 3px 0 var(--shadow-ink);font-variant-numeric:tabular-nums}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
.btn{border:0;border-radius:var(--r-btn);background:var(--surface);box-shadow:var(--ledge) var(--shadow-ink-2);font:inherit;font-weight:700;color:var(--ink);padding:12px 16px;cursor:pointer;touch-action:manipulation;transition:transform var(--t-fast)}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:var(--ledge-press) var(--shadow-ink-2)}
.btn.sm{font-size:18px;padding:10px 14px}
.btn.xs{padding:4px 10px;font-size:var(--fs-2);border-radius:var(--r-chip)}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;text-align:center;overflow:auto;min-height:0}
.center>:first-child{margin-top:auto}.center>:last-child{margin-bottom:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;font-size:19px}
.tile.math{background:var(--math-tint)}.tile.read{background:var(--read-tint)}
.te{font-size:44px;transition:transform .2s}.tile:active .te{transform:rotate(-12deg) scale(1.2)}

/* hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--star-tint),var(--star));border-radius:var(--r-hero);padding:14px 18px;margin:4px 0 6px;box-shadow:var(--ledge) var(--shadow-ink)}

@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.jump{animation:jump .5s!important}
@keyframes jump{30%{transform:translateY(-30px) scale(1.15) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}}

@keyframes sad{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* icons (P4-02): ico(name,size,cls) in 15-icons.js; colour from currentColor, second tone from --ic2 */

.ic-rec{color:var(--danger)}.ic-brand{color:var(--brand)}.ic-math{color:var(--math)}.ic-read{color:var(--read)}
.ic-es{color:var(--es)}.ic-play{color:var(--play-shade)}.ic-bt{color:var(--bt)}.ic-disc{color:var(--disc)}
/* reduced motion and calm mode (also hides confetti) */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.conf{display:none!important}}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html.calm .conf{display:none!important}
.art{display:inline-block;vertical-align:-.125em;color:var(--ink)}
.online-note{font-size:var(--fs-1);color:var(--ink-2);text-align:right;padding:0 var(--s-3) var(--s-1)}
/* Object art palette (DESIGN_SYSTEM.md 6.5; drawings in src/js/16-art-*.js). Every role maps to an --ill-* token in 00-tokens.css.
   Per hue: --a-x1 highlight, --a-x base, --a-x2 shade, --a-x3 deep accent. Light comes from the top left.
   Also on .pw-hat / .pw-toy, the wearables inside a pet drawing (P4-07, src/js/17-wear.js).
   r red, o orange, y yellow, g green, c aqua, b blue, v purple, p pink, n brown, t tan, s skin, m cream, e grey, w white, k ink. */
.art,.pw-hat,.pw-toy{
  fill:var(--a-k);stroke-linecap:round;stroke-linejoin:round;
  --a-r1:var(--ill-red-1);--a-r:var(--ill-red);--a-r2:var(--ill-red-2);--a-r3:var(--ill-red-3);
  --a-o1:var(--ill-orange-1);--a-o:var(--ill-orange);--a-o2:var(--ill-orange-2);--a-o3:var(--ill-orange-3);
  --a-y1:var(--ill-yellow-1);--a-y:var(--ill-yellow);--a-y2:var(--ill-yellow-2);--a-y3:var(--ill-yellow-3);
  --a-g1:var(--ill-green-1);--a-g:var(--ill-green);--a-g2:var(--ill-green-2);--a-g3:var(--ill-green-3);
  --a-c1:var(--ill-aqua-1);--a-c:var(--ill-aqua);--a-c2:var(--ill-aqua-2);--a-c3:var(--ill-aqua-3);
  --a-b1:var(--ill-blue-1);--a-b:var(--ill-blue);--a-b2:var(--ill-blue-2);--a-b3:var(--ill-blue-3);
  --a-v1:var(--ill-purple-1);--a-v:var(--ill-purple);--a-v2:var(--ill-purple-2);--a-v3:var(--ill-purple-3);
  --a-p1:var(--ill-pink-1);--a-p:var(--ill-pink);--a-p2:var(--ill-pink-2);--a-p3:var(--ill-pink-3);
  --a-n1:var(--ill-brown-1);--a-n:var(--ill-brown);--a-n2:var(--ill-brown-2);--a-n3:var(--ill-brown-3);
  --a-t1:var(--ill-tan-1);--a-t:var(--ill-tan);--a-t2:var(--ill-tan-2);--a-t3:var(--ill-tan-3);
  --a-s1:var(--ill-skin-1);--a-s:var(--ill-skin);--a-s2:var(--ill-skin-2);--a-s3:var(--ill-skin-3);
  --a-m1:var(--ill-cream-1);--a-m:var(--ill-cream);--a-m2:var(--ill-cream-2);--a-m3:var(--ill-cream-3);
  --a-e1:var(--ill-grey-1);--a-e:var(--ill-grey);--a-e2:var(--ill-grey-2);--a-e3:var(--ill-grey-3);
  --a-w:var(--ill-white);--a-w2:var(--ill-white-2);--a-w3:var(--ill-white-3);
  --a-k:var(--ill-ink);--a-k2:var(--ill-ink-2);
}
/* play */
.track{position:relative;flex:1;height:52px;margin:0 6px}
.track .line{position:absolute;left:0;right:30px;top:34px;border-top:5px dotted #d6cfc4}
.track .chest{position:absolute;right:0;top:12px;font-size:34px}
.runner{position:absolute;top:2px;font-size:40px;line-height:1;transition:left .5s cubic-bezier(.5,1.6,.5,1)}
.bubble{position:absolute;top:46px;left:0;background:#fff;border-radius:14px;padding:4px 10px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px #0002;opacity:0;transition:opacity .2s;z-index:5}
.bubble.on{opacity:1}
.streak{font-size:20px;flex:none;font-weight:700;color:#ea580c;background:#ffedd5;border-radius:14px;padding:4px 10px;white-space:nowrap;display:none}
.streak.on{display:block;animation:bump .4s}
.play{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;min-height:0}
.qarea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;min-height:0;text-align:center;overflow:auto}
.qarea>:first-child{margin-top:auto}.qarea>:last-child{margin-bottom:auto}
.prompt{--k:1;font-size:calc(var(--big)*var(--k));max-width:100%;font-weight:700;line-height:1.2;animation:qin .35s cubic-bezier(.5,1.6,.5,1)}

.eq{white-space:nowrap}

.seq{font-size:calc(clamp(30px,8vmin,72px)*var(--k))}
.slot{display:inline-block;min-width:1.3em;min-height:1.15em;line-height:1.15em;border:4px dashed #94a3b8;border-radius:14px;padding:0 .12em;color:var(--blue);vertical-align:middle;text-align:center;background:#fff8}
.slot.ok{border:4px solid var(--green);color:var(--green);animation:bump .4s}
.slot.rev{border:4px solid #f59e0b;color:#b45309}
.tools{display:flex;gap:10px}
.hint{font-size:clamp(16px,2.8vh,20px);font-weight:700;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.inp{flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.pad .k{font-size:clamp(24px,4.6vh,36px);height:clamp(46px,8.5vh,76px);padding:0}
.pad .go{background:var(--green);color:#fff}.pad .del{background:#fde68a}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto;width:100%}
.ch{font-size:clamp(26px,4.6vh,34px);padding:clamp(10px,2vh,18px) 8px}
.choices.pics{grid-template-columns:repeat(3,1fr)}
.choices.pics .ch{font-size:clamp(44px,8vh,64px);padding:6px}
.ch.right{background:#bbf7d0;animation:bump .4s}.ch.wrong{background:#fecaca;opacity:.6}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.lt{font-size:clamp(30px,5.5vh,40px);width:clamp(56px,10vh,74px);height:clamp(56px,10vh,74px);padding:0;background:#fef9c3}
.lt.used{visibility:hidden}
.lt.glow{animation:glow 1s infinite}
.undo{display:block;margin:12px auto 0}
.emo{font-size:calc(clamp(70px,22vmin,160px)*var(--k));line-height:1.2;padding-bottom:.05em}
.lslots{display:flex;gap:8px;justify-content:center;margin-top:10px}

.ls.ok{color:var(--green)}
.story{font-size:calc(clamp(21px,4.6vmin,34px)*max(var(--k),.7));font-weight:700;line-height:1.5;max-width:760px;margin:0 0 6px}

.rods{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

.rod{display:inline-flex;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 #0003}
.rod i{width:clamp(16px,3.6vmin,28px);height:clamp(16px,3.6vmin,28px);background:var(--c);border-right:1px solid #0003;position:relative}

.rod i.x::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b91c1c;font-style:normal;font-weight:900}

.fb{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5) rotate(-6deg);font-size:clamp(26px,7vw,44px);font-weight:700;color:var(--green);background:#fff;padding:14px 26px;border-radius:24px;box-shadow:0 8px 30px #0003;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.5,1.8,.5,1);width:max-content;max-width:90vw;text-align:center;z-index:40}
.fb.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
.fb.warn{color:#c2410c}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px #facc15}}

.burst{position:fixed;font-size:30px;pointer-events:none;z-index:45;transition:transform .7s ease-out,opacity .7s}
/* finish */
.chestbtn{font-size:120px;background:none;box-shadow:none;animation:rattle 1.2s infinite;padding:0}
@keyframes rattle{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}85%{transform:rotate(-6deg)}}
.prize{font-size:clamp(70px,18vmin,120px);animation:spin .8s cubic-bezier(.5,1.6,.5,1)}
@keyframes spin{from{transform:scale(0) rotate(-360deg)}}
.newtag{display:inline-block;background:#ef4444;color:#fff;border-radius:10px;padding:2px 10px;font-size:18px;animation:bump .6s infinite}
.bigstars{font-size:min(36px,8.5vw);white-space:nowrap;margin:6px 0 6px;min-height:1.3em;line-height:1.3}

.ovl .grow{font-size:160px;animation:wobble .25s infinite}
@keyframes wobble{50%{transform:rotate(8deg) scale(1.05)}}
.ovl .grown{font-size:160px;animation:spin .9s cubic-bezier(.5,1.6,.5,1)}
/* stickers */
/* setup + grownups */
.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.pets{grid-template-columns:1fr 1fr}}
.petopt{display:flex;flex-direction:column;align-items:center;font-size:16px;padding:10px 4px}
.petopt span{font-size:52px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid #f0ebe3;text-align:left}.nw{white-space:nowrap}.tr{color:var(--muted)}
@media (orientation:landscape){.play{flex-direction:row;align-items:stretch}.inp{width:46%;display:flex;flex-direction:column;justify-content:center}}
@media (max-width:560px){.hero{padding:10px;gap:10px}.petbig{font-size:64px}.hname{font-size:21px}.top{gap:6px;padding:8px}.btn.sm{font-size:16px;padding:8px 10px}.stars{font-size:18px;padding:5px 9px}.streak{font-size:16px;padding:4px 7px}.runner{font-size:32px}.track .chest{font-size:28px}.title{font-size:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.tile{font-size:17px;padding:12px 6px}.te{font-size:38px}.chestbtn{font-size:100px}.bigstars{font-size:26px}.msg{font-size:19px}h1{font-size:28px}}
@media (max-height:520px){.setup h1{font-size:24px;margin:0 0 6px}.setup .card{margin:6px 0;padding:10px}.petopt{padding:6px 4px}.petopt span{font-size:36px}.prize{font-size:64px}.chestbtn{font-size:90px}.msg{font-size:18px;margin:2px 0}h1{font-size:26px;margin:0 0 8px}.top{padding:6px 10px}.play{padding-top:8px}.tools .btn{padding:6px 10px;font-size:15px}}

/* v4: map, new skills, shop, balloons */

/* grade picker (setup, Grown-ups): 4 x 2 big buttons */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2);margin-top:var(--s-2)}
.gr{min-height:var(--tap);padding:var(--s-2) var(--s-1);font-size:var(--fs-3);font-weight:700}
.gr.sel{background:var(--brand);color:var(--surface);box-shadow:var(--ledge) var(--brand-shade)}
/* Pre-K math (P2-01, world Tiny Town): pictures first, words only inside .pktxt (hidden by html.notext, the debug flag).
   Tokens only. Sizes follow the prompt's font size (em), so fit() shrinks pictures and text together. */
.pkq{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);max-width:100%;font-size:1.3em}
.pkrow{display:flex;flex-wrap:wrap;justify-content:center;gap:.08em .12em;max-width:100%}
.pko{display:inline-block;font-size:1em;line-height:1.15;min-width:1.1em;text-align:center}
